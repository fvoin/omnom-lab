<title>Крючки — настройка</title>
<style>:root{--bg:#1d2333;--fg:#f3f5fa;--muted:#a9b1c6;--card:#2a3148;--card2:#323b57;--line:#3d4766;--acc:#ffd166;--add:#ff9f6b}*{box-sizing:border-box}html,body{background:var(--bg);height:100%;color:var(--fg);margin:0;font:13px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}body{flex-direction:column;height:100dvh;display:flex}header{flex:none;align-items:center;gap:10px;padding:6px 12px;display:flex}header a{color:var(--muted);font-size:13px;text-decoration:none}header h1{margin:0;font-size:15px;font-weight:700}#app{flex:1;min-height:0;display:flex}#stage{touch-action:none;-webkit-user-select:none;user-select:none;flex:1;min-width:0;min-height:0;position:relative}canvas{touch-action:none;border-radius:8px;display:block;position:absolute}#panel{background:var(--card);border-left:1px solid var(--line);flex-direction:column;flex:none;width:370px;min-height:0;display:flex}.phead{border-bottom:1px solid var(--line);flex-direction:column;flex:none;gap:6px;padding:8px 10px 6px;display:flex}.row{flex-wrap:wrap;align-items:center;gap:5px;display:flex}.pbody{-webkit-overflow-scrolling:touch;flex:1;padding:4px 10px 16px;overflow:auto}button{font:inherit;color:var(--fg);background:var(--card2);border:1px solid var(--line);cursor:pointer;border-radius:8px;padding:5px 9px;font-weight:600}button.on{background:var(--acc);color:#222;border-color:var(--acc)}button.warn{box-shadow:0 0 0 2px var(--add)}#drawerBtn{display:none}.preset-note{color:var(--muted);font-size:12px}details{border-bottom:1px solid var(--line);padding:4px 0}summary{cursor:pointer;color:var(--acc);padding:5px 0;font-size:13px;font-weight:700}.gnote{color:var(--muted);margin:0 0 4px;font-size:11px}.f{grid-template-columns:1fr 74px;align-items:center;gap:2px 6px;padding:3px 0;display:grid}.f label{color:var(--fg);grid-column:1/3;font-size:12px}.f input[type=range]{width:100%;margin:0}.f input[type=number]{width:74px;font:inherit;color:var(--fg);border:1px solid var(--line);background:#141a29;border-radius:6px;padding:3px 4px}.f.dis{opacity:.45}.t{align-items:center;gap:6px;padding:4px 0;font-size:12px;display:flex}.t select{font:inherit;color:var(--fg);border:1px solid var(--line);background:#141a29;border-radius:6px;padding:3px 4px}.add{color:var(--add);border:1px solid var(--add);border-radius:4px;margin-left:4px;padding:0 3px;font-size:10px;font-weight:700}.ch{color:var(--acc)}#copyBox{width:100%;height:140px;color:var(--fg);border:1px solid var(--acc);background:#141a29;border-radius:6px;font:11px/1.25 ui-monospace,Menlo,monospace;display:none}#toast{background:var(--acc);color:#222;z-index:3;pointer-events:none;border-radius:8px;padding:4px 10px;font-weight:700;display:none;position:absolute;top:10px;left:50%;transform:translate(-50%)}@media (width<=760px){header{padding:4px 10px}#app{flex-direction:column}#panel{border-left:0;border-top:1px solid var(--line);width:auto;max-height:48%}#panel.closed{max-height:none}#panel.closed .pbody,#panel.closed .more{display:none}#drawerBtn{display:inline-block}.phead button{padding:4px 7px;font-size:12px}.row{gap:4px}}</style>

<header><a href="index.html">← Лаборатория</a><h1>Крючки — настройка</h1></header>

  <div id="panel">

      <div class="row">
        <button id="drawerBtn">Настройки ▲</button>

    <div class="pbody" id="pbody"></div>

<script>
"use strict";
// Примитивный тюнер «Крючков» (D-58). Физика — из hook-rnf.html v2 (прицел углом, зацеп за верх крыши, держишь — висишь,
// отпустил — летишь), но честная: на верёвке — точный маятник (полярные координаты, симплектический шаг), в полёте — баллистика.
// Всё, что добавляет энергию (рывок паутины, подъём «вжух», буст отпускания, подтяжка, батут, конфеты), — переключатели, в «Чистом» выкл.
// Механическая энергия на единицу массы: E = v²/2 + g·(высота центра над землёй) [+ k·растяжение²/2]; в отладке — как высота E/g, u.

// ---- Числа: наборы ------------------------------------------------------------------------------------------
const CLEAN = {
  // мир
  gravity: 1300, airDrag: 0.999, ropeDrag: 1, capOn: true, capVx: 950, capVy: 1400, maxSpeed: 0, ceilOn: false,
  // верёвка
  aimMode: "roof", rayAngle: 55, aimCone: 30, liftDy: 60, roofInset: 8, aimHyst: 6, ropeMin: 80, ropeMax: 600,
  reel: 0, reelMin: 120, elastic: 0, pumpOn: false, pumpSpeed: 300, pumpDL: 120, pumpZone: 25, vDrag: 1,
  swingOn: false, swingMin: 350, backDragOn: false, backDrag: 0.985,
  ownOn: false, ownPoint: "corner", ownPad: 40,
  // отпускание
  boostOn: false, sweetBoost: 1.08, sweetMin: 25, sweetMax: 60, liftOn: false, sweetLift: 160,
  // дома (применяются при «Новый мир» / «Рестарт»)
  hMin0: 440, hMinG: 0.6, hMax: 720, wMin: 110, wMax0: 220, wShrink: 0.002, wFloor: 160,
  gapMin: 140, gapMax0: 220, gapGrow: 0.004, gapCap: 380, reachCheck: true, firstX0: 200, firstW: 180, firstH: 560,
  dhMin: 0, dhMax: 0, skyP: 0, skyWMin: 300, skyWMax: 600, skyHMin: 700, skyHMax: 1000,
  // камера
  zoom: 0.4, camSmooth: 0.35, lookahead: 0.1, camAnchor: 0.35, camTopMargin: 120, camGround: 60,
  zoomSpeedOn: false, zoomFast: 0.32, zoomV0: 500, zoomV1: 900, zoomLerp: 0.06, rotAlong: true,
  // конфеты, земля, старт
  candiesOn: false, kickOn: false, candyKick: 30, eatDist: 40,

// «Подтяжка» (по умолчанию) — «Чистый» + честный источник энергии: пока держишь, верёвка укорачивается (работа подтяжки идёт в энергию); старт с крыши первого дома
const PULL = Object.assign({}, CLEAN, { reel: 200, startMode: "roof" });
// v2 — hook-rnf.html со всеми добавками (камера — эта, плавная; полос, полосатого неба и линий скорости нет)
const V2 = Object.assign({}, CLEAN, {

// v1 — hook-rnf-v1.html (режим «угол»): луч до первой стены/крыши, низкие частые дома, g 784, общий предел 700, потолок

const FAR_OWN = Object.assign({}, FAR, { ownOn: true, ownPoint: "corner" });
const SKY = Object.assign({}, FAR_OWN, { ropeMax: 850, skyP: 0.4, skyWMin: 350, skyWMax: 700, skyHMin: 800, skyHMax: 1050,
  wMin: 70, wMax0: 130, wFloor: 100, hMin0: 500, hMinG: 0.3, hMax: 750, gapMin: 240, gapMax0: 360, gapCap: 420, zoom: 0.28, camTopMargin: 220 });
const CANYON = Object.assign({}, FAR_OWN, { gravity: 1000, reel: 220, rayAngle: 42, ropeMax: 1050, capVx: 1500, capVy: 1800,
  gapMin: 420, gapMax0: 560, gapCap: 700, hMin0: 750, hMinG: 0.3, hMax: 1050, wMin: 80, wMax0: 140, wFloor: 110, zoom: 0.24, camTopMargin: 260 });
const PEAKS = Object.assign({}, FAR_OWN, { reel: 300, rayAngle: 55, ropeMax: 750, dhMin: 220, dhMax: 450, hMin0: 350, hMinG: 0, hMax: 1000,

const ROOFS = Object.assign({}, FAR_OWN, { gravity: 1600, reel: 350, rayAngle: 52, ropeMax: 600, hMin0: 380, hMinG: 0.2, hMax: 560,
  wMin: 220, wMax0: 420, wFloor: 260, gapMin: 160, gapMax0: 240, gapCap: 300, zoom: 0.36, camTopMargin: 160 });
const MOON = Object.assign({}, FAR_OWN, { gravity: 650, airDrag: 0.9998, reel: 140, rayAngle: 45, ropeMax: 950, capVx: 1100,
  gapMin: 380, gapMax0: 500, gapCap: 650, hMin0: 600, hMinG: 0.3, hMax: 950, dhMax: 200, wMin: 60, wMax0: 110, wFloor: 80, zoom: 0.26, camTopMargin: 240 });
const PRESETS = { spider: SPIDER, pend: PEND, rocket: ROCKET, light: LIGHT, rubber: RUBBER, swing: SWING, tarzan: TARZAN, glider: GLIDER, hopper: HOPPER, far: FAR,
  sky: SKY, canyon: CANYON, peaks: PEAKS, roofs: ROOFS, moon: MOON, pull: PULL, clean: CLEAN, v1: V1, v2: V2 };
const PR_NAME = { spider: "Паук", pend: "Маятник", rocket: "Ракета", light: "Лёгкий", rubber: "Резинка",
  swing: "Раскачка", tarzan: "Тарзан", glider: "Планер", hopper: "Кузнечик", far: "Дальнобой",
  sky: "Небоскрёбы", canyon: "Каньон", peaks: "Горы", roofs: "Крыши", moon: "Луна", pull: "Подтяжка", clean: "Чистый", v1: "v1", v2: "v2" };
const PR_NOTE = {
  spider: "Короткие верёвки, быстрый пологий полёт над крышами. Энергия — сильная подтяжка 350 u/с, пока держишь.",

  tarzan: "Длинные лианы, высокие дома, сильный бросок. Энергия — раскачка и буст ×1,35, если отпустить на подъёме 15…70°.",

  v1: "Эталон: hook-rnf-v1 (луч до стены, низкие частые дома, буст ×1,12, батут).",
  v2: "Эталон: hook-rnf v2 со всеми скрытыми добавками (рывок паутины, подъём «вжух», батут).",
};
const TUNE = Object.assign({}, SPIDER);

// Панель: [ключ, подпись, min, max, шаг] | [ключ, подпись, "bool"] | [ключ, подпись, "sel", [[знач, подпись]…]]; ADD — добавляет энергию
const ADD = new Set(["pumpOn", "swingOn", "backDragOn", "boostOn", "liftOn", "reel", "kickOn", "groundMode", "jumpVx"]);
const SPEC = [
  ["Мир", "", [
    ["gravity", "Гравитация, u/с²", 200, 3000, 10],
    ["airDrag", "Сопротивление в полёте, × скорости за тик", 0.98, 1, 0.0005],
    ["ropeDrag", "Сопротивление на верёвке, × за тик", 0.98, 1, 0.0005],
    ["vDrag", "Сопротивление падению в полёте (только vy вниз), × за тик", 0.9, 1, 0.0005],
    ["capOn", "Пределы скорости по осям (v2)", "bool"],

  ]],
  ["Верёвка", "", [
    ["aimMode", "Прицел", "sel", [["roof", "к ребру крыши (v2)"], ["ray", "луч до стены/крыши (v1)"]]],
    ["rayAngle", "Угол луча, ° вверх-вправо", 20, 80, 1],
    ["aimCone", "Конус прицела ±°", 5, 60, 1],

    ["roofInset", "Отступ от углов крыши, u", 0, 40, 1],
    ["aimHyst", "Гистерезис цели, °", 0, 20, 1],
    ["ropeMin", "Мин. длина, u", 20, 300, 1],
    ["ropeMax", "Макс. длина, u", 150, 1200, 5],
    ["reel", "Подтяжка, пока держишь, u/с (0 — нет)", 0, 800, 5],

    ["elastic", "Упругость k, 1/с² (0 — жёсткая)", 0, 3000, 10],
    ["pumpOn", "Раскачка: внизу маха верёвка укорачивается, на подъёме отпускается (вместо подтяжки)", "bool"],

    ["ownPoint", "…точка на крыше", "sel", [["ray", "по лучу, дальше — передний угол"], ["corner", "передний угол"], ["perp", "поперёк скорости (без рывка)"]]],
    ["ownPad", "…зона начинается до левой стены за, u", 0, 200, 5],
  ]],
  ["Отпускание", "Окно «вжух» — угол скорости вправо-вверх в момент отпускания.", [
    ["boostOn", "Буст «вжух» (v1, v2)", "bool"],
    ["sweetBoost", "…множитель скорости", 1, 1.6, 0.01],

  ctx.fillStyle = COL.ink; ctx.fillText(fmt(distM()) + " м · рекорд " + fmt(best) + " м", W - 6, 6);
  if (S.paused) { ctx.textAlign = "center"; ctx.font = "700 16px system-ui,sans-serif"; ctx.fillText("пауза", W / 2, 40); }
  if (DEBUG) drawDebug();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
function drawDebug() {
  const o = S.om, r = S.rope, g = TUNE.gravity, e = energy(), lc = S.lastCatch, lr = S.lastRelease;
  const lines = [
    "v " + fmt(speed()) + " u/с (vx " + fmt(o.vx) + ", vy " + fmt(o.vy) + ")",
    "E " + fmt(e / g) + " u высоты" + (r ? " · на верёвке " + (r.E0 ? (e >= r.E0 ? "+" : "") + fmt((e / r.E0 - 1) * 100, 2) + " %" : "") : ""),
    r ? "T " + fmt(S.tension / g, 2) + " g · L " + fmt(r.L) + " u · " + (TUNE.elastic > 0 ? "упругая" : r.taut ? "натянута" : "провисла") : "в полёте" + (o.grounded ? " (стоит)" : ""),
    "зацеп " + (lc ? fmt(lc.vBefore) + "→" + fmt(lc.vAfter) + " u/с (" + (lc.vAfter >= lc.vBefore ? "+" : "") + fmt((lc.vAfter / Math.max(1, lc.vBefore) - 1) * 100, 1) + " %)" : "—"),
    "отпуск " + (lr ? fmt(lr.vBefore) + "→" + fmt(lr.vAfter) + " u/с, " + fmt(lr.ang) + "°" + (lr.sweet ? " вжух" : "") : "—"),
    "зацепов " + S.catches + (TUNE.ownOn ? " (свой дом " + S.ownCatches + ")" : "") + " · промахов " + S.misses + " · земля " + S.bounces + " · seed " + S.seed,
  ];
  ctx.textAlign = "left"; ctx.font = "600 8px ui-monospace,Menlo,monospace";
  let wMax = 0; for (const s of lines) wMax = Math.max(wMax, ctx.measureText(s).width);
  ctx.fillStyle = "rgba(255,255,255,.72)"; ctx.fillRect(4, 24, wMax + 8, lines.length * 10 + 5);
  ctx.fillStyle = COL.ink; lines.forEach((s, i) => ctx.fillText(s, 8, 27 + i * 10));
}

// ---- Цикл -----------------------------------------------------------------------------------------------------------
let manual = false, acc = 0, lastT = 0, DEBUG = true, SPEED = 1;
const frameTimes = [];
function frame(now) {
  requestAnimationFrame(frame);
  if (lastT) {
    frameTimes.push(now - lastT); if (frameTimes.length > 120) frameTimes.shift();
    if (!manual && !S.paused) {
      acc += Math.min(0.05, (now - lastT) / 1000) * SPEED;
      let n = 0;
      while (acc >= DT && n < 4) { step(); acc -= DT; n++; }
      if (n === 4) acc = 0;
    }
  }
  lastT = now;
  ip = manual || S.paused ? 1 : clamp(acc / DT, 0, 1);
  draw();
}
function saveBest() { try { localStorage.setItem(BEST_KEY, String(Math.floor(best))); } catch (e) {} }
function restart(seed) { saveBest(); newRound(seed == null ? S.seed : seed); acc = 0; worldDirty = false; syncUi(); }
function newWorldBtn() { restart((Date.now() ^ (Math.random() * 1e9)) >>> 0); }

// ---- Настройки: панель, наборы, localStorage ------------------------------------------------------------------------
let PRESET = "spider", worldDirty = false, drawerOpen = false;
const ctl = {};
function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ preset: PRESET, tune: TUNE, ui: { debug: DEBUG, speed: SPEED, drawer: drawerOpen } })); } catch (e) {}
}
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { d = null; }
  if (!d || typeof d !== "object") return;
  if (PRESETS[d.preset]) { PRESET = d.preset; Object.assign(TUNE, PRESETS[PRESET]); }
  if (d.tune) for (const k of SPEC_KEYS) if (k in d.tune && typeof d.tune[k] === typeof CLEAN[k]) TUNE[k] = d.tune[k];
  if (d.ui) { DEBUG = d.ui.debug !== false; if ([0.25, 0.5, 1].includes(d.ui.speed)) SPEED = d.ui.speed; drawerOpen = !!d.ui.drawer; }
}
function diffFromPreset() { const p = PRESETS[PRESET], o = {}; for (const k of SPEC_KEYS) if (TUNE[k] !== p[k]) o[k] = TUNE[k]; return o; }
function tuneJSON() {
  const tune = {}; for (const k of SPEC_KEYS) tune[k] = TUNE[k];
  return JSON.stringify({ page: "hook-tune", preset: PRESET, changed: diffFromPreset(), tune }, null, 1);
}
function setTune(key, val, noRestart) {
  if (!(key in CLEAN)) return false;
  const t = typeof CLEAN[key];
  if (t === "number") { val = +val; if (!isFinite(val)) return false; }
  else if (t === "boolean") val = val === true || val === "true" || val === 1;
  else val = String(val);
  TUNE[key] = val;
  if (WORLD_KEYS.has(key)) worldDirty = true;
  if (S && S.rope && key === "elastic" && TUNE.elastic <= 0) { S.rope.taut = false; tautCheck(S.rope, "slack"); }
  if (S && !S.rope) updateTarget();
  save(); syncUi();
  return true;
}
function applyPreset(name) {
  if (!PRESETS[name]) { const low = String(name).toLowerCase(); name = Object.keys(PR_NAME).find((k) => PR_NAME[k].toLowerCase() === low) || low; }
  if (!PRESETS[name]) return false;
  PRESET = name; Object.assign(TUNE, PRESETS[name]); save(); restart(); return true;
}
function numStr(v) { return String(+(+v).toFixed(5)); }
function buildPanel() {
  const body = document.getElementById("pbody");
  for (const [title, note, fields] of SPEC) {
    const det = document.createElement("details"); det.open = true;
    const sum = document.createElement("summary"); sum.textContent = title; det.appendChild(sum);
    if (note) { const p = document.createElement("p"); p.className = "gnote"; p.textContent = note; det.appendChild(p); }
    for (const f of fields) {
      const [key, label] = f;
      const tag = ADD.has(key) ? '<span class="add" title="добавляет энергию">+E</span>' : "";
      if (f[2] === "bool") {
        const w = document.createElement("label"); w.className = "t";
        w.innerHTML = '<input type="checkbox"><span></span>' + tag; w.querySelector("span").textContent = label;
        const inp = w.querySelector("input"); inp.addEventListener("change", () => setTune(key, inp.checked));
        ctl[key] = { el: w, set: (v) => { inp.checked = !!v; } }; det.appendChild(w);
      } else if (f[2] === "sel") {
        const w = document.createElement("label"); w.className = "t";
        w.innerHTML = '<span></span><select></select>' + tag; w.querySelector("span").textContent = label;
        const sel = w.querySelector("select");
        for (const [val, txt] of f[3]) { const o = document.createElement("option"); o.value = val; o.textContent = txt; sel.appendChild(o); }
        sel.addEventListener("change", () => setTune(key, sel.value));
        ctl[key] = { el: w, set: (v) => { sel.value = v; } }; det.appendChild(w);
      } else {
        const [, , mn, mx, st] = f;
        const w = document.createElement("div"); w.className = "f";
        w.innerHTML = '<label></label><input type="range"><input type="number">';
        w.querySelector("label").innerHTML = ""; w.querySelector("label").append(label); if (tag) w.querySelector("label").insertAdjacentHTML("beforeend", tag);
        const rg = w.querySelectorAll("input")[0], nb = w.querySelectorAll("input")[1];
        for (const el of [rg, nb]) { el.min = mn; el.max = mx; el.step = st; }
        rg.addEventListener("input", () => { nb.value = numStr(rg.value); setTune(key, rg.value); });
        nb.addEventListener("change", () => { if (nb.value !== "" && isFinite(+nb.value)) setTune(key, nb.value); else syncUi(); });
        ctl[key] = { el: w, set: (v) => { rg.value = v; if (document.activeElement !== nb) nb.value = numStr(v); } }; det.appendChild(w);
      }
    }
    body.appendChild(det);
  }
}
const DEP = { capVx: "capOn", capVy: "capOn", swingMin: "swingOn", backDrag: "backDragOn", sweetBoost: "boostOn", sweetLift: "liftOn",
  zoomFast: "zoomSpeedOn", zoomV0: "zoomSpeedOn", zoomV1: "zoomSpeedOn", zoomLerp: "zoomSpeedOn", candyKick: "kickOn", reelMin: "reel", ownPoint: "ownOn", ownPad: "ownOn", skyWMin: "skyP", skyWMax: "skyP", skyHMin: "skyP", skyHMax: "skyP", pumpSpeed: "pumpOn", pumpDL: "pumpOn", pumpZone: "pumpOn" };
function syncUi() {
  const p = PRESETS[PRESET];
  for (const k of SPEC_KEYS) {
    const c = ctl[k]; if (!c) continue; c.set(TUNE[k]);
    c.el.classList.toggle("ch", TUNE[k] !== p[k]);
    const d = DEP[k]; if (d) c.el.classList.toggle("dis", !TUNE[d]);
  }
  for (const k of ["restitution", "groundFric"]) ctl[k].el.classList.toggle("dis", TUNE.groundMode !== "bounce");
  for (const k of ["bounceUp", "bounceVx"]) ctl[k].el.classList.toggle("dis", TUNE.groundMode !== "tramp");
  for (const k of ["aimCone", "liftDy", "roofInset", "aimHyst", "reachCheck"]) ctl[k].el.classList.toggle("dis", TUNE.aimMode !== "roof");
  const nCh = Object.keys(diffFromPreset()).length;
  document.getElementById("prNote").textContent = PR_NAME[PRESET] + (nCh ? " (+ " + nCh + " изм.)" : "") + ": " + PR_NOTE[PRESET];
  document.querySelectorAll("[data-pr]").forEach((b) => b.classList.toggle("on", b.dataset.pr === PRESET));
  document.querySelectorAll("[data-sp]").forEach((b) => b.classList.toggle("on", +b.dataset.sp === SPEED));
  document.getElementById("bPause").classList.toggle("on", !!(S && S.paused));
  document.getElementById("bWorld").classList.toggle("warn", worldDirty);
  document.getElementById("cDebug").checked = DEBUG;
  document.getElementById("panel").classList.toggle("closed", !drawerOpen);
  document.getElementById("drawerBtn").textContent = drawerOpen ? "Настройки ▼" : "Настройки ▲";
}
function toast(s) { const t = document.getElementById("toast"); t.textContent = s; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => { t.style.display = "none"; }, 1400); }
function copyTune() {
  const txt = tuneJSON(), box = document.getElementById("copyBox");
  const fallback = () => {
    box.value = txt; box.style.display = "block"; if (!drawerOpen) { drawerOpen = true; syncUi(); }
    box.focus(); box.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    toast(ok ? "Скопировано (и показано в поле)" : "Буфер недоступен — выдели и скопируй из поля");
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => { box.style.display = "none"; toast("Настройки скопированы"); }, fallback);
    else fallback();
  } catch (e) { fallback(); }
  return txt;
}
function setPause(v) { S.paused = v == null ? !S.paused : !!v; acc = 0; syncUi(); }
function setSpeed(v) { if ([0.25, 0.5, 1].includes(+v)) SPEED = +v; save(); syncUi(); }

// ---- Ввод ---------------------------------------------------------------------------------------------------------------
const downs = new Set();
stage.addEventListener("pointerdown", (e) => { e.preventDefault(); downs.add(e.pointerId); try { stage.setPointerCapture(e.pointerId); } catch (_) {} if (!S.paused) hold(); });
function up(e) { if (!downs.delete(e.pointerId)) return; if (!downs.size) release(); }
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
window.addEventListener("blur", () => { downs.clear(); if (S.held) release(); });
const typing = (e) => /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== "checkbox" && e.target.type !== "range";
window.addEventListener("keydown", (e) => {
  if (typing(e)) return;
  if (e.code === "Space") { e.preventDefault(); if (!e.repeat && !S.paused) hold(); }
  else if (e.code === "KeyR" && !e.repeat) restart();
  else if (e.code === "KeyP" && !e.repeat) setPause();
});
window.addEventListener("keyup", (e) => { if (e.code === "Space" && !typing(e)) release(); });
document.getElementById("bRestart").addEventListener("click", () => restart());
document.getElementById("bWorld").addEventListener("click", newWorldBtn);
document.getElementById("bPause").addEventListener("click", () => setPause());
document.getElementById("bReset").addEventListener("click", () => applyPreset(PRESET));
document.getElementById("bCopy").addEventListener("click", copyTune);
document.getElementById("cDebug").addEventListener("change", (e) => { DEBUG = e.target.checked; save(); });
document.getElementById("drawerBtn").addEventListener("click", () => { drawerOpen = !drawerOpen; save(); syncUi(); });
document.querySelectorAll("[data-sp]").forEach((b) => b.addEventListener("click", () => setSpeed(b.dataset.sp)));
document.querySelectorAll("[data-pr]").forEach((b) => { b.title = PR_NOTE[b.dataset.pr] || ""; b.addEventListener("click", () => applyPreset(b.dataset.pr)); });
// кнопки не должны оставлять фокус (пробел — это «держать»)
document.querySelectorAll("button").forEach((b) => b.addEventListener("mouseup", () => b.blur()));
new ResizeObserver(() => draw()).observe(stage);

// ---- Тестовый API ---------------------------------------------------------------------------------------------------------
window.__game = {
  ready: false,
  getState() {
    const o = S.om, r = S.rope, c = S.cam, e = energy(), t = S.tgt;
    return {
      steps: S.steps, time: S.time, seed: S.seed, held: S.held, paused: S.paused, speedMul: SPEED, preset: PRESET, debug: DEBUG, drawerOpen,
      om: { x: o.x, y: o.y, vx: o.vx, vy: o.vy, grounded: o.grounded, rot: o.rot }, speed: speed(),
      energy: { E: e, h: e / TUNE.gravity, rope0: r ? r.E0 : null, ropeDelta: r && r.E0 ? e / r.E0 - 1 : null },
      rope: r ? { ax: r.ax, ay: r.ay, L: r.L, house: r.house, own: r.own, taut: r.taut, tension: S.tension, tensionG: S.tension / TUNE.gravity } : null,
      target: t ? { x: t.x, y: t.y, dev: t.dev, L: t.L, house: t.house, own: !!t.own } : null,
      cam: { x: c.x, y: c.y, zoom: c.zoom, vx: c.vx, vy: c.vy }, zoom: c.zoom,
      dist: distM(), best, catches: S.catches, ownCatches: S.ownCatches, misses: S.misses, sweet: S.sweet, bounces: S.bounces, candies: S.candies,
      lastCatch: S.lastCatch, lastRelease: S.lastRelease, log: S.log.slice(-40),
      houses: S.WD.bld.filter((b) => b.x1 > c.x - 100 && b.x0 < c.x + W / c.zoom + 100).map((b) => ({ id: b.id, x0: b.x0, x1: b.x1, top: b.top, h: b.h })),
      gen: { houses: S.WD.bld.length, rerolls: S.WD.rerolls, fails: S.WD.fails }, worldDirty,
      view: (() => { const q = cv.getBoundingClientRect(); return { left: q.left, top: q.top, width: q.width, height: q.height, scale: q.width / W }; })(),
    };
  },
  act(a, p) {
    if (a === "hold") hold();
    else if (a === "release") release();
    else if (a === "restart") restart(p && p.seed != null ? p.seed : undefined);
    else if (a === "newWorld") { if (p && p.seed != null) restart(p.seed); else newWorldBtn(); }
    else if (a === "tune.set") return setTune(p.key, p.v);
    else if (a === "tune.preset") return applyPreset(p && p.name);
    else if (a === "tune.get") return tuneJSON();
    else if (a === "copy") return copyTune();
    else if (a === "clock") { manual = !!(p && p.manual); acc = 0; }
    else if (a === "step") { for (let i = 0; i < (p || 1); i++) step(); }
    else if (a === "draw") draw();
    else if (a === "pause") setPause(p);
    else if (a === "speed") setSpeed(p);
    else if (a === "debug") { DEBUG = !!p; save(); syncUi(); }
    else if (a === "drawer") { drawerOpen = !!p; save(); syncUi(); }
    else if (a === "place") { // dev: поставить Ома Нома (без верёвки)
      const o = S.om; o.x = p.x; o.y = p.y; o.vx = p.vx || 0; o.vy = p.vy || 0; o.grounded = false;
      S.rope = null; S.held = false; S.trail = []; ensureWorld(); camStep(true); updateTarget(); snapPrev();
    }
    else if (a === "street") { setStreet((p && p.houses) || []); ensureWorld(); updateTarget(); }
  },
  metrics() {
    const s = frameTimes.slice().sort((x, y) => x - y), mean = s.reduce((q, x) => q + x, 0) / (s.length || 1);
    return { fps: s.length ? Math.round(1000 / mean) : 0, frameMsP95: s.length ? s[Math.floor(s.length * 0.95)] : 0, drawCalls: -1 };
  },
};

load();
buildPanel();
newRound(QS.has("seed") ? +QS.get("seed") : undefined);
syncUi();
draw();
Promise.all(omWaits).then(() => { window.__game.ready = true; });
requestAnimationFrame(frame);
</script>
