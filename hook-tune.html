<style>:root{--bg:#1d2333;--fg:#f3f5fa;--muted:#a9b1c6;--card:#2a3148;--card2:#323b57;--line:#3d4766;--acc:#ffd166;--add:#ff9f6b}*{box-sizing:border-box}html,body{background:var(--bg);height:100%;color:var(--fg);margin:0;font:13px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}body{flex-direction:column;height:100dvh;display:flex}header{flex:none;align-items:center;gap:10px;padding:6px 12px;display:flex}header a{color:var(--muted);font-size:13px;text-decoration:none}header h1{margin:0;font-size:15px;font-weight:700}#app{flex:1;min-height:0;display:flex}#stage{touch-action:none;-webkit-user-select:none;user-select:none;flex:1;min-width:0;min-height:0;position:relative}canvas{touch-action:none;border-radius:8px;display:block;position:absolute}#panel{background:var(--card);border-left:1px solid var(--line);flex-direction:column;flex:none;width:370px;min-height:0;display:flex}.phead{border-bottom:1px solid var(--line);flex-direction:column;flex:none;gap:6px;padding:8px 10px 6px;display:flex}.row{flex-wrap:wrap;align-items:center;gap:5px;display:flex}.pbody{-webkit-overflow-scrolling:touch;flex:1;padding:4px 10px 16px;overflow:auto}button{font:inherit;color:var(--fg);background:var(--card2);border:1px solid var(--line);cursor:pointer;border-radius:8px;padding:5px 9px;font-weight:600}button.on{background:var(--acc);color:#222;border-color:var(--acc)}button.warn{box-shadow:0 0 0 2px var(--add)}#drawerBtn{display:none}.preset-note{color:var(--muted);font-size:12px}.row3{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;display:grid}.pr3{flex-direction:column;gap:2px;min-width:0;display:flex}.pr3 button{width:100%}.pr3 span{color:var(--muted);text-align:center;white-space:nowrap;text-overflow:ellipsis;font-size:10.5px;line-height:1.15;overflow:hidden}details{border-bottom:1px solid var(--line);padding:4px 0}summary{cursor:pointer;color:var(--acc);padding:5px 0;font-size:13px;font-weight:700}.gnote{color:var(--muted);margin:0 0 4px;font-size:11px}. <body>
<header><a href="index.html">← Лаборатория</a><h1>Крючки — настройка</h1></header>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas><div id="toast"></div></div>
  <div id="panel">
    <div class="phead">
      <div class="row">
        <button id="drawerBtn">Настройки ▲</button>
        <button id="bRestart" title="клавиша R">Рестарт</button>
        <button id="bPause" title="клавиша P">Пауза</button>
        <button data-sp="0.25">×0,25</button><button data-sp="0.5">×0,5</button><button data-sp="1">×1</button>
      </div>
      <div class="row3">
        <div class="pr3"><button data-pr="fire">Огоньки</button><span>отпусти в золоте</span></div>
        <div class="pr3"><button data-pr="web">Клубки</button><span>зацеп тратит клубок</span></div>
        <div class="pr3"><button data-pr="full">Полный мах</button><span>держи до отметки</span></div>
      </div>
      <div class="row">
        <button data-pr="spider">Паук</button><button data-pr="pend">Маятник</button><button data-pr="rocket">Ракета</button><button data-pr="light">Лёгкий</button><button data-pr="rubber">Резинка</button>
      </div>
      <div class="row">
        <button data-pr="swing">Раскачка</button><button data-pr="tarzan">Тарзан</button><button data-pr="glider">Планер</button><button data-pr="hopper">Кузнечик</button><button data-pr="far">Дальнобой</button>
      </div>
      <div class="row">
        <button data-pr="sky">Небоскрёбы</button><button data-pr="canyon">Каньон</button><button data-pr="peaks">Горы</button><button data-pr="roofs">Крыши</button><button data-pr="moon">Луна</button>
      </div>
      <div class="preset-note" id="prNote"></div>
      <div class="row more">
        <span class="preset-note">Эталоны:</span><button data-pr="pull">Подтяжка</button><button data-pr="clean">Чистый</button><button data-pr="v1">v1</button><button data-pr="v2">v2</button>
      </div>
      <div class="row more">
        <button id="bReset">Сбросить</button><button id="bWorld">Новый мир</button><button id="bCopy">Скопировать настройки</button>
        <label class="t" style="padding:0"><input type="checkbox" id="cDebug"> отладка</label>
      </div>
      <textarea id="copyBox" class="more" readonly></textarea>
    </div>
    <div class="pbody" id="pbody"></div>
  </div>
</div>
<script>
"use strict";
// Примитивный тюнер «Крючков» (D-58). Физика — из hook-rnf.html v2 (прицел углом, зацеп за верх крыши, держишь — висишь,
// отпустил — летишь), но честная: на верёвке — точный маятник (полярные координаты, симплектический шаг), в полёте — баллистика.
// Всё, что добавляет энергию (рывок паутины, подъём «вжух», буст отпускания, подтяжка, батут, конфеты), — переключатели, в «Чистом» выкл.
// Механическая энергия на единицу массы: E = v²/2 + g·(высота центра над землёй) [+ k·растяжение²/2]; в отладке — как высота E/g, u.

// ---- Числа: наборы ------------------------------------------------------------------------------------------
const CLEAN = {
  // мир
  gravity: 1300, airDrag: 0.999, ropeDrag: 1, capOn: true, capVx: 950, capVy: 1400, maxSpeed: 0, ceilOn: false,
  // верёвка
  aimMode: "roof", rayAngle: 55, aimCone: 30, liftDy: 60, roofInset: 8, aimHyst: 6, ropeMin: 80, ropeMax: 600,
  reel: 0, reelMin: 120, elastic: 0, pumpOn: false, pumpSpeed: 300, pumpDL: 120, pumpZone: 25, vDrag: 1,
  swingOn: false, swingMin: 350, backDragOn: false, backDrag: 0.985,
  ownOn: false, ownPoint: "corner", ownPad: 40, ctrAhead: 0, ownAll: false, ownMinL: 0, ownSlack: "none", ownPayMax: 300, ownReel: 0, ownReelMin: 0, ownVmax: 0, ropeBrake: 0,
  // отпускание
  boostOn: false, sweetBoost: 1.08, sweetMin: 25, sweetMax: 60, liftOn: false, sweetLift: 160,
  // дома (применяются при «Новый мир» / «Рестарт»)
  hMin0: 440, hMinG: 0.6, hMax: 720, wMin: 110, wMax0: 220, wShrink: 0.002, wFloor: 160,
  gapMin: 140, gapMax0: 220, gapGrow: 0.004, gapCap: 380, reachCheck: true, firstX0: 200, firstW: 180, firstH: 560,
  dhMin: 0, dhMax: 0, skyP: 0, skyWMin: 300, skyWMax: 600, skyHMin: 700, skyHMax: 1000,
  // камера
  zoom: 0.4, camSmooth: 0.35, lookahead: 0.1, camAnchor: 0.35, camTopMargin: 120, camGround: 60,
  zoomSpeedOn: false, zoomFast: 0.32, zoomV0: 500, zoomV1: 900, zoomLerp: 0.06, rotAlong: true,
  // конфеты, земля, старт
  candiesOn: false, kickOn: false, candyKick: 30, eatDist: 40,
  groundMode: "bounce", restitution: 0.5, groundFric: 0.8, bounceUp: 800, bounceVx: 200, jumpVx: 300, jumpVy: -200, startMode: "box",
  // D-83: правило мастерства (силу подтяжки надо заработать) и страховка
  rule83: "none", winMin: 25, winMax: 50, fireMax: 3, reelBase: 40, reelPerFire: 100, winBoost: 1.05, missMul: 0.6,
  webMax: 3, thinReel: 0, fullAng: 35, fullMissMul: 0.5,
  safeOn: false, safeDeg: 22, safeClear: 180, safeReel: 330,
};
// «Подтяжка» (по умолчанию) — «Чистый» + честный источник энергии: пока держишь, верёвка укорачивается (работа подтяжки идёт в энергию); старт с крыши первого дома
const PULL = Object.assign({}, CLEAN, { reel: 200, startMode: "roof" });
// v2 — hook-rnf.html со всеми добавками (камера — эта, плавная; полос, полосатого неба и линий скорости нет)
const V2 = Object.assign({}, CLEAN, {
  swingOn: true, backDragOn: true, boostOn: true, liftOn: true,
  zoom: 0.5, zoomSpeedOn: true, zoomFast: 0.44, zoomV0: 500, zoomV1: 900, zoomLerp: 0.06,
  camAnchor: 0.18, camSmooth: 0.14, lookahead: 0, camTopMargin: 100, camGround: 18,
  candiesOn: true, kickOn: true, groundMode: "tramp",
});
// v1 — hook-rnf-v1.html (режим «угол»): луч до первой стены/крыши, низкие частые дома, g 784, общий предел 700, потолок
const V1 = Object.assign({}, CLEAN, {
  gravity: 784, capOn: false, maxSpeed: 700, ceilOn: true,
  aimMode: "ray", ropeMin: 40, ropeMax: 360,
  boostOn: true, sweetBoost: 1.12, sweetMin: 15, sweetMax: 60,
  hMin0: 243.75, hMinG: 1.43, hMax: 372, wMin: 90, wMax0: 200, wShrink: 0.002, wFloor: 130,
  gapMin: 25, gapMax0: 50, gapGrow: 0.003, gapCap: 115, reachCheck: false, firstX0: 160, firstW: 160, firstH: 362,
  zoom: 1, zoomSpeedOn: true, zoomFast: 0.82, zoomV0: 300, zoomV1: 650, zoomLerp: 0.05,
  camAnchor: 0.25, camSmooth: 0.14, lookahead: 0, camTopMargin: 0, camGround: 18,
  candiesOn: true, kickOn: true, candyKick: 25, eatDist: 34, groundMode: "tramp", bounceUp: 560, bounceVx: 140, jumpVx: 220, jumpVy: -120,
});
// Пять наборов (D-61): у каждого энергия только из названного источника, рывка паутины и гарантированного подъёма нет, зум постоянный
const SPIDER = Object.assign({}, CLEAN, { reel: 350, reelMin: 90, rayAngle: 62, ropeMax: 420, capVx: 1150, startMode: "roof" });
const PEND = Object.assign({}, CLEAN, { reel: 150, rayAngle: 45, ropeMin: 220, ropeMax: 800, aimCone: 35, capVy: 1800,
  hMin0: 520, hMax: 820, zoom: 0.33, camTopMargin: 200, startMode: "roof" });
const ROCKET = Object.assign({}, CLEAN, { reel: 120, boostOn: true, sweetBoost: 1.3, sweetMin: 20, sweetMax: 65, capVx: 1100, capVy: 1800,
  zoom: 0.35, camTopMargin: 200, startMode: "roof" });
const LIGHT = Object.assign({}, CLEAN, { gravity: 800, airDrag: 0.9995, reel: 150, aimCone: 40, gapMax0: 180, gapCap: 300, zoom: 0.45, startMode: "roof" });
const RUBBER = Object.assign({}, CLEAN, { elastic: 180, reel: 250, reelMin: 100, zoom: 0.45, startMode: "roof" });
// Ещё пять (D-65)
const SWING = Object.assign({}, CLEAN, { pumpOn: true, pumpSpeed: 300, pumpDL: 200, pumpZone: 35, startMode: "roof" });
const TARZAN = Object.assign({}, CLEAN, { pumpOn: true, pumpSpeed: 350, pumpDL: 150, boostOn: true, sweetBoost: 1.35, sweetMin: 15, sweetMax: 70,
  rayAngle: 48, ropeMin: 180, ropeMax: 650, aimCone: 35, capVx: 1200, capVy: 1800, hMin0: 520, hMax: 820, zoom: 0.33, camTopMargin: 220, startMode: "roof" });
const GLIDER = Object.assign({}, CLEAN, { vDrag: 0.95, reel: 300, capVx: 1100, startMode: "roof" });
const HOPPER = Object.assign({}, CLEAN, { gravity: 2200, reel: 450, reelMin: 70, rayAngle: 65, ropeMin: 60, ropeMax: 340, liftDy: 40, capVy: 1800,
  gapMin: 80, gapMax0: 150, gapGrow: 0.002, gapCap: 220, hMin0: 380, hMax: 620, jumpVx: 350, jumpVy: -750, zoom: 0.45, startMode: "roof" });
// «Дальнобой» и пять его вариаций (D-70, D-75; D-78 отменено в D-83): прицел «центр крыши» — центр крыши ближайшего дома, чей центр впереди
// хотя бы на 30 u и крыша выше хотя бы на 100 u; за центром и над крышей — следующий дом; не достаёт — ещё следующий; нет — промах
// liftDy 100: крыша выше Ома Нома хотя бы на 100 u — он не проходит под самой точкой ближе reelMin и верёвка не дёргает при натяжении
const CENTER = { aimMode: "center", ownOn: true, ownPoint: "center", ctrAhead: 30, liftDy: 100 };
// D-78 (отменено D-83, переключатель ownAll оставлен выключенным): в ширине дома — всегда центр его крыши (ctrAhead/liftDy выше — только для цели в промежутке). Зацеп за центром (b) или над крышей (c):
// верёвка сначала провисает (травится/выбирается без силы) и встаёт без рывка, когда расстояние до точки перестало меняться; потом подтяжка
// 900 u/с до 40 u — «раскрутка» вокруг центра крыши (энергия только от подтяжки), отпустил на подъёме — улетел. Короче 80 u верёвка не бывает.
const OWN78 = { ownAll: true, ownSlack: "free", ownMinL: 80, ownPayMax: 60, ownReel: 900, ownReelMin: 40 };
const FAR = Object.assign({}, CLEAN, CENTER, { reel: 330, rayAngle: 48, ropeMax: 800, capVx: 1300, gapMin: 260, gapMax0: 380, gapGrow: 0.003, gapCap: 520,
  hMin0: 560, hMinG: 0.4, hMax: 880, wMin: 90, wMax0: 160, wFloor: 120, zoom: 0.3, camTopMargin: 200, startMode: "roof" });
const SKY = Object.assign({}, FAR, { reel: 300, ropeMax: 1150, skyP: 0.4, skyWMin: 350, skyWMax: 700, skyHMin: 800, skyHMax: 1050,
  wMin: 70, wMax0: 130, wFloor: 100, hMin0: 700, hMinG: 0.3, hMax: 950, gapMin: 240, gapMax0: 360, gapCap: 420, zoom: 0.28, camTopMargin: 220 });
const CANYON = Object.assign({}, FAR, { gravity: 1000, reel: 300, rayAngle: 42, ropeMax: 1050, capVx: 1500, capVy: 1800,
  gapMin: 420, gapMax0: 560, gapCap: 700, hMin0: 750, hMinG: 0.3, hMax: 1050, wMin: 80, wMax0: 140, wFloor: 110, zoom: 0.24, camTopMargin: 260 });
const PEAKS = Object.assign({}, FAR, { reel: 380, rayAngle: 55, ropeMax: 950, dhMin: 220, dhMax: 450, hMin0: 350, hMinG: 0, hMax: 1000,
  wMin: 120, wMax0: 260, wFloor: 160, gapMin: 200, gapMax0: 320, gapCap: 380 });
const ROOFS = Object.assign({}, FAR, { gravity: 1600, reel: 350, rayAngle: 52, ropeMax: 750, hMin0: 530, hMinG: 0.2, hMax: 710,
  wMin: 220, wMax0: 420, wFloor: 260, gapMin: 160, gapMax0: 240, gapCap: 300, zoom: 0.36, camTopMargin: 160 });
const MOON = Object.assign({}, FAR, { gravity: 650, airDrag: 0.9998, reel: 180, rayAngle: 45, ropeMax: 850, capVx: 1100,
  gapMin: 380, gapMax0: 500, gapCap: 650, hMin0: 600, hMinG: 0.3, hMax: 950, dhMax: 200, wMin: 60, wMax0: 110, wFloor: 80, zoom: 0.26, camTopMargin: 240 });
// D-83: три правила против бездумного тапа — вариации «Дальнобоя» (та же улица и физика), со страховкой
// подогнано по боту (programmer-66): огоньки — «мимо» ×0,5 (модель 0,6: небрежный 50 % на seed 11–30); полный мах — страховка до 28° (модель 22°: падения небрежного до 5)
const FIRE = Object.assign({}, FAR, { rule83: "fire", reelBase: 40, reelPerFire: 100, missMul: 0.5, safeOn: true });
const WEB = Object.assign({}, FAR, { rule83: "web", safeOn: true });
const FULL = Object.assign({}, FAR, { rule83: "full", reelBase: 20, reelPerFire: 100, safeOn: true, safeDeg: 28 });
const PRESETS = { fire: FIRE, web: WEB, full: FULL, spider: SPIDER, pend: PEND, rocket: ROCKET, light: LIGHT, rubber: RUBBER, swing: SWING, tarzan: TARZAN, glider: GLIDER, hopper: HOPPER, far: FAR,
  sky: SKY, canyon: CANYON, peaks: PEAKS, roofs: ROOFS, moon: MOON, pull: PULL, clean: CLEAN, v1: V1, v2: V2 };
const PR_NAME = { fire: "Огоньки", web: "Клубки", full: "Полный мах", spider: "Паук", pend: "Маятник", rocket: "Ракета", light: "Лёгкий", rubber: "Резинка",
  swing: "Раскачка", tarzan: "Тарзан", glider: "Планер", hopper: "Кузнечик", far: "Дальнобой",
  sky: "Небоскрёбы", canyon: "Каньон", peaks: "Горы", roofs: "Крыши", moon: "Луна", pull: "Подтяжка", clean: "Чистый", v1: "v1", v2: "v2" };
const PR_NOTE = {
  spider: "Короткие верёвки, быстрый пологий полёт над крышами. Энергия — сильная подтяжка 350 u/с, пока держишь.",
  pend: "Длинные верёвки, большие дуги между высокими домами, камера дальше. Энергия — подтяжка 150 u/с.",
  rocket: "Высокие полёты над крышами. Энергия — подтяжка 120 u/с и буст ×1,3, если отпустить на подъёме 20…65°.",
  light: "Гравитация 800: плавно и медленно, дома ближе, прицел прощает. Энергия — подтяжка 150 u/с.",
  rubber: "Упругая верёвка пружинит (k 180). Энергия — подтяжка 250 u/с натягивает резинку.",
  swing: "Как на качелях: держишь — внизу маха верёвка короче, на подъёме длиннее. Энергия — раскачка в правильной фазе (300 u/с, ход 200 u).",
  tarzan: "Длинные лианы, высокие дома, сильный бросок. Энергия — раскачка и буст ×1,35, если отпустить на подъёме 15…70°.",
  glider: "Падение тормозится сильнее, чем полёт вперёд: парит и медленно снижается. Энергия — подтяжка 300 u/с.",
  hopper: "Гравитация 2200, короткие верёвки, частые перескоки с крыши на крышу. Энергия — подтяжка 450 u/с и прыжок 750 с крыши/земли.",
  far: "Редкие узкие дома, широкие пропасти, длинные перелёты, камера дальше. Верёвка — в центр крыши ближайшего дома впереди (за центром и над крышей — следующего). Энергия — подтяжка 330 u/с.",
  fire: "«Дальнобой» + огоньки: отпустил в золотой зоне маха (25…50°) — огонёк (до 3), подтяжка 40 + 100 × огоньки u/с и скорость ×1,05; мимо — огоньки гаснут, скорость ×0,5. Страховка вкл.",
  web: "«Дальнобой» + клубки: зацеп тратит клубок (из 3), золотое отпускание (25…50°) возвращает; без клубков — тонкая нитка без подтяжки; мимо — скорость ×0,6. Страховка вкл.",
  full: "«Дальнобой» + полный мах: держи до белой отметки (угол ≥ 35°) — серия +1 (до 3), подтяжка 20 + 100 × серия, скорость ×1,05; раньше — «пшик»: скорость × L/L0 × 0,5, серия 0. Страховка вкл. (до 28°).",
  sky: "Широкие небоскрёбы (350…700) вперемешку с узкими башнями; верёвка — в центр крыши, до 1150. Подтяжка 300 u/с.",
  canyon: "Пропасти 420…700, высокие узкие башни, верёвка до 1050 — в центр крыши, g 1000, камера дальше всех. Подтяжка 300 u/с.",
  peaks: "Соседние дома отличаются по высоте на 220…450 (350…1000); верёвка — в центр крыши, до 950. Подтяжка 380 u/с.",

const RULE_KEYS = { winMin: "fw", winMax: "fw", fireMax: "fF", reelBase: "fF", reelPerFire: "fF", winBoost: "fF", missMul: "fw", webMax: "w", thinReel: "w", fullAng: "F", fullMissMul: "F" };
function syncUi() {
  const p = PRESETS[PRESET];
  for (const k of SPEC_KEYS) {
    const c = ctl[k]; if (!c) continue; c.set(TUNE[k]);
    c.el.classList.toggle("ch", TUNE[k] !== p[k]);
    const d = DEP[k]; if (d) c.el.classList.toggle("dis", !TUNE[d]);
  }
  for (const k of ["restitution", "groundFric"]) ctl[k].el.classList.toggle("dis", TUNE.groundMode !== "bounce");
  for (const k of ["bounceUp", "bounceVx"]) ctl[k].el.classList.toggle("dis", TUNE.groundMode !== "tramp");
  for (const k of ["aimCone", "roofInset", "aimHyst"]) ctl[k].el.classList.toggle("dis", TUNE.aimMode !== "roof");
  for (const k of ["liftDy", "reachCheck"]) ctl[k].el.classList.toggle("dis", TUNE.aimMode === "ray");
  const rl = { none: "-", fire: "f", web: "w", full: "F" }[TUNE.rule83] || "-";
  for (const k in RULE_KEYS) ctl[k].el.classList.toggle("dis", !RULE_KEYS[k].includes(rl));
  const nCh = Object.keys(diffFromPreset()).length;
  document.getElementById("prNote").textContent = PR_NAME[PRESET] + (nCh ? " (+ " + nCh + " изм.)" : "") + ": " + PR_NOTE[PRESET];
  document.querySelectorAll("[data-pr]").forEach((b) => b.classList.toggle("on", b.dataset.pr === PRESET));
  document.querySelectorAll("[data-sp]").forEach((b) => b.classList.toggle("on", +b.dataset.sp === SPEED));
  document.getElementById("bPause").classList.toggle("on", !!(S && S.paused));
  document.getElementById("bWorld").classList.toggle("warn", worldDirty);
  document.getElementById("cDebug").checked = DEBUG;
  document.getElementById("panel").classList.toggle("closed", !drawerOpen);
  document.getElementById("drawerBtn").textContent = drawerOpen ? "Настройки ▼" : "Настройки ▲";
}
function toast(s) { const t = document.getElementById("toast"); t.textContent = s; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => { t.style.display = "none"; }, 1400); }
function copyTune() {
  const txt = tuneJSON(), box = document.getElementById("copyBox");
  const fallback = () => {
    box.value = txt; box.style.display = "block"; if (!drawerOpen) { drawerOpen = true; syncUi(); }
    box.focus(); box.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    toast(ok ? "Скопировано (и показано в поле)" : "Буфер недоступен — выдели и скопируй из поля");
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => { box.style.display = "none"; toast("Настройки скопированы"); }, fallback);
    else fallback();
  } catch (e) { fallback(); }
  return txt;
}
function setPause(v) { S.paused = v == null ? !S.paused : !!v; acc = 0; syncUi(); }
function setSpeed(v) { if ([0.25, 0.5, 1].includes(+v)) SPEED = +v; save(); syncUi(); }

// ---- Ввод ---------------------------------------------------------------------------------------------------------------
const downs = new Set();
stage.addEventListener("pointerdown", (e) => { e.preventDefault(); downs.add(e.pointerId); try { stage.setPointerCapture(e.pointerId); } catch (_) {} if (!S.paused) hold(); });
function up(e) { if (!downs.delete(e.pointerId)) return; if (!downs.size) release(); }
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
window.addEventListener("blur", () => { downs.clear(); if (S.held) release(); });
const typing = (e) => /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== "checkbox" && e.target.type !== "range";
window.addEventListener("keydown", (e) => {
  if (typing(e)) return;
  if (e.code === "Space") { e.preventDefault(); if (!e.repeat && !S.paused) hold(); }
  else if (e.code === "KeyR" && !e.repeat) restart();
  else if (e.code === "KeyP" && !e.repeat) setPause();
});
window.addEventListener("keyup", (e) => { if (e.code === "Space" && !typing(e)) release(); });
document.getElementById("bRestart").addEventListener("click", () => restart());
document.getElementById("bWorld").addEventListener("click", newWorldBtn);
document.getElementById("bPause").addEventListener("click", () => setPause());
document.getElementById("bReset").addEventListener("click", () => applyPreset(PRESET));
document.getElementById("bCopy").addEventListener("click", copyTune);
document.getElementById("cDebug").addEventListener("change", (e) => { DEBUG = e.target.checked; save(); });
document.getElementById("drawerBtn").addEventListener("click", () => { drawerOpen = !drawerOpen; save(); syncUi(); });
document.querySelectorAll("[data-sp]").forEach((b) => b.addEventListener("click", () => setSpeed(b.dataset.sp)));
document.querySelectorAll("[data-pr]").forEach((b) => { b.title = PR_NOTE[b.dataset.pr] || ""; b.addEventListener("click", () => applyPreset(b.dataset.pr)); });
// кнопки не должны оставлять фокус (пробел — это «держать»)
document.querySelectorAll("button").forEach((b) => b.addEventListener("mouseup", () => b.blur()));
new ResizeObserver(() => draw()).observe(stage);

// ---- Тестовый API ---------------------------------------------------------------------------------------------------------
window.__game = {
  ready: false,
  getState() {
    const o = S.om, r = S.rope, c = S.cam, e = energy(), t = S.tgt;
    return {
      steps: S.steps, time: S.time, seed: S.seed, held: S.held, paused: S.paused, speedMul: SPEED, preset: PRESET, debug: DEBUG, drawerOpen,
      om: { x: o.x, y: o.y, vx: o.vx, vy: o.vy, grounded: o.grounded, rot: o.rot }, speed: speed(),
      energy: { E: e, h: e / TUNE.gravity, rope0: r ? r.E0 : null, ropeDelta: r && r.E0 ? e / r.E0 - 1 : null },
      rope: r ? { ax: r.ax, ay: r.ay, L: r.L, house: r.house, own: r.own, taut: r.taut, tension: S.tension, tensionG: S.tension / TUNE.gravity } : null,
      target: t ? { x: t.x, y: t.y, dev: t.dev, L: t.L, house: t.house, own: !!t.own } : null,
      cam: { x: c.x, y: c.y, zoom: c.zoom, vx: c.vx, vy: c.vy }, zoom: c.zoom,
      dist: distM(), best, catches: S.catches, ownCatches: S.ownCatches, misses: S.misses, sweet: S.sweet, bounces: S.bounces, falls: S.falls, candies: S.candies,
      rule83: { rule: TUNE.rule83, fire: S.m.fire, web: S.m.web, gold: S.m.gold, miss: S.m.miss, lastRel: S.m.lastRel, reel: r ? -r.rd : 0, thin: !!(r && r.thin),
        inWin: inWinNow(), safe: { on: TUNE.safeOn, holding: !!(r && r.auto), jam: !!(r && r.jam), count: S.m.safeN } },
      lastCatch: S.lastCatch, lastRelease: S.lastRelease, log: S.log.slice(-40),
      houses: S.WD.bld.filter((b) => b.x1 > c.x - 100 && b.x0 < c.x + W / c.zoom + 100).map((b) => ({ id: b.id, x0: b.x0, x1: b.x1, top: b.top, h: b.h })),
      gen: { houses: S.WD.bld.length, rerolls: S.WD.rerolls, fails: S.WD.fails }, worldDirty,
      view: (() => { const q = cv.getBoundingClientRect(); return { left: q.left, top: q.top, width: q.width, height: q.height, scale: q.width / W }; })(),
    };
  },
  act(a, p) {
    if (a === "hold") hold();
    else if (a === "release") release();
    else if (a === "restart") restart(p && p.seed != null ? p.seed : undefined);
    else if (a === "newWorld") { if (p && p.seed != null) restart(p.seed); else newWorldBtn(); }
    else if (a === "tune.set") return setTune(p.key, p.v);
    else if (a === "tune.preset") return applyPreset(p && p.name);
    else if (a === "tune.get") return tuneJSON();
    else if (a === "copy") return copyTune();
    else if (a === "clock") { manual = !!(p && p.manual); acc = 0; }
    else if (a === "step") { for (let i = 0; i < (p || 1); i++) step(); }
    else if (a === "draw") draw();
    else if (a === "pause") setPause(p);
    else if (a === "speed") setSpeed(p);
    else if (a === "debug") { DEBUG = !!p; save(); syncUi(); }
    else if (a === "drawer") { drawerOpen = !!p; save(); syncUi(); }
    else if (a === "place") { // dev: поставить Ома Нома (без верёвки)
      const o = S.om; o.x = p.x; o.y = p.y; o.vx = p.vx || 0; o.vy = p.vy || 0; o.grounded = false;
      S.rope = null; S.held = false; S.trail = []; ensureWorld(); camStep(true); updateTarget(); snapPrev();
    }
    else if (a === "street") { setStreet((p && p.houses) || []); ensureWorld(); updateTarget(); }
  },
  metrics() {
    const s = frameTimes.slice().sort((x, y) => x - y), mean = s.reduce((q, x) => q + x, 0) / (s.length || 1);
    return { fps: s.length ? Math.round(1000 / mean) : 0, frameMsP95: s.length ? s[Math.floor(s.length * 0.95)] : 0, drawCalls: -1 };
  },
};

load();
buildPanel();
newRound(QS.has("seed") ? +QS.get("seed") : undefined);
syncUi();
draw();
Promise.all(omWaits).then(() => { window.__game.ready = true; });
requestAnimationFrame(frame);
</script>
