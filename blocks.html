<body>

<script>
"use strict";
// ---- Ом Ном кадрами приложения: тот же блок OMS, что в hook.html ----
// ---- Ом Ном кадрами приложения (D-40, не рисунок кодом) ---------------------------
// Кадры лежат в assets/omnom/ — одна папка на все прототипы; новую версию Ома Нома копируем поверх теми же именами.
// Числа — из assets/omnom/omnom_frames.json: 6,4024 px на u, лапы = pivot, рот (кадр wide); зрачки — два слоя (левый и правый глаз), каждый ходит в эллипсе своего глаза (pupils.<кадр>.eyes).
// В файлах Ом Ном смотрит ВЛЕВО от зрителя; flip = смотрит вправо. Кадр: p.mx, p.my — точка рта в игре (u), p.fy — лапы (по умолчанию рот + 20).
const OMS = (() => {
  const PX = 6.4024, PIV = [0.5366, 0.0253], MOUTH = [-2.08, -19.98];
  // Зрачки — по слою на глаз. Для каждого: rest — центр зрачка в покое, c и r — эллипс хода центра зрачка (u от лап, оси кадра до зеркала).
  // Сдвиг взгляда d одинаков для обоих глаз, но центр каждого зрачка потом зажимается в эллипс СВОЕГО глаза: зрачок не выходит из белка и не переходит шов.
  const PUP = {
    neutral: { l: { rest: [-13.93, -44.86], c: [-16.67, -45.33], r: [3.91, 3.98] },
             r: { rest: [-0.81, -42.67], c: [2.23, -42.67], r: [6.22, 6.39] } },
    ajar:   { l: { rest: [-13.7, -47.75], c: [-15.42, -48.29], r: [2.61, 2.51] },
             r: { rest: [-1.6, -45.33], c: [1.92, -42.83], r: [6.06, 6.01] } },
    wide:   { l: { rest: [-13.39, -51.18], c: [-14.79, -51.42], r: [1.98, 1.54] },
             r: { rest: [-1.13, -48.76], c: [0.98, -45.95], r: [5.73, 5.06] } },
    wide2:  { l: { rest: [-13.93, -52.28], c: [-14.95, -52.67], r: [1.64, 1.31] },
             r: { rest: [-1.52, -49.54], c: [0.83, -46.58], r: [5.85, 5.25] } },
  };
  const LOOK = 7; // u: длина полного взгляда, больше любого радиуса хода — на краю эллипса зрачок упирается в границу
  const NAMES = ["neutral", "ajar", "wide", "wide2", "chew", "chew2", "sad", "joy", "blink", "half", "shadow"];
  for (const f in PUP) NAMES.push(f + "_pupils_l", f + "_pupils_r");
  const img = {};
  const waits = [];
  for (const n of NAMES) {
    const i = new Image(); img[n] = i;
    waits.push(new Promise((res) => { i.onload = i.onerror = res; }));
    i.src = "assets/omnom/" + n + ".png";
  }
  const ok = (i) => i && i.complete && i.naturalWidth > 0;
  // центр зрачка: покой + сдвиг (dx, dy), затем в эллипс хода своего глаза: q = (p - c) / r; |q| > 1 -> p = c + q/|q| * r
  function eyePos(e, dx, dy) {
    let px = e.rest[0] + dx, py = e.rest[1] + dy;
    const qx = (px - e.c[0]) / e.r[0], qy = (py - e.c[1]) / e.r[1], ql = Math.hypot(qx, qy);
    if (ql > 1) { px = e.c[0] + qx / ql * e.r[0]; py = e.c[1] + qy / ql * e.r[1]; }
    return [px, py];
  }
  // p: { frame, mx, my, fy?, flip?, tx?, ty?, rot?, piv?, shadow?, alpha? }; st — объект вызывающего: плавный взгляд
  const last = { frame: null, l: null, r: null, d: null };
  function draw(ctx, p, st) {
    let f = p.frame || "neutral";
    if (f === "neutral" && (performance.now() + (p.blinkOff || 0)) % 3600 < 120) f = "blink";
    const base = img[f]; if (!ok(base)) return;
    const flip = p.flip ? -1 : 1, fx = p.mx - flip * MOUTH[0], fy = p.fy != null ? p.fy : p.my - MOUTH[1];
    const pw = base.naturalWidth, ph = base.naturalHeight, k = 1 / PX;
    ctx.save();
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    if (p.alpha != null) ctx.globalAlpha = p.alpha;
    if (p.shadow && ok(img.shadow)) ctx.drawImage(img.shadow, fx - 32, fy - 6, 64, 12);
    ctx.translate(fx, p.piv ? fy - p.piv : fy); if (p.rot) ctx.rotate(p.rot); if (p.piv) ctx.translate(0, p.piv);
    ctx.scale(flip * k, k);
    ctx.drawImage(base, -PIV[0] * pw, -(1 - PIV[1]) * ph);
    const pu = PUP[f], pl = img[f + "_pupils_l"], pr = img[f + "_pupils_r"];
    if (pu && ok(pl) && ok(pr)) {
      let gx = 0, gy = 0;
      if (p.tx != null) { // цель в системе кадра до зеркала; общий сдвиг взгляда, потом зажим по каждому глазу
        const pv = p.piv || 0;
        let dx = p.tx - fx, dy = p.ty - (fy - pv);
        if (p.rot) { const c = Math.cos(-p.rot), sn = Math.sin(-p.rot), qx = dx * c - dy * sn, qy = dx * sn + dy * c; dx = qx; dy = qy; }
        dy -= pv; dx *= flip;
        const ex = (pu.l.rest[0] + pu.r.rest[0]) / 2, ey = (pu.l.rest[1] + pu.r.rest[1]) / 2; // между глазами
        const vx = dx - ex, vy = dy - ey, L = Math.hypot(vx, vy) || 1, a = Math.min(1, L / 45);
        gx = vx / L * a * LOOK; gy = vy / L * a * LOOK;
      }
      if (st) { st.x = st.x == null ? gx : st.x + (gx - st.x) * 0.35; st.y = st.y == null ? gy : st.y + (gy - st.y) * 0.35; gx = st.x; gy = st.y; }
      const pL = eyePos(pu.l, gx, gy), pR = eyePos(pu.r, gx, gy);
      ctx.drawImage(pl, -PIV[0] * pw + (pL[0] - pu.l.rest[0]) * PX, -(1 - PIV[1]) * ph + (pL[1] - pu.l.rest[1]) * PX);
      ctx.drawImage(pr, -PIV[0] * pw + (pR[0] - pu.r.rest[0]) * PX, -(1 - PIV[1]) * ph + (pR[1] - pu.r.rest[1]) * PX);
      last.frame = f; last.l = pL; last.r = pR; last.d = [gx, gy];
    }
    ctx.restore();
  }
  return { draw, img, PUP, eyePos, last, loaded: Promise.all(waits), ready: () => NAMES.every((n) => ok(img[n])) };
})();

// ---- Главные числа и логика: крутить здесь (TUNE) ----
// ==== CORE BEGIN (чистая логика: без DOM, одна и для игры, и для бота-калибровки) ====
const TUNE = {
  // --- поле и размеры (опорные px кадра 1080×1920, blocks.md §3) ---
  board: { x: 60, y: 450, cell: 120, n: 8 },
  slotX: [30, 370, 710], slotY: 1480, slotW: 340, slotH: 360,
  trayScale: 0.6, trayBox: [310, 330],     // масштаб фигуры в слоте и рамка с запасом 15 px
  lift: 160,                               // px: нижний край фигуры над пальцем
  growT: 0.1, snapT: 0.08, retT: 0.2, trayInT: 0.25,
  total: 21,                               // mode 21: фигур в раунде
  // --- сложность по номеру подноса: [с какого подноса, доли малые/средние/большие] ---
  mix: [[1, [0.5, 0.4, 0.1]], [3, [0.3, 0.45, 0.25]], [7, [0.25, 0.45, 0.3]], [13, [0.2, 0.4, 0.4]]],
  mixRows21: 2,                            // mode 21 — без роста: только первые две строки (blocks.md §4)
  guaranteeUntil: 10,                      // endless: гарантия подноса до этого номера включительно (999 — навсегда)
  guaranteeUntil21: 999,                   // mode 21: гарантия всегда
  rerolls: 20,
  // --- серия и счёт ---
  comboGrace: 3,                           // постановок без линии до сброса серии
  comboMax: 10,
  softCap: 0,                              // > 0: endless заканчивается «коробка доверху» после этой постановки
  lineScore: [0, 10, 30, 60, 100],         // за 1/2/3/4+ линий
  emptyBonus: 50,
  milestones: [250, 500, 1000, 2000, 4000], // дальше удваиваем
  // --- звёзды: ключ «режим|серия», [2★, 3★]; по калибровке на 100 seed (правило: 2★ = медиана(0,5)·0,85, 3★ = медиана(0,8)); 21|0 — как в blocks.md ---
  stars: { "21|0": [90, 140], "21|1": [110, 250], "endless|0": [100, 270], "endless|1": [110, 520] },
  // --- бот ---
  botInterval: 0.4,                        // c между постановками бота (видно глазами)
  planFirst: 6, planSecond: 3,             // сколько лучших мест перебирает планировщик для 1-й и 2-й фигуры
  secPerPiece: [4, 6],                     // оценка: секунд на фигуру у человека (для «длительности раунда»)
  // --- время и анимации ---
  endDelay: 1.0, againDelay: 0.3,
  eatStep: 0.03, eatFly: 0.35, eatMax: 0.6,
};
const KINDS = ["r", "y", "g", "b", "p"];
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---- набор фигур (blocks.md §4): клетки (строка, столбец) от левого верхнего угла рамки ----
const PIECES = {}; const GROUPS = { small: [], mid: [], big: [] };
(function () {
  const rect = (w, h) => { const c = []; for (let r = 0; r < h; r++) for (let q = 0; q < w; q++) c.push([r, q]); return c; };
  const rot = (c) => { const m = c.map(([r, q]) => [q, -r]); const mr = Math.min(...m.map((p) => p[0])), mq = Math.min(...m.map((p) => p[1])); return m.map(([r, q]) => [r - mr, q - mq]); };
  const add = (g, id, cells) => {
    const h = Math.max(...cells.map((p) => p[0])) + 1, w = Math.max(...cells.map((p) => p[1])) + 1;
    PIECES[id] = { id, cells, w, h, group: g }; GROUPS[g].push(PIECES[id]);
  };
  const addRots = (g, id, c) => { let cur = c; for (let k = 0; k < 4; k++) { add(g, id + "_" + k, cur); cur = rot(cur); } };
  add("small", "P1", [[0, 0]]); add("small", "I2h", rect(2, 1)); add("small", "I2v", rect(1, 2));
  add("small", "I3h", rect(3, 1)); add("small", "I3v", rect(1, 3)); addRots("small", "V3", [[0, 0], [1, 0], [1, 1]]);
  add("mid", "O4", rect(2, 2)); add("mid", "I4h", rect(4, 1)); add("mid", "I4v", rect(1, 4));
  addRots("mid", "L4", [[0, 0], [1, 0], [2, 0], [2, 1]]); addRots("mid", "T4", [[0, 0], [0, 1], [0, 2], [1, 1]]);
  add("mid", "S4", [[0, 1], [0, 2], [1, 0], [1, 1]]); add("mid", "Z4", [[0, 0], [0, 1], [1, 1], [1, 2]]);
  add("big", "I5h", rect(5, 1)); add("big", "I5v", rect(1, 5)); add("big", "R6h", rect(3, 2)); add("big", "R6v", rect(2, 3));
  add("big", "O9", rect(3, 3)); addRots("big", "V5", [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2]]);
})();
const GROUP_LIST = [GROUPS.small, GROUPS.mid, GROUPS.big];

// ---- поле: массив из 64 чисел, 0 — пусто, 1..5 — вид конфеты ----
function fits(g, cells, r, c) {
  for (let i = 0; i < cells.length; i++) { const R = r + cells[i][0], C = c + cells[i][1]; if (R > 7 || C > 7 || R < 0 || C < 0 || g[R * 8 + C]) return false; }
  return true;
}
function anyFit(g, cells) { for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (fits(g, cells, r, c)) return true; return false; }
// поставить и очистить заполненные линии; возвращает новую сетку, линии и клетки очистки (с видом конфеты)
function drop(g, cells, r, c, v) {
  g = g.slice(); for (let i = 0; i < cells.length; i++) g[(r + cells[i][0]) * 8 + c + cells[i][1]] = v;
  const rows = [], cols = [];
  for (let i = 0; i < 8; i++) { let fr = 1, fc = 1; for (let j = 0; j < 8; j++) { if (!g[i * 8 + j]) fr = 0; if (!g[j * 8 + i]) fc = 0; } if (fr) rows.push(i); if (fc) cols.push(i); }
  const cleared = [];
  for (let i = 0; i < 64; i++) { const R = i >> 3, C = i & 7; if (rows.includes(R) || cols.includes(C)) { cleared.push([R, C, g[i]]); } }
  for (const [R, C] of cleared) g[R * 8 + C] = 0;
  return { g, rows, cols, lines: rows.length + cols.length, cleared };
}
// линии, которые соберутся, если поставить (для подсветки; сетку не меняет)
function wouldComplete(g, cells, r, c) { const d = drop(g, cells, r, c, 1); return d; }

// ---- оценка поля (spec §4): 8·линии + 4·[O9] + 4·[I5h] + 4·[I5v] − 2·закрытые + 0,2·пустые ----
function evalG(g) {
  const rowM = [], colM = [];
  for (let i = 0; i < 8; i++) { let a = 0, b = 0; for (let j = 0; j < 8; j++) { if (!g[i * 8 + j]) a |= 1 << j; if (!g[j * 8 + i]) b |= 1 << j; } rowM.push(a); colM.push(b); } // 1 = пусто
  let s = 0, okO = false, okH = false, okV = false;
  for (let r = 0; r < 8 && !(okO && okH); r++) {
    const m = rowM[r]; if (!okH && (m & m >> 1 & m >> 2 & m >> 3 & m >> 4)) okH = true;
    if (!okO && r < 6) { const x = rowM[r] & rowM[r + 1] & rowM[r + 2]; if (x & x >> 1 & x >> 2) okO = true; }
  }
  for (let c = 0; c < 8; c++) { const m = colM[c]; if (m & m >> 1 & m >> 2 & m >> 3 & m >> 4) { okV = true; break; } }
  if (okO) s += 4; if (okH) s += 4; if (okV) s += 4;
  let iso = 0, empty = 0;
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (!g[r * 8 + c]) {
    empty++; let n = 0;
    if (r === 7 || g[(r + 1) * 8 + c]) n++; if (r === 0 || g[(r - 1) * 8 + c]) n++;
    if (c === 7 || g[r * 8 + c + 1]) n++; if (c === 0 || g[r * 8 + c - 1]) n++;
    if (n >= 3) iso++;
  }
  return s - iso * 2 + empty * 0.2;
}

// ---- бот-планировщик по подносу (spec §4) ----
function cands(g, cells, k) {
  const o = [];
  for (let a = 0; a < 8; a++) for (let b = 0; b < 8; b++) if (fits(g, cells, a, b)) { const res = drop(g, cells, a, b, 1); o.push({ a, b, g: res.g, lines: res.lines, v: res.lines * 8 + evalG(res.g) }); }
  o.sort((x, y) => y.v - x.v); return o.slice(0, k);
}
// ps: [{slot, cells}]; возвращает { slot, r, c } первой постановки лучшей цепочки
function plan(g, ps) {
  let best = -Infinity, bm = null; const idx = ps.map((_, i) => i);
  for (const i of idx) {
    for (const c1 of cands(g, ps[i].cells, TUNE.planFirst)) {
      const rest = idx.filter((x) => x !== i); let v2 = rest.length ? -Infinity : c1.v;
      for (const j of rest) {
        const cs2 = cands(c1.g, ps[j].cells, TUNE.planSecond), k = rest.find((x) => x !== j);
        if (!cs2.length) { v2 = Math.max(v2, c1.v - 500); continue; } // цепочка оборвана: ход всё равно возможен, но хуже любой целой
        for (const c2 of cs2) {
          let v3;
          if (k === undefined) v3 = c2.v;
          else { const c3 = cands(c2.g, ps[k].cells, 1); v3 = c3.length ? c3[0].v + c2.lines * 8 : c2.v + c2.lines * 8 - 500; }
          v3 += c1.lines * 8; if (v3 > v2) v2 = v3;
        }
      }
      if (v2 > best) { best = v2; bm = { slot: ps[i].slot, r: c1.a, c: c1.b }; }
    }
  }
  return bm;
}

// ---- ядро раунда ----
function mixFor(tray, mode) {
  const rows = mode === "21" ? TUNE.mix.slice(0, TUNE.mixRows21) : TUNE.mix; let m = rows[0][1];
  for (const [from, sh] of rows) if (tray >= from) m = sh; return m;
}
function milestoneAt(i) { return i < TUNE.milestones.length ? TUNE.milestones[i] : TUNE.milestones[TUNE.milestones.length - 1] * Math.pow(2, i - TUNE.milestones.length + 1); }
function makeCore(seed, mode, comboOn) {
  const c = { seed: seed >>> 0, mode, comboOn: !!comboOn, rng: mulberry(seed >>> 0), kindRng: mulberry((seed ^ 0xC0FFEE) >>> 0),
