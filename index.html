<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Лаборатория</title>
<link rel="icon" href="data:,">
<style>:root{--bg:#1d2333;--fg:#f3f5fa;--muted:#a9b1c6;--card:#2a3148;--card2:#323b57;--best:#ffd166}*{box-sizing:border-box}html,body{background:var(--bg);color:var(--fg);margin:0;font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:520px;margin:0 auto;padding:20px 16px 32px}h1{margin:4px 0;font-size:26px}.lead{color:var(--muted);margin:0 0 18px;font-size:14px}a.game{color:inherit;background:var(--card);border-radius:16px;align-items:center;gap:12px;min-height:76px;margin:0 0 12px;padding:16px 18px;text-decoration:none;display:flex}a.game:active{background:var(--card2)}.txt{flex:1;min-width:0}.name{font-size:19px;font-weight:700}.rule{color:var(--muted);margin-top:3px;font-size:14px}.best{text-align:right;color:var(--best);font-variant-numeric:tabular-nums;flex:none;font-size:18px;font-weight:700}h2{text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 2px;font-size:15px}.note{color:var(--muted);opacity:.8;margin:0 0 10px;font-size:13px}.row{align-items:stretch;gap:8px;margin:0 0 12px;display:flex}.row a.game{flex:1;min-width:0;margin:0}a.alt{background:var(--card);color:var(--best);white-space:nowrap;border-radius:16px;flex:none;justify-content:center;align-items:center;padding:0 14px;font-size:15px;font-weight:700;text-decoration:none;display:flex}a.alt:active{background:var(--card2)}.best small{color:var(--muted);font-size:11px;font-weight:400;display:block}a.newlink{color:#1d2333;background:var(--best);border-radius:16px;align-items:center;gap:12px;min-height:64px;margin:0 0 18px;padding:16px 18px;font-size:19px;font-weight:800;text-decoration:none;display:flex}a.newlink small{opacity:.8;margin-top:2px;font-size:13px;font-weight:500;display:block}a.newlink .go{margin-left:auto;font-size:22px}</style>
</head>
<body>
<main>
  <h1>Лаборатория</h1>
  <p class="lead">Грубые прототипы игр. Поиграй в каждый минуту-две.</p>
  <a class="newlink" href="new.html"><span>Новые игры (17)<small>Merge, Sort, Duel, Trial, Race, Queens и ещё 11</small></span><span class="go">›</span></a>
  <div id="list"></div>
</main>
<script>
"use strict";
const SECTIONS = [
  ["Новые кандидаты", "Сырые прото без арта и звука (D-160). ⚙ внизу — крутить ощущение.", [
    ["merge",  "Candy Merge (2048)", "Свайпы: одинаковые конфеты сливаются; торт Ом Ном съедает"],
    ["sort",   "Candy Sort", "Леденцы-кольца на палочках: собери 4 одного цвета — Ом Ном съест"],
    ["duel",   "Jelly Duel", "Рогатка-дуэль: оттяни и стреляй желе с учётом ветра — с ботом или вдвоём"],
    ["trial",  "Om Nom Trial", "Мотоцикл: газ, тормоз, наклон — не упади головой, крути сальто"],
    ["race",   "Candy Race", "Гонки вид сверху: держи лево/право — с ботами или вдвоём напротив"],
    ["smash",  "Candy Smash", "Пушка: оттяни и выстрели — разбей все банки, лучше одним выстрелом"],
    ["queens", "Om Nom Queens", "По одному Ому Ному в строке, столбце и цвете — и не касаются"],
  ]],
  ["Ещё новые (D-171)", "Одиннадцать новых прото. Ом Ном в них не везде — это нормально.", [
    ["hop",     "Nom Hop", "Прыгай через дороги, реки и рельсы — доберись до торта"],
    ["paint",   "Nom Paint", "Загоняй мармеладных мишек петлёй к своей земле — кто съел больше"],
    ["arrows",  "Nom Arrows", "Тапай стрелку — она улетает; упёрлась в другую — минус сердце"],
    ["sumo",    "Sumo Nom", "Желейные бойцы на торте: тап — рывок; последний на торте берёт очко"],
    ["dash",    "Jelly Rush", "Держи — сжимаешься, отпусти — прыжок; дольше держишь — выше"],
    ["drop",    "Nom Drop", "Держи палец — конфета пробивает кольца башни вниз; чёрный сектор — стоп"],
    ["maketen", "Make Ten", "Две конфеты с одинаковыми цифрами или в сумме на десять, видящие друг друга (рядом, по вертикали, по диагонали) — Ом Ном съест обе"],
    ["clash",   "Nom Clash", "Тяни от своего домика к другому — уйдёт половина Номми; захвати все"],
    ["pin",     "Pin Nom", "Вытягивай шпильки по порядку — налей банку до черты"],
    ["pixel",   "Pixel Nom", "Тап по Номми: он катится по картинке и кусает свой цвет"],
    ["hulu",    "Nom Hulu", "Танхулу: нанижи фрукты, свари сироп кругами, окуни, остуди — Ом Ном хрустит"],
  ]],
  ["В приложении", "Эти игры переносим в сборник; здесь подбираем ощущение.", [
    ["hook",  "Ом Ном на крючках", "Держи — Ом Ном цепляется и качается, отпусти — летит выше"],
    ["sling", "Конфетная рогатка", "Оттяни конфету и отпусти — попади Ому Ному в рот"],
    ["slide", "Конфетная горка", "Рисуй пальцем верёвку-горку — конфеты катятся в рот"],
    ["hockey", "Конфетный хоккей", "Веди биту-пуговицу пальцем и забей конфету в ворота Тосс — с ботом или вдвоём", [["hockey-v1", "v1"]]],
  ]],
  ["Эксперименты", "Остаются в лаборатории.", [
    ["hook-tune", "Крючки — настройка", "Финал D-87/D-91: «Дальнобой» + конфеты на улице (и на дуге маха под крышами) — раунд 60 с, счёт — съеденные конфеты; «Густо» или «Редко», прежние наборы — в «Архиве»"],
    ["hook-obs-a", "Крючки без конфет A: Шипы", "Колючие ежи висят на пути маха, шипы торчат с краёв крыш. Врезался — Ом Ном падает, забег кончен. Счёт — метры"],
    ["hook-obs-b", "Крючки без конфет B: Провода и птицы", "Провода с искрами между домами и птицы поперёк улицы. Раунд 60 с: удар — падаешь, встаёшь (~2 с потеряно), летишь дальше. Счёт — метры"],
    ["hook-obs-c", "Крючки без конфет C: Движущиеся", "Булавы качаются на цепях, шипастые столбы выдвигаются из земли — лови момент. Врезался — падаешь, конец. Счёт — метры"],
    ["ninja", "Конфетный ниндзя", "Режь верёвки шариков росчерком — Ом Ном ловит конфеты"],
    ["claw",  "Кран с конфетами", "Держи — кран едет, отпусти — клешня хватает конфету"],
    ["tower", "Торт-башня: качается и режет", "Тап режет верёвку, слой падает. Башня качается от центра масс: криво поставишь — кренится. Ещё три режима для сравнения"],
    ["blocks", "Коробка: до тупика", "Ставь фигуры, пока есть место: ряды подряд растят серию"],
    ["hook-rnf", "Крючки как Rope'n'Fly", "Цепляйся за крючки и раскачивайся — вариант в стиле Rope'n'Fly"],
    ["omnom-rig", "Ом Ном на риге", "Векторный Ом Ном на костях и пружинах: сравни с кадрами v2 в сценке, на качелях и на пульте"],
    ["rain", "Мармеладный дождь", "Тяни пружину вниз — конфета из трубы скачет по желейкам; в полёте тапни — пузырь несёт её к пальцу. Сбей золотые — новое поле", [["sling-rain-a", "A"]]],
    ["sling-rain-b", "Дождь B: Пушка и пульт", "Мармеладный дождь: целишься пультом внизу, пушка стреляет сверху"],
    ["sling-rain-c", "Дождь C: Карусель", "Мармеладный дождь: выбираешь момент, а не угол"],
    ["sling-rain", "Рогатка: первые наброски", "Концепции D-92: Мармеладный дождь, Гроздья, Ком", [["sling-grapes", "Гроздья"], ["sling-ball", "Ком"]]],
  ]],
  ["Главный экран", "Варианты экрана на 100 игр. Полистай и выбери. ?task=1 — найти игру на время.", [
    ["hub-a", "A. Комната + полки", "Комната Ома Нома сверху, ниже — «что сыграть сейчас» и полки по темам по 3 коробки"],
    ["hub-b", "B. Дом этажами", "Дом-коробка по этажам-темам, Ом Ном едет на лифте-корзинке; кнопки этажей слева"],
    ["hub-c", "C. Одна коробка", "Ом Ном держит одну большую игру, свайп листает, «Все игры» — сетка"],
  ]],
];
function best(slug) { try { const v = localStorage.getItem("lab.best." + slug); return v === null ? null : Number(v); } catch (e) { return null; } }
const list = document.getElementById("list");
for (const [title, note, games] of SECTIONS) {
  const h = document.createElement("h2"); h.textContent = title; list.appendChild(h);
  const n = document.createElement("p"); n.className = "note"; n.textContent = note; list.appendChild(n);
  for (const [slug, name, rule, alts] of games) {
    const a = document.createElement("a");
    a.className = "game"; a.href = slug + ".html";
    const b = best(slug);
    a.innerHTML = `<div class="txt"><div class="name"></div><div class="rule"></div></div>` +
      (b !== null && !isNaN(b) ? `<div class="best"><small>рекорд</small>${b}</div>` : "");
    a.querySelector(".name").textContent = name;
    a.querySelector(".rule").textContent = rule;
    if (!alts) { list.appendChild(a); continue; }
    const row = document.createElement("div"); row.className = "row"; row.appendChild(a); // рядом — другие версии той же игры
    for (const [href, label] of alts) { const x = document.createElement("a"); x.className = "alt"; x.href = href + ".html"; x.textContent = label; row.appendChild(x); }
    list.appendChild(row);
  }
}
</script>
</body>
</html>
