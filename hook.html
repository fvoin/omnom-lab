<body>
<header>
  <div class="row"><a class="back" href="index.html">← Лаборатория</a>

  <div class="row"><h1>Ом Ном на крючках</h1><span class="hud" id="hud">🍬 0 · 0 м · 1:30</span></div>

<div id="stage">

  <div id="end"><div class="card">

    <p id="endHeight">Высота: 0 м</p>
    <p id="endBest">Рекорд: 0</p>

    <p style="margin-top:12px"><button class="big" id="again">Ещё раз</button></p>
  </div></div>
</div>
<script>
"use strict";
// ---- Ом Ном кадрами приложения (D-40, не рисунок кодом) ---------------------------
// Кадры лежат в assets/omnom/ — одна папка на все прототипы; новую версию Ома Нома копируем поверх теми же именами.
// Числа — из assets/omnom/omnom_frames.json: 6,4024 px на u, лапы = pivot, рот (кадр wide); зрачки — два слоя (левый и правый глаз), каждый ходит в эллипсе своего глаза (pupils.<кадр>.eyes).
// В файлах Ом Ном смотрит ВЛЕВО от зрителя; flip = смотрит вправо. Кадр: p.mx, p.my — точка рта в игре (u), p.fy — лапы (по умолчанию рот + 20).
const OMS = (() => {
  const PX = 6.4024, PIV = [0.5366, 0.0253], MOUTH = [-2.08, -19.98];
  // Зрачки — по слою на глаз. Для каждого: rest — центр зрачка в покое, c и r — эллипс хода центра зрачка (u от лап, оси кадра до зеркала).
  // Сдвиг взгляда d одинаков для обоих глаз, но центр каждого зрачка потом зажимается в эллипс СВОЕГО глаза: зрачок не выходит из белка и не переходит шов.
  const PUP = {
    neutral: { l: { rest: [-13.93, -44.86], c: [-16.67, -45.33], r: [3.91, 3.98] },
             r: { rest: [-0.81, -42.67], c: [2.23, -42.67], r: [6.22, 6.39] } },
    ajar:   { l: { rest: [-13.7, -47.75], c: [-15.42, -48.29], r: [2.61, 2.51] },
             r: { rest: [-1.6, -45.33], c: [1.92, -42.83], r: [6.06, 6.01] } },
    wide:   { l: { rest: [-13.39, -51.18], c: [-14.79, -51.42], r: [1.98, 1.54] },
             r: { rest: [-1.13, -48.76], c: [0.98, -45.95], r: [5.73, 5.06] } },
    wide2:  { l: { rest: [-13.93, -52.28], c: [-14.95, -52.67], r: [1.64, 1.31] },
             r: { rest: [-1.52, -49.54], c: [0.83, -46.58], r: [5.85, 5.25] } },
  };
  const LOOK = 7; // u: длина полного взгляда, больше любого радиуса хода — на краю эллипса зрачок упирается в границу
  const NAMES = ["neutral", "ajar", "wide", "wide2", "chew", "chew2", "sad", "joy", "blink", "half", "shadow"];
  for (const f in PUP) NAMES.push(f + "_pupils_l", f + "_pupils_r");
  const img = {};
  const waits = [];
  for (const n of NAMES) {
    const i = new Image(); img[n] = i;
    waits.push(new Promise((res) => { i.onload = i.onerror = res; }));
    i.src = "assets/omnom/" + n + ".png";
  }
  const ok = (i) => i && i.complete && i.naturalWidth > 0;
  // центр зрачка: покой + сдвиг (dx, dy), затем в эллипс хода своего глаза: q = (p - c) / r; |q| > 1 -> p = c + q/|q| * r
  function eyePos(e, dx, dy) {
    let px = e.rest[0] + dx, py = e.rest[1] + dy;
    const qx = (px - e.c[0]) / e.r[0], qy = (py - e.c[1]) / e.r[1], ql = Math.hypot(qx, qy);
    if (ql > 1) { px = e.c[0] + qx / ql * e.r[0]; py = e.c[1] + qy / ql * e.r[1]; }
    return [px, py];
  }
  // p: { frame, mx, my, fy?, flip?, tx?, ty?, rot?, piv?, shadow?, alpha? }; st — объект вызывающего: плавный взгляд
  const last = { frame: null, l: null, r: null, d: null };
  function draw(ctx, p, st) {
    let f = p.frame || "neutral";
    if (f === "neutral" && (performance.now() + (p.blinkOff || 0)) % 3600 < 120) f = "blink";
    const base = img[f]; if (!ok(base)) return;
    const flip = p.flip ? -1 : 1, fx = p.mx - flip * MOUTH[0], fy = p.fy != null ? p.fy : p.my - MOUTH[1];
    const pw = base.naturalWidth, ph = base.naturalHeight, k = 1 / PX;
    ctx.save();
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    if (p.alpha != null) ctx.globalAlpha = p.alpha;
    if (p.shadow && ok(img.shadow)) ctx.drawImage(img.shadow, fx - 32, fy - 6, 64, 12);
    ctx.translate(fx, p.piv ? fy - p.piv : fy); if (p.rot) ctx.rotate(p.rot); if (p.piv) ctx.translate(0, p.piv);
    ctx.scale(flip * k, k);
    ctx.drawImage(base, -PIV[0] * pw, -(1 - PIV[1]) * ph);
    const pu = PUP[f], pl = img[f + "_pupils_l"], pr = img[f + "_pupils_r"];
    if (pu && ok(pl) && ok(pr)) {
      let gx = 0, gy = 0;
      if (p.tx != null) { // цель в системе кадра до зеркала; общий сдвиг взгляда, потом зажим по каждому глазу
        const pv = p.piv || 0;
        let dx = p.tx - fx, dy = p.ty - (fy - pv);
        if (p.rot) { const c = Math.cos(-p.rot), sn = Math.sin(-p.rot), qx = dx * c - dy * sn, qy = dx * sn + dy * c; dx = qx; dy = qy; }
        dy -= pv; dx *= flip;
        const ex = (pu.l.rest[0] + pu.r.rest[0]) / 2, ey = (pu.l.rest[1] + pu.r.rest[1]) / 2; // между глазами
        const vx = dx - ex, vy = dy - ey, L = Math.hypot(vx, vy) || 1, a = Math.min(1, L / 45);
        gx = vx / L * a * LOOK; gy = vy / L * a * LOOK;
      }
      if (st) { st.x = st.x == null ? gx : st.x + (gx - st.x) * 0.35; st.y = st.y == null ? gy : st.y + (gy - st.y) * 0.35; gx = st.x; gy = st.y; }
      const pL = eyePos(pu.l, gx, gy), pR = eyePos(pu.r, gx, gy);
      ctx.drawImage(pl, -PIV[0] * pw + (pL[0] - pu.l.rest[0]) * PX, -(1 - PIV[1]) * ph + (pL[1] - pu.l.rest[1]) * PX);
      ctx.drawImage(pr, -PIV[0] * pw + (pR[0] - pu.r.rest[0]) * PX, -(1 - PIV[1]) * ph + (pR[1] - pu.r.rest[1]) * PX);
      last.frame = f; last.l = pL; last.r = pR; last.d = [gx, gy];
    }
    ctx.restore();
  }
  return { draw, img, PUP, eyePos, last, loaded: Promise.all(waits), ready: () => NAMES.every((n) => ok(img[n])) };
})();
// ---- Главные числа: крутить здесь -------------------------------------------
// Поле 320×480 u (1 u = 3,375 опорн. px при ширине 1080). Размеры объектов — по cut.md §3 и style.md.
const SIZE = {
  omH: 72,        // Ом Ном от лап до усика, u (лист: лапы 0, рот −20, усик −72, ширина 65)
  omR: 30,        // полуширина тела — о стены
  omFeet: 30,     // от центра тела до лап — о пол
  mouthDy: 10,    // рот ниже центра тела
  candyR: 17,     // конфета Ø 34 u
  hookR: 18,      // пуговица-крюк Ø 36 u
  wall: 12,       // картонные стенки шахты
  rope: 4,        // толщина верёвки
};
const TUNE = {
  gravity: 784,        // u/с², как в CTR
  iterations: 25,      // проходов релаксации верёвки (CTR)
  linkLen: 12,         // длина звена, u
  nodeWeight: 0.02,    // вес звена; Ом Ном весит 1 — «тяжёлый конец»
  hookRadius: 230,     // радиус поиска крюка, u
  minRope: 60,         // короче не бывает
  ropeMax: 110,        // длиннее — подтягивается
  reel: 420,           // u/с — скорость подтяжки до ropeMax
  reelKick: 1,         // доля скорости подтяжки, что остаётся Ому Ному (1 — «выстрел» вверх, 0 — без разгона)
  pump: 200,           // u/с² — подкачка вдоль качания, пока Ом Ном ниже крюка (было 340)
  releaseBoost: 1.10,  // множитель скорости при отпускании
  releaseUp: 90,       // u/с — добавка вверх при отпускании
  maxSpeed: 650,       // u/с — потолок скорости
  airDrag: 0.999,      // за тик, в полёте
  hookGap0: 125,       // шаг крюков по высоте в начале, u
  hookGapGrow: 0.012,  // +u к шагу за каждый u высоты
  hookGapMax: 190,     // (было 165)
  hookReach: 0.95,     // следующий крюк не дальше этой доли hookRadius от предыдущего (было 0.8; см. отчёт: 0.65 при gapMax 190 даёт столб крюков)
  sideMin: 35, sideMax: 105, // смещение крюка от центра шахты, u
  hookMargin: 62,      // крюк не ближе к краю поля, u
  arcCandies: 2,       // конфет на дуге качания под крюком
  arcAngle: 0.75,      // рад — где они на дуге (0 — в самом низу; выше — нужна раскачка)
  flyCandies: 1,       // конфет на пролёте к крюку
  eatDist: 34,         // u, рот — центр конфеты
  magnet: 140,         // u/с — слабое притяжение конфеты ко рту...
  magnetZone: 17,      // ...не дальше 1 радиуса конфеты сверх eatDist
  roundSec: 90,
  fallPenalty: 3,      // с за батут (было 1,5); батут сбрасывает комбо
  fragFade: 1.2,       // с, за сколько тает обрывок
  wallBounce: 0.5, wallBounceRope: 0.9,
  camAnchor: 0.55,     // где держать Ома Нома по высоте экрана (доля сверху)
  star2: 0, star3: 0,  // пороги звёзд по конфетам (1★ — любой доигранный раунд); выставлены ниже по замеру ботов
};
TUNE.star2 = 90; TUNE.star3 = 150; // по диздоку hook.md (замер ботов: медиана бота 0,5 = 91,5; бота 1 = 203)
// ----------------------------------------------------------------------------
const W = 320, H = 480, DT = 1 / 60, FLOOR = 462, WALL = SIZE.wall;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const stage = document.getElementById("stage");
const hudEl = document.getElementById("hud");
const endEl = document.getElementById("end");

// Детерминированный генератор (mulberry32)
class Prng {
  constructor(seed) { this.s = seed >>> 0; }
  next() { let t = (this.s = (this.s + 0x6D2B79F5) >>> 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  clone() { const p = new Prng(0); p.s = this.s; return p; }
}

let S;          // всё состояние раунда
let SIM = false; // идёт прокрутка бота (без эффектов, DOM и рекордов)

function newRound(seed) {
  if (seed == null) seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
  const y0 = FLOOR - SIZE.omFeet;
  S = {
    seed: seed >>> 0, rng: new Prng(seed), scene: "ready", t: TUNE.roundSec, held: false,
    om: { x: 105, y: y0, px: 105, py: y0, face: 1, chew: 0, grounded: true, w: 1 },
    rope: null, frags: [], hooks: [], candies: [], pops: [],
    camY: 0, minY: y0, candiesEaten: 0, combo: 0, bestCombo: 0, falls: 0,
    lastHookId: -1, tramp: 0, hintT: 0, steps: 0, phase: 0, phaseAt: 0,
  };
  addHook(205, 320);
  ensureWorld();
  botReset();
  endEl.style.display = "none";
  updateHud();
}

function addHook(x, y) {
  const h = { id: S.hooks.length, x, y };
  const prev = S.hooks[S.hooks.length - 1];
  S.hooks.push(h);
  if (prev) addArc(prev, h);
  else for (let i = 0; i < 3; i++) S.candies.push({ x: 128 + i * 42, y: 236 - Math.sin(i / 2 * Math.PI) * 22, eaten: false });
}
function addArc(a, b) {
  // конфеты на дуге качания под новым крюком (высоко по дуге — нужна раскачка) + на пролёте к нему
  const r = TUNE.ropeMax - 4, n = TUNE.arcCandies;
  for (let i = 0; i < n; i++) {
    const ang = n > 1 ? -TUNE.arcAngle + 2 * TUNE.arcAngle * i / (n - 1) : 0;
    addCandy(b.x + Math.sin(ang) * r, b.y + Math.cos(ang) * r);
  }
  const s = Math.sign(b.x - a.x) || 1;
  for (let i = 0; i < TUNE.flyCandies; i++) {
    const t = (i + 1) / (TUNE.flyCandies + 1);
    addCandy(a.x + (b.x - a.x) * t + s * 12, a.y + (b.y - a.y) * t + 24);
  }
}
function addCandy(x, y) { // внутри шахты и без наложений на конфеты и крюки
  const m = WALL + SIZE.candyR + 10;
  x = Math.max(m, Math.min(W - m, x));
  const gap = SIZE.candyR * 2 + 10, hg = SIZE.candyR + SIZE.hookR + 8;
  for (let i = S.candies.length - 1; i >= 0 && i >= S.candies.length - 12; i--) { const c = S.candies[i]; if (Math.hypot(c.x - x, c.y - y) < gap) return; }
  for (let i = S.hooks.length - 1; i >= 0 && i >= S.hooks.length - 3; i--) { const h = S.hooks[i]; if (Math.hypot(h.x - x, h.y - y) < hg) return; }
  S.candies.push({ x, y, eaten: false });
}
function ensureWorld() {
  while (S.hooks[S.hooks.length - 1].y > S.camY - 700) {
    const last = S.hooks[S.hooks.length - 1];
    const height = FLOOR - last.y;
    const gap = Math.min(TUNE.hookGapMax, TUNE.hookGap0 + height * TUNE.hookGapGrow) * (0.9 + S.rng.next() * 0.2);
    const k = Math.min(1, height / 3000);
    const side = last.x > W / 2 ? -1 : 1;
    const off = TUNE.sideMin + (TUNE.sideMax - TUNE.sideMin) * (0.4 * k + 0.6 * S.rng.next() * (0.5 + 0.5 * k));
    let x = Math.max(TUNE.hookMargin, Math.min(W - TUNE.hookMargin, W / 2 + side * off));
    const maxDx = Math.sqrt(Math.max(0, (TUNE.hookRadius * TUNE.hookReach) ** 2 - gap * gap));
    x = Math.max(last.x - maxDx, Math.min(last.x + maxDx, x));
    addHook(x, last.y - gap);
  }
  if (S.steps % 30 === 0) S.candies = S.candies.filter(c => c.y < S.camY + H + 300);
}

// ---- Верле ------------------------------------------------------------------
function P(x, y, w, vx = 0, vy = 0) { return { x, y, px: x - vx * DT, py: y - vy * DT, w }; }
function integrate(p, damp) {
  const vx = (p.x - p.px) * damp, vy = (p.y - p.py) * damp;
  p.px = p.x; p.py = p.y;
  p.x += vx; p.y += vy + TUNE.gravity * DT * DT;
}
function solve(a, b, rest) { // односторонне: тянет, не толкает (как в CTR)
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  if (d <= rest || d === 0) return;
  const ia = a.w ? 1 / a.w : 0, ib = b.w ? 1 / b.w : 0, sum = ia + ib;
  if (!sum) return;
  const k = (d - rest) / d / sum;
  a.x += dx * k * ia; a.y += dy * k * ia;
  b.x -= dx * k * ib; b.y -= dy * k * ib;
}
function relax(nodes, rest) {
  for (let it = 0; it < TUNE.iterations; it++)
    for (let i = 1; i < nodes.length; i++) solve(nodes[i - 1], nodes[i], rest);
}

// ---- Действия игрока --------------------------------------------------------
function pickHook() {
  const o = S.om; let best = null, bestD = 1e9, bestFwd = null, bestFwdD = 1e9;
  const R2 = TUNE.hookRadius * TUNE.hookRadius;
  for (let i = S.hooks.length - 1; i >= 0; i--) {
    const h = S.hooks[i];
    if (h.y > S.camY + H) break;                 // крюки идут снизу вверх: ниже экрана — дальше не смотрим
    if (h.y > o.y - 10 || h.y < S.camY - 40) continue; // только выше и на экране
    const d2 = (h.x - o.x) ** 2 + (h.y - o.y) ** 2;
    if (d2 > R2) continue;
    if (d2 < bestD) { bestD = d2; best = h; }
    if (h.id > S.lastHookId && d2 < bestFwdD) { bestFwdD = d2; bestFwd = h; }
  }
  return bestFwd || best;
}
function attach() {
  const h = pickHook(); if (!h) return false;
  const o = S.om;
  const L = Math.max(TUNE.minRope, Math.hypot(o.x - h.x, o.y - h.y));
  let nodes = null, n = 1;
  if (!SIM) {
    const vx = (o.x - o.px) / DT, vy = (o.y - o.py) / DT;
    n = Math.max(4, Math.ceil(L / TUNE.linkLen));
    nodes = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      nodes.push(P(h.x + (o.x - h.x) * t, h.y + (o.y - h.y) * t, i === 0 ? 0 : TUNE.nodeWeight, vx * t, vy * t));
    }
    nodes[n] = o; // хвост верёвки — сам Ом Ном
  }
  S.rope = { hook: h, nodes, rest: L / n, L, Lt: Math.min(L, TUNE.ropeMax), shoot: 0 };

// ---- Бот -----------------------------------------------------------------------
// Умение s: 0 — жмёт и отпускает наугад; 1 — каждые 4 тика прокручивает 12 вариантов «когда нажать / отпустить»
// (0…40 тиков или «не сейчас») на 100 тиков вперёд той же физикой и берёт лучший.
// Ошибки: доля «рассеянных» фаз (наугад) (1−s)², ошибка момента ±(3 + 9·(1−s)) тиков и запаздывание 8·(1−s) тиков.

}

  };
  path(); ctx.strokeStyle = C.cut; ctx.lineWidth = width; ctx.stroke();
  path(); ctx.strokeStyle = C.card; ctx.lineWidth = width * 0.4; ctx.stroke();
  ctx.globalAlpha = 1;
}
function draw() {
  fit();
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  drawBackdrop();
  ctx.translate(0, -S.camY);
  drawWalls();
  const o = S.om;
  const target = !S.rope && S.scene !== "end" ? pickHook() : null;
  for (const h of S.hooks) {
    if (h.y < S.camY - 30 || h.y > S.camY + H + 30) continue;
    drawHook(h, h === target);
  }
  if (target) {
    ctx.strokeStyle = "rgba(74,37,18,.45)"; ctx.lineWidth = 2; ctx.setLineDash([5, 7]);
    ctx.beginPath(); ctx.moveTo(o.x, o.y - 20); ctx.lineTo(target.x, target.y); ctx.stroke(); ctx.setLineDash([]);
  }
  for (const c of S.candies) if (!c.eaten && c.y > S.camY - 30 && c.y < S.camY + H + 30) drawCandy(c);
  for (const f of S.frags) drawRope(f.nodes, Math.max(0, f.life / TUNE.fragFade), SIZE.rope * 0.8);
  if (S.rope) {
    const r = S.rope;
    if (r.shoot < 1) {
      const h = r.hook;
      drawRope([{ x: o.x, y: o.y }, { x: o.x + (h.x - o.x) * r.shoot, y: o.y + (h.y - o.y) * r.shoot }], 1, SIZE.rope);
    } else drawRope(r.nodes, 1, SIZE.rope);
  }
  // батут — мягкая коралловая подушка
  if (FLOOR > S.camY + H) {
    const ty = S.camY + H - 8 + (S.tramp > 0 ? Math.sin(S.tramp * 40) * 3 : 0);
    ctx.fillStyle = S.tramp > 0 ? "#F7B08A" : C.soft; ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(WALL + 4, ty, W - 2 * WALL - 8, 12, 6); ctx.fill(); ctx.stroke();
  }
  drawOmNom(o);
  ctx.textAlign = "center"; ctx.font = "900 17px Nunito, ui-rounded, system-ui, sans-serif"; ctx.lineJoin = "round";
  for (const p of S.pops) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.strokeText(p.txt, p.x, p.y);
    ctx.fillStyle = p.color; ctx.fillText(p.txt, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  drawGarland();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
let omFrame = "neutral"; const omGaze = {};
function drawOmNom(o) {
  // Ом Ном кадрами приложения: рот в (o.x, o.y + mouthDy), лапы +30 — размеры и зона рта прежние
  let near = 1e9, tgt = null, tgtD = 1e9;
  for (const c of S.candies) if (!c.eaten) {
    const d = Math.hypot(c.x - o.x, c.y - o.y - SIZE.mouthDy);
    if (Math.abs(c.y - o.y) < 100) near = Math.min(near, d);
    if (Math.abs(c.y - o.y) < 260 && d < tgtD) { tgtD = d; tgt = c; }
  }
  omFrame = o.chew > 0 ? (Math.floor(o.chew * 12) % 2 ? "chew2" : "chew") : S.tramp > 0 ? "sad" : near < 60 ? "wide" : near < 110 ? "ajar" : "neutral";
  let tilt = 0;
  if (S.rope) tilt = Math.max(-0.45, Math.min(0.45, Math.atan2(o.x - S.rope.hook.x, S.rope.hook.y - o.y) * -0.6));
  OMS.draw(ctx, { frame: omFrame, mx: o.x, my: o.y + SIZE.mouthDy, fy: o.y + SIZE.omFeet, flip: o.face > 0, rot: tilt, piv: SIZE.omFeet,
    shadow: o.grounded && !S.rope, tx: tgt ? tgt.x : undefined, ty: tgt ? tgt.y : undefined }, omGaze);
}

// ---- Цикл: фиксированный шаг 1/60 ---------------------------------------------
let manual = false, acc = 0, lastT = 0;
const frameTimes = [];
function frame(now) {
  requestAnimationFrame(frame);
  if (lastT) {
    frameTimes.push(now - lastT); if (frameTimes.length > 120) frameTimes.shift();
    if (!manual) {
      acc += Math.min(0.05, (now - lastT) / 1000);
      let n = 0;
      while (acc >= DT && n < 3) { step(); acc -= DT; n++; }
      if (n === 3) acc = 0;
    }
  }
  lastT = now;
  draw(); updateHud();
}

// ---- Ввод ----------------------------------------------------------------------
const downs = new Set();
cv.addEventListener("pointerdown", e => { e.preventDefault(); if (BOT.on) return; downs.add(e.pointerId); try { cv.setPointerCapture(e.pointerId); } catch (_) {} hold(); });
function up(e) { if (!downs.delete(e.pointerId)) return; if (!downs.size) release(); }
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
window.addEventListener("blur", () => { downs.clear(); if (S.held && !BOT.on) release(); });
window.addEventListener("keydown", e => { if (e.code === "Space" && !e.repeat && !BOT.on) { e.preventDefault(); hold(); } });
window.addEventListener("keyup", e => { if (e.code === "Space" && !BOT.on) release(); });
cv.addEventListener("contextmenu", e => e.preventDefault());
document.getElementById("restart").addEventListener("click", () => newRound());
document.getElementById("again").addEventListener("click", () => newRound());
const BOT_MODES = [null, 0, 0.5, 1];
const botBtn = document.getElementById("botBtn");
function setBot(skill) {
  BOT.on = skill != null; if (BOT.on) BOT.skill = Math.max(0, Math.min(1, +skill));
  botBtn.textContent = "Бот: " + (BOT.on ? String(BOT.skill).replace(".", ",") : "выкл");
  botReset();
}
botBtn.addEventListener("click", () => {
  const i = BOT_MODES.indexOf(BOT.on ? BOT.skill : null);
  setBot(BOT_MODES[(i + 1) % BOT_MODES.length]); newRound();
});
new ResizeObserver(() => draw()).observe(stage);
window.addEventListener("orientationchange", () => draw());

// ---- Тестовый API --------------------------------------------------------------
window.__game = {
  ready: false,
  getState() {
    const o = S.om;
    return {
      scene: S.scene, seed: S.seed, held: S.held, camY: S.camY, best: S.best, steps: S.steps,
      bot: { on: BOT.on, skill: BOT.skill, plans: BOT.plans },
      view: (() => { const r = cv.getBoundingClientRect(); return { left: r.left, top: r.top, scale: r.width / W }; })(),
      om: { frame: omFrame, x: o.x, y: o.y, vx: (o.x - o.px) / DT, vy: (o.y - o.py) / DT, grounded: o.grounded },
      rope: S.rope ? { hookX: S.rope.hook.x, hookY: S.rope.hook.y, L: S.rope.L } : null,
      frags: S.frags.map(f => { let path = 0; const n = f.nodes;
        for (let i = 1; i < n.length; i++) path += Math.hypot(n[i].x - n[i-1].x, n[i].y - n[i-1].y);
        const a = n[0], z = n[n.length - 1];
        return { life: f.life, nodes: n.length, straight: path ? Math.hypot(z.x - a.x, z.y - a.y) / path : 0, endY: z.y - a.y }; }),
      hook: { t: S.t, y: heightM(), attached: !!S.rope, hookId: S.rope ? S.rope.hook.id : -1, lastHookId: S.lastHookId,
        speed: Math.hypot(o.x - o.px, o.y - o.py) / DT, candies: S.candiesEaten, falls: S.falls, combo: S.combo, bestCombo: S.bestCombo,
        stars: S.scene === "end" ? S.stars : starsFor(S.candiesEaten), star2: TUNE.star2, star3: TUNE.star3 },
      size: { ...SIZE },
    };
  },
  act(a, p) {
    if (a === "hold") { if (!BOT.on) hold(); }
    else if (a === "release") { if (!BOT.on) release(); }
    else if (a === "restart") newRound(p && p.seed != null ? p.seed : undefined);
    else if (a === "clock") { manual = !!(p && p.manual); }
    else if (a === "step") { for (let i = 0; i < (p || 1); i++) step(); }
    else if (a === "tune") Object.assign(TUNE, p || {});
    else if (a === "autoplay") setBot(p == null || p === false || p.skill == null ? null : p.skill);
    else if (a === "runToEnd") { let n = 0; while (S.scene !== "end" && n < 20000) { step(); n++; } }
  },
  metrics() {
    const a = frameTimes.slice().sort((x, y) => x - y);
    const mean = a.reduce((s, x) => s + x, 0) / (a.length || 1);
    return { fps: a.length ? Math.round(1000 / mean) : 0, frameMsP95: a.length ? a[Math.floor(a.length * 0.95)] : 0, drawCalls: -1 };
  },
};
newRound();
draw();
OMS.loaded.then(() => { window.__game.ready = true; });
requestAnimationFrame(frame);
</script>
