display:block}.card a{color:var(--act2);text-decoration:none}.btn{border:3px solid var(--ink);background:var(--act);color:#fff;width:100%;box-shadow:0 4px 0 var(--act2);text-shadow:0 1px #0006;border-radius:999px;margin:8px 0 0;padding:11px 10px;font-size:19px;font-weight:900;display:block}.btn.alt{background:var(--cream);color:var(--ink);box-shadow:0 4px 0 var(--cream2);text-shadow:none;padding:8px 10px;font-size:16px}.btn.endless{background:#6a8cff;padding:9px 10px;font-size:17px;box-shadow:0 4px #3a54b8}.btn:disabled,.lv button:disabled{opacity:.45;cursor:default}.wl{text-align:left;text-transform:uppercase;letter-spacing:.06em;color:#6a4fb3;margin:8px 2px 2px;font-size:11px;font-weight:900}.lv{grid-template-columns:repeat(6,1fr);gap:6px;display:grid}#lv{max-height:56vh;padding:2px;overflow:auto}.lv button{border:3px solid var(--ink);background:#fff;border-radius:12px;padding:3px 0 2px;font-size:11px;font-weight:800;line-height:1.1}.lv button.cur{background:var(--go);box-shadow:0 3px 0 var(--go2)}.lv b{font-size:16px;display:block}.lv i{letter-spacing:-1px;color:#c89b00;min-height:12px;font-size:10px;font-style:normal;display:block}.stars{letter-spacing:4px;margin:4px 0 8px;font-size:44px;line-height:1}.stars span{color:#d9d2b8}.stars span.on{color:var(--star);-webkit-text-stroke:2px var(--ink)}.rew{color:var(--act2);border-top:2px dashed var(--cream2);margin:6px 0 4px;padding-top:6px;font-size:22px;font-weight:900}.rew s{color:var(--ink);opacity:.7;margin-top:2px;font-size:12px;font-weight:700;text-decoration:none;display:block}.row{gap:8px;display:flex}.row .btn{margin-top:8px}</style>

<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <button class="mini" id="gear" title="Settings">&#9881;</button>
  <div id="panel">
    <label><span>All levels open</span><input type="checkbox" id="allopen"></label>
    <button id="resetSave">Reset progress</button>
  </div>
  <div class="ov on" id="menu"><div class="card">
    <h1>Nom Arrows</h1>
    <p>Tap an arrow to send it away. A blocked arrow costs a heart!</p>
    <div id="lv"></div>
    <small>Free path to the edge = it leaves. Empty the field for Om Nom.</small>
    <small id="recs"></small>
    <small><a href="index.html">&larr; Lab</a></small>
  </div></div>
  <div class="ov" id="pause"><div class="card">
    <h1>Paused</h1>
    <button class="btn" id="resume">Resume</button>
    <button class="btn alt" id="pRestart">Restart</button>
    <button class="btn alt" id="pQuit">Home</button>
    <small>no candies if you leave</small>
  </div></div>
  <div class="ov" id="result"><div class="card">
    <h1 id="rTitle">Yum!</h1>
    <div class="stars" id="rStars"></div>
    <p id="rInfo"></p>
    <div class="rew" id="rRew"></div>
    <button class="btn" id="next">Next level</button>
    <div class="row"><button class="btn alt" id="rRetry">Again</button><button class="btn alt" id="rMenu">Home</button></div>
  </div></div>
</div>
</body>
