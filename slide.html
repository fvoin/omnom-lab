e:44px;line-height:1}.card .stars .on{color:var(--star);-webkit-text-stroke:2px var(--ink)}.card .stars .off{color:var(--cut);opacity:.55}.card .thr{opacity:.75;font-size:12px}.card button{color:#fff;background:var(--act);border:3px solid var(--act3);box-shadow:0 5px 0 var(--act2);text-shadow:0 2px 0 var(--act3);border-radius:30px;margin-top:12px;padding:10px 34px;font-size:20px;font-weight:900}</style>

<body>
<header>
  <a href="index.html">← Лаборатория</a>
  <h1>Конфетная горка</h1>
  <span class="stats" id="stats">0 · 90</span>
  <button id="restart">Заново</button>
  <div class="rule">Рисуй пальцем горку — конфеты скатятся Ому Ному в рот. Росчерк поперёк свежей верёвки режет её; мигающую можно обвести — она обновится. Тап лопает пузырь.</div>
</header>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="over"><div class="card">
    <img class="omEnd" src="./assets/omnom/joy.png" alt="">
    <p>Ом Ном съел</p>

    <div class="stars" id="ovStars"></div>

<script>
"use strict";
// ---- Ом Ном кадрами приложения (D-40, не рисунок кодом) ---------------------------
// Кадры лежат в assets/omnom/ — одна папка на все прототипы; новую версию Ома Нома копируем поверх теми же именами.
// Числа — из assets/omnom/omnom_frames.json: 6,4024 px на u, лапы = pivot, рот (кадр wide), зрачки — отдельным слоем.
// В файлах Ом Ном смотрит ВЛЕВО от зрителя; flip = смотрит вправо. Кадр: p.mx, p.my — точка рта в игре (u), p.fy — лапы (по умолчанию рот + 20).
const OMS = (() => {
  const PX = 6.4024, PIV = [0.5366, 0.0253], MOUTH = [-2.08, -19.98];
  const PUP = { // центр слоя зрачков и предел сдвига (u, оси кадра до зеркала): не больше — иначе глаза вылезают за белки
    neutral: { c: [-6.13, -43.11], l: 7.03, r: 10.15, u: 5.0, d: 1.41 },
    wide:    { c: [-6.83, -49.51], l: 3.9,  r: 1.72,  u: 2.66, d: 2.66 },
    ajar:    { c: [-7.45, -46.39], l: 4.22, r: 2.19,  u: 3.59, d: 4.69 },
    wide2:   { c: [-7.53, -50.53], l: 3.44, r: 1.56,  u: 2.34, d: 2.5 },
  };
  const NAMES = ["neutral", "neutral_pupils", "ajar", "ajar_pupils", "wide", "wide_pupils", "wide2", "wide2_pupils", "chew", "chew2", "sad", "joy", "blink", "half", "shadow"];
  const img = {};
  const waits = [];
  for (const n of NAMES) {
    const i = new Image(); img[n] = i;
    waits.push(new Promise((res) => { i.onload = i.onerror = res; }));
    i.src = "assets/omnom/" + n + ".png";
  }
  const ok = (i) => i && i.complete && i.naturalWidth > 0;
  // p: { frame, mx, my, fy?, flip?, tx?, ty?, rot?, piv?, shadow?, alpha? }; st — объект вызывающего: плавный взгляд
  function draw(ctx, p, st) {
    let f = p.frame || "neutral";
    if (f === "neutral" && (performance.now() + (p.blinkOff || 0)) % 3600 < 120) f = "blink";
    const base = img[f]; if (!ok(base)) return;
    const flip = p.flip ? -1 : 1, fx = p.mx - flip * MOUTH[0], fy = p.fy != null ? p.fy : p.my - MOUTH[1];
    const pw = base.naturalWidth, ph = base.naturalHeight, k = 1 / PX;
    ctx.save();
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    if (p.alpha != null) ctx.globalAlpha = p.alpha;
    if (p.shadow && ok(img.shadow)) ctx.drawImage(img.shadow, fx - 32, fy - 6, 64, 12);
    ctx.translate(fx, p.piv ? fy - p.piv : fy); if (p.rot) ctx.rotate(p.rot); if (p.piv) ctx.translate(0, p.piv);
    ctx.scale(flip * k, k);
    ctx.drawImage(base, -PIV[0] * pw, -(1 - PIV[1]) * ph);
    const pu = PUP[f];
    if (pu && ok(img[f + "_pupils"])) {
      let gx = 0, gy = 0;
      if (p.tx != null) { // цель в системе кадра до зеркала; слой двигаем к ней в пределах белков
        const pv = p.piv || 0;
        let dx = p.tx - fx, dy = p.ty - (fy - pv);
        if (p.rot) { const c = Math.cos(-p.rot), sn = Math.sin(-p.rot), qx = dx * c - dy * sn, qy = dx * sn + dy * c; dx = qx; dy = qy; }
        dy -= pv; dx *= flip;
        const ex = pu.c[0], ey = pu.c[1], vx = dx - ex, vy = dy - ey, L = Math.hypot(vx, vy) || 1, a = Math.min(1, L / 45);
        const ux = vx / L * a, uy = vy / L * a;
        gx = ux > 0 ? ux * pu.r : ux * pu.l; gy = uy > 0 ? uy * pu.d : uy * pu.u;
      }
      if (st) { st.x = st.x == null ? gx : st.x + (gx - st.x) * 0.35; st.y = st.y == null ? gy : st.y + (gy - st.y) * 0.35; gx = st.x; gy = st.y; }
      ctx.drawImage(img[f + "_pupils"], -PIV[0] * pw + gx * PX, -(1 - PIV[1]) * ph + gy * PX);
    }
    ctx.restore();
  }
  return { draw, img, loaded: Promise.all(waits), ready: () => NAMES.every((n) => ok(img[n])) };
})();
// ---- Главные числа: крути здесь (u — единицы поля 320×480; 1 u = 3,375 опорн. px при ширине 1080) ----
const TUNE = {
  roundSec: 90,          // длина раунда (новые конфеты — до этой секунды)
  finishMax: 3,          // «доедание»: после 90 с ждём падающие и пузырные конфеты не дольше N с
  bubbleUntil: 86,       // новых пузырей после этой секунды нет
  overDelay: 1.2,        // от конца доедания до карточки итога, с
  spawnStart: 2.0,       // интервал конфет в начале, с
  spawnEnd: 0.8,         // интервал конфет в конце, с
  spawnWarn: 0.5,        // метка «тут упадёт» заранее, с
  candyG: 600,           // гравитация конфет, u/с² (верёвка — 784, как в CTR)
  candyR: 17,            // радиус конфеты (видимый Ø 34 u = 115 px)
  friction: 0.004,       // трение качения за подшаг (0 — лёд)
  bounce: 0.08,          // отскок от верёвки
  inkMax: 280,           // запас верёвки, u (поле 320 шириной)
  inkRegen: 75,          // восстановление, u/с
  minRope: 34,           // короче — не верёвка
  link: 8,               // длина звена верёвки
  ropeHalf: 2.5,         // полутолщина верёвки для столкновений (видимая толщина ≈ 5 u)
  hold: 0.08,            // как сильно верёвка держит нарисованную форму
  ropeGive: 0.3,         // насколько конфета продавливает верёвку
  ropeIters: 22,         // итерации Верле
  ropeLife: 10,          // жизнь верёвки, с (последние 1,5 с мигает)
  blinkFrom: 8.5,        // с этого возраста верёвка мигает и НЕ считается началом среза (росчерк с неё рисует)
  scrapFade: 1.2,        // обрывки тают, с
  cutStart: 18,          // росчерк, начатый ближе к верёвке, — срез
  dragStart: 4,          // сдвиг пальца до начала росчерка
  mouthR: 36,            // зона рта (расстояние от центра конфеты до рта)
  omMoves: [20, 40, 52, 64, 76], // моменты перебежек Ома Нома, с (D-36: после 40 с — каждые 12 с)
  omWarn: 2,             // за сколько секунд тянется в новый угол
  omRunSec: 0.9,
  spawnAvoidOm: 80,      // конфеты не падают прямо в рот
  bubbleFrom: 14,        // пузыри с этой секунды
  bubbleEvery: 9,        // примерно раз в N с
  bubbleSpeed: 42,
  bubbleR: 26,           // Ø 52: конфета Ø 34 помещается внутрь
  popPad: 14,            // запас тапа по пузырю
  star2: 0,              // 2★ от N конфет (заполняется по замеру ботов, см. STARS ниже)
  star3: 0,              // 3★ от N конфет
};
// Пороги звёзд: 1★ — любой доигранный раунд; 2★ ≈ медиана бота 0,5; 3★ ≈ 0,9 × медиана бота 1 (замер 10 seed).
const STARS = { star2: 42, star3: 57 };   // D-36: было 45/57
Object.assign(TUNE, STARS);
// Геометрия сцены (u)
const W = 320, H = 480, DT = 1 / 60, ROPE_G = 784, SUB = 3;
const FLOOR = 470;                 // верх картонной подставки: тут лапы Ома Нома, тут конфета «плюхается»
const OM_R = 26, OM_CY = FLOOR - 4 - OM_R;   // тело Ø 52; лапы 4; усик 16 → 72 u от лап до усика
const OM_MOUTH_DY = 6;             // рот ниже центра тела
const OM_X = [54, 266];
const FRAME = 9;                   // картонная рамка вокруг поля
// Бот: калибровка «низа горки» относительно рта (сторона — к конфетам). Подобрано сеткой, см. отчёт.
const BOT = { lowDx: 40, lowDy: -50, drop: 110, farPad: 12 };

const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), wrap = document.getElementById("wrap");
const statsEl = document.getElementById("stats"), overEl = document.getElementById("over");
let view = { s: 1, ox: 0, oy: 0, dpr: 1, cw: 0, ch: 0 };

function readBest() { try { return +(localStorage.getItem("lab.best.slide") || 0) || 0; } catch (e) { return 0; } }
function writeBest(v) { try { localStorage.setItem("lab.best.slide", String(v)); } catch (e) {} }
// обучение (рука и её горка) — пока игрок сам не нарисовал горку; сценарный старт — каждый раунд
function readTutorial() { try { return localStorage.getItem("lab.slide.tutorial") === "1"; } catch (e) { return false; } }
function writeTutorial() { try { localStorage.setItem("lab.slide.tutorial", "1"); } catch (e) {} }

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function lowEnd(side, x) { // точка «низ горки» для Ома Нома в x; side = 0 — Ом слева (конфеты справа)
  const dir = side === 0 ? 1 : -1;
  return { x: x + dir * BOT.lowDx, y: OM_CY + OM_MOUTH_DY + BOT.lowDy };
}
function rampFor(side, x) {
  const L = lowEnd(side, x), dir = side === 0 ? 1 : -1;
  return { L, Hp: { x: dir > 0 ? W - BOT.farPad : BOT.farPad, y: L.y - BOT.drop } };
}

let S;
function newGame(seed, opts) {
  const hintOn = opts && opts.tutorial != null ? !!opts.tutorial : !readTutorial();
  seed = seed == null ? (Date.now() & 0xffffff) : (seed >>> 0);
  const r0 = rampFor(0, OM_X[0]);
  S = {
    t: 0, tick: 0, seed, rng: mulberry(seed), ropes: [], candies: [], bubbles: [], fx: [],
    ink: TUNE.inkMax, caught: 0, missed: 0, spawned: 0, over: false, stars: 0, best: readBest(), newBest: false,
    om: { x: OM_X[0], side: 0, run: null, warn: -1, moveIdx: 0, nextMove: TUNE.omMoves[0], chew: 0, open: 0 },
    pending: null, nextSpawn: 0, script: [0.3, 2.7, 3.9, 5.1], scriptX: 252, nextBubble: TUNE.bubbleFrom,
    hint: { active: hintOn, done: false, t0: 0.9, dur: 1.1, a: r0.Hp, b: r0.L },
    bot: null, finish: false, overT: 0, overShown: false, spoolShake: 0, spoolAng: 0,
  };
  S.nextSpawn = S.script[0];
  ptr = null;
  overEl.classList.remove("show");
}

// ---------- ropes ----------
function resample(pts, step) {
  const out = [{ x: pts[0].x, y: pts[0].y }];
  let carry = 0;
  for (let i = 1; i < pts.length; i++) {
    let ax = pts[i - 1].x, ay = pts[i - 1].y; const bx = pts[i].x, by = pts[i].y;
    let seg = Math.hypot(bx - ax, by - ay);
    while (carry + seg >= step) {
      const k = (step - carry) / seg; ax += (bx - ax) * k; ay += (by - ay) * k;
      out.push({ x: ax, y: ay }); seg = Math.hypot(bx - ax, by - ay); carry = 0;
    }
    carry += seg;
  }
  const last = pts[pts.length - 1], tail = out[out.length - 1];
  if (Math.hypot(last.x - tail.x, last.y - tail.y) > step * 0.4) out.push({ x: last.x, y: last.y });
  else { tail.x = last.x; tail.y = last.y; }
  return out;
}
function makeRope(pts) {
  const r = resample(pts, TUNE.link);
  if (r.length < 3) return null;
  const nodes = r.map(p => ({ x: p.x, y: p.y, px: p.x, py: p.y, hx: p.x, hy: p.y }));
  const rest = [];
  for (let i = 0; i < nodes.length - 1; i++) rest.push(Math.hypot(nodes[i + 1].x - nodes[i].x, nodes[i + 1].y - nodes[i].y) * 1.02);
  const rope = { nodes, rest, pinA: true, pinB: true, solid: true, hold: TUNE.hold, age: 0, fade: 0, fadeMax: 0 };
  S.ropes.push(rope);
  return rope;
}
function stepRope(r) {
  const n = r.nodes, last = n.length - 1, g = ROPE_G * DT * DT;
  for (let i = 0; i <= last; i++) {
    const p = n[i];
    if ((i === 0 && r.pinA) || (i === last && r.pinB)) { p.px = p.x; p.py = p.y; continue; }
    const vx = (p.x - p.px) * 0.99, vy = (p.y - p.py) * 0.99;
    p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + g;
    if (r.hold) { p.x += (p.hx - p.x) * r.hold; p.y += (p.hy - p.y) * r.hold; }
  }
  for (let k = 0; k < TUNE.ropeIters; k++) {
    for (let i = 0; i < last; i++) {
      const a = n[i], b = n[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-6;
      if (d <= r.rest[i]) continue; // верёвка тянет, но не толкает
      const wa = (i === 0 && r.pinA) ? 0 : 1, wb = (i + 1 === last && r.pinB) ? 0 : 1, w = wa + wb;
      if (!w) continue;
      const c = (d - r.rest[i]) / d / w;
      a.x += dx * c * wa; a.y += dy * c * wa; b.x -= dx * c * wb; b.y -= dy * c * wb;
    }
  }
}
function scrapify(r, sec) { r.solid = false; r.hold = 0; r.fade = r.fadeMax = sec; }
function segInter(p1, p2, p3, p4) {
  const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
  if (Math.abs(d) < 1e-9) return false;
  const u = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
  const v = ((p3.x - p1.x) * (p2.y - p1.y) - (p3.y - p1.y) * (p2.x - p1.x)) / d;
  return u >= 0 && u <= 1 && v >= 0 && v <= 1;
}
function cutSegment(p0, p1) {
  let cuts = 0;
  for (const r of S.ropes.slice()) {
    if (!r.solid) continue;
    const n = r.nodes;
    for (let i = 0; i < n.length - 1; i++) {
      if (!segInter(p0, p1, n[i], n[i + 1])) continue;
      S.ropes.splice(S.ropes.indexOf(r), 1);
      const A = { nodes: n.slice(0, i + 1), rest: r.rest.slice(0, i), pinA: r.pinA, pinB: false };
      const B = { nodes: n.slice(i + 1), rest: r.rest.slice(i + 1), pinA: false, pinB: r.pinB };
      for (const piece of [A, B]) {
        if (piece.nodes.length < 2) continue;
        Object.assign(piece, { solid: true, hold: 0, age: r.age, fade: 0, fadeMax: 0 });
        for (const p of piece.nodes) { p.px -= (p1.x - p0.x) * 0.04; p.py -= (p1.y - p0.y) * 0.04; }
        scrapify(piece, TUNE.scrapFade);
        S.ropes.push(piece);
      }
      cuts++;
      break;
    }
  }
  return cuts;
}
function ropeDist(p, freshOnly) { // freshOnly: мигающие горки (возраст >= blinkFrom) не считаются — для начала среза
  let best = 1e9;
  for (const r of S.ropes) {
    if (!r.solid) continue;
    if (freshOnly && r.age >= TUNE.blinkFrom) continue;
    const n = r.nodes;
    for (let i = 0; i < n.length - 1; i++) best = Math.min(best, distSeg(p, n[i], n[i + 1]).d);
  }
  return best;
}
function distSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy || 1e-9;
  let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2; t = t < 0 ? 0 : t > 1 ? 1 : t;
  const qx = a.x + dx * t, qy = a.y + dy * t;
  return { d: Math.hypot(p.x - qx, p.y - qy), qx, qy, t };
}

// ---------- candies ----------
function spawnCandy(x) {
  S.candies.push({ x, y: -TUNE.candyR, vx: 0, vy: 30, ang: S.rng() * 6.28, state: "fall", bub: null, demo: S.t < 1 });
  S.spawned++;
}
function chooseX() {
  const m = TUNE.candyR + 8;
  for (let k = 0; k < 20; k++) {
    const x = m + S.rng() * (W - 2 * m);
    if (Math.abs(x - S.om.x) > TUNE.spawnAvoidOm && (!S.om.run || Math.abs(x - S.om.run.to) > TUNE.spawnAvoidOm)) return x;
  }
  return W / 2;
}
function mouth() { return { x: S.om.x, y: OM_CY + OM_MOUTH_DY }; }
function stepCandies(h) {
  const R = TUNE.candyR, cs = S.candies, m = mouth();
  for (const c of cs) {
    if (c.state === "bub") { c.x = c.bub.x; c.y = c.bub.y; c.vx = 0; c.vy = 0; continue; }
    if (c.state !== "fall") continue;
    c.vy += TUNE.candyG * h; c.x += c.vx * h; c.y += c.vy * h;
    for (const r of S.ropes) {
      if (!r.solid || r.fade) continue;
      const n = r.nodes, rr = R + TUNE.ropeHalf;
      for (let i = 0; i < n.length - 1; i++) {
        const q = distSeg(c, n[i], n[i + 1]);
        if (q.d >= rr) continue;
        let nx, ny;
        if (q.d > 1e-6) { nx = (c.x - q.qx) / q.d; ny = (c.y - q.qy) / q.d; }

        if (!(i === 0 && r.pinA)) { a.x -= nx * pen * give * (1 - q.t); a.y -= ny * pen * give * (1 - q.t); }
        if (!(i + 1 === last && r.pinB)) { b.x -= nx * pen * give * q.t; b.y -= ny * pen * give * q.t; }
        const vn = c.vx * nx + c.vy * ny;
        if (vn < 0) { c.vx -= nx * vn * (1 + TUNE.bounce); c.vy -= ny * vn * (1 + TUNE.bounce); }

    if (Math.hypot(c.x - m.x, c.y - m.y) < TUNE.mouthR) {
      c.state = "eaten"; S.caught++; S.om.chew = 0.35;

      continue;
    }
    if (c.y > FLOOR - R) {
      c.state = "splat"; c.y = FLOOR - 4; c.t = 0;
      if (!c.demo) S.missed++;
      continue;
    }
    for (const b of S.bubbles) if (!b.c && Math.hypot(c.x - b.x, c.y - b.y) < b.r + R * 0.6) { b.c = c; c.state = "bub"; c.bub = b; break; }

    if (rv < 0) { a.vx += nx * rv * 0.6; a.vy += ny * rv * 0.6; b.vx -= nx * rv * 0.6; b.vy -= ny * rv * 0.6; }
  }
}

// ---------- бот: act("autoplay", {skill}) ----------
// skill 0 — случайные росчерки; 1 — держит горку от дальней стены в рот, обновляет её до конца жизни,
// заранее перерисовывает под перебежку и режет старую, лопает пузыри с конфетой.
// Ошибка концов горки σ = 34·(1 − skill) u, реакция 0,15…1,0 с, скорость пальца 450…1000 u/с.
function makeBot(skill, seed) {
  const s = Math.max(0, Math.min(1, +skill || 0));

    skill: s, rng: mulberry((seed ^ 0x9E3779B9) >>> 0),
    sigma: 34 * (1 - s), react: 0.15 + 0.85 * (1 - s), speed: 450 + 550 * s,
    pRandom: (1 - s) * (1 - s), pAnticip: s * s, pCut: s, pPop: 0.15 + 0.85 * s, margin: 0.4 + 1.6 * s,
    wait: 0.6, stroke: null, ramps: [], seen: new Set(), strokes: 0, cuts: 0, pops: 0, randoms: 0,

function gauss(rng) { let u = 0; for (let i = 0; i < 4; i++) u += rng(); return (u - 2) * 1.7320508; }
function botStroke(b, kind, pts) {

}
function clampField(p) { return { x: Math.max(6, Math.min(W - 6, p.x)), y: Math.max(30, Math.min(FLOOR - 8, p.y)) }; }

  for (let k = 0; k < 8; k++) {
    const onB = S.bubbles.some(bb => Math.hypot(p.x - bb.x, p.y - bb.y) < bb.r + TUNE.popPad);

}
function botTick() {

  if (b.stroke) { // ведём палец
    const s = b.stroke, q = s.path[s.i++];

    if (s.i >= s.path.length) { const r = endStroke(s.st); if (r && s.kind === "draw") b.ramps.push(r); b.stroke = null; b.wait = b.react * (0.6 + 0.8 * b.rng()); }
    return;

    const a = { x: 15 + b.rng() * (W - 30), y: 40 + b.rng() * 380 }, ang = b.rng() * 6.283, len = 60 + b.rng() * 160;
    const c = clampField({ x: a.x + Math.cos(ang) * len, y: a.y + Math.sin(ang) * len });
    const st0 = freeStart(a);
    if (st0) botStroke(b, "draw", [st0, c]);
    b.wait = b.react * (0.6 + 0.8 * b.rng());
    return;
  }
  if (b.skill <= 0) return;
  // 2) пузырь с конфетой — лопнуть

    b.seen.add(bb);

  }

    if (popAt({ x: bb.x + gauss(b.rng) * b.sigma * 0.3, y: bb.y + gauss(b.rng) * b.sigma * 0.3 })) b.pops++;

  }

  b.ramps = live;
  const lowOf = r => { const a = r.nodes[0], z = r.nodes[r.nodes.length - 1]; return a.y > z.y ? a : z; };
  const good = live.filter(r => Math.hypot(lowOf(r).x - R.L.x, lowOf(r).y - R.L.y) < 40 + b.sigma && r.age < TUNE.ropeLife - b.margin);

    if (ropeDist(p0) < TUNE.cutStart && botStroke(b, "cut", [p0, p1])) { b.cuts++; b.ramps = b.ramps.filter(z => z !== r); return; }
  }

  const need = Math.hypot(R.Hp.x - R.L.x, R.Hp.y - R.L.y);
  if (S.ink < Math.min(need, 120)) return;
  const L = clampField({ x: R.L.x + gauss(b.rng) * b.sigma, y: R.L.y + gauss(b.rng) * b.sigma });
  let Hp = clampField({ x: R.Hp.x + gauss(b.rng) * b.sigma * 0.6, y: R.Hp.y + gauss(b.rng) * b.sigma });

  const fH = freeStart(Hp), fL = fH ? null : freeStart(L);
  if (!fH && !fL) { b.wait = 0.2; return; }
  const pts = fH ? [fH, L] : [fL, Hp];
  // неточная рука: немного дрожи вдоль пути
  const mid = { x: (pts[0].x + pts[1].x) / 2 + gauss(b.rng) * b.sigma * 0.3, y: (pts[0].y + pts[1].y) / 2 + gauss(b.rng) * b.sigma * 0.3 };
  if (!botStroke(b, "draw", [pts[0], mid, pts[1]])) b.wait = 0.2;
}

// ---------- tick ----------
const ROUND_TICKS = Math.round(TUNE.roundSec / DT);
function stepVisual() { // после конца раунда: всё дотаивает под карточкой итога

  S.ropes = S.ropes.filter(r => !(r.fadeMax && r.fade <= 1e-6) && r.nodes[0].y < H + 200);
  for (const c of S.candies) if (c.state === "splat") c.t += DT;
  S.candies = S.candies.filter(c => c.state === "splat" && c.t < 0.6);
  for (const f of S.fx) f.t += DT;
  S.fx = S.fx.filter(f => f.t < f.life);

}
function tick() {

    return;
  }
  S.t += DT; S.tick++;
  if (!S.finish && S.tick >= ROUND_TICKS) { S.finish = true; S.pending = null; } // 90 с: новых конфет нет, ждём доедания
  const om = S.om;
  const hn = S.hint;
  if (hn.active && !hn.done && S.t >= hn.t0 + hn.dur) {
    hn.done = true; hn.active = false;
    makeRope([hn.a, { x: (hn.a.x + hn.b.x) / 2, y: (hn.a.y + hn.b.y) / 2 }, hn.b]);
  }

    const scripted = S.script.length > 0;
    S.pending = { x: scripted ? S.scriptX : chooseX(), at: S.nextSpawn };
  }
  if (!S.finish && S.pending && S.t >= S.pending.at) {
    spawnCandy(S.pending.x); S.pending = null;
    if (S.script.length) S.script.shift();
    if (S.script.length) S.nextSpawn = S.script[0];
    else {
      const k = Math.min(1, S.t / TUNE.roundSec);

    }

    S.bubbles.push({ x: 50 + S.rng() * (W - 100), y: FLOOR + 10, r: TUNE.bubbleR, c: null, ph: S.rng() * 6 });
    S.nextBubble = S.t + TUNE.bubbleEvery * (0.7 + S.rng() * 0.6);

  for (const b of S.bubbles.slice()) if (b.y < -b.r - 4) {
    if (b.c) { b.c.state = "gone"; S.missed++; }
    S.bubbles.splice(S.bubbles.indexOf(b), 1);
  }
  const mvTick = Math.round(om.nextMove / DT);   // перебежки считаем в тиках: без дрейфа S.t
  if (!om.run && S.tick >= mvTick - Math.round(TUNE.omWarn / DT) && om.warn < 0) om.warn = 1 - om.side;
  if (!om.run && S.tick >= mvTick) { om.run = { from: om.x, to: OM_X[1 - om.side], t: 0 }; }
  if (om.run) {
    om.run.t += DT / TUNE.omRunSec;

  for (const c of S.candies) { if (c.state === "fall") c.ang += c.vx * DT / TUNE.candyR; if (c.state === "splat") c.t += DT; }

  if (!drawing) S.ink = Math.min(TUNE.inkMax, S.ink + TUNE.inkRegen * DT);

  S.bubbles.length = 0;
  S.stars = starsFor(S.caught);

  document.getElementById("ovStars").innerHTML = [1, 2, 3].map(i => `<span class="${i <= S.stars ? "on" : "off"}">★</span>`).join("");
  document.getElementById("ovMiss").textContent = "Мимо: " + S.missed;

  document.getElementById("ovThr").textContent = `★★ от ${TUNE.star2} · ★★★ от ${TUNE.star3}`;

// ---------- input ----------
let ptr = null;
function toField(e) {
  const rc = cv.getBoundingClientRect();
  const x = (e.clientX - rc.left - view.ox) / view.s, y = (e.clientY - rc.top - view.oy) / view.s;
  return { x: Math.max(6, Math.min(W - 6, x)), y: Math.max(6, Math.min(FLOOR - 8, y)) }; // зажим: пуговица не уходит за картон
}
function popAt(p) {
  for (const b of S.bubbles) if (Math.hypot(p.x - b.x, p.y - b.y) < b.r + TUNE.popPad) {
    if (b.c) { b.c.state = "fall"; b.c.bub = null; b.c.vx = 0; b.c.vy = 0; }
    S.bubbles.splice(S.bubbles.indexOf(b), 1);
    S.fx.push({ k: "pop", x: b.x, y: b.y, t: 0, life: 0.3 });
    return true;
  }

}
function cancelHint() { if (S.hint.active) S.hint.active = false; }
function startStroke(p) {

}
function moveStroke(st, p) {

  if (st.mode === "draw") {
    const l = st.pts[st.pts.length - 1];
    let d = Math.hypot(p.x - l.x, p.y - l.y);
    if (d < 3) return;
    if (d > S.ink && S.ink < TUNE.minRope) S.spoolShake = 0.2;
    if (d > S.ink) { if (S.ink < 1) return; const k = S.ink / d; p = { x: l.x + (p.x - l.x) * k, y: l.y + (p.y - l.y) * k }; d = S.ink; }

    cutSegment(st.last, p);
    S.fx.push({ k: "trail", x: st.last.x, y: st.last.y, x2: p.x, y2: p.y, t: 0, life: 0.25 });

  if (st.len < TUNE.minRope) { S.ink = Math.min(TUNE.inkMax, S.ink + st.len); return null; }
  const rp = makeRope(st.pts);

}
cv.addEventListener("pointerdown", e => {
  if (S.over || ptr) return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const st = startStroke(toField(e));
  ptr = st ? Object.assign(st, { id: e.pointerId }) : null;
});
cv.addEventListener("pointermove", e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) moveStroke(ptr, toField(ev));
});
function up(e) { if (!ptr || e.pointerId !== ptr.id) return; const st = ptr; ptr = null; endStroke(st); }
cv.addEventListener("pointerup", up);
cv.addEventListener("pointercancel", up);
function bindBtn(el, fn) { el.addEventListener("pointerup", fn); el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") fn(); }); }
bindBtn(document.getElementById("restart"), () => newGame());
bindBtn(document.getElementById("again"), () => newGame());

// ---------- render ----------
function fit() {
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  if (!cw || !ch) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (cw === view.cw && ch === view.ch && dpr === view.dpr) return;
  const pad = 8, s = Math.min((cw - 2 * pad) / (W + 2 * FRAME), (ch - 2 * pad) / (H + 2 * FRAME));
  view = { s, ox: (cw - W * s) / 2, oy: (ch - H * s) / 2, dpr, cw, ch };
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
}
new ResizeObserver(fit).observe(wrap);
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", fit);

const C = { card: "#C98A4B", card2: "#B8773D", shade: "#8F5427", cut: "#5A2E10", cream: "#FBEBD0", cream2: "#E9CFA3", ink: "#4A2512",
  paper: "#C9B8F2", paperHi: "#DCD0F7", om: "#A9DE28", omSh: "#82C126", omLine: "#0B2608", candy: "#E8412F", candyHi: "#FF7A5C",
