};
function eyePos(e, dx, dy) { // центр зрачка: покой + d, затем в эллипс хода своего глаза
  let px = e.rest[0] + dx, py = e.rest[1] + dy;
  const qx = (px - e.c[0]) / e.r[0], qy = (py - e.c[1]) / e.r[1], ql = Math.hypot(qx, qy);
  if (ql > 1) { px = e.c[0] + qx / ql * e.r[0]; py = e.c[1] + qy / ql * e.r[1]; }
  return [px, py];
}
const LOOK = 7; // u: полный взгляд, больше любого радиуса хода
const LS = "lab.hubA.";

function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

};
function buildCatalogue(seed) {
  const rnd = rngOf(seed), games = [];
  for (const th of THEMES) for (const name of th.games) {
    const real = REAL[name];
    games.push({ id: games.length, name, theme: th.id, color: th.color, kind: real ? real.kind : "stub",
      href: real && real.href || null, pic: real && real.pic || null, om: real && real.om || null, prop: real && real.prop || null,
      shape: th.shapes[Math.floor(rnd() * th.shapes.length)], rel: 0, isNew: false });
  }
  const order = games.map(g => g.id);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  order.forEach((id, i) => games[id].rel = i);           // release index: higher = newer
  for (const g of games) g.isNew = g.rel >= games.length - 6;
  return games;
}

  seen: new Set(load("seen", [])),
  recent: load("recent", []),
  fav: load("fav", []),
  topTab: null,          // 'fav' | 'recent' ; null = auto
  daily: null,
};
function today() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function makeDaily() {
  const day = today(), saved = load("daily", null);
  const rnd = rngOf(SEED ^ hashStr(day));
  const reals = GAMES.filter(g => g.kind !== "stub");
  const t1 = reals[Math.floor(rnd() * reals.length)];
  const untried = GAMES.filter(g => !st.seen.has(g.id) && g.id !== t1.id && !st.recent.includes(g.id));
  const t2 = (untried.length ? untried : GAMES)[Math.floor(rnd() * (untried.length || GAMES.length))];
  const th = THEMES.filter(t => t.id !== t1.theme && t.id !== t2.theme)[Math.floor(rnd() * 5)];
  const pool = GAMES.filter(g => g.theme === th.id && g.id !== t2.id);
  const t3 = pool[Math.floor(rnd() * pool.length)];
  if (saved && saved.day === day && saved.seed === SEED) return saved;
  const d = { day, seed: SEED, tasks: [
    { gid: t1.id, text: "Сыграй в «" + t1.name + "»", sub: "любимая классика" },
    { gid: t2.id, text: "Попробуй новую: «" + t2.name + "»", sub: "ты в неё ещё не играл" },
    { gid: t3.id, text: "Тема «" + th.name + "»: «" + t3.name + "»", sub: "загляни на другую полку" },
  ], done: [] };
  save("daily", d); return d;
}
st.daily = makeDaily();

function measure() {

    return { id: Number(el.dataset.id), el, x, y, w: el.offsetWidth, h: el.offsetHeight, card: el.classList.contains("card") };

// ================= scroll & room =================
let scroll = 0, maxScroll = 0, vel = 0, collapse = 0;
function setScroll(y) {
  scroll = Math.max(0, Math.min(maxScroll, y));
  collapse = Math.min(1, scroll / COLLAPSE);
  const roomH = ROOM_FULL - COLLAPSE * collapse;
  content.style.transform = "translate3d(0," + (ROOM_FULL - scroll) + "px,0)";
  room.style.height = roomH + "px";
  scene.style.transform = "translate3d(0," + (-SCENE_SHIFT * collapse) + "px,0)";
  shade.style.top = roomH + "px";
  shade.style.opacity = collapse > 0.02 ? 1 : 0;
  placeOmnom(roomH);
}
let omFeet = { x: OM_FEET_FULL.x, y: OM_FEET_FULL.y };
function placeOmnom(roomH) {
  const peekY = roomH + OM_PEEK;
  omFeet = { x: OM_FEET_FULL.x, y: OM_FEET_FULL.y + (peekY - OM_FEET_FULL.y) * collapse };
  omEl.style.transform = "translate3d(" + (omFeet.x - OM.feetX) + "px," + (omFeet.y - OM.feetY) + "px,0)";

// ================= Om Nom: blink, look, moods =================
const om = { frame: "neutral", blinkAt: 1200, blinkUntil: 0, moodUntil: 0, mood: null,
  look: { x: 0, y: 0 }, lookGoal: { x: 0, y: 0 }, nextGlance: 0, pointer: null, pointerAt: -1e9 };
const FRAME_SRC = {}; ["neutral","blink","joy","wide","wave1","chew"].forEach(f => FRAME_SRC[f] = "assets/hub/omnom_" + f + ".png");
function setFrame(f) {
  if (om.frame === f) return; om.frame = f;
  omFrame.src = FRAME_SRC[f];
  const pup = f === "neutral" ? "neutral" : f === "wide" ? "wide" : null;
  omPupilsL.style.display = omPupilsR.style.display = pup ? "" : "none";
  if (pup) { omPupilsL.src = "assets/hub/omnom_" + pup + "_pupils_l.png"; omPupilsR.src = "assets/hub/omnom_" + pup + "_pupils_r.png"; }
}
function omMood(f, ms) { om.mood = f; om.moodUntil = now + ms; }
function updateOmnom(t, dt) {
  // blink
  if (t >= om.blinkAt) { om.blinkUntil = t + 130; om.blinkAt = t + 1800 + Math.random() * 3200; if (Math.random() < 0.2) om.blinkAt = t + 260; }
  let f = "neutral";
  if (om.mood && t < om.moodUntil) f = om.mood;
  else if (t < om.blinkUntil) f = "blink";
  setFrame(f);
  // gaze target (screen coords): pointer if recent, else glances; scrolling -> look down at shelves
  const eye = { x: omFeet.x + (PUP.neutral.l.rest[0] + PUP.neutral.r.rest[0]) / 2 * OM.ppu, y: omFeet.y + (PUP.neutral.l.rest[1] + PUP.neutral.r.rest[1]) / 2 * OM.ppu };
  let goal;
  if (om.pointer && t - om.pointerAt < 2500) goal = { x: om.pointer.x - eye.x, y: om.pointer.y - eye.y };
  else if (Math.abs(vel) > 0.15 || dragging) goal = { x: 0, y: 200 };
  else {
    if (t > om.nextGlance) { om.nextGlance = t + 1400 + Math.random() * 2600;
      const pts = [{ x:-120, y:-10 }, { x:-150, y:40 }, { x:150, y:-80 }, { x:0, y:200 }, { x:60, y:150 }, { x:-60, y:-60 }];
      om.lookGoal = pts[Math.floor(Math.random() * pts.length)]; }
    goal = om.lookGoal;
  }
  const len = Math.hypot(goal.x, goal.y) || 1, nx = goal.x / len, ny = goal.y / len, k = Math.min(1, len / 60);
  const tx = nx * k * LOOK * OM.ppu, ty = ny * k * LOOK * OM.ppu; // общий сдвиг взгляда, px
  const a = 1 - Math.exp(-dt / 70);
  om.look.x += (tx - om.look.x) * a; om.look.y += (ty - om.look.y) * a;
  // у каждого глаза свой зажим в эллипс хода: зрачок не выходит из своего белка и не переходит шов
  const pu = om.frame === "wide" ? PUP.wide : PUP.neutral, dxu = om.look.x / OM.ppu, dyu = om.look.y / OM.ppu;
  const pl = eyePos(pu.l, dxu, dyu), pr = eyePos(pu.r, dxu, dyu);
  om.pl = pl; om.pr = pr;
  omPupilsL.style.transform = "translate(" + ((pl[0] - pu.l.rest[0]) * OM.ppu).toFixed(2) + "px," + ((pl[1] - pu.l.rest[1]) * OM.ppu).toFixed(2) + "px)";
  omPupilsR.style.transform = "translate(" + ((pr[0] - pu.r.rest[0]) * OM.ppu).toFixed(2) + "px," + ((pr[1] - pu.r.rest[1]) * OM.ppu).toFixed(2) + "px)";
}

// ================= actions =================

function toast(text) { const e = $("toast"); e.textContent = text; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 1600); }
function markOpened(g) {

  st.recent = [g.id, ...st.recent.filter(i => i !== g.id)].slice(0, 9); save("recent", st.recent);

}

  const g = GAMES[id];

  markOpened(g);
  lastLaunch = { id, name: g.name, kind: g.kind, via: via || "tap", href: g.href };
  omMood("joy", 900);

    showSheet("stub", g);

}

        return '<div class="task-row" data-act="game" data-id="' + tg.id + '"><div class="tw" style="background:' + tg.color + '">' +
          (tg.pic ? '<img class="pic" src="assets/hub/' + tg.pic + '.png" style="width:100%;height:100%;object-fit:cover" alt="">' :
           tg.om ? '<img class="om" src="assets/hub/omnom_' + (tg.om === "wave1" ? "neutral" : tg.om) + '.png" alt="">' : svgSil(tg.shape)) +
          '</div><div class="tx">' + esc(t.text) + '<small>' + esc(t.sub) + '</small></div><div class="tick' + (st.daily.done.includes(t.gid) ? " done" : "") + '"></div></div>'; }).join("");
  } else {

  h += '<div class="btns">' + favBtn + '<span class="btn" data-act="close">Понятно</span></div>';
  $("sheet").innerHTML = h; $("modal").classList.add("on"); modal = { kind, id: g ? g.id : null };
}
function closeSheet() { $("modal").classList.remove("on"); modal = null; render(); }

function doAct(el) {
  const a = el.dataset.act, id = el.dataset.id !== undefined ? Number(el.dataset.id) : null;
  if (a === "close") { if (el.id !== "modal" || true) closeSheet(); return; }
  if (modal && a !== "game" && a !== "favbtn") return;
  if (a === "game") { if (modal) { $("modal").classList.remove("on"); modal = null; } openGame(id, "tap"); }
  else if (a === "card") { if (el.dataset.k === "daily") showSheet("daily"); else openGame(id, "card-" + el.dataset.k); }
  else if (a === "tab") { st.topTab = el.dataset.k; render(); }
  else if (a === "favbtn") { toggleFav(id); showSheet(modal.kind, GAMES[id]); }
  else if (a === "panel") { showSheet(el.dataset.k === "daily" ? "daily" : el.dataset.k); }
  else if (a === "omnom") { omMood(Math.random() < 0.5 ? "wave1" : "joy", 800); }
  else if (a === "back") { if (!noNav) location.href = "index.html"; }
  else if (a === "task-next") { newTarget(); }

// ================= input: drag-scroll, tap with 12 px slop, long press, wheel =================
let ptr = null, dragging = false, fitK = 1, fitX = 0, fitY = 0;
const toStage = e => ({ x: (e.clientX - fitX) / fitK, y: (e.clientY - fitY) / fitK });
stage.addEventListener("pointerdown", e => {
  if (e.button > 0 || ptr) return;
  const p = toStage(e), actEl = e.target.closest("[data-act]");
  const inScroll = !modal && !e.target.closest("#panel,#shop,#back,#task,#modal");
  ptr = { id: e.pointerId, x0: p.x, y0: p.y, actEl, inScroll, moved: false, long: false, s0: scroll, anchor: 0, samples: [[performance.now(), p.y]] };
  vel = 0; dragging = false;
  if (actEl && actEl.id !== "modal") actEl.classList.add("pressed");
  if (actEl && actEl.dataset.act === "game" && !modal) ptr.lp = setTimeout(() => { if (ptr && !ptr.moved) { ptr.long = true; actEl.classList.remove("pressed"); toggleFav(Number(actEl.dataset.id)); } }, LONG_PRESS_MS);
  om.pointer = p; om.pointerAt = now;
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  if (e.target.closest("a")) e.preventDefault();
});
stage.addEventListener("pointermove", e => {
  const p = toStage(e);
  if (e.pointerType === "mouse" || ptr) { om.pointer = p; om.pointerAt = now; }
  if (!ptr || e.pointerId !== ptr.id) return;
  const d = Math.hypot(p.x - ptr.x0, p.y - ptr.y0);
  if (!ptr.moved && d >= TAP_SLOP) {
    ptr.moved = true; clearTimeout(ptr.lp);
    if (ptr.actEl) ptr.actEl.classList.remove("pressed");
    if (ptr.inScroll) { dragging = true; ptr.anchor = p.y; ptr.s0 = scroll; }
  }
  if (dragging) {
    setScroll(ptr.s0 - (p.y - ptr.anchor));
    ptr.samples.push([performance.now(), p.y]); if (ptr.samples.length > 8) ptr.samples.shift();
  }
});
function endPtr(e, cancelled) {
  if (!ptr || e.pointerId !== ptr.id) return;
  clearTimeout(ptr.lp);
  if (ptr.actEl) ptr.actEl.classList.remove("pressed");
  if (dragging) {
    const s = ptr.samples, tNow = performance.now();
    let i = s.length - 1; while (i > 0 && tNow - s[i - 1][0] < 90) i--;
    const dt = tNow - s[i][0];
    vel = dt > 8 ? -(s[s.length - 1][1] - s[i][1]) / dt : 0;     // px per ms, scroll direction
    if (tNow - s[s.length - 1][0] > 80) vel = 0;                   // finger stopped before lifting
  } else if (!cancelled && !ptr.moved && !ptr.long && ptr.actEl) {
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const upEl = under && under.closest("[data-act]");
    if (upEl === ptr.actEl) doAct(ptr.actEl);
  }
  ptr = null; dragging = false;
}
stage.addEventListener("pointerup", e => endPtr(e, false));
stage.addEventListener("pointercancel", e => endPtr(e, true));
stage.addEventListener("click", e => { if (e.target.closest("a")) e.preventDefault(); });
stage.addEventListener("wheel", e => {
  e.preventDefault(); if (modal) return;
  vel = 0; setScroll(scroll + e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 600 : 1) / fitK);
}, { passive: false });
stage.addEventListener("contextmenu", e => e.preventDefault());

// ================= fit 390x844 into the window =================
function fit() {
  const w = window.innerWidth, h = window.innerHeight; if (!w || !h) return;
  fitK = Math.min(w / W, h / H); fitX = (w - W * fitK) / 2; fitY = (h - H * fitK) / 2;
  stage.style.transform = "translate(" + fitX + "px," + fitY + "px) scale(" + fitK + ")";
}
window.addEventListener("resize", fit); window.addEventListener("orientationchange", fit); fit();

// ================= self-test mode ?task=1 =================
let taskState = null;
function visibleIds() {
  const top = ROOM_FULL - COLLAPSE * collapse, bottom = H - PANEL_H, off = ROOM_FULL - scroll;
  return layout.boxes.filter(b => b.y + off + b.h > top && b.y + off < bottom).map(b => b.id);
}
function newTarget() {
  const rnd = rngOf((Date.now() & 0xffffff) ^ SEED);
  const onStart = new Set(layout.boxes.filter(b => b.y + ROOM_FULL < H - PANEL_H).map(b => b.id));
  const pool = GAMES.filter(g => !onStart.has(g.id) && (!taskState || g.id !== taskState.target));
  const g = pool[Math.floor(rnd() * pool.length)];
  taskState = { target: g.id, t0: now, taps: 0, found: false, sec: null, results: taskState ? taskState.results : [], flash: 0, wrong: null };
  taskEl.classList.add("on"); markTarget(); drawTask();
}
function taskTap(g) {
  taskState.taps++;
  if (g.id === taskState.target) {
    taskState.found = true; taskState.sec = (now - taskState.t0) / 1000;
    taskState.results.push({ name: g.name, sec: +taskState.sec.toFixed(1), taps: taskState.taps });
    omMood("joy", 1200); markTarget(); drawTask();
  } else { taskState.wrong = g.name; taskState.flash = now + 1200; omMood("wide", 500); drawTask(); }
}
function markTarget() {
  content.querySelectorAll(".box.hit").forEach(e => e.classList.remove("hit"));
  if (taskState && taskState.found) content.querySelectorAll('.box[data-id="' + taskState.target + '"]').forEach(e => e.classList.add("hit"));
}
function fmt(s) { return s.toFixed(1).replace(".", ","); }
let taskDrawn = "";
function drawTask() {
  if (!taskState) return;
  const g = GAMES[taskState.target]; let h, bad = false;
  if (taskState.found) {
    const ok = taskState.sec <= 10;
    h = 'Нашёл «' + esc(g.name) + '» за<span class="t">' + fmt(taskState.sec) + ' с</span><span class="btn" data-act="task-next">Дальше</span>' +
      '<div class="sub">' + (ok ? "в норме: ≤ 10 с" : "дольше нормы 10 с") + ' · тапов: ' + taskState.taps + ' · найдено: ' + taskState.results.length + '</div>';
  } else if (now < taskState.flash) {
    bad = true; h = 'Это «' + esc(taskState.wrong) + '». Найди: «' + esc(g.name) + '»<span class="t">' + fmt((now - taskState.t0) / 1000) + ' с</span>';
  } else h = 'Найди: «' + esc(g.name) + '»<span class="t">' + fmt((now - taskState.t0) / 1000) + ' с</span>';
  if (h !== taskDrawn) { taskEl.innerHTML = h; taskDrawn = h; }
  taskEl.classList.toggle("bad", bad);
}

// ================= main loop =================
let now = 0, last = 0, frames = [], ready = false, glowStep = 0;
function frame(t) {
  now = t; const dt = Math.min(50, last ? t - last : 16); last = t;
  frames.push(dt); if (frames.length > 120) frames.shift();
  if (!dragging && Math.abs(vel) > 0.01) {
    const before = scroll; setScroll(scroll + vel * dt);
    vel *= Math.exp(-dt / 325);
    if (scroll === before) vel = 0;
  } else if (!dragging) vel = 0;
  updateOmnom(t, dt);
  const gs = Math.floor(t / 420);
  if (gs !== glowStep) { glowStep = gs; bulbEls.forEach((e, i) => e.classList.toggle("on", (i + gs) % 3 === 0)); }
  if (taskState && !taskState.found) drawTask();
  requestAnimationFrame(frame);
}

// ================= test API =================
window.__game = {
  get ready() { return ready; },
  getState() {
    const vis = visibleIds();
    return {
      scene: modal ? "sheet:" + modal.kind : "hub",
      scroll: Math.round(scroll), maxScroll: Math.round(maxScroll), collapse: +collapse.toFixed(3),
      roomH: Math.round(ROOM_FULL - COLLAPSE * collapse),
      omnom: { frame: om.frame, feet: { x: Math.round(omFeet.x), y: Math.round(omFeet.y) }, look: { x: +om.look.x.toFixed(1), y: +om.look.y.toFixed(1) } },
      games: GAMES.length, themes: THEMES.map(t => ({ id: t.id, name: t.name, color: t.color, count: GAMES.filter(g => g.theme === t.id).length })),
      real: GAMES.filter(g => g.kind !== "stub").map(g => ({ id: g.id, name: g.name, kind: g.kind, href: g.href })),
      newIds: GAMES.filter(isNewDot).map(g => g.id), seen: [...st.seen], recent: st.recent.slice(), fav: st.fav.slice(), topTab: topTab(),
      daily: { tasks: st.daily.tasks.map(t => ({ gid: t.gid, name: GAMES[t.gid].name, text: t.text, untried: t.sub.includes("ещё не") })), done: st.daily.done.slice() },
      cards: (m => ({ recent: m.recent.id, fresh: m.fresh.id }))(cardsModel()),
      visible: vis, lastLaunch,
      task: taskState ? { target: taskState.target, name: GAMES[taskState.target].name, found: taskState.found, sec: taskState.sec === null ? null : +taskState.sec.toFixed(2), taps: taskState.taps, results: taskState.results } : null,
      view: { k: fitK, x: fitX, y: fitY },
    };
  },
  act(a, p) {
    if (a === "scrollTo") { vel = 0; setScroll(Number(p)); }
    else if (a === "scrollBy") { vel = 0; setScroll(scroll + Number(p)); }
    else if (a === "open" || a === "tap") openGame(typeof p === "string" ? byName(p).id : p, "act");
    else if (a === "fav") toggleFav(typeof p === "string" ? byName(p).id : p);
    else if (a === "tab") { st.topTab = p; render(); }
    else if (a === "card") { const el = content.querySelector('.card[data-k="' + p + '"]'); if (el) doAct(el); }
    else if (a === "panel") showSheet(p === "daily" ? "daily" : p);
    else if (a === "close") closeSheet();
    else if (a === "noNav") noNav = !!p;
    else if (a === "newTarget") newTarget();
    else if (a === "reset") { ["seen","recent","fav","daily"].forEach(k => { try { localStorage.removeItem(LS + k); } catch (_) {} }); location.reload(); }
    else if (a === "boxRect") { // page-pixel rect of a game's shelf box (for real-mouse tests); scrolls it into view first
      const id = typeof p === "string" ? byName(p).id : p;
      const b = layout.boxes.find(b => b.id === id && !b.card); if (!b) return null;
      const top = ROOM_FULL - COLLAPSE, want = b.y + ROOM_FULL - (top + 40);
      if (b.y + ROOM_FULL - scroll < top || b.y + ROOM_FULL - scroll + b.h > H - PANEL_H) setScroll(want);
      const off = ROOM_FULL - scroll;
      return { x: fitX + (b.x + b.w / 2) * fitK, y: fitY + (b.y + off + b.h / 2) * fitK };
    }
  },
  metrics() {
    const s = frames.slice().sort((a, b) => a - b), avg = s.reduce((a, b) => a + b, 0) / (s.length || 1);
    return { fps: Math.round(1000 / (avg || 16.7)), frameMsP95: +(s[Math.floor(s.length * 0.95)] || 0).toFixed(1), drawCalls: -1 };
  },
};

// ================= start =================
render();
if (TASK_MODE) newTarget();
window.addEventListener("load", () => { measure(); requestAnimationFrame(t => { frame(t); requestAnimationFrame(() => { ready = true; }); }); });
</script>
