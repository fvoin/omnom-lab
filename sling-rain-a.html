<script>
"use strict";
// ---- Ом Ном кадрами приложения (D-40, не рисунок кодом) — блок как в sling-rain.html ----
const OMS = (() => {
  const PX = 6.4024, PIV = [0.5366, 0.0253], MOUTH = [-2.08, -19.98];
  const PUP = {
    neutral: { l: { rest: [-13.93, -44.86], c: [-16.67, -45.33], r: [3.91, 3.98] },
             r: { rest: [-0.81, -42.67], c: [2.23, -42.67], r: [6.22, 6.39] } },
    ajar:   { l: { rest: [-13.7, -47.75], c: [-15.42, -48.29], r: [2.61, 2.51] },
             r: { rest: [-1.6, -45.33], c: [1.92, -42.83], r: [6.06, 6.01] } },
    wide:   { l: { rest: [-13.39, -51.18], c: [-14.79, -51.42], r: [1.98, 1.54] },
             r: { rest: [-1.13, -48.76], c: [0.98, -45.95], r: [5.73, 5.06] } },
    wide2:  { l: { rest: [-13.93, -52.28], c: [-14.95, -52.67], r: [1.64, 1.31] },
             r: { rest: [-1.52, -49.54], c: [0.83, -46.58], r: [5.85, 5.25] } },
  };

  const NAMES = ["neutral", "ajar", "wide", "wide2", "chew", "chew2", "sad", "joy", "blink", "half", "shadow"];
  for (const f in PUP) NAMES.push(f + "_pupils_l", f + "_pupils_r");

  const waits = [];
  for (const n of NAMES) {
    const i = new Image(); img[n] = i;
    waits.push(new Promise((res) => { i.onload = i.onerror = res; }));
    i.src = "assets/omnom/" + n + ".png";
  }
  const ok = (i) => i && i.complete && i.naturalWidth > 0;
  function eyePos(e, dx, dy) {
    let px = e.rest[0] + dx, py = e.rest[1] + dy;
    const qx = (px - e.c[0]) / e.r[0], qy = (py - e.c[1]) / e.r[1], ql = Math.hypot(qx, qy);

        const vx = dx - ex, vy = dy - ey, L = Math.hypot(vx, vy) || 1, a = Math.min(1, L / 45);

      const pL = eyePos(pu.l, gx, gy), pR = eyePos(pu.r, gx, gy);
      ctx.drawImage(pl, -PIV[0] * pw + (pL[0] - pu.l.rest[0]) * PX, -(1 - PIV[1]) * ph + (pL[1] - pu.l.rest[1]) * PX);
      ctx.drawImage(pr, -PIV[0] * pw + (pR[0] - pu.r.rest[0]) * PX, -(1 - PIV[1]) * ph + (pR[1] - pu.r.rest[1]) * PX);
      last.frame = f; last.l = pL; last.r = pR; last.d = [gx, gy];
    }
    ctx.restore();
  }
  return { draw, img, PUP, eyePos, last, loaded: Promise.all(waits), ready: () => NAMES.every((n) => ok(img[n])) };
})();
// ---- «Мармеладный дождь», вариация A «Пружина и труба» (D-93, design/lab-sling-rain-v2.md) ----
// Палец внизу тянет пружину; конфета взлетает по трубе вдоль правой стены и выходит в поле сверху горизонтально.
// Выбор — одно число (сила): vx = −(40 + pull × springK). Цепочка по желейкам вниз, тап в полёте — пузырь, тележка ловит.
const TUNE = {
  gravity: 1100,      // u/с² (было 784; скорости ×1,185)
  springK: 5.4,       // u/с на 1 u оттяжки (ручка)
  vx0: 40,            // u/с, скорость выхода при нулевой оттяжке
  pullMax: 100, pullMin: 10,
  tubeT: 0.25,        // с, конфета в трубе («вжух», ручка)
  aimPreview: 0,      // 0 — пунктир до первой желейки, 1 — плюс один отскок (ручка)
  candyR: 12, candyHitR: 9,
  pegHalf: 7, pegThick: 12, pegGap: 20, pegMin: 26, pegMax: 40, jitter: 8,
  e: 0.72,            // упругость желеек (ручка); 0,65 на 400 seed не лучше (28 % / 68 %) — оставлено 0,72, как в описании
  eTired: 0.45, tiredT: 3.0, // «усталость»: после 3,0 с полёта e 0,45, конфета бледнеет
  kt: 0.98, wallE: 0.6, maxSpeed: 1126,
  gold: 10,           // золотых в раунде 1; раунд n: gold + min(n−1, 2). Описание: 8; bench 400 seed: случайный 45 % → 35 %, прицельный 82 % → 75 %
  shots: 6,           // конфет в раунде; поймал тележкой — +1. Описание: 7; bench 400 seed: случайный 35 % → 28 %, прицельный 75 % → 70 %
  bubbleT: 0.7,       // с, пузырь (ручка)
  bubbleRise: 270,    // u/с, всплытие (≈ 140 u за 0,7 с)
  cartSpeed: 0.6, cartAmp: 100, catchW: 18, omScale: 0.7,
  popGap: 0.075, popTotal: 1.0, // вся очередь лопания ≤ 1,0 с
  stuckV: 40, stuckT: 0.5, stuckR: 16, shotMax: 6, // застряла: |v| < 40 или сдвиг < 16 u за 0,5 с (прыгает в «люльке» между двумя желейками)
  firstTries: 60,     // вводов при проверке «≥ 2 золотые — первое касание»
  aimTries: 10, aimNoise: 3, // прицельный бот: лучший из 10, шум ±3 u оттяжки

const KNOBS = [ // ручки панели: ключ, подпись, мин, макс, шаг
  ["springK", "Пружина, u/с на 1 u", 3.5, 7, 0.1],
  ["e", "Упругость желеек", 0.5, 0.95, 0.01],
  ["bubbleT", "Пузырь, с", 0.3, 1.5, 0.05],
  ["tubeT", "Труба, с", 0.1, 0.6, 0.05],
  ["aimPreview", "Пунктир: +отскок", 0, 1, 1],
];
const W = 320, H = 480, DT = 1 / 60, SUB = 2;
// Раскладка (u): труба x 290–318, y 60–470, колено влево, выход (286; 62); картонная стенка x 286 от y 120 до низа.
const TUBE = { x0: 290, x1: 318, cx: 304, top: 80, bot: 470 }, ELB = { cx: 286, cy: 80, r: 18 }, EXIT = { x: 286, y: 62 };
const WALL_X = 286, WALL_Y = 120;
const F = { x0: 30, x1: 278, y0: 150, y1: 380, cx: 154 }; // поле желеек, ось зеркала x 154
const CART_C = 154, FEET_Y = 458, MOUTH_Y = 444;
const SPRING_BOT = 468, SPRING_TOP = 440; // пружина в покое; сжатие до 20 u
const C = {
  paper: "#F5A9D0", paperHi: "#F9C3DF", paperLo: "#EE97C3", ink: "#4A2512", cream: "#FBEBD0", creamSh: "#E9CFA3",
  card: "#C98A4B", cardMid: "#B8773D", cardSh: "#8F5427", candy: "#E8412F", wrap: "#FFC93C", gold: "#FFD23F", goldLit: "#FFF6B8",
  mint: "#5FD3C7", mintLit: "#D9FFF9", mintDk: "#1E7F75", goldDk: "#B07A00",
};
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const q = new URLSearchParams(location.search);
for (const k in TUNE) if (q.has(k)) TUNE[k] = +q.get(k);
let S, bot = null, QUIET = false, STATS = null;

// ---- Геометрия ----
function segEnds(p) { const c = Math.cos(p.a) * TUNE.pegHalf, s = Math.sin(p.a) * TUNE.pegHalf; p.ax = p.x - c; p.ay = p.y - s; p.bx = p.x + c; p.by = p.y + s; return p; }
function ptSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
  const qx = ax + dx * t, qy = ay + dy * t; return { d: Math.hypot(px - qx, py - qy), qx, qy };
}
function orient(ax, ay, bx, by, cx, cy) { return Math.sign((bx - ax) * (cy - ay) - (by - ay) * (cx - ax)); }
function segSeg(p, o) {
  if (orient(p.ax, p.ay, p.bx, p.by, o.ax, o.ay) * orient(p.ax, p.ay, p.bx, p.by, o.bx, o.by) < 0 &&
      orient(o.ax, o.ay, o.bx, o.by, p.ax, p.ay) * orient(o.ax, o.ay, o.bx, o.by, p.bx, p.by) < 0) return 0;
  return Math.min(ptSeg(p.ax, p.ay, o.ax, o.ay, o.bx, o.by).d, ptSeg(p.bx, p.by, o.ax, o.ay, o.bx, o.by).d,
    ptSeg(o.ax, o.ay, p.ax, p.ay, p.bx, p.by).d, ptSeg(o.bx, o.by, p.ax, p.ay, p.bx, p.by).d);
}

// ---- Поле по seed: шаблон (левая половина от оси 154) + разброс, зеркало, зазор, добивка до 26, срез до 40 ----
const PY0 = F.y0 + 6, PY1 = F.y1 - 6; // центры желеек; концы капсул не выходят за 150–380
function tplGrid(r, y0, y1) {
  const out = [], rowH = 40 + r() * 6, colW = 56 + r() * 10, tilt = r() * 0.45, holes = 0.1 + r() * 0.15;
  for (let k = 0, y = y0 + 4; y <= y1; k++, y += rowH) {
    const off = (k % 2) * colW / 2;
    for (let x = F.cx - off; x >= F.x0; x -= colW) if (r() >= holes) out.push({ x, y, a: (k % 2 ? 1 : -1) * tilt });
  }
  return out;
}
function tplRings(r, y0, y1) {
  const out = [], h = y1 - y0;
  const bR = 50 + r() * 10, by = y0 + h * 0.36, n = 10;
  for (let i = 0; i < n; i++) { const t = Math.PI / 2 + i / n * 2 * Math.PI, x = F.cx + Math.cos(t) * bR; if (x <= F.cx + 0.5) out.push({ x, y: by + Math.sin(t) * bR, a: t + Math.PI / 2 }); }
  const sx = 72 + r() * 12, sy = y0 + h * 0.8, sR = 30 + r() * 6, m = 7, t0 = r() * 6;
  for (let i = 0; i < m; i++) { const t = t0 + i / m * 2 * Math.PI; out.push({ x: sx + Math.cos(t) * sR, y: sy + Math.sin(t) * sR, a: t + Math.PI / 2 }); }
  for (let x = F.cx - 29; x >= F.x0; x -= 58) out.push({ x, y: y0, a: 0 });
  out.push({ x: F.cx, y: sy, a: Math.PI / 2 }, { x: 44, y: by, a: 1.2 }, { x: F.cx, y: y1, a: 0 });
  return out;
}
function tplArcs(r, y0, y1) {
  const out = [], n = 5, step = (y1 - y0) / (n - 1);
  for (let k = 0; k < n; k++) {
    const yk = y0 + k * step, cv = (k % 2 ? 1 : -1) * (0.0022 + r() * 0.0018), off = (k % 2) * 28;
    for (let x = F.cx - off; x >= F.x0; x -= 56) { const dx = x - F.cx, y = yk + cv * (dx * dx - 4200); if (y >= y0 - 4 && y <= y1 + 4) out.push({ x, y, a: Math.atan(2 * cv * dx) }); }
  }

const TEMPLATES = [["решётка", tplGrid], ["кольца", tplRings], ["дуги", tplArcs]];
function launch(pull) { return { x: EXIT.x, y: EXIT.y, vx: -(TUNE.vx0 + pull * TUNE.springK), vy: 0, out: false }; }
// Прогон одного выстрела без тележки и пузыря (бот, проверка поля). first — стоп на первом касании.
function simShot(pegs, pull, first) {
  const lit = new Set(); let n = 0, gold = 0, firstPeg = null, t = TUNE.tubeT;

  while (t < TUNE.shotMax && c.y < H + 20 && !(first && firstPeg)) {
    const e = t >= TUNE.tiredT ? TUNE.eTired : TUNE.e;
    for (let s = 0; s < SUB; s++) stepBody(c, pegs, DT / SUB, hit, false, e);

function cellOf(p) { const col = Math.max(0, Math.min(3, Math.floor((p.x - F.x0) / ((F.x1 - F.x0) / 4)))), row = p.y < (F.y0 + F.y1) / 2 ? 0 : 1; return row * 4 + col; }

  const r = mulberry(seed ^ 0x9e3779b9), y0 = PY0, y1 = PY1;
  const ti = Math.floor(r() * TEMPLATES.length), raw = TEMPLATES[ti][1](r, y0, y1);

  for (const p of raw) add(p.x, p.y, p.a, true) || add(p.x, p.y, p.a, false);

  for (let k = 0, y = y0; y <= y1; k++, y += st * 0.8) for (let x = F.cx - (k % 2) * st / 2; x >= F.x0; x -= st) fill.push([x, y]);
  for (let i = fill.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [fill[i], fill[j]] = [fill[j], fill[i]]; }
  for (const [x, y] of fill) { if (pegs.length >= TUNE.pegMin + 8) break; add(x, y, (r() * 2 - 1) * 0.9, true); }
  for (let i = 0; pegs.length < TUNE.pegMin && i < 3000; i++) add(F.x0 + r() * (F.cx - F.x0), y0 + r() * (y1 - y0), (r() * 2 - 1) * 0.9, false);

  state: shortState,

    const r = cv.getBoundingClientRect(), c = S.candy;
    return Object.assign(shortState(), {
      seed: S.seed, template: S.template, tick: Math.round(S.t * 60), lastAct: S.lastAct, omFrame,
      maxChain: S.maxChain, shot: S.shot, catches: S.catches, firstGold: S.firstGold, firstPegs: S.firstPegs, cellCap: S.cellCap,
      pegsTotal: S.pegs.length, pegsLeft: S.pegs.filter((p) => p.alive).length, lit: S.pegs.filter((p) => p.alive && p.lit).length,
      pegs: S.pegs.map((p) => ({ x: +p.x.toFixed(1), y: +p.y.toFixed(1), a: +p.a.toFixed(3), gold: p.gold, lit: p.lit, alive: p.alive })),
      bubble: { used: S.bubbleUsed, active: !!c.bubble, t: +c.bubbleT.toFixed(2) },
      candy: { x: c.x, y: c.y, vx: c.vx, vy: c.vy, vis: c.vis }, lastPull: S.lastPull,
      aim: S.phase === "drag" && S.pull >= TUNE.pullMin ? (() => { const a = aimPath(S.pull); return { mark: a.mark, hit: a.hit, first: a.pts[0] || null }; })() : null,
      cart: { x: cartX(), mouthY: MOUTH_Y, catchW: TUNE.catchW }, lastShot: S.lastShot,
      flyers: S.flyers.length, popups: S.popups.length, log: S.log.slice(-40), bot: bot ? bot.skill : null,
      view: { left: r.left, top: r.top, scale, W, H, exit: EXIT, field: F }, tune: TUNE,
    });
  },
  act(a, p) {
    if (a === "seed") newRound(typeof p === "object" ? p.seed : p, typeof p === "object" ? p.level : undefined);
    else if (a === "restart") newRound(S.seed, S.level);
    else if (a === "newSeed") newRound(undefined, S.level);
    else if (a === "continue") continueRound();
    else if (a === "pull") { if (S.phase === "aim") startPull(); setPull(typeof p === "object" ? p.y : p); }
    else if (a === "release") return release();
    else if (a === "shoot") { if (!startPull()) return false; setPull(typeof p === "object" ? p.y : p); return release(); }
    else if (a === "tap") return tap();
    else if (a === "clock") manual = !!(p && p.manual);
    else if (a === "step") { for (let i = 0; i < (p || 1); i++) tick(); }
    else if (a === "autoplay") { bot = p === false || (p && p.on === false) ? null : { skill: p && p.skill != null ? +p.skill : 1 }; if (S) { S.botT = 0; S.botPlan = null; } }
    else if (a === "plan") return botPlan();
    else if (a === "bench") return bench(p);
    else if (a === "setTune") { Object.assign(TUNE, p); }
    else if (a === "render") render();
  },
  metrics() {
    const d = []; for (let i = 1; i < frames.length; i++) d.push(frames[i] - frames[i - 1]);
    const avg = d.length ? d.reduce((s, x) => s + x, 0) / d.length : 16.7; d.sort((x, y) => x - y);
    return { fps: Math.round(1000 / avg), frameMsP95: d.length ? d[Math.floor(d.length * 0.95)] : 0, drawCalls: -1 };
  },
};
// ?seed=7&level=2&bot=1 — бот играет сам; любые ключи TUNE тоже из адреса (?e=0.7&gold=9)
newRound(q.has("seed") ? +q.get("seed") : undefined, q.has("level") ? +q.get("level") : 1);
if (q.has("bot")) bot = { skill: +q.get("bot") || 0 };
fit(); render();
OMS.loaded.then(() => { window.__game.ready = true; });
requestAnimationFrame(loop);
</script>
