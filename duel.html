<script>
"use strict";
// =================================================================================================
// Jelly Duel (D-161). Physics runs in WORLD units (400 wide, as in the prototype); everything is drawn
// in the reference frame of 1080 u wide (new7-a §0.1), 1 world unit = K = 2.7 u. The view layer
// `draw(name, x, y, opts)` is the only place that paints sprites; no art file -> stub shape.
// =================================================================================================
const W = 400, K = 2.7, FW = 1080, BODY = 24, WIND_K = 20, MAXPULL = 110, MINPULL = 12, DT = 1 / 120, WIN_HITS = 3;
const LEG = 30;                       // fighter centre above the feet, world units (sprite 170 u tall)
const NEAR_MISS = 20;                 // edge gap, world units: "almost hit" -> oops
const AMMO = [Infinity, 2, 2];        // jelly, triple, bounce per match
const DOT_N = 13, DOT_SEC = 0.67, DOT_SEC_EASY = 1.0;

  easy:   { e0: 1.6,  wind: 1, stars: 2, label: "Easy" },
  medium: { e0: 0.75, wind: 2, stars: 3, label: "Medium" },
  hard:   { e0: 0.45, wind: 3, stars: 3, label: "Hard" },
};
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ---- seeded random (game logic only; view effects use Math.random) ------------------------------
let seedN = null, rs = 0;
function seed(n) { seedN = n; rs = (n >>> 0) || 1; }
function rng() {
  if (seedN === null) return Math.random();

  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

const rnd = (a, b) => a + rng() * (b - a);

// ---- tuning (the gear) ----------------------------------------------------------------------------
const CFG_DEF = { gravity: 600, power: 600, botMul: 1 };
const SLIDERS = [["gravity", "Gravity", 300, 1200, 25], ["power", "Max power", 350, 900, 25], ["botMul", "Bot error ×", 0.3, 2, 0.05]];
let cfg = Object.assign({}, CFG_DEF);
try { const o = JSON.parse(localStorage.getItem("lab.duel.cfg") || "{}"); for (const k of Object.keys(CFG_DEF)) if (typeof o[k] === "number") cfg[k] = o[k]; } catch (e) {}
function saveCfg() { try { localStorage.setItem("lab.duel.cfg", JSON.stringify(cfg)); } catch (e) {} }

// ---- save: wins vs bot (shown in the lab list), per-level wins, first round -----------------------
const SAVE_KEY = "lab.duel.save";
function loadSave() {
  const d = { played: 0, won: { easy: 0, medium: 0, hard: 0 }, candies: 0 };
  try { const o = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}"); if (o && typeof o === "object") { d.played = o.played | 0; d.candies = o.candies | 0; for (const k in d.won) d.won[k] = (o.won && o.won[k]) | 0; } } catch (e) {}
  return d;
}
let save = loadSave();
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); localStorage.setItem("lab.best.duel", String(save.won.easy + save.won.medium + save.won.hard)); } catch (e) {}
}

// =================================================================================================
// VIEW LAYER: manifest of art slots + draw() with stub shapes
// =================================================================================================
// anchor [ax, ay] — fraction of w/h; states {name: frames}; sprite file for state s, frame f:
//   <file>.<s>.<f>.png  (frames > 1) | <file>.<s>.png (1 frame) | <file>.png (no states)
const FIGHTER_STATES = { idle: 2, want: 1, open: 1, chew: 3, happy: 1, sad: 1, oops: 1, aim: 1, hit: 1, win: 1, lick: 1 };
const MANIFEST = [
  { name: "om", file: "assets/duel/om", w: 170, h: 170, anchor: [0.5, 1], states: FIGHTER_STATES, fps: 5, note: "Om Nom, hitbox r 65 u. Exactly 2 arms + 2 legs (D-56). Faces RIGHT; the code mirrors for the right side." },
  { name: "rival_toss", file: "assets/duel/rival_toss", w: 170, h: 170, anchor: [0.5, 1], states: FIGHTER_STATES, fps: 5, note: "Toss, same states as om. Faces RIGHT in the file; code mirrors him (he stands on the right)." },
  { name: "jelly_coat_1", file: "assets/duel/jelly_coat_1", w: 190, h: 190, anchor: [0.5, 1], states: { idle: 2 }, fps: 6, note: "jelly layer over the fighter after hit 1 (1/3)" },
  { name: "jelly_coat_2", file: "assets/duel/jelly_coat_2", w: 190, h: 190, anchor: [0.5, 1], states: { idle: 2 }, fps: 6, note: "after hit 2 (2/3)" },
  { name: "jelly_coat_3", file: "assets/duel/jelly_coat_3", w: 190, h: 190, anchor: [0.5, 1], states: { idle: 2 }, fps: 6, note: "after hit 3 (whole)" },
  { name: "sling", file: "assets/duel/sling", w: 60, h: 90, anchor: [0.5, 1], note: "slingshot in the hands, fork up; the band is a code line" },
  { name: "shot_jelly", file: "assets/duel/shot_jelly", w: 40, h: 40, anchor: [0.5, 0.5], note: "round jelly (physics r 7 units)" },
  { name: "shot_triple", file: "assets/duel/shot_triple", w: 26, h: 26, anchor: [0.5, 0.5], note: "one of 3 small pellets" },
  { name: "shot_bounce", file: "assets/duel/shot_bounce", w: 40, h: 40, anchor: [0.5, 0.5], note: "bouncy jelly" },
  { name: "splat_1", file: "assets/duel/splat_1", w: 60, h: 40, anchor: [0.5, 0.6], note: "blob on the ground; tinted by code? no — art draws the weapon colour; one per weapon is fine, code picks splat_1..3" },
  { name: "splat_2", file: "assets/duel/splat_2", w: 75, h: 50, anchor: [0.5, 0.6] },
  { name: "splat_3", file: "assets/duel/splat_3", w: 90, h: 60, anchor: [0.5, 0.6] },
  { name: "ground_fill", file: "assets/duel/ground_fill", w: 256, h: 256, anchor: [0, 0], tile: true, note: "seamless tile, fills under the terrain line" },
  { name: "ground_edge", file: "assets/duel/ground_edge", w: 256, h: 64, anchor: [0, 0.5], tile: true, note: "grass strip along the terrain line; stamped along the curve, centred on the line" },
  { name: "bg_sky", file: "assets/duel/bg_sky", w: 1080, h: 1920, anchor: [0, 0], note: "covers the frame; taller screens crop from the bottom" },
  { name: "cloud_1", file: "assets/duel/cloud_1", w: 360, h: 150, anchor: [0.5, 0.5] },
  { name: "cloud_2", file: "assets/duel/cloud_2", w: 280, h: 120, anchor: [0.5, 0.5] },
  { name: "cloud_3", file: "assets/duel/cloud_3", w: 200, h: 90, anchor: [0.5, 0.5] },
  { name: "hud_cup", file: "assets/duel/hud_cup", w: 70, h: 50, anchor: [0.5, 0.5], states: { empty: 1, full: 1 }, note: "hit cup, 3 per fighter" },
  { name: "wind_arrow", file: "assets/duel/wind_arrow", w: 160, h: 60, anchor: [0.5, 0.5], states: { "0": 1, "1": 1, "2": 1, "3": 1 }, note: "points RIGHT; code flips it for wind to the left. State = ceil(|wind|), 0 = calm" },
  { name: "btn_weapon_jelly", file: "assets/duel/btn_weapon_jelly", w: 300, h: 150, anchor: [0.5, 0.5], states: { normal: 1, selected: 1, off: 1 }, note: "ammo badge is drawn by code (btn_badge)" },
  { name: "btn_weapon_triple", file: "assets/duel/btn_weapon_triple", w: 300, h: 150, anchor: [0.5, 0.5], states: { normal: 1, selected: 1, off: 1 } },
  { name: "btn_weapon_bounce", file: "assets/duel/btn_weapon_bounce", w: 300, h: 150, anchor: [0.5, 0.5], states: { normal: 1, selected: 1, off: 1 } },
  // additions (not in the design table, needed by the screen):
  { name: "hud_face_om", file: "assets/duel/hud_face_om", w: 110, h: 110, anchor: [0.5, 0.5], extra: true, note: "face in the HUD corner" },
  { name: "hud_face_rival_toss", file: "assets/duel/hud_face_rival_toss", w: 110, h: 110, anchor: [0.5, 0.5], extra: true },
  { name: "btn_pause", file: "assets/duel/btn_pause", w: 100, h: 100, anchor: [0.5, 0.5], extra: true },
  { name: "btn_badge", file: "assets/duel/btn_badge", w: 56, h: 56, anchor: [0.5, 0.5], extra: true, note: "ammo count bubble on a weapon button" },
  { name: "turn_marker", file: "assets/duel/turn_marker", w: 60, h: 50, anchor: [0.5, 1], extra: true, note: "arrow over the shooter's head" },
  { name: "candy", file: "assets/duel/candy", w: 70, h: 70, anchor: [0.5, 0.5], extra: true, note: "the reward candy flying into the mouth" },
  { name: "aim_dot", file: "assets/duel/aim_dot", w: 22, h: 22, anchor: [0.5, 0.5], extra: true, note: "dotted preview dot" },
];
const SP = {};                         // name -> sprite def (+ imgs)
const art = { loaded: 0, total: 0, source: "embedded" };
for (const m of MANIFEST) SP[m.name] = Object.assign({ ready: false, imgs: {} }, m);
const used = new Set(), frameUsed = new Set();

function spriteFile(s, state, frame) {
  const f = s.file;
  if (s.states && state) return (s.states[state] || 1) > 1 ? `${f}.${state}.${frame}.png` : `${f}.${state}.png`;
  return `${f}.png`;
}
function loadArt() {
  // manifest.json next to the art may flip `ready` and adjust sizes; over file:// we keep the embedded copy
  if (location.protocol === "file:") return Promise.resolve();
  return fetch("assets/duel/manifest.json", { cache: "no-cache" }).then((r) => r.ok ? r.json() : null).then((j) => {
    if (!j || !Array.isArray(j.sprites)) return;
    art.source = "manifest.json";
    const waits = [];
    for (const e of j.sprites) {
      const s = SP[e.name]; if (!s) continue;
      for (const k of ["w", "h", "anchor", "fps"]) if (e[k] != null) s[k] = e[k];
      if (e.states) s.states = e.states;
      s.ready = e.ready === true;
      if (!s.ready) continue;
      const list = s.states ? Object.keys(s.states).flatMap((st) => Array.from({ length: s.states[st] || 1 }, (_, i) => [st, i + 1])) : [[null, 1]];
      for (const [st, fr] of list) {
        art.total++;
        waits.push(new Promise((res) => {
          const im = new Image(); im.onload = () => { art.loaded++; res(); }; im.onerror = res;
          im.src = spriteFile(s, st, fr); s.imgs[(st || "_") + "." + fr] = im;
        }));
      }
    }
    return Promise.all(waits);
  }).catch(() => {});
}
function imgOf(s, state, frame) {
  const im = s.imgs[(s.states && state ? state : "_") + "." + frame];
  return im && im.complete && im.naturalWidth ? im : null;
}

// draw(name, x, y, {state, frame, rot, scale, sx, sy, alpha, flip}) — x,y in u (frame space)
function draw(name, x, y, o) {
  o = o || {};
  const s = SP[name]; if (!s) return;
  used.add(name); frameUsed.add(name);
  const [ax, ay] = s.anchor, w = o.w || s.w, h = o.h || s.h;
  ctx.save();
  ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  const k = o.scale == null ? 1 : o.scale;
  ctx.scale((o.sx == null ? 1 : o.sx) * k * (o.flip ? -1 : 1), (o.sy == null ? 1 : o.sy) * k);
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  const img = s.ready ? imgOf(s, o.state, o.frame || 1) : null;
  if (img) ctx.drawImage(img, -ax * w, -ay * h, w, h);
  else { ctx.translate(-ax * w, -ay * h); stub(name, w, h, o); }
  ctx.restore();
}
const INK = "#2a2140";
function pathEllipse(cx, cy, rx, ry) { ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, 7); }
function stub(name, w, h, o) {
  const st = o.state, fr = o.frame || 1;
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  if (name === "om" || name === "rival_toss") return stubFighter(name, w, h, st, fr, o);
  let m;
  if ((m = /^jelly_coat_(\d)$/.exec(name))) {
    const n = +m[1], wob = fr === 2 ? 1 : -1;
    ctx.fillStyle = `rgba(255,95,168,${0.28 + 0.14 * n})`; ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 5;
    const cy = h * (n === 3 ? 0.52 : 0.58), ry = h * (0.3 + 0.07 * n) + wob * 3;
    pathEllipse(w / 2, cy, w * (0.34 + 0.05 * n) + wob * 3, ry); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.65)"; pathEllipse(w * 0.36, h * 0.3, 14, 8); ctx.fill();
    if (n < 3) { ctx.fillStyle = `rgba(255,95,168,${0.5})`; for (const dx of [0.3, 0.55, 0.72]) { pathEllipse(w * dx, h * 0.9 + wob * 2, 9, 14 - n * 2); ctx.fill(); } }
    return;
  }
  if (name === "sling") {
    ctx.strokeStyle = "#7a4a22"; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(w / 2, h); ctx.lineTo(w / 2, h * 0.5); ctx.lineTo(w * 0.15, h * 0.08); ctx.moveTo(w / 2, h * 0.5); ctx.lineTo(w * 0.85, h * 0.08); ctx.stroke(); return;
  }
  if ((m = /^shot_(jelly|triple|bounce)$/.exec(name))) {
    const col = { jelly: "#ff5fa8", triple: "#ffd23f", bounce: "#3fd0ff" }[m[1]];
    ctx.fillStyle = col; ctx.strokeStyle = INK; ctx.lineWidth = 5; pathEllipse(w / 2, h / 2, w / 2 - 3, h / 2 - 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.7)"; pathEllipse(w * 0.36, h * 0.34, w * 0.14, w * 0.1); ctx.fill(); return;
  }
  if (/^splat_\d$/.test(name)) {
    ctx.fillStyle = o.tint || "#ff5fa8"; ctx.beginPath();
    for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283, r = (i % 2 ? 0.34 : 0.5) * (1 + 0.15 * Math.sin(i * 7)); ctx.lineTo(w / 2 + Math.cos(a) * w * r, h * 0.6 + Math.sin(a) * h * r * 0.9); }
    ctx.closePath(); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,.4)"; pathEllipse(w * 0.4, h * 0.45, w * 0.1, h * 0.07); ctx.fill(); return;
  }
  if (name === "ground_fill") { ctx.fillStyle = "#7a4a22"; ctx.fillRect(0, 0, w, h); ctx.fillStyle = "#6b3f1c"; ctx.fillRect(30, 40, 60, 14); ctx.fillRect(150, 150, 70, 14); return; }
  if (name === "ground_edge") { ctx.fillStyle = "#5fbf3a"; ctx.fillRect(0, h * 0.25, w, h * 0.5); return; }
  if (name === "bg_sky") { const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#7cc9ee"); g.addColorStop(1, "#c8eefc"); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); return; }
  if (/^cloud_\d$/.test(name)) {
    ctx.fillStyle = "rgba(255,255,255,.85)"; pathEllipse(w * 0.5, h * 0.62, w * 0.46, h * 0.26); ctx.fill();
    pathEllipse(w * 0.34, h * 0.48, w * 0.22, h * 0.3); ctx.fill(); pathEllipse(w * 0.64, h * 0.42, w * 0.26, h * 0.34); ctx.fill(); return;
  }
  if (name === "hud_cup") {
    ctx.fillStyle = st === "full" ? "#ff5fa8" : "rgba(255,255,255,.55)"; ctx.strokeStyle = INK; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.roundRect(4, 4, w - 8, h - 8, 14); ctx.fill(); ctx.stroke(); return;
  }
  if (name === "wind_arrow") {
    const L = (+st || 0) / 3 * (w - 40), cy = h / 2;
    ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineWidth = 12;
    if (L <= 0) { pathEllipse(w / 2, cy, 9, 9); ctx.fill(); return; }
    ctx.beginPath(); ctx.moveTo(w / 2 - L / 2 - 10, cy); ctx.lineTo(w / 2 + L / 2, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w / 2 + L / 2 + 22, cy); ctx.lineTo(w / 2 + L / 2 - 6, cy - 20); ctx.lineTo(w / 2 + L / 2 - 6, cy + 20); ctx.closePath(); ctx.fill(); return;
  }
  if ((m = /^btn_weapon_(jelly|triple|bounce)$/.exec(name))) {
    const col = { jelly: "#ff5fa8", triple: "#ffd23f", bounce: "#3fd0ff" }[m[1]], label = { jelly: "Jelly", triple: "Triple", bounce: "Bounce" }[m[1]];
    ctx.globalAlpha *= st === "off" ? 0.4 : 1;
    ctx.fillStyle = st === "selected" ? "#ffd23f" : "#fff6e0"; ctx.strokeStyle = INK; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.roundRect(5, 5, w - 10, h - 10, 36); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col; pathEllipse(66, h / 2, 30, 30); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.font = "800 44px ui-rounded, system-ui, sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(label, 110, h / 2 + 2); return;
  }
  if (name === "hud_face_om" || name === "hud_face_rival_toss") {
    ctx.fillStyle = name === "hud_face_om" ? "#6bd13f" : "#ff9a2e"; ctx.strokeStyle = INK; ctx.lineWidth = 6;
    pathEllipse(w / 2, h / 2, w / 2 - 6, h / 2 - 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fff"; for (const dx of [-20, 20]) { pathEllipse(w / 2 + dx, h * 0.42, 15, 17); ctx.fill(); }
    ctx.fillStyle = INK; for (const dx of [-20, 20]) { pathEllipse(w / 2 + dx + 3, h * 0.44, 6, 7); ctx.fill(); }
    ctx.beginPath(); ctx.arc(w / 2, h * 0.62, 16, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); return;
  }
  if (name === "btn_pause") {
    ctx.fillStyle = "#fff6e0"; ctx.strokeStyle = INK; ctx.lineWidth = 6; pathEllipse(w / 2, h / 2, w / 2 - 5, h / 2 - 5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.fillRect(w * 0.34, h * 0.28, w * 0.1, h * 0.44); ctx.fillRect(w * 0.56, h * 0.28, w * 0.1, h * 0.44); return;
