<!doctype html>
<html lang="ru">
<head>

<title>Конфетная рогатка (v2)</title>
<style>:root{--ink:#4a2512;--cream:#fbebd0;--cream-sh:#e9cfa3;--card:#c98a4b;--card-mid:#b8773d;--card-sh:#8f5427;--cut:#5a2e10;--act:#8ccb2a;--act-low:#4e8a12;--act-line:#1f4a0a;--gold:#ffd23f}html,body{height:100%;color:var(--ink);margin:0;font:700 14px/1.3 Nunito,system-ui,-apple-system,sans-serif;overflow:hidden}body{-webkit-user-select:none;user-select:none;background:radial-gradient(120% 80% at 30% 0%, #d49a5e 0%, var(--card) 45%, var(--card-mid) 100%);flex-direction:column;height:100dvh;display:flex}header{grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;padding:8px 12px 4px;display:grid}header a{color:var(--ink);background:var(--cream);box-shadow:0 2px 0 var(--cream-sh);border-radius:10px;padding:5px 9px;font-size:13px;text-decoration:none}header h1{text-align:center;color:var(--cream);text-shadow:0 2px 0 var(--card-sh);margin:0;font-size:18px;font-weight:900}header button{font:inherit;background:var(--cream);color:var(--ink);box-shadow:0 3px 0 var(--cream-sh);cursor:pointer;border:0;border-radius:12px;padding:6px 12px;font-weight:800}#rule{text-align:center;white-space:nowrap;text-overflow:ellipsis;color:var(--cream);grid-column:1/4;font-size:12px;overflow:hidden}#hud{grid-column:1/4;justify-content:center;gap:10px;font-size:15px;font-weight:900;display:flex}#hud span{background:var(--cream);box-shadow:0 2px 0 var(--cream-sh);border-radius:12px;padding:3px 12px}#stage{touch-action:none;flex:1;min-height:0;position:relative}canvas{box-shadow:0 0 0 6px var(--card-mid), 0 0 0 9px var(--card-sh), 4px 8px 14px #4a251259;border-radius:14px;display:block;position:absolute}#end{background:#4a251261;justify-content:center;align-items:center;display:none;position:absolute;inset:0}#end .card{background:var(--cream);text-align:center;min-width:210px;box-shadow:0 6px 0 var(--cream-sh), 0 10px 24px #4a251259;border:3px solid var(--ink);border-radius:22px;padding:18px 26px 22px}#end .stars{letter-spacing:4px;font-size:46px;line-height:1}#end .stars span </head>
<body>
<header>
  <a href="index.html">← Лаборатория</a>
  <h1>Рогатка v2</h1>
  <button id="restart">Заново</button>
  <div id="rule">Тяни конфету вниз и отпускай — корми Ома Нома!</div>
  <div id="hud"><span id="score">Счёт: 0</span><span id="shots">Конфеты: 10</span></div>
</header>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="end"><div class="card">
    <div class="stars" id="endStars"></div>
    <p>Раунд окончен</p>
    <div class="big" id="endScore">0</div>
    <p id="endDetail"></p>
    <p id="endBest"></p>
    <p><small id="endNext"></small></p>
    <button id="again">Ещё раз</button>
  </div></div>
</div>
<script>
"use strict";
// ---- Главные числа. Поле 320×480 u, 1 u = 3,375 опорн. px (ширина 1080). Размеры — cut.md §3 ----
const TUNE = {
  gravity: 784,        // u/s², как в CTR
  power: 7.6,          // скорость вылета = оттяжка × power (u/s на u); 110 u → 836 u/s
  maxPull: 110,        // u, предел оттяжки
  minPull: 14,         // u, меньше — отмена броска
  candyR: 17,          // u, конфета Ø 34 (115 px) — рисунок и сбор звезды
  candyHitR: 14,       // u, столкновения со стенами, коробкой и подставкой (мягкий край, ≈ 0,8 рисунка)
  catchR: 30,          // u, радиус «рта» (единственная помощь, магнита нет)
  starR: 18,           // u, звезда Ø 36
  nailR: 8,            // u, гвоздь-пуговица Ø 16
  standW: 64, standH: 14, // u, картонная подставка под Ом Номом (столкновения)
  boxW: [70, 100], boxH: 34, boxGap: [2, 12], // u, коробка-препятствие и её зазор до «естественной» дуги
  aimDots: 5,          // точек прицела
  aimDotDt: 0.07,      // c между точками прицела (короткий пунктир)
  mouthOpenDist: 110,  // u, рот открывается, когда конфета ближе
  wallBounce: 0.5,
  shotTimeout: 3.0,    // c, после — промах
  shots: 10,           // конфет в раунде
  boxFrom: 2,          // с какого попадания появляются коробки
  boxChance: 0.8,
  moveFrom: 5,         // с какого попадания подставка едет
  moveAmp: 55,         // u
  moveSpeed: 1.1,      // рад/с
  starChance: 0.85, starJitter: 24, // звезда на «идеальной» дуге ± джиттер
  // очки: попадание +1, без касаний +2, звезда +1. Пороги раунда — по замеру ботов (10 seed × умение)
  star2: 11,           // ≈ медиана бота 0,5 (10 seed: 11; 40 seed: 12)
  star3: 16,           // ≈ 0,9 × медиана бота 1 (10 seed: 0,9 × 18 = 16,2; 40 seed: 0,9 × 17 = 15,3)
  // бот (act("autoplay", {skill})): skill 0 — случайные броски, 1 — почти идеальные
  botThink: 0.45,      // c до начала оттяжки
  botPullT: 0.35,      // c на оттяжку
  botSigmaMin: 1.5,    // u, разброс прицела при skill 1
  botSigmaMax: 30,     // u, добавка разброса: sigma = min + max·(1−skill)³ (0,5 → 5,3 u)
  ropeIters: 25, ropeNodes: 15, ropeSlack: 1.04, ropeDamp: 0.985, ropeWidth: 4,
};
const W = 320, H = 480, DT = 1 / 60;
const NAIL_A = { x: 100, y: 342 }, NAIL_B = { x: 220, y: 342 };
const REST = { x: 160, y: 350 };
const C = { // палитра docs/style.md
  paper: "#F5A9D0", paperHi: "#F9C3DF", paperLo: "#EE97C3", ink: "#4A2512", cream: "#FBEBD0", creamSh: "#E9CFA3",
  card: "#C98A4B", cardMid: "#B8773D", cardSh: "#8F5427", cut: "#5A2E10", bulb: "#FFE9A8", glow: "rgba(255,200,87,.35)",
  om: "#A9DE28", omSh: "#82C126", omLine: "#0B2608", candy: "#E8412F", wrap: "#FFC93C", gold: "#FFD23F", coral: "#F29B6B", ok: "#4E8A12",
};

// ---- Prng (mulberry32) ----
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---- Состояние ----
let best = 0;
try { best = Number(localStorage.getItem("lab.best.sling")) || 0; } catch (e) {}
let S; // текущий раунд
let bot = null; // { skill } — живёт между раундами, пока не выключат или игрок не тронет поле

function newRound(seed) {
  seed = seed == null ? (Date.now() & 0x7fffffff) : (seed >>> 0);
  S = {
    seed, rng: mulberry(seed), botRng: mulberry(seed ^ 0x5bd1e995),
    scene: "play", phase: "aim", t: 0, phaseT: 0,
    shot: 0, hits: 0, perfects: 0, stars: 0, score: 0, misses: 0, rating: 0,
    candy: null, pull: null, touchedEver: false,
    lv: null, omFace: "idle", mouth: 0, jump: null,
    popups: [], solution: null, botT: 0, botN: 0, botTgt: null,
  };
  initRope();
  S.lv = makeLevel(0, S.rng);
  S.solution = solve(S.lv);
  freshCandy();
  document.getElementById("end").style.display = "none";
  updateHud();
}

// ---- Резинка: Верле ----
let rope;
function initRope() {
  const n = TUNE.ropeNodes, L = Math.hypot(NAIL_B.x - NAIL_A.x, NAIL_B.y - NAIL_A.y) / (n - 1) * TUNE.ropeSlack;
  rope = { L0: L, La: L, Lb: L, mid: (n - 1) / 2, pinMid: true, p: [] };
  for (let i = 0; i < n; i++) {
    const x = NAIL_A.x + (NAIL_B.x - NAIL_A.x) * i / (n - 1), y = NAIL_A.y;
    rope.p.push({ x, y, px: x, py: y });
  }
}
function stepRope() {
  const p = rope.p, n = p.length;
  for (let i = 1; i < n - 1; i++) {
    const q = p[i]; const vx = (q.x - q.px) * TUNE.ropeDamp, vy = (q.y - q.py) * TUNE.ropeDamp;
    q.px = q.x; q.py = q.y; q.x += vx; q.y += vy + TUNE.gravity * DT * DT;
  }
  for (let k = 0; k < TUNE.ropeIters; k++) {
    p[0].x = NAIL_A.x; p[0].y = NAIL_A.y; p[n - 1].x = NAIL_B.x; p[n - 1].y = NAIL_B.y;
    if (rope.pinMid) { p[rope.mid].x = S.candy.x; p[rope.mid].y = S.candy.y; }
    for (let i = 0; i < n - 1; i++) {
      const a = p[i], b = p[i + 1];
      const L = i < rope.mid ? rope.La : rope.Lb;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-6;
      const diff = (d - L) / d * 0.5;
      const fa = (i === 0 || (rope.pinMid && i === rope.mid)) ? 0 : 1;
      const fb = (i + 1 === n - 1 || (rope.pinMid && i + 1 === rope.mid)) ? 0 : 1;
      const s = fa + fb; if (!s) continue;
      a.x += dx * diff * 2 * fa / s; a.y += dy * diff * 2 * fa / s;
      b.x -= dx * diff * 2 * fb / s; b.y -= dy * diff * 2 * fb / s;
    }
  }
}
function stretchRopeTo(c) {
  const half = rope.mid;
  rope.La = Math.max(rope.L0, Math.hypot(c.x - NAIL_A.x, c.y - NAIL_A.y) / half);
  rope.Lb = Math.max(rope.L0, Math.hypot(c.x - NAIL_B.x, c.y - NAIL_B.y) / half);
}
function freshCandy() {
  S.candy = { x: REST.x, y: REST.y, vx: 0, vy: 0, vis: 1, touched: false, star: false, starCounted: false, pop: 0.25 };
  rope.pinMid = true; rope.La = rope.Lb = rope.L0;
}

// ---- Уровень: точка om = центр рта Ома Нома (cut.md §3) ----
function omAt(lv, ph) { return { x: lv.om.x + lv.amp * Math.sin(ph), y: lv.om.y }; }
function standOf(o) { return { x: o.x - TUNE.standW / 2, y: o.y + 24, w: TUNE.standW, h: TUNE.standH }; }
function makeLevel(h, rng) {
  for (let tries = 0; tries < 40; tries++) {
    const moving = h >= TUNE.moveFrom && tries < 34;
    const amp = moving ? TUNE.moveAmp : 0;
    const near = h < 2;
    const om = { x: 50 + amp + rng() * (220 - 2 * amp), y: near ? 150 + rng() * 80 : 70 + rng() * 160 };
    const lv = { om, amp, ph: rng() * 6.28, box: null, star: null };
    let sol = solve(lv);
    if (!sol) continue;
    // коробка встаёт вплотную к «естественной» дуге (над, под или сбоку) и сужает окно броска
    if (h >= TUNE.boxFrom && tries < 26 && rng() < TUNE.boxChance) {
      const o = omAt(lv, lv.ph), pts = sol.path.filter(q => q.y < REST.y - 80 && q.y > 50 && Math.hypot(q.x - o.x, q.y - o.y) > 70);
      for (let k = 0; k < 4 && pts.length && !lv.box; k++) {
        const q = pts[Math.floor(rng() * pts.length)], w = TUNE.boxW[0] + rng() * (TUNE.boxW[1] - TUNE.boxW[0]);
        const gap = TUNE.candyR + TUNE.boxGap[0] + rng() * (TUNE.boxGap[1] - TUNE.boxGap[0]), side = Math.floor(rng() * 4);
        let cx = q.x + (rng() - 0.5) * 20, cy = q.y + (rng() - 0.5) * 20;
        if (side === 0) cy = q.y - gap - TUNE.boxH / 2; else if (side === 1) cy = q.y + gap + TUNE.boxH / 2;
        else cx = q.x + (side === 2 ? -1 : 1) * (gap + w / 2);
        const box = { x: Math.max(6, Math.min(W - 6 - w, cx - w / 2)), y: Math.max(36, cy - TUNE.boxH / 2), w, h: TUNE.boxH };
        if (circleRect({ x: q.x, y: q.y, vx: 0, vy: 0 }, TUNE.candyR, box)) continue; // встала прямо на дугу
        if (Math.hypot(box.x + box.w / 2 - o.x, box.y + box.h / 2 - o.y) < 70) continue;   // не загораживать Ом Нома
        lv.box = box;
        const s2 = solve(lv);
        if (s2) sol = s2; else lv.box = null;
      }
    }
    // звезда на найденной идеальной дуге, чтобы её можно было собрать, но не у самого рта
    if (rng() < TUNE.starChance && sol.path.length > 20) for (let k = 0; k < 3 && !lv.star; k++) {
      const i = Math.floor(sol.path.length * (0.3 + rng() * 0.3));
      const st = { x: sol.path[i].x + (rng() - 0.5) * TUNE.starJitter, y: sol.path[i].y + (rng() - 0.5) * TUNE.starJitter, got: false };
      st.x = Math.max(TUNE.starR + 4, Math.min(W - TUNE.starR - 4, st.x)); st.y = Math.max(TUNE.starR + 22, st.y);
      const o = omAt(lv, lv.ph), b = lv.box;
      const nearBox = b && st.x > b.x - TUNE.starR && st.x < b.x + b.w + TUNE.starR && st.y > b.y - TUNE.starR && st.y < b.y + b.h + TUNE.starR;
      if (Math.hypot(st.x - o.x, st.y - o.y) > TUNE.catchR + TUNE.starR + 6 && !nearBox) lv.star = st;
    }
    if (lv.star) lv.solution = solve(lv); // пересчёт: теперь оракул знает и дугу через звезду
    return lv;
  }
  return { om: { x: 160, y: 200 }, amp: 0, ph: 0, box: null, star: null };
}

// ---- Полёт конфеты: общий шаг для игры, решателя и бота ----
function circleRect(c, r, R) {
  const nx = Math.max(R.x, Math.min(c.x, R.x + R.w)), ny = Math.max(R.y, Math.min(c.y, R.y + R.h));
  let dx = c.x - nx, dy = c.y - ny; const d = Math.hypot(dx, dy);
  if (d >= r) return false;
  if (d < 1e-6) { dx = 0; dy = c.y < R.y + R.h / 2 ? -1 : 1; } else { dx /= d; dy /= d; }
  const push = r - (d < 1e-6 ? 0 : d);
  c.x += dx * push; c.y += dy * push;
  const vn = c.vx * dx + c.vy * dy;
  if (vn < 0) { c.vx -= (1 + TUNE.wallBounce) * vn * dx; c.vy -= (1 + TUNE.wallBounce) * vn * dy; c.vx *= 0.85; }
  return true;
}
// возвращает "hit" | "out" | null; мутирует c и lv.ph
function stepCandy(c, lv) {
  c.vy += TUNE.gravity * DT; c.x += c.vx * DT; c.y += c.vy * DT;
  lv.ph += TUNE.moveSpeed * DT;
  const r = TUNE.candyHitR;
  if (c.x < r) { c.x = r; c.vx = Math.abs(c.vx) * TUNE.wallBounce; c.touched = true; }
  if (c.x > W - r) { c.x = W - r; c.vx = -Math.abs(c.vx) * TUNE.wallBounce; c.touched = true; }
  const o = omAt(lv, lv.ph);
  if (Math.hypot(c.x - o.x, c.y - o.y) < TUNE.catchR) return "hit";
  if (lv.box && circleRect(c, r, lv.box)) c.touched = true;
  if (circleRect(c, r, standOf(o))) c.touched = true;
  if (lv.star && !lv.star.got && Math.hypot(c.x - lv.star.x, c.y - lv.star.y) < TUNE.candyR + TUNE.starR) { lv.star.got = true; c.star = true; }
  if (c.y > H + 30 && c.vy > 0) return "out";
  return null;
}
function simulate(lv, pull, keepPath) {
  const l = { om: lv.om, amp: lv.amp, ph: lv.ph, box: lv.box, star: lv.star && !lv.star.got ? { ...lv.star, got: false } : null };
  const c = { x: REST.x + pull.dx, y: REST.y + pull.dy, vx: -pull.dx * TUNE.power, vy: -pull.dy * TUNE.power, touched: false, star: false };
  const path = [];
  for (let i = 0; i < TUNE.shotTimeout * 60; i++) {
    const e = stepCandy(c, l);
    if (keepPath) path.push({ x: c.x, y: c.y });
    if (e === "hit") return { hit: true, perfect: !c.touched, star: c.star, path };
    if (e === "out") break;
  }
  return { hit: false, star: c.star, path };
}
// оракул для тестов, руки-подсказки и бота: оттяжка в центре самого широкого окна «идеально»;
// star — то же, но дуга ещё и берёт звезду
function solve(lv) {
  const step = 5, M = TUNE.maxPull, good = new Map();
  for (let dx = -M; dx <= M; dx += step) for (let dy = step; dy <= M; dy += step) {
    if (Math.hypot(dx, dy) > M) continue;
    const r = simulate(lv, { dx, dy });
    if (r.hit && r.perfect) good.set(dx + "," + dy, { dx, dy, star: r.star });
  }
  const pick = (needStar, minN) => {
    let bs = null, bn = -1;
    for (const s of good.values()) {
      if (needStar && !s.star) continue;
      let n = 0; for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
        const g = good.get((s.dx + i * step) + "," + (s.dy + j * step)); if (g && (!needStar || g.star)) n++;
      }
      if (n > bn) { bn = n; bs = s; }
    }
    return bs && bn >= minN ? { dx: bs.dx, dy: bs.dy, n: bn } : null;
  };
  const main = pick(false, 3);
  if (!main) return null;
  return { dx: main.dx, dy: main.dy, path: simulate(lv, main, true).path, star: lv.star ? pick(true, 2) : null };
}

// ---- Действия игрока ----
function startPull() { if (S.scene !== "play" || S.phase !== "aim") return false; S.phase = "drag"; S.pull = { dx: 0, dy: 0 }; S.touchedEver = true; return true; }
function setPull(dx, dy) {
  if (S.phase !== "drag") return;
  const d = Math.hypot(dx, dy); if (d > TUNE.maxPull) { dx *= TUNE.maxPull / d; dy *= TUNE.maxPull / d; }
  S.pull = { dx, dy }; S.candy.x = REST.x + dx; S.candy.y = REST.y + dy; stretchRopeTo(S.candy);
}
function release() {
  if (S.phase !== "drag") return;
  const p = S.pull; S.pull = null;
  if (Math.hypot(p.dx, p.dy) < TUNE.minPull || p.dy < 4) { S.phase = "aim"; freshCandy(); S.candy.pop = 0; return; }
  const c = S.candy; c.vx = -p.dx * TUNE.power; c.vy = -p.dy * TUNE.power; c.touched = false; c.star = false;
  rope.pinMid = false; rope.La = rope.Lb = rope.L0;
  S.phase = "fly"; S.phaseT = 0; S.shot++;
  updateHud();
}

// ---- Бот: тот же ввод, что у игрока (startPull → setPull → release), детерминирован seed ----
function gauss(r) { const u = Math.max(1e-9, r()), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function botAim() {
  const sk = bot.skill, r = S.botRng, M = TUNE.maxPull, pullTicks = Math.round(TUNE.botPullT * 60);
  const randomPull = () => { const a = Math.PI * (0.15 + 0.7 * r()), rad = M * (0.35 + 0.65 * r()); return { dx: Math.cos(a) * rad, dy: Math.sin(a) * rad }; };
  if (r() < Math.max(0, 1 - 2 * sk)) return randomPull();
  // фаза движения в момент отпускания — предсказуема, т. к. тик фиксирован
  let ph = S.lv.ph; if (S.lv.amp > 0) for (let i = 0; i < pullTicks; i++) ph += TUNE.moveSpeed * DT;
  const sol = S.lv.amp > 0 ? solve({ ...S.lv, ph }) : S.solution;
  if (!sol) return randomPull();
  const tgt = sol.star && !S.lv.star.got && r() < sk ? sol.star : sol;
  const sg = TUNE.botSigmaMin + TUNE.botSigmaMax * (1 - sk) ** 3;
  return { dx: tgt.dx + gauss(r) * sg, dy: tgt.dy + gauss(r) * sg };
}
function botTick() {
  if (!bot || S.scene !== "play") return;
  if (S.phase === "aim") {
    S.botT += DT;
    if (S.botT >= TUNE.botThink - 1e-9) { S.botTgt = botAim(); S.botN = 0; startPull(); }
  } else if (S.phase === "drag" && S.botTgt) {
    S.botN++;
    const n = Math.round(TUNE.botPullT * 60), k = Math.min(1, S.botN / n), e = 1 - (1 - k) * (1 - k);

// ---- Шаг игры ----
function popup(x, y, text, color) { S.popups.push({ x, y, text, color, t: 0 }); }
function tick() {

  S.t += DT; S.phaseT += DT;
  botTick();
  const lv = S.lv, c = S.candy;
  if (S.phase === "fly") {
    const e = stepCandy(c, lv);
    if (c.star && lv.star.got && !c.starCounted) { c.starCounted = true; S.stars++; S.score++; popup(lv.star.x, lv.star.y, "★ +1", C.gold); }
    const o = omAt(lv, lv.ph);
    if (e === "hit") {
      const perfect = !c.touched;
      S.hits++; if (perfect) S.perfects++;
      S.score += perfect ? 2 : 1;
      popup(o.x, o.y - 62, perfect ? "Идеально! +2" : "+1", perfect ? C.ok : C.ink);
      c.vis = 0; S.phase = "eat"; S.phaseT = 0; S.omFace = "chew";
    } else if (e === "out" || S.phaseT > TUNE.shotTimeout) {
      S.misses++; popup(o.x, o.y - 62, "Мимо", C.coral);
      c.vis = 0; S.phase = "miss"; S.phaseT = 0; S.omFace = "sad";
    }
  } else {
    if (S.phase !== "jump") lv.ph += TUNE.moveSpeed * DT;
  }
  if (S.phase === "eat" && S.phaseT > 0.45) {
    if (S.shot >= TUNE.shots) return endRound();

    S.lv = makeLevel(S.hits, S.rng); S.solution = S.lv.solution || solve(S.lv);
    S.jump = { from, t: 0 }; S.phase = "jump"; S.phaseT = 0; S.omFace = "idle";
  } else if (S.phase === "jump" && S.phaseT > 0.5) {

  } else if (S.phase === "miss" && S.phaseT > 0.7) {
    if (S.shot >= TUNE.shots) return endRound();
    S.omFace = "idle"; nextCandy();
  }
  if (S.phase === "aim" || S.phase === "drag") rope.pinMid = true;
  if (S.candy.pop > 0) S.candy.pop = Math.max(0, S.candy.pop - DT);

  document.getElementById("endScore").textContent = S.score;
  document.getElementById("endDetail").textContent = `Попаданий ${S.hits} из ${TUNE.shots} · идеальных ${S.perfects} · звёзд ${S.stars}`;
  document.getElementById("endBest").textContent = isBest ? "Новый рекорд!" : `Рекорд: ${best}`;

// ---- Цикл: фиксированный тик 1/60, рендер по кадрам ----
let manual = false, acc = 0, last = performance.now();
const frames = [];
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  frames.push(now); if (frames.length > 120) frames.shift();
  if (!manual) { acc += dt; let n = 0; while (acc >= DT && n < 3) { tick(); acc -= DT; n++; } if (n === 3) acc = 0; }
  render();
  requestAnimationFrame(loop);
}

      rope: { stretch: Math.max(rope.La, rope.Lb) / rope.L0, pinned: rope.pinMid },
      bot: bot ? { skill: bot.skill } : null,
      view: { left: r.left, top: r.top, scale, restX: REST.x, restY: REST.y },
      scale, tune: TUNE,
    };
  },
  act(a, p) {
    if (a === "pull") { if (S.phase === "aim") startPull(); setPull(p.dx, p.dy); }
    else if (a === "release") release();
    else if (a === "restart") newRound(p && p.seed != null ? p.seed : undefined);
    else if (a === "autoplay") { bot = p && p.skill != null ? { skill: Math.max(0, Math.min(1, +p.skill)) } : null; S.botT = 0; S.botTgt = null; if (bot && S.phase === "drag") { S.phase = "aim"; S.pull = null; freshCandy(); } }
    else if (a === "clock") manual = !!(p && p.manual);
    else if (a === "step") { for (let i = 0; i < (p || 1); i++) tick(); }
  },
  metrics() {
    const d = []; for (let i = 1; i < frames.length; i++) d.push(frames[i] - frames[i - 1]);
    const avg = d.length ? d.reduce((s, x) => s + x, 0) / d.length : 16.7; d.sort((a, b) => a - b);
    return { fps: Math.round(1000 / avg), frameMsP95: d.length ? d[Math.floor(d.length * 0.95)] : 0, drawCalls: -1 };
  },
};
// ?seed=7&bot=0.5 — посмотреть бота глазами
const q = new URLSearchParams(location.search);
newRound(q.has("seed") ? +q.get("seed") : undefined);
if (q.has("bot")) bot = { skill: Math.max(0, Math.min(1, +q.get("bot"))) };
fit(); render();
window.__game.ready = true;
requestAnimationFrame(loop);
</script>
