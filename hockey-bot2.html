<script>
"use strict";
// ---- Ом Ном кадрами приложения (D-40, не рисунок кодом) ---------------------------
// Кадры лежат в assets/omnom/ — одна папка на все прототипы; новую версию Ома Нома копируем поверх теми же именами.
// Числа — из assets/omnom/omnom_frames.json: 6,4024 px на u, лапы = pivot, рот (кадр wide); зрачки — два слоя (левый и правый глаз), каждый ходит в эллипсе своего глаза (pupils.<кадр>.eyes).
// В файлах Ом Ном смотрит ВЛЕВО от зрителя; flip = смотрит вправо. Кадр: p.mx, p.my — точка рта в игре (u), p.fy — лапы (по умолчанию рот + 20).
const OMS = (() => {
  const PX = 6.4024, PIV = [0.5366, 0.0253], MOUTH = [-2.08, -19.98];
  // Зрачки — по слою на глаз. Для каждого: rest — центр зрачка в покое, c и r — эллипс хода центра зрачка (u от лап, оси кадра до зеркала).
  // Сдвиг взгляда d одинаков для обоих глаз, но центр каждого зрачка потом зажимается в эллипс СВОЕГО глаза: зрачок не выходит из белка и не переходит шов.
  const PUP = {
    neutral: { l: { rest: [-13.93, -44.86], c: [-16.67, -45.33], r: [3.91, 3.98] },
             r: { rest: [-0.81, -42.67], c: [2.23, -42.67], r: [6.22, 6.39] } },
    ajar:   { l: { rest: [-13.7, -47.75], c: [-15.42, -48.29], r: [2.61, 2.51] },
             r: { rest: [-1.6, -45.33], c: [1.92, -42.83], r: [6.06, 6.01] } },
    wide:   { l: { rest: [-13.39, -51.18], c: [-14.79, -51.42], r: [1.98, 1.54] },
             r: { rest: [-1.13, -48.76], c: [0.98, -45.95], r: [5.73, 5.06] } },
    wide2:  { l: { rest: [-13.93, -52.28], c: [-14.95, -52.67], r: [1.64, 1.31] },
             r: { rest: [-1.52, -49.54], c: [0.83, -46.58], r: [5.85, 5.25] } },
  };
  const LOOK = 7; // u: длина полного взгляда, больше любого радиуса хода — на краю эллипса зрачок упирается в границу
  const NAMES = ["neutral", "ajar", "wide", "wide2", "chew", "chew2", "sad", "joy", "blink", "half", "shadow"];
  for (const f in PUP) NAMES.push(f + "_pupils_l", f + "_pupils_r");
  const img = {};
  const waits = [];
  for (const n of NAMES) {
    const i = new Image(); img[n] = i;
    waits.push(new Promise((res) => { i.onload = i.onerror = res; }));
    i.src = "assets/omnom/" + n + ".png";
  }
  const ok = (i) => i && i.complete && i.naturalWidth > 0;
  // центр зрачка: покой + сдвиг (dx, dy), затем в эллипс хода своего глаза: q = (p - c) / r; |q| > 1 -> p = c + q/|q| * r
  function eyePos(e, dx, dy) {
    let px = e.rest[0] + dx, py = e.rest[1] + dy;
    const qx = (px - e.c[0]) / e.r[0], qy = (py - e.c[1]) / e.r[1], ql = Math.hypot(qx, qy);
    if (ql > 1) { px = e.c[0] + qx / ql * e.r[0]; py = e.c[1] + qy / ql * e.r[1]; }
    return [px, py];
  }
  // p: { frame, mx, my, fy?, flip?, tx?, ty?, rot?, piv?, shadow?, alpha? }; st — объект вызывающего: плавный взгляд
  const last = { frame: null, l: null, r: null, d: null };
  function draw(ctx, p, st) {
    let f = p.frame || "neutral";
    if (f === "neutral" && (performance.now() + (p.blinkOff || 0)) % 3600 < 120) f = "blink";
    const base = img[f]; if (!ok(base)) return;
    const flip = p.flip ? -1 : 1, fx = p.mx - flip * MOUTH[0], fy = p.fy != null ? p.fy : p.my - MOUTH[1];
    const pw = base.naturalWidth, ph = base.naturalHeight, k = 1 / PX;
    ctx.save();
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    if (p.alpha != null) ctx.globalAlpha = p.alpha;
    if (p.shadow && ok(img.shadow)) ctx.drawImage(img.shadow, fx - 32, fy - 6, 64, 12);
    ctx.translate(fx, p.piv ? fy - p.piv : fy); if (p.rot) ctx.rotate(p.rot); if (p.piv) ctx.translate(0, p.piv);
    ctx.scale(flip * k, k);
    ctx.drawImage(base, -PIV[0] * pw, -(1 - PIV[1]) * ph);
    const pu = PUP[f], pl = img[f + "_pupils_l"], pr = img[f + "_pupils_r"];
    if (pu && ok(pl) && ok(pr)) {
      let gx = 0, gy = 0;
      if (p.tx != null) { // цель в системе кадра до зеркала; общий сдвиг взгляда, потом зажим по каждому глазу
        const pv = p.piv || 0;
        let dx = p.tx - fx, dy = p.ty - (fy - pv);
        if (p.rot) { const c = Math.cos(-p.rot), sn = Math.sin(-p.rot), qx = dx * c - dy * sn, qy = dx * sn + dy * c; dx = qx; dy = qy; }
        dy -= pv; dx *= flip;
        const ex = (pu.l.rest[0] + pu.r.rest[0]) / 2, ey = (pu.l.rest[1] + pu.r.rest[1]) / 2; // между глазами
        const vx = dx - ex, vy = dy - ey, L = Math.hypot(vx, vy) || 1, a = Math.min(1, L / 45);
        gx = vx / L * a * LOOK; gy = vy / L * a * LOOK;
      }
      if (st) { st.x = st.x == null ? gx : st.x + (gx - st.x) * 0.35; st.y = st.y == null ? gy : st.y + (gy - st.y) * 0.35; gx = st.x; gy = st.y; }
      const pL = eyePos(pu.l, gx, gy), pR = eyePos(pu.r, gx, gy);
      ctx.drawImage(pl, -PIV[0] * pw + (pL[0] - pu.l.rest[0]) * PX, -(1 - PIV[1]) * ph + (pL[1] - pu.l.rest[1]) * PX);
      ctx.drawImage(pr, -PIV[0] * pw + (pR[0] - pu.r.rest[0]) * PX, -(1 - PIV[1]) * ph + (pR[1] - pu.r.rest[1]) * PX);
      last.frame = f; last.l = pL; last.r = pR; last.d = [gx, gy];
    }
    ctx.restore();
  }
  return { draw, img, PUP, eyePos, last, loaded: Promise.all(waits), ready: () => NAMES.every((n) => ok(img[n])) };
})();

// ---- Тосс кадрами листа (assets/toss/, копия assets/characters/toss/frames) -------
// Холст 512×454, 6,4024 px на u, pivot лап [0.5, 0.022] (Unity, y вверх). Рост 62 u (у Ома Нома 72 u). Смотрит ВЛЕВО; к центру — scaleX −1.
const TOSS = (() => {
  const PX = 6.4024, PIV = [0.5, 0.022], NAMES = ["neutral", "joy", "wide", "wave", "face"];
  const img = {}, waits = [];
  for (const n of NAMES) { const i = new Image(); img[n] = i; waits.push(new Promise((res) => { i.onload = i.onerror = res; })); i.src = "assets/toss/" + n + ".png"; }
  const ok = (i) => i && i.complete && i.naturalWidth > 0;
  // лапы в (x, y) опорн. px; pxPerU — масштаб персонажа (200/72 у Ома Нома); sx — scaleX (−1 = к центру), sy — растяжение от лап
  function draw(ctx, frame, x, y, pxPerU, sx, sy) {
    const im = img[frame]; if (!ok(im)) return;
    const k = pxPerU / PX;
    ctx.save(); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.translate(x, y); ctx.scale(sx * k, sy * k);
    ctx.drawImage(im, -PIV[0] * im.naturalWidth, -(1 - PIV[1]) * im.naturalHeight);
    ctx.restore();
  }
  return { draw, img, loaded: Promise.all(waits), ready: () => NAMES.every((n) => ok(img[n])) };
})();

// ==== CORE BEGIN (чистая логика без DOM: Node может выполнить этот кусок для калибровки) ====
// ---- Главные числа: крутить здесь (hockey.md §3, §6, §8) ---------------------------
// Всё в опорных px кадра 1080×1920 (y вниз), время в секундах, тик 1/60 с.
const TUNE = {
  puckR: 55,           // шайба Ø 110
  malletR: 85,         // бита Ø 170
  friction: 0.997,     // множитель скорости шайбы за тик 1/60 (≈ −16 % в секунду)
  puckMax: 3000,       // px/с — предел скорости шайбы
  wallE: 0.9,          // упругость борта
  malletE: 0.95,       // упругость удара битой (нормальная составляющая относительной скорости)
  malletMax: 5000,     // px/с — бита за пальцем
  lineGap: 85,         // центр биты не ближе этого к центральной линии
  postR: 10,           // скругление углов проёма ворот
  squeeze: 0.5,        // шайба, зажатая битой у борта, выдавливается вдоль борта: доля скорости биты поперёк борта
  substeps: 8,         // подшагов физики на тик (≥ 4 по диздоку)
  stallSpeed: 40, stallSec: 4, blowSpeed: 350, blowSkip: 60, // антизастой: в катке — медленнее 40 px/с дольше 4 с
  // антизастой v2 (§6, D-86): зона «у борта» — ближе endZone к торцу или вплотную к боковому (puckR + sideZone);
  // у торца — при любой скорости, у бокового — медленнее stallWallSpeed; срабатывает через stallWallSec.
  // «Выдох» ведёт шайбу к точке подачи своей половины: скорость = min(blowSpeed, blowBrake · расстояние), ближе blowStop — стоп;
  // удар движущейся битой (быстрее blowKeep) выдох прерывает
  endZone: 125, sideZone: 5, stallWallSpeed: 120, stallWallSec: 1.0, blowBrake: 4, blowStop: 4, blowKeep: 50,
  goals: 5,            // до скольких голов
  countdown: 0.8, goalPause: 1.0, candyFly: 0.6, chew: 1.2, endPanel: 2.2,
  // бот: задержка реакции, макс. скорость биты, σ ошибки по x, атакует медленнее чем, линия защиты от своих ворот
  bot: {
    easy:   { delay: 0.30, speed: 1200, sigma: 90, attack: 600,  def: 200 }, // v2: скорость 1400 → 1200 (§8.4)
    medium: { delay: 0.18, speed: 2300, sigma: 50, attack: 900,  def: 220 },
    hard:   { delay: 0.10, speed: 3200, sigma: 40, attack: 1300, def: 240 }, // v2: σ 35 → 40 (§8.4)
    simple: { delay: 0.20, speed: 2000, sigma: 60 }, // «ребёнок» §8.3 (только калибровка): держит биту под шайбой
    adult:  { delay: 0.15, speed: 4000, sigma: 30, attack: 1500, def: 230 }, // «умелый взрослый» §8.4: алгоритм v2 (только калибровка)
  },
  botRest: 0.6,        // скорость возврата на линию защиты, доля от макс.
  botOvershoot: 100,   // перелёт биты сквозь точку удара, px
  botResample: 30,     // тиков между новыми ошибками прицела
  simpleBack: 0.25,    // с — бот simple после касания отдёргивает биту к своим воротам
  botLead: 0.08,       // с — бот целит в шайбу чуть вперёд по её скорости
  // ошибка предсказания растёт с дальностью и отскоками (иначе защита идеальна и голов почти нет):
  // σ_пред = σ · (botErrBase + путь шайбы до линии защиты / botErrTravel + botErrBounce · число отскоков); одна ошибка на траекторию
  botErrBase: 0.5, botErrTravel: 550, botErrBounce: 1, botTrajDv: 150,
  // бот v2 (§8.4): удар доводится botCommit тиков (или до касания); после своего удара (−vn > hitHard → hitHardT)
  // round(delay·60) + botRecover тиков не атакует (не бьёт «призрак»)
  botCommit: 12, botRecover: 6, hitHard: 120,
};
const DT = 1 / 60;
const RINK = { x0: 40, x1: 1040, y0: 200, y1: 1720, mid: 960, gL: 360, gR: 720, cx: 540, serveTop: 600, serveBot: 1320 }; // serveTop/Bot: куда ставится новая шайба (D-89; было 580 / 1340)
class Prng {
  constructor(seed) { this.s = seed >>> 0; }
  next() { let t = (this.s = (this.s + 0x6D2B79F5) >>> 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  gauss() { let u = 0; while (u === 0) u = this.next(); const v = this.next(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
}
const HOME = { 1: { x: 540, y: RINK.y1 - 250 }, 2: { x: 540, y: RINK.y0 + 250 } };
const LEVELS = ["easy", "medium", "hard"];
// ctrl: [_, низ, верх] — "human" или имя бота
function newMatch(mode, seed, c1, c2) {
  const S = {
    mode, seed: seed >>> 0, rng: new Prng(seed),
    ctrl: [null, c1 || "human", c2 || (mode === "duo" ? "human" : mode)],
    state: "countdown", t: Math.round(TUNE.countdown / DT), ticks: 0, playTicks: 0, overT: 0,
    puck: { x: RINK.cx, y: RINK.mid, vx: 0, vy: 0, ang: 0 },
    m: [null, mal(1), mal(2)],
    score: [0, 0, 0], winner: 0, stall: 0, blow: null, act: [null, "", ""],
    face: [null, { f: "neutral", until: 0 }, { f: "neutral", until: 0 }],
    lastGoal: null, hist: [], fx: [], bot: [null, { ex: 0, ep: 0, next: 0, sk: null }, { ex: 0, ep: 0, next: 0, sk: null }],
    hits: 0, maxSpeed: 0,
  };
  record(S);
  return S;
}
function mal(pl) { const h = HOME[pl]; return { x: h.x, y: h.y, tx: h.x, ty: h.y, vx: 0, vy: 0, dx: 0, dy: 0, max: TUNE.malletMax }; }
function bounds(pl) {
  const R = TUNE.malletR;
  return pl === 1 ? { x0: RINK.x0 + R, x1: RINK.x1 - R, y0: RINK.mid + TUNE.lineGap, y1: RINK.y1 - R }
                  : { x0: RINK.x0 + R, x1: RINK.x1 - R, y0: RINK.y0 + R, y1: RINK.mid - TUNE.lineGap };
}
function clampTo(b, x, y) { return [Math.max(b.x0, Math.min(b.x1, x)), Math.max(b.y0, Math.min(b.y1, y))]; }
function record(S) { const p = S.puck; S.hist.push({ x: p.x, y: p.y, vx: p.vx, vy: p.vy }); if (S.hist.length > 40) S.hist.shift(); }
function fx(S, o) { o.t = S.ticks; S.fx.push(o); }
function homeMallets(S) { for (const pl of [1, 2]) { const m = S.m[pl], h = HOME[pl]; m.x = h.x; m.y = h.y; m.vx = m.vy = 0; } }

function collideWalls(S, bounce) {
  const p = S.puck, r = TUNE.puckR, e = TUNE.wallE;
  if (p.x < RINK.x0 + r) { p.x = RINK.x0 + r; if (p.vx < 0) { if (bounce) fx(S, { k: "cush", side: "L", x: RINK.x0, y: p.y, s: -p.vx }); p.vx = -p.vx * e; } }
  if (p.x > RINK.x1 - r) { p.x = RINK.x1 - r; if (p.vx > 0) { if (bounce) fx(S, { k: "cush", side: "R", x: RINK.x1, y: p.y, s: p.vx }); p.vx = -p.vx * e; } }

    ctx.fillStyle = C.cream; ctx.strokeStyle = C.ink; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(b.x, b.y, PAUSE_R, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.ink; rr(b.x - 22, b.y - 26, 15, 52, 6); ctx.fill(); rr(b.x + 7, b.y - 26, 15, 52, 6); ctx.fill();

function drawFx() {
  for (const f of S.fx) {
    const age = S.ticks - f.t;

      const a = 1 - age / 9, s = Math.min(1, f.s / 2500);
      const R0 = 18 + age * (7 + 9 * s);
      ctx.strokeStyle = "rgba(255,255,255," + (0.95 * a) + ")"; ctx.lineWidth = 9 * a + 2; ctx.lineCap = "round";
      ctx.beginPath(); ctx.arc(f.x, f.y, R0, 0, 7); ctx.stroke();
      ctx.strokeStyle = "rgba(255,210,63," + a + ")"; ctx.lineWidth = 7 * a + 2;
      for (let i = 0; i < 8; i++) { const an = i * Math.PI / 4 + 0.3, r1 = R0 + 8, r2 = R0 + 18 + 30 * s; ctx.beginPath(); ctx.moveTo(f.x + Math.cos(an) * r1, f.y + Math.sin(an) * r1); ctx.lineTo(f.x + Math.cos(an) * r2, f.y + Math.sin(an) * r2); ctx.stroke(); }
    } else if (f.k === "blow" && age <= 18) { // ветерок 0,3 с
      const a = 1 - age / 18, sp = Math.hypot(f.vx, f.vy) || 1, ux = f.vx / sp, uy = f.vy / sp;
      const p = S.puck; ctx.strokeStyle = "rgba(160,215,250," + (0.9 * a) + ")"; ctx.lineWidth = 7; ctx.lineCap = "round";

        ctx.beginPath(); ctx.moveTo(bx, by);

function drawFlyingCandy() {
  const g = S.lastGoal; if (!g) return;
  const n = Math.round(TUNE.candyFly / DT), age = S.ticks - g.tick; if (age >= n) return;
  const t = age / n, to = pilePos(g.pl), from = { x: g.x, y: g.pl === 1 ? RINK.y0 - 30 : RINK.y1 + 30 };
  const x = from.x + (to.x - from.x) * t, y = from.y + (to.y - 22 - from.y) * t - Math.sin(Math.PI * t) * 260 * (g.pl === 1 ? 1 : -1) * (g.pl === 2 || S.mode === "duo" ? 1 : 1);
  drawCandy(x, y, TUNE.puckR * (1 - 0.6 * t), t * 9);
}
function drawCountdown() {
  if (S.state !== "countdown") return;
  const n = Math.round(TUNE.countdown / DT), left = S.t / n, p = S.puck;
  for (let i = 0; i < 3; i++) {
    const on = left > i / 3; // три точки гаснут по очереди
    for (const sgn of [-1, 1]) {
      if (S.mode !== "duo" && sgn === -1) continue;
      const y = p.y + sgn * 105, x = p.x + (i - 1) * 46 * sgn;

function drawHint() {
  if (!hintOn || S.state === "over") return;
  const m = S.m[1], p = S.puck, t = (performance.now() / 1300) % 1, k = t < 0.75 ? t / 0.75 : 1;
  const x = m.x + (p.x - m.x) * k * 0.8, y = m.y + (p.y - m.y) * k * 0.8;

  ctx.beginPath(); ctx.arc(x, y, 46, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.cream; rr(x - 16, y + 10, 32, 120, 16); ctx.fill(); ctx.stroke(); // палец
  ctx.globalAlpha = 1;

function draw() {
  fit();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.table; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(view.s * dpr, 0, 0, view.s * dpr, view.ox * dpr, view.oy * dpr);
  if (!S) return;
  drawBack(); drawCushions();
  drawStripContent(2, S.mode === "duo"); drawStripContent(1, false);
  const p = S.puck;
  // след быстрой шайбы
  const H = S.hist, sp = Math.hypot(p.vx, p.vy);
  if (S.state === "play" && sp > 1400) for (let i = 1; i <= 4 && H.length - 1 - i >= 0; i++) {
    const q = H[H.length - 1 - i]; if (Math.hypot(q.x - p.x, q.y - p.y) > 60 * (i + 1)) break; ctx.fillStyle = "rgba(232,65,47," + (0.16 - i * 0.03) + ")"; ctx.beginPath(); ctx.arc(q.x, q.y, TUNE.puckR * (1 - i * 0.08), 0, 7); ctx.fill();
  }
  drawMallet(1); drawMallet(2);
  if (S.state === "play" || S.state === "countdown") {
    ctx.fillStyle = "rgba(74,37,18,.22)"; ctx.beginPath(); ctx.ellipse(p.x + 6, p.y + 10, TUNE.puckR, TUNE.puckR * 0.9, 0, 0, 7); ctx.fill();
    drawCandy(p.x, p.y, TUNE.puckR, p.ang);

}

// ---- Цикл: фиксированный шаг 1/60 ---------------------------------------------------
let manual = false, acc = 0, lastT = 0;
const frameTimes = [];
function frame(now) {
  requestAnimationFrame(frame);
  if (lastT) {
    frameTimes.push(now - lastT); if (frameTimes.length > 120) frameTimes.shift();
    if (!manual) {
      acc += Math.min(0.05, (now - lastT) / 1000);
      let n = 0;
      while (acc >= DT && n < 3) { tick(); acc -= DT; n++; }
      if (n === 3) acc = 0;
    }
  }
  lastT = now;
  draw(); sounds();
}

// ---- Ввод с экрана: pointer events, мультитач ------------------------------------------
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); const a = audio(); if (a && a.state === "suspended") a.resume().catch(() => {});
  const [x, y] = toRef(e);
  if (touch(e.pointerId, "down", x, y)) { try { cv.setPointerCapture(e.pointerId); } catch (_) {} }
});
cv.addEventListener("pointermove", (e) => { if (!touches.has(e.pointerId)) return; const [x, y] = toRef(e); touch(e.pointerId, "move", x, y); });
cv.addEventListener("pointerup", (e) => { const [x, y] = toRef(e); touch(e.pointerId, "up", x, y); });
cv.addEventListener("pointercancel", (e) => { const [x, y] = toRef(e); touch(e.pointerId, "cancel", x, y); });

new ResizeObserver(() => draw()).observe(stage);
window.addEventListener("orientationchange", () => draw());
window.addEventListener("resize", () => draw());

// ---- Тестовый API (test-api.md §6) ---------------------------------------------------
let lastAct = null;
function runToOver(capSec) {
  const cap = Math.round((capSec || 1200) / DT); let n = 0;
  while (S.state !== "over" && n < cap) { tick(); n++; }
  for (let i = 0; i < Math.round(TUNE.endPanel / DT) + 2 && S.state === "over"; i++) tick();
  return n;
}
window.__game = {
  ready: false,
  getState() {
    const st = {
      "app.scene": scene, "hockey.paused": paused,
      "session.state": scene !== "game" ? "none" : result ? result.state : "playing",
      "result.stars": result ? result.stars : 0, "result.award": result ? result.award : 0, "result.newRecord": result ? result.newRecord : false,
      "result.winner": result ? result.winner : 0, "result.score": result ? result.score : 0,
      "hockey.lastMode": lastMode(), lastAct,
      view: (() => { const r = cv.getBoundingClientRect(); return { left: r.left + view.ox, top: r.top + view.oy, scale: view.s }; })(),

      "hockey.puckX": S.puck.x, "hockey.puckY": S.puck.y, "hockey.puckVx": S.puck.vx, "hockey.puckVy": S.puck.vy,
      "hockey.puckSpeed": Math.hypot(S.puck.vx, S.puck.vy),
      "hockey.m1x": S.m[1].x, "hockey.m1y": S.m[1].y, "hockey.m2x": S.m[2].x, "hockey.m2y": S.m[2].y,
      "hockey.state": S.state, "hockey.winner": S.winner, "hockey.ticks": S.ticks, "hockey.stall": S.stall,
      "hockey.ctrl1": S.ctrl[1], "hockey.ctrl2": S.ctrl[2], "hockey.hits": S.hits, "hockey.maxSpeed": S.maxSpeed,
      "hockey.omFrame": charFrame(1).fr, "hockey.tossFrame": charFrame(2).fr, "hockey.tossScaleX": -1, "hockey.tossScaleY": +charFrame(2).sy.toFixed(3),
      "hockey.drawnOmFrame": omFrame, "hockey.drawnTossFrame": tossFrame, "hockey.tossHeightPx": +(62 * OM_K * charFrame(2).sy).toFixed(1), "hockey.omHeightPx": +(72 * OM_K).toFixed(1),
      "hockey.topRotated": S.mode === "duo", "hockey.hint": hintOn, "hockey.fingers": [...touches.values()].filter((t) => t.pl).length,
      "hockey.owner1": owner[1], "hockey.owner2": owner[2],
      // бот v2: решение (botAct — верхний бот), ошибка на траекторию (botErr — ep верхнего), прицел, доводка, «выдох»
      "hockey.botAct": S.act[2], "hockey.botAct1": S.act[1], "hockey.botErr": S.bot[2].ep, "hockey.botErr1": S.bot[1].ep,
      "hockey.botEx": S.bot[2].ex, "hockey.botCommit": !!S.bot[2].sk,
      "hockey.m1hitT": S.m[1].hitT == null ? null : S.m[1].hitT, "hockey.m2hitT": S.m[2].hitT == null ? null : S.m[2].hitT,

      "hockey.blow": !!S.blow, "hockey.blowX": S.blow ? S.blow.x : null, "hockey.blowY": S.blow ? S.blow.y : null,
      "hockey.viewM1x": viewMallet(1).x, "hockey.viewM1y": viewMallet(1).y, "hockey.viewM2x": viewMallet(2).x, "hockey.viewM2y": viewMallet(2).y,

// перед выбором режима за панелью виден каток с битами
