<style>:root{--ink:#2a2140;--cream:#fff6e0;--pink:#ff5fa8;--pink2:#b8326f;--grass:#5fae45;--go:#8ccb3e;--go2:#5e9a22}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;background:#2c5a2c;margin:0;font:800 14px/1.25 ui-rounded,SF Pro Rounded,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}body{height:100dvh}#stage{touch-action:none;position:absolute;inset:0}canvas#cv{touch-action:none;width:100%;height:100%;display:block;position:absolute;inset:0}button{font:inherit;border:2px solid var(--ink);background:var(--cream);color:var(--ink);cursor:pointer;border-radius:999px;padding:6px 12px;font-weight:800;box-shadow:0 3px #2a214059}button:active{transform:translateY(2px);box-shadow:0 1px #2a214059}#menuBtn{z-index:3;width:36px;height:36px;padding:0;font-size:18px;display:none;position:absolute;top:8px;right:8px}body.race #menuBtn{display:block}body.race.two #menuBtn{margin-top:-18px;top:50%;right:8px}#gear{z-index:7;width:38px;height:38px;padding:0;font-size:20px;position:fixed;bottom:12px;right:8px}body.race #backLink{display:none}body.race.two #gear{margin-top:30px;top:50%;bottom:auto}#panel{background:var(--cream);border:2px solid var(--ink);z-index:7;border-radius:16px;width:262px;max-height:80dvh;padding:10px 12px;display:none;position:fixed;bottom:56px;right:8px;overflow:auto;box-shadow:0 6px 18px #2a214066}body.race.two #panel{top:calc(50% + 74px);bottom:auto}#panel .r{grid-template-columns:86px 1fr 38px;align-items:center;gap:6px;margin:6px 0;font-size:12px;display:grid}#panel .c{align-items:center;gap:8px;margin:8px 0;font-size:12px;display:flex}#panel input[type=range]{touch-action:pan-x;width:100%;margin:0}#panel b{text-align:right;font-variant-numeric:tabular-nums}#panel .t{justify-content:space-between;align-items:center;display:flex}.ov{z-index:5;background:#1e321e9e;justify-content:center;align-items:center;display:none;position <body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="ov on" id="start"><div class="card">
    <h1>Om Nom Racers</h1>
    <p>Auto gas. Hold left or right to steer.</p>
    <div class="tracks" id="tracks"></div>
    <div class="col">
      <button class="big" id="b1">1 Player</button>
      <button class="big pink" id="b2">2 Players</button>
    </div>
  </div></div>
  <div class="ov" id="end"><div class="card">
    <div class="flip off" id="endFlip"><p class="big2" id="endT2"></p><p id="endS2"></p></div>
    <p class="big2" id="endT"></p>
    <p id="endS"></p>
    <p id="endRec" class="rec"></p>
    <div class="row"><button class="big" id="again">Again</button><button id="toMenu">Menu</button></div>
  </div></div>
  <button id="menuBtn" title="Menu">&#9776;</button>
  <a class="back" id="backLink" href="index.html">&larr; Lab</a>
</div>
<button id="gear" title="Settings">&#9881;</button>
<div id="panel"><div class="t"><b style="text-align:left">Tuning</b><button id="reset" style="padding:2px 10px;font-size:12px">Reset</button></div><div id="sl"></div><div id="ck"></div></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

// ---- constants ---------------------------------------------------------------------------------
const BOX = { w: 330, h: 560 };   // world box the 2-player view fits on screen
const RW = 22, GW = 12;            // road half width, grass half width (beyond the road edge)
const DT = 1 / 60, LAPS = 3, DS = 6;
const CAR_L = 17, CAR_W = 9.5, CAR_R = 8;

// ---- tuning (the gear) -------------------------------------------------------------------------
const CFG_DEF = { vmax: 100, turn: 2.6, grip: 6, bot: 0.6, rotate: false, bots2: false };
const SLIDERS = [["vmax", "Max speed", 70, 200, 5], ["turn", "Steering", 1.2, 4.5, 0.1], ["grip", "Grip (low = drift)", 2, 12, 0.5], ["bot", "Bot skill", 0, 1, 0.05]];
const CHECKS = [["rotate", "Rotate map with car (1 P)"], ["bots2", "2 bots in 2-player race"]];
const cfg = Object.assign({}, CFG_DEF);
try { Object.assign(cfg, JSON.parse(localStorage.getItem("lab.race.cfg") || "{}")); } catch (e) {}
function saveCfg() { try { localStorage.setItem("lab.race.cfg", JSON.stringify(cfg)); } catch (e) {} }
function getBest(i) { try { return Number(localStorage.getItem("lab.race.best." + i)) || 0; } catch (e) { return 0; } }
function setBest(i, v) { try { localStorage.setItem("lab.race.best." + i, String(v)); } catch (e) {} }
function fmt(t) { if (!(t > 0)) return "-:--.--"; const m = Math.floor(t / 60); return m + ":" + (t - m * 60).toFixed(2).padStart(5, "0"); }

// ---- tracks ------------------------------------------------------------------------------------
function catmull(pts, per) {
  const out = [], n = pts.length;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i + n - 1) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    for (let k = 0; k < per; k++) {
      const t = k / per, t2 = t * t, t3 = t2 * t;
      const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
    }
  }
  return out;
}
function resample(poly, ds) {
  const n = poly.length, cum = [0];
  for (let i = 0; i < n; i++) { const a = poly[i], b = poly[(i + 1) % n]; cum.push(cum[i] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
  const L = cum[n], N = Math.round(L / ds), step = L / N, out = [];
  let seg = 0;
  for (let i = 0; i < N; i++) {
    const s = i * step;
    while (cum[seg + 1] < s) seg++;
    const a = poly[seg], b = poly[(seg + 1) % n], u = (s - cum[seg]) / (cum[seg + 1] - cum[seg] || 1);
    out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]);
  }
  return { pts: out, N, ds: step, L };
}
const TRACK_DEFS = [
  { name: "Bob", info: "Oval with a kink",
    poly: () => catmull([[40, 380], [40, 250], [58, 150], [112, 72], [185, 46], [250, 72], [290, 135], [288, 215], [252, 285], [254, 350], [290, 410], [286, 478], [235, 518], [165, 522], [90, 505], [50, 462]], 14),
    boosts: [[0.20, -8], [0.62, 8]] },
  { name: "Eight", info: "Bridge in the middle",
    poly: () => { const o = []; for (let i = 0; i < 360; i++) { const t = Math.PI / 2 + (i / 360) * TAU; o.push([165 + 125 * Math.sin(2 * t), 280 + 235 * Math.sin(t)]); } return o; },
    bridge: true, boosts: [[0.10, 8], [0.60, -8]] },
  { name: "Twisty", info: "Lots of turns",
    poly: () => catmull([[70, 512], [165, 512], [250, 508], [292, 470], [288, 405], [235, 365], [172, 392], [118, 345], [140, 285], [218, 272], [283, 235], [282, 165], [248, 100], [190, 62], [130, 70], [108, 118], [128, 168], [92, 208], [48, 245], [42, 320], [40, 400], [40, 462]], 10),
    boosts: [[0.06, 8], [0.40, -8], [0.72, 8]] },
];
function buildTrack(def) {
  const r = resample(def.poly(), DS), N = r.N, T = { name: def.name, info: def.info, N, ds: r.ds, L: r.L };
  T.cx = new Float32Array(N); T.cy = new Float32Array(N); T.tx = new Float32Array(N); T.ty = new Float32Array(N);
  T.nx = new Float32Array(N); T.ny = new Float32Array(N); T.ideal = new Float32Array(N); T.br = new Uint8Array(N);
  for (let i = 0; i < N; i++) { T.cx[i] = r.pts[i][0]; T.cy[i] = r.pts[i][1]; }
  for (let i = 0; i < N; i++) {
    const a = (i + N - 1) % N, b = (i + 1) % N;
    let dx = T.cx[b] - T.cx[a], dy = T.cy[b] - T.cy[a]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    T.tx[i] = dx; T.ty[i] = dy; T.nx[i] = -dy; T.ny[i] = dx;
  }
  // racing line for the bots: smooth the offset path inside the road
  const lim = RW - 9, k = 3;
  for (let it = 0; it < 260; it++) {
    for (let i = 0; i < N; i++) {
      const a = (i + N - k) % N, b = (i + k) % N;
      const ax = T.cx[a] + T.nx[a] * T.ideal[a], ay = T.cy[a] + T.ny[a] * T.ideal[a];
      const bx = T.cx[b] + T.nx[b] * T.ideal[b], by = T.cy[b] + T.ny[b] * T.ideal[b];
      const mx = (ax + bx) / 2, my = (ay + by) / 2;
      T.ideal[i] = clamp((mx - T.cx[i]) * T.nx[i] + (my - T.cy[i]) * T.ny[i], -lim, lim);
    }
  }
  // bridge: the later of the two samples at the self-crossing
  if (def.bridge) {
    let best = 1e9, bi = 0, bj = 0;
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const gap = Math.min(j - i, N - (j - i)); if (gap < N * 0.15) continue;
      const d = Math.hypot(T.cx[i] - T.cx[j], T.cy[i] - T.cy[j]); if (d < best) { best = d; bi = i; bj = j; }
    }
    const B = Math.ceil(54 / T.ds); T.bridgeIdx = bj; T.bridgeLen = B;
    for (let d = -B; d <= B; d++) T.br[(bj + d + N) % N] = 1;
  }
  T.boosts = (def.boosts || []).map(([f, off]) => {
    const i = Math.floor(f * N) % N;
    return { i, off, x: T.cx[i] + T.nx[i] * off, y: T.cy[i] + T.ny[i] * off, tx: T.tx[i], ty: T.ty[i] };
  });
  // paths
  const p = new Path2D(); p.moveTo(T.cx[0], T.cy[0]); for (let i = 1; i < N; i++) p.lineTo(T.cx[i], T.cy[i]); p.closePath(); T.path = p;
  if (def.bridge) {
    const bp = new Path2D(), B = T.bridgeLen;
    for (let d = -B; d <= B; d++) { const i = (T.bridgeIdx + d + N) % N; if (d === -B) bp.moveTo(T.cx[i], T.cy[i]); else bp.lineTo(T.cx[i], T.cy[i]); }
    T.bridgePath = bp;
  }
  return T;
}
const TRACKS = TRACK_DEFS.map(buildTrack);

function nearestGlobal(T, x, y) {
  let bi = 0, bd = 1e18;
  for (let i = 0; i < T.N; i++) { const dx = x - T.cx[i], dy = y - T.cy[i], d = dx * dx + dy * dy; if (d < bd) { bd = d; bi = i; } }
  return { i: bi, d: Math.sqrt(bd) };
}
// nearest index close to the previous one (continuous progress, correct at the crossing)
function nearestLocal(T, x, y, prev) {
  let bi = prev, bd = 1e18;
  for (let k = -24; k <= 24; k++) {
    const i = (prev + k + T.N) % T.N, dx = x - T.cx[i], dy = y - T.cy[i], d = dx * dx + dy * dy;
    if (d < bd) { bd = d; bi = i; }
  }
  const f = clamp(((x - T.cx[bi]) * T.tx[bi] + (y - T.cy[bi]) * T.ty[bi]) / T.ds, -0.5, 0.5);
  return { i: bi, f };
}

// ---- race state --------------------------------------------------------------------------------
let scene = "menu", mode = 1, trackIdx = 0, T = TRACKS[0];
let cars = [], cd = 3, raceT = 0, endT = 0, finishOrder = [], newRecord = false, bestLap = 0, ended = false;
const inp = { p1: 0, p2: 0 };           // steering inputs from touch/keys: -1 left, 0, +1 right
let manual = false, acc = 0, tAnim = 0, boostFx = [], frameN = 0;
let auto = { p1: false, p2: false, digital: true, skill: 0.5 };  // test: let the AI drive a human car
const gauss = () => { let s = 0; for (let i = 0; i < 4; i++) s += Math.random(); return (s - 2) * 1.73; };

function makeCar(kind, idx, behind, lane, color, skill) {
  const nb = Math.round(behind / T.ds), i0 = (T.N - nb) % T.N;
  const x = T.cx[i0] + T.nx[i0] * lane, y = T.cy[i0] + T.ny[i0] * lane;
  return { kind, idx, color, x, y, a: Math.atan2(T.ty[i0], T.tx[i0]), vx: 0, vy: 0, steer: 0, in: 0, boost: 0, lvl: 0,
    ip: i0, prog: -nb, lapIdx: -1, tcross: [], laps: [], best: 0, finishT: 0, finished: false,
    skill: skill == null ? 0.5 : skill, lane, noise: 0, wob: 0, wobT: 0, surf: "road", skid: null, hits: 0, slip: 0, pk: { x: 0, y: 0 } };
}
function startRace(m, ti) {
  mode = m; trackIdx = ti; T = TRACKS[ti]; cars = []; finishOrder = []; raceT = 0; cd = 3; ended = false; newRecord = false; boostFx = [];
  bestLap = getBest(ti); skClear();
  const s = cfg.bot;
  if (m === 1) {
    cars.push(makeCar("p1", 0, 32, -11, "#3b8cff"),
      makeCar("bot", 1, 8, -11, "#ff4b4b", clamp(s + 0.15, 0, 1)),
      makeCar("bot", 2, 8, 11, "#a24bff", clamp(s, 0, 1)),
      makeCar("bot", 3, 32, 11, "#ffd23f", clamp(s - 0.15, 0, 1)));
  } else {
    cars.push(makeCar("p1", 0, 8, -11, "#3b8cff"), makeCar("p2", 1, 8, 11, "#ff8a1f"));
    if (cfg.bots2) { cars.push(makeCar("bot", 2, 32, -11, "#ff4b4b", clamp(s, 0, 1)), makeCar("bot", 3, 32, 11, "#a24bff", clamp(s - 0.1, 0, 1))); }
  }
  scene = "race";
  document.body.classList.add("race"); document.body.classList.toggle("two", m === 2);
  $("start").classList.remove("on"); $("end").classList.remove("on");
  camInit();
}
function toMenu() {
  scene = "menu"; document.body.classList.remove("race", "two");
  $("end").classList.remove("on"); $("start").classList.add("on"); refreshTracks();
}

// ---- physics -----------------------------------------------------------------------------------
function botInput(c, digital) {
  const N = T.N, sp = Math.hypot(c.vx, c.vy);
  let look = Math.round((20 + sp * 0.24) / T.ds);
  const j = (c.ip + look) % N;
  // lane: chase a boost strip a little ahead when skilled enough
  let off = T.ideal[j] + c.lane * 0.25 + c.noise;
  for (const b of T.boosts) {
    const di = (b.i - c.ip + N) % N;
    if (di > 2 && di < 22 && c.skill > 0.3) off = off * 0.2 + b.off * 0.8;
  }
  off = clamp(off, -RW + 7, RW - 7);
  const qx = T.cx[j] + T.nx[j] * off, qy = T.cy[j] + T.ny[j] * off;
  const err = angDiff(Math.atan2(qy - c.y, qx - c.x), c.a);
  if (c.wobT > 0) return c.wob;
  if (digital) return err > 0.07 ? 1 : err < -0.07 ? -1 : 0;
  return clamp(err * 2.4, -1, 1);
}
function stepCar(c, dt) {
  const sk = c.kind === "bot" ? c.skill : auto.skill;
  const isBot = c.kind === "bot", isAuto = (c.kind === "p1" && auto.p1) || (c.kind === "p2" && auto.p2) || c.finished;
  // bot noise / mistakes
  if (isBot || isAuto) {
    c.noise += -c.noise * 1.2 * dt + gauss() * (1 - sk) * 12 * Math.sqrt(dt) * 1.3;
    if (c.wobT > 0) c.wobT -= dt; else if (Math.random() < (1 - sk) * 0.12 * dt * 2 * (c.finished ? 0.1 : 1)) { c.wobT = 0.25 + Math.random() * 0.2; c.wob = Math.random() < 0.5 ? -1 : 1; }
    c.in = botInput(c, isAuto && !isBot ? auto.digital : false);
    if (isAuto && !isBot && auto.delay) { (c.hist || (c.hist = [])).push(c.in); c.in = c.hist.length > auto.delay ? c.hist.shift() : 0; }
  } else c.in = c.kind === "p1" ? inp.p1 : inp.p2;
  const g = nearestGlobal(T, c.x, c.y);
  const surf = g.d <= RW ? "road" : g.d <= RW + GW ? "grass" : "wall";
  c.surf = surf;
  c.steer += clamp(c.in - c.steer, -8 * dt, 8 * dt);
  const speed = Math.hypot(c.vx, c.vy);
  // steering first: the heading turns, the velocity does not (that is the slide)
  const omega = cfg.turn * c.steer * clamp(speed / 45, 0, 1);
  c.a += omega * dt;
  const fx = Math.cos(c.a), fy = Math.sin(c.a);
  let vl = c.vx * fx + c.vy * fy, vs = -c.vx * fy + c.vy * fx;
  const vscale = isBot ? 0.8 + 0.22 * c.skill : 1;
  if (c.boost > 0) c.boost -= dt;
  let tgt = cfg.vmax * vscale * (1 - 0.22 * Math.abs(c.steer));
  if (surf !== "road") tgt = cfg.vmax * 0.3;
  if (c.boost > 0) tgt = Math.max(tgt, cfg.vmax * 1.4);
  if (vl < tgt) vl = Math.min(tgt, vl + cfg.vmax * 1.1 * dt); else vl += (tgt - vl) * Math.min(1, (surf === "road" ? 1.6 : 4.5) * dt);
  // lateral grip with a cap: asking for more than the tyres give makes the car slide
  const hard = clamp((Math.abs(c.steer) - 0.55) / 0.45, 0, 1) * clamp(speed / (cfg.vmax * 0.8), 0, 1);
  const gEff = cfg.grip * (1 - 0.4 * hard) * (surf === "road" ? 1 : 0.6);
  const want = gEff * vs * dt, cap = gEff * 40 * dt;
  vs -= clamp(want, -cap, cap);
  c.slip = vs;
  c.vx = fx * vl - fy * vs; c.vy = fy * vl + fx * vs;
  c.x += c.vx * dt; c.y += c.vy * dt;
  // wall
  const g2 = nearestGlobal(T, c.x, c.y);
  if (g2.d > RW + GW) {
    const nx = (c.x - T.cx[g2.i]) / g2.d, ny = (c.y - T.cy[g2.i]) / g2.d;
    c.x = T.cx[g2.i] + nx * (RW + GW); c.y = T.cy[g2.i] + ny * (RW + GW);
    const vn = c.vx * nx + c.vy * ny;
    if (vn > 0) {
      c.vx -= 1.35 * vn * nx; c.vy -= 1.35 * vn * ny;
      const tx = -ny, ty = nx, vt = c.vx * tx + c.vy * ty; c.vx -= vt * 0.12 * tx; c.vy -= vt * 0.12 * ty;
      if (vn > 20) c.hits++;
    }
  }
  // progress
  const l = nearestLocal(T, c.x, c.y, c.ip);
  c.ip = l.i; c.lvl = T.br[l.i];
  const pm = ((c.prog % T.N) + T.N) % T.N;
  let d = (l.i + l.f) - pm; if (d > T.N / 2) d -= T.N; if (d < -T.N / 2) d += T.N;
  c.prog += d;
  const lap = Math.floor(c.prog / T.N);
  if (lap > c.lapIdx) {
    for (let k = c.lapIdx + 1; k <= lap; k++) {
      c.tcross[k] = raceT; // k = 0 start line, k>=1 lap k done
      if (k >= 1) {
        c.laps.push(c.tcross[k] - c.tcross[k - 1]);
        const lt = c.laps[c.laps.length - 1];
        if (!c.best || lt < c.best) c.best = lt;
        if (c.kind === "p1" && mode === 1 && !auto.p1 && (!bestLap || lt < bestLap)) { bestLap = lt; newRecord = true; setBest(trackIdx, lt); }
      }
    }
    c.lapIdx = lap;
    if (lap >= LAPS && !c.finished) { c.finished = true; c.finishT = raceT; finishOrder.push(c); }
  }
  // boosters
  for (const b of T.boosts) {
    const dx = c.x - b.x, dy = c.y - b.y, al = dx * b.tx + dy * b.ty, la = -dx * b.ty + dy * b.tx;

  tracks: TRACKS, W: RW, G: GW,
  getState() { return { scene, mode, track: trackIdx, cd: +cd.toFixed(2), raceT: +raceT.toFixed(2), laps: LAPS, ended, newRecord, bestLap, cfg: Object.assign({}, cfg), inp: Object.assign({}, inp), cars: cars.map(stateOf), rank: ranking().map((c) => cars.indexOf(c)) }; },
  metrics() { const s = meter.slice().sort((a, b) => a - b); const m = s.reduce((a, b) => a + b, 0) / (s.length || 1); return { fps: m ? Math.round(1000 / m) : 0, frameMsP95: s.length ? s[Math.floor(s.length * 0.95)] : 0, drawCalls: -1 }; },
  act(a, p) {
    if (a === "step") { const n = typeof p === "number" ? p : (p && p.n) || 1; for (let i = 0; i < n; i++) { simStep(DT); camStep(DT); } return; }
    p = p || {};
    if (a === "start") { if (p.cfg) Object.assign(cfg, p.cfg); startRace(p.mode || 1, p.track || 0); }
    else if (a === "menu") toMenu();
    else if (a === "clock") manual = !!p.manual;
    else if (a === "steer") { if (p.p1 != null) inp.p1 = p.p1; if (p.p2 != null) inp.p2 = p.p2; }
    else if (a === "auto") { Object.assign(auto, p); }
    else if (a === "cfg") Object.assign(cfg, p);
    else if (a === "draw") draw();
  },
};
