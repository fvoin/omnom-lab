<script>
"use strict";
// Версия 2 (D-53, «как Человек-паук»): прицел только «угол», зацеп за верх крыши с подсветкой цели до нажатия,
// большие махи и высокий полёт, камера дальше, дома выше и реже, генератор с проверкой досягаемости. v1 — hook-rnf-v1.html.
// ---- Ом Ном кадрами приложения (D-40, не рисунок кодом) ---------------------------
// Кадры лежат в assets/omnom/ — одна папка на все прототипы; новую версию Ома Нома копируем поверх теми же именами.
// Числа — из assets/omnom/omnom_frames.json: 6,4024 px на u, лапы = pivot, рот (кадр wide); зрачки — два слоя (левый и правый глаз), каждый ходит в эллипсе своего глаза (pupils.<кадр>.eyes).
// В файлах Ом Ном смотрит ВЛЕВО от зрителя; flip = смотрит вправо. Кадр: p.mx, p.my — точка рта в игре (u), p.fy — лапы (по умолчанию рот + 20).
const OMS = (() => {
  const PX = 6.4024, PIV = [0.5366, 0.0253], MOUTH = [-2.08, -19.98];
  // Зрачки — по слою на глаз. Для каждого: rest — центр зрачка в покое, c и r — эллипс хода центра зрачка (u от лап, оси кадра до зеркала).
  // Сдвиг взгляда d одинаков для обоих глаз, но центр каждого зрачка потом зажимается в эллипс СВОЕГО глаза: зрачок не выходит из белка и не переходит шов.
  const PUP = {
    neutral: { l: { rest: [-13.93, -44.86], c: [-16.67, -45.33], r: [3.91, 3.98] },
             r: { rest: [-0.81, -42.67], c: [2.23, -42.67], r: [6.22, 6.39] } },
    ajar:   { l: { rest: [-13.7, -47.75], c: [-15.42, -48.29], r: [2.61, 2.51] },
             r: { rest: [-1.6, -45.33], c: [1.92, -42.83], r: [6.06, 6.01] } },
    wide:   { l: { rest: [-13.39, -51.18], c: [-14.79, -51.42], r: [1.98, 1.54] },
             r: { rest: [-1.13, -48.76], c: [0.98, -45.95], r: [5.73, 5.06] } },
    wide2:  { l: { rest: [-13.93, -52.28], c: [-14.95, -52.67], r: [1.64, 1.31] },
             r: { rest: [-1.52, -49.54], c: [0.83, -46.58], r: [5.85, 5.25] } },
  };
  const LOOK = 7; // u: длина полного взгляда, больше любого радиуса хода — на краю эллипса зрачок упирается в границу
  const NAMES = ["neutral", "ajar", "wide", "wide2", "chew", "chew2", "sad", "joy", "blink", "half", "shadow"];
  for (const f in PUP) NAMES.push(f + "_pupils_l", f + "_pupils_r");
  const img = {};
  const waits = [];
  for (const n of NAMES) {
    const i = new Image(); img[n] = i;
    waits.push(new Promise((res) => { i.onload = i.onerror = res; }));
    i.src = "assets/omnom/" + n + ".png";
  }
  const ok = (i) => i && i.complete && i.naturalWidth > 0;
  // центр зрачка: покой + сдвиг (dx, dy), затем в эллипс хода своего глаза: q = (p - c) / r; |q| > 1 -> p = c + q/|q| * r
  function eyePos(e, dx, dy) {
    let px = e.rest[0] + dx, py = e.rest[1] + dy;
    const qx = (px - e.c[0]) / e.r[0], qy = (py - e.c[1]) / e.r[1], ql = Math.hypot(qx, qy);
    if (ql > 1) { px = e.c[0] + qx / ql * e.r[0]; py = e.c[1] + qy / ql * e.r[1]; }
    return [px, py];
  }
  // p: { frame, mx, my, fy?, flip?, tx?, ty?, rot?, piv?, shadow?, alpha? }; st — объект вызывающего: плавный взгляд
  const last = { frame: null, l: null, r: null, d: null };
  function draw(ctx, p, st) {
    let f = p.frame || "neutral";
    if (f === "neutral" && (performance.now() + (p.blinkOff || 0)) % 3600 < 120) f = "blink";
    const base = img[f]; if (!ok(base)) return;
    const flip = p.flip ? -1 : 1, fx = p.mx - flip * MOUTH[0], fy = p.fy != null ? p.fy : p.my - MOUTH[1];
    const pw = base.naturalWidth, ph = base.naturalHeight, k = 1 / PX;
    ctx.save();
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    if (p.alpha != null) ctx.globalAlpha = p.alpha;
    if (p.shadow && ok(img.shadow)) ctx.drawImage(img.shadow, fx - 32, fy - 6, 64, 12);
    ctx.translate(fx, p.piv ? fy - p.piv : fy); if (p.rot) ctx.rotate(p.rot); if (p.piv) ctx.translate(0, p.piv);
    ctx.scale(flip * k, k);
    ctx.drawImage(base, -PIV[0] * pw, -(1 - PIV[1]) * ph);
    const pu = PUP[f], pl = img[f + "_pupils_l"], pr = img[f + "_pupils_r"];
    if (pu && ok(pl) && ok(pr)) {
      let gx = 0, gy = 0;
      if (p.tx != null) { // цель в системе кадра до зеркала; общий сдвиг взгляда, потом зажим по каждому глазу
        const pv = p.piv || 0;
        let dx = p.tx - fx, dy = p.ty - (fy - pv);
        if (p.rot) { const c = Math.cos(-p.rot), sn = Math.sin(-p.rot), qx = dx * c - dy * sn, qy = dx * sn + dy * c; dx = qx; dy = qy; }
        dy -= pv; dx *= flip;
        const ex = (pu.l.rest[0] + pu.r.rest[0]) / 2, ey = (pu.l.rest[1] + pu.r.rest[1]) / 2; // между глазами
        const vx = dx - ex, vy = dy - ey, L = Math.hypot(vx, vy) || 1, a = Math.min(1, L / 45);
        gx = vx / L * a * LOOK; gy = vy / L * a * LOOK;
      }
      if (st) { st.x = st.x == null ? gx : st.x + (gx - st.x) * 0.35; st.y = st.y == null ? gy : st.y + (gy - st.y) * 0.35; gx = st.x; gy = st.y; }
      const pL = eyePos(pu.l, gx, gy), pR = eyePos(pu.r, gx, gy);
      ctx.drawImage(pl, -PIV[0] * pw + (pL[0] - pu.l.rest[0]) * PX, -(1 - PIV[1]) * ph + (pL[1] - pu.l.rest[1]) * PX);
      ctx.drawImage(pr, -PIV[0] * pw + (pR[0] - pu.r.rest[0]) * PX, -(1 - PIV[1]) * ph + (pR[1] - pu.r.rest[1]) * PX);
      last.frame = f; last.l = pL; last.r = pR; last.d = [gx, gy];
    }
    ctx.restore();
  }
  return { draw, img, PUP, eyePos, last, loaded: Promise.all(waits), ready: () => NAMES.every((n) => ok(img[n])) };
})();
// ---- Главные числа: крутить здесь (TUNE v2, спецификация v2.5) ------------------------
// Окно 320×480 u, варенье y 462. Домики — задний план (места для зацепа), высота h над вареньем, крыша top = 462 − h (может быть < 0).
const SIZE = {
  omH: 72,        // Ом Ном от лап до усика, u
  omR: 30,        // полуширина тела
  omFeet: 30,     // от центра тела до лап
  omTop: 36,      // от центра тела до макушки (верх кадра)
  mouthDy: 10,    // рот ниже центра тела
  candyR: 20,     // конфета Ø 40 u
  rope: 7,        // толщина верёвки (u; при зуме 0,5 — 3,5 u экрана)
};
const TUNE = {
  gravity: 1300, airDrag: 0.999, iterations: 25, linkLen: 14, nodeWeight: 0.02, // верёвка — Верле (только вид)
  // прицел: только угол; цель — точка на верхнем ребре крыши (v2.1)
  rayAngle: 55,        // ° вверх-вправо (?angle=)
  aimCone: 30,         // ° допуск от rayAngle: 25…85°
  liftDy: 60,          // u: крыша выше центра Ома Нома хотя бы на столько
  roofInset: 8,        // u: отступ точки от углов крыши
  aimHyst: 6,          // °: прежняя цель держится, пока её dev ≤ лучший + aimHyst
  ropeMin: 80, ropeMax: 600, // u
  missRay: 120,        // u: выстрел промаха и серый луч «цели нет»
  // динамика «как Человек-паук» (v2.2)
  swingMin: 350,       // u/с: касательная скорость при зацепе поднимается до этой («рывок паутины»)
  backDrag: 0.985,     // ×/тик скорости на верёвке, пока vx < 0 (обратный мах гаснет)
  sweetBoost: 1.08,    // «вжух»: множитель скорости
  sweetMin: 25, sweetMax: 60, // окно угла скорости, ° к горизонту вправо-вверх (спецификация 15…70; сужено по калибровке — первая ручка v2.6)
  sweetLift: 160,      // u: «вжух» гарантирует взлёт центра на столько выше точки зацепа
  capVx: 950, capVy: 1400,
  candyKick: 30,       // u/с вдоль движения за конфету
  bounceUp: 800, bounceVx: 200, fallPenalty: 2, // варенье-батут
  jumpVx: 300, jumpVy: -200, // первое нажатие с коробки
  eatDist: 40, magnet: 140, magnetZone: 20,
  roundSec: 60, finaleSec: 1.2, fragFade: 1.2, shootSec: 0.07, retractSec: 0.15,
  // улица (v2.3)
  gapMin: 140, gapMax0: 220, gapGrow: 0.004, gapCap: 380,
  wMin: 110, wMax0: 220, wShrink: 0.002, wFloor: 160,
  hMax: 720, hMin0: 440, hMinG: 0.6, scanH: [200, 380], genRetry: 6, genScanStep: 5,
  // камера (v2.3)
  zoomBase: 0.5, zoomFast: 0.44, zoomMin: 0.40, zoomV0: 500, zoomV1: 900, zoomLerp: 0.06,
  camTopMargin: 100, camYLerp: 0.12, camAnchor: 0.18, camLerp: 0.12,
  speedLines: 700,
  // ошибки умения бота s (как v1): доля «рассеянных» фаз (1−s)^randPow; ошибка момента ±(offBase + offSlope·(1−s)) тиков; запаздывание delaySlope·(1−s) тиков
  botRandPow: 4, botOffBase: 3, botOffSlope: 9, botDelaySlope: 8,
  botErrPress: 0.2, botErrRelease: 1, // множители ошибки момента на нажатие и на отпускание
  botBounceCost: 400,  // цена варенья в оценке прокрутки (как v1; 1500 по замеру ничего не меняет)
};
// пороги звёзд (метры) — по калибровке v2, см. calib()
let STARS = [0, 0];
// ----------------------------------------------------------------------------
const W = 320, H = 480, DT = 1 / 60, FLOOR = 462;
const START = { x: 80, bodyY: 300, boxX0: 40, boxX1: 120, boxTop: 330 };
const FIRST = { x0: 200, w: 180, h: 560 }; // первый домик: top −98; с коробки цель (358,7; −98), L 485,9
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const stage = document.getElementById("stage");
const hudEl = document.getElementById("hud");
const endEl = document.getElementById("end");
const QS = new URLSearchParams(location.search);
if (QS.has("sec")) TUNE.roundSec = Math.max(5, +QS.get("sec") || 60);
if (QS.has("angle")) TUNE.rayAngle = Math.max(20, Math.min(80, +QS.get("angle") || 55));
const rad = (d) => d * Math.PI / 180;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const star2 = () => STARS[0], star3 = () => STARS[1];
const BEST_KEY = "lab.best.hook-rnf-v2";

// Детерминированный генератор (mulberry32)
class Prng {
  constructor(seed) { this.s = seed >>> 0; }
  next() { let t = (this.s = (this.s + 0x6D2B79F5) >>> 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  clone() { const p = new Prng(0); p.s = this.s; return p; }
  gauss() { const u = Math.max(1e-9, this.next()), v = this.next(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * v); }
}

let S;            // всё состояние раунда
let SIM = false;  // идёт прокрутка планировщика бота (без эффектов, статистики и DOM)
let NOFX = false; // тихий прогон (калибровка): без эффектов и DOM, но со статистикой
const fx = () => !SIM && !NOFX;

// ---- Цель зацепа: точка на верхнем ребре крыши (v2.1) -----------------------------------
// Домик-кандидат: x1 − inset > x, x0 ≤ x + ropeMax, крыша выше центра на ≥ liftDy. Точка P — где луч rayAngle пересёк
// линию крыши, зажатая в ребро с отступом inset; годится, если |угол к P − rayAngle| ≤ aimCone и ropeMin ≤ |P − O| ≤ ropeMax.
function houseAim(b, x, y, tn) {
  const ins = TUNE.roofInset;
  if (!(b.x1 - ins > x) || b.x0 > x + TUNE.ropeMax) return null;
  const dy = y - b.top; if (dy < TUNE.liftDy) return null;
  const lo = Math.max(b.x0 + ins, x + 1), hi = b.x1 - ins;
  const px = Math.min(hi, Math.max(lo, x + dy / tn)), dx = px - x;
  const dev = Math.abs(Math.atan2(dy, dx) * 180 / Math.PI - TUNE.rayAngle), L = Math.hypot(dx, dy);
  if (dev > TUNE.aimCone || L < TUNE.ropeMin || L > TUNE.ropeMax) return null;
  return { x: px, y: b.top, dev, L, house: b.id };
}
// лучшая цель среди домиков list[i0…]: наименьший dev (округлённый до 1°), при равенстве — ближний; гистерезис по prevId
function aimIn(list, i0, x, y, prevId) {
  const tn = Math.tan(rad(TUNE.rayAngle));
  let best = null, bestR = 1e9, prev = null;
  for (let i = i0; i < list.length; i++) {
    const b = list[i]; if (b.x0 > x + TUNE.ropeMax) break;
    const c = houseAim(b, x, y, tn); if (!c) continue;
    if (c.house === prevId) prev = c;
    const r = Math.round(c.dev);
    if (r < bestR || (r === bestR && c.L < best.L)) { best = c; bestR = r; }
  }
  if (prev && prev !== best && prev.dev <= best.dev + TUNE.aimHyst) return prev;
  return best;
}
function firstIdx(bl, x) { // первый домик с x1 − inset > x
  let lo = 0, hi = bl.length; const xx = x + TUNE.roofInset;
  while (lo < hi) { const m = (lo + hi) >> 1; if (bl[m].x1 <= xx) lo = m + 1; else hi = m; }
  return lo;
}
function aimAt(x, y, prevId) { const bl = S.WD.bld; return aimIn(bl, firstIdx(bl, x), x, y, prevId); }
// цель Ома Нома сейчас (с гистерезисом); на верёвке цели нет
function updateTarget() {
  if (S.rope) { S.tgt = null; return; }
  const o = S.om, prev = S.tgt;
  const t = aimAt(o.x, o.y, prev ? prev.house : -1);
  if (t && (!prev || prev.house !== t.house) && fx()) S.tgtBlink = 0.1;
  if (t && (!prev || prev.house !== t.house)) S.tgtSwitch++;
  S.tgt = t;
}

// ---- Мир: домики улицы ---------------------------------------------------------
// Домик: x0, x1, top (крыша), h, col (цвет-ягода), v (вариант окон), g (промежуток перед ним).
// Мир общий для настоящего раунда и прокруток бота: растёт только вперёд и целиком зависит от seed.
const gapMaxAt = (d) => Math.min(TUNE.gapCap, TUNE.gapMax0 + TUNE.gapGrow * d);
const wMaxAt = (d) => Math.max(TUNE.wFloor, TUNE.wMax0 - TUNE.wShrink * d);
const hMinAt = (g) => Math.min(TUNE.hMax, TUNE.hMin0 + TUNE.hMinG * (g - TUNE.gapMin));
function mkHouse(id, x0, w, h, col, v, g) { return { id, x0, x1: x0 + w, top: FLOOR - h, h, col, v, g }; }
function newWorld(seed) {
  const WD = { seed, rng: new Prng((Math.imul(seed >>> 0, 2654435761) ^ 0x9E3779B9) >>> 0), bld: [], cand: [], auto: true,
    tries: 0, rerolls: 0, halves: 0, fails: 0 };
  const b = mkHouse(0, FIRST.x0, FIRST.w, FIRST.h, 0, 0, 0);
  WD.bld.push(b); houseCandies(WD, null, b);
  return WD;
}
// досягаемость нового домика B после A: скан x от A.x0 до B.x0 + 5 на высотах scanH над вареньем — цель везде.
// Шаг genScanStep 5 по сетке кратных 5 u (в спецификации 10: при 10 между узлами оставались «окна» шириной < 10 u без цели — 50 точек из 800 тыс. в проверке шагом 5)
function reachOK(A, B) {
  const list = [A, B], st = TUNE.genScanStep;
  for (let x = Math.floor(A.x0 / st) * st; x <= B.x0 + 5 + 1e-9; x += st)
    for (const hs of TUNE.scanH) if (!aimIn(list, 0, x, FLOOR - hs, -1)) return false;
  return true;
}
function genMore(WD, xTo) {
  if (!WD.auto) return;

    const A = WD.bld[WD.bld.length - 1], r = WD.rng, d0 = A.x1 + TUNE.gapMin;
    let g = 0, w = 0, h = 0, ok = false, B = null;
    for (let k = 0; k <= TUNE.genRetry && !ok; k++) { // первая попытка и до genRetry перебросов
      g = lerp(TUNE.gapMin, gapMaxAt(d0), r.next());
      w = lerp(TUNE.wMin, wMaxAt(A.x1 + g), r.next());
      h = lerp(hMinAt(g), TUNE.hMax, r.next());
      B = mkHouse(A.id + 1, A.x1 + g, w, h, 0, 0, g);
      ok = reachOK(A, B); WD.tries++; if (k > 0) WD.rerolls++;
    }
    for (let k = 0; k < 12 && !ok; k++) { // дальше промежуток к gapMin по половинам (h ≥ hMin(g) остаётся верным)
      g = (g + TUNE.gapMin) / 2; if (k === 11) g = TUNE.gapMin;
      w = Math.min(w, wMaxAt(A.x1 + g));

// конфеты: над промежутком ≥ 160 — «верхняя» посередине, на 120 выше крыши выше-стоящего соседа;

function houseCandies(WD, A, B) {
  if (A && B.g >= 160) addCand(WD, A.x1 + B.g / 2, Math.min(A.top, B.top) - 120);
  const cx = (B.x0 + B.x1) / 2, R = Math.min(380, B.h - 140);
  for (const th of [0, 35]) { const t = rad(th); addCand(WD, cx + R * Math.sin(t), B.top + R * Math.cos(t)); }
}
function addCand(WD, x, y) {
  y = Math.min(y, FLOOR - 100 - 20); // лапы над вареньем ≥ 100 u (лапы = рот + 20)
  const L = WD.cand;
  for (let i = L.length - 1; i >= 0 && i >= L.length - 14; i--) if (Math.hypot(L[i].x - x, L[i].y - y) < 50) return;
  L.push({ x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 });
}
// улица вместо генератора (dev, для проверок): houses [{x0, w, h}] (h над вареньем; можно top)
function setStreet(houses) {
  const WD = S.WD; WD.auto = false;
  WD.bld = houses.map((h, i) => mkHouse(i, h.x0, h.w, h.h != null ? h.h : FLOOR - h.top, i % 3, i % 3, 0));
  WD.cand = []; S.cand = []; S.ci = 0; S.tgt = null;
}

// ---- Новый раунд -------------------------------------------------------------------
function newRound(seed) {
  if (seed == null) seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
  seed = seed >>> 0;
  const y0 = START.bodyY;
  S = {
    seed, WD: newWorld(seed), scene: "ready", t: TUNE.roundSec, fin: 0, held: false,
    om: { x: START.x, y: y0, px: START.x, py: y0, face: 1, chew: 0, grounded: true },
    rope: null, shot: null, frags: [], pops: [], rings: [], cand: [], ci: 0,
    camX: 0, camBot: H, zoom: TUNE.zoomBase, maxX: START.x, candies: 0, combo: 0, bestCombo: 0, bounces: 0, misses: 0, sweet: 0,
    gapBounce: new Set(), sadT: 0, wideT: 0, steps: 0, phase: 0, phaseAt: 0, noPressUntil: 0,
    stars: 1, best: 0, hintT: 0, tutor: true, roundNo: (S ? S.roundNo + 1 : 0),
    tgt: null, tgtBlink: 0, tgtSwitch: 0, peak: null, peaks: [], playTicks: 0, ropeTicks: 0, vSum: 0, vxSum: 0, capTicks: 0,
  };
  S.camX = camTarget();
  ensureWorld();
  updateTarget();
  botReset();
  if (!NOFX) { endEl.style.display = "none"; updateHud(); }
}
function ensureWorld() {
  const o = S.om;
  genMore(S.WD, o.x + 2000);
  const L = S.WD.cand;
  while (S.ci < L.length && L[S.ci].x < o.x + 1300) { const c = L[S.ci++]; if (c.x > o.x - 500) S.cand.push({ x: c.x, y: c.y }); }
  if (S.steps % 30 === 0 && S.cand.length) { let j = 0; for (const c of S.cand) if (c.x > o.x - 600) S.cand[j++] = c; S.cand.length = j; }
}

// ---- Верёвка (вид): Верле, последний узел прибит к Ому Ному ---------------------
function P(x, y, w, vx = 0, vy = 0) { return { x, y, px: x - vx * DT, py: y - vy * DT, w }; }
function integrate(p, damp) {
  const vx = (p.x - p.px) * damp, vy = (p.y - p.py) * damp;
  p.px = p.x; p.py = p.y;
  p.x += vx; p.y += vy + TUNE.gravity * DT * DT;
}
function solve(a, b, rest) { // односторонне: тянет, не толкает
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  if (d <= rest || d === 0) return;
  const ia = a.w ? 1 / a.w : 0, ib = b.w ? 1 / b.w : 0, sum = ia + ib;
  if (!sum) return;
  const k = (d - rest) / d / sum;
  a.x += dx * k * ia; a.y += dy * k * ia;
  b.x -= dx * k * ib; b.y -= dy * k * ib;
}
function relax(nodes, rest) {
  for (let it = 0; it < TUNE.iterations; it++)
    for (let i = 1; i < nodes.length; i++) solve(nodes[i - 1], nodes[i], rest);
}
const vel = (o) => [(o.x - o.px) / DT, (o.y - o.py) / DT];
function setVel(o, vx, vy) { o.px = o.x - vx * DT; o.py = o.y - vy * DT; }

// ---- Действия игрока --------------------------------------------------------------
const userLocked = () => S.scene === "finale" || S.scene === "end";
function fire() {
  const o = S.om;
  const scoring = S.scene !== "end";
  if (o.grounded) { setVel(o, TUNE.jumpVx, TUNE.jumpVy); o.grounded = false; } // первое нажатие с коробки — ещё и прыжок
  updateTarget();
  const t = S.tgt;
  S.phase++; S.phaseAt = S.steps;
  if (t) { // верёвка ровно в подсвеченную точку, L = расстояние
    const ax = t.x, ay = t.y, L = Math.hypot(ax - o.x, ay - o.y);
    let [vx, vy] = vel(o);
    // «рывок паутины»: касательная скорость вперёд (вправо) не меньше swingMin
    const tx = -(ay - o.y) / L, ty = (ax - o.x) / L, vt = vx * tx + vy * ty;
    if (vt < TUNE.swingMin) { vx += (TUNE.swingMin - vt) * tx; vy += (TUNE.swingMin - vt) * ty; setVel(o, vx, vy); }
    let nodes = null, n = 1;
    if (fx()) {
      n = Math.max(4, Math.ceil(L / TUNE.linkLen)); nodes = [];
      for (let i = 0; i <= n; i++) { const k = i / n; nodes.push(P(ax + (o.x - ax) * k, ay + (o.y - ay) * k, (i === 0 || i === n) ? 0 : TUNE.nodeWeight, vx * k, vy * k)); }
    }
    peakDone();
    S.rope = { ax, ay, L, nodes, rest: L / n, shoot: 0, house: t.house };
    S.tgt = null; S.shot = null;
  } else {
    if (scoring) S.misses++;
    S.noPressUntil = S.steps + 7;
    const a = rad(TUNE.rayAngle);
    if (fx()) S.shot = { t: 0, dx: Math.cos(a), dy: -Math.sin(a) };
  }
}
function doHold() {
  S.held = true;
  if (S.scene === "ready") S.scene = "play";
  if (!S.rope) fire();
}
function doRelease() {
  const was = S.held; S.held = false;
  if (!S.rope) { if (was) { S.phase++; S.phaseAt = S.steps; } return; }
  const r = S.rope, o = S.om;
  let [vx, vy] = vel(o);
  const ang = Math.atan2(-vy, vx) * 180 / Math.PI;
  const sweet = vx > 0 && ang >= TUNE.sweetMin && ang <= TUNE.sweetMax;
  if (fx() && r.nodes) {
    // перекус: от верёвки остаётся обрывок на точке зацепа, он обмякает и тает
    const nodes = r.nodes.slice(0, -1);
    const end = P(o.x, o.y, TUNE.nodeWeight);
    end.px = o.x - (o.x - o.px) * 0.3; end.py = o.y - (o.y - o.py) * 0.3;
    for (let i = 1; i < nodes.length; i++) { const q = nodes[i]; q.px = q.x - (q.x - q.px) * 0.5; q.py = q.y - (q.y - q.py) * 0.5; }
    nodes.push(end);
    for (let i = 1; i < nodes.length; i++) nodes[i].w = TUNE.nodeWeight * 0.5;
    S.frags.push({ nodes, rest: r.rest, life: TUNE.fragFade });

  S.phase++; S.phaseAt = S.steps;

    // гарантированный взлёт: центр поднимется на sweetLift выше точки зацепа
    const depth = Math.max(0, o.y - r.ay), up = Math.sqrt(2 * TUNE.gravity * (depth + TUNE.sweetLift));
    if (vy > -up) vy = -up;
    S.sweet++; S.wideT = 0.25;
    if (!SIM && S.scene !== "end") S.peak = { ay: r.ay, minY: o.y };
    pop(o.x + 12, o.y - 80, "вжух", "#FFC93C");
    if (fx()) S.rings.push({ x: o.x, y: o.y, life: 0.45, max: 0.45 });
  }
  vx = clamp(vx, -TUNE.capVx, TUNE.capVx); vy = clamp(vy, -TUNE.capVy, TUNE.capVy);

}
function hold() { if (userLocked()) return; doHold(); }
function release() { if (userLocked()) return; doRelease(); }
function pop(x, y, txt, color) { if (fx()) S.pops.push({ x, y, txt, color, life: 0.8 }); }
// пик полёта после «вжух» над крышей своего зацепа; reached — полёт дошёл до верхней точки (не зацепился раньше и не шлёпнулся)
function peakDone(reached) { if (S.peak) { S.peaks.push({ h: S.peak.ay - S.peak.minY, reached: !!reached }); S.peak = null; } }

// ---- Шаг симуляции ------------------------------------------------------------------
const CAM_FF = (1 - TUNE.camLerp) / TUNE.camLerp; // опережение камеры, чтобы при постоянной скорости Ом Ном стоял на camAnchor ширины
function camTarget() {
  const o = S.om, vx = (o.x - o.px) / DT;
  return o.x + vx * DT * CAM_FF - TUNE.camAnchor * W / S.zoom;
}
// зум = clamp(min(zSpeed, zHeight), zoomMin, zoomBase); не хватает zoomMin — камера поднимается (низ кадра выше варенья)
function camStep(snap) {
  const o = S.om, sp = Math.hypot(o.x - o.px, o.y - o.py) / DT;
  const zS = lerp(TUNE.zoomBase, TUNE.zoomFast, clamp((sp - TUNE.zoomV0) / (TUNE.zoomV1 - TUNE.zoomV0), 0, 1));
  const needTop = o.y - SIZE.omTop - TUNE.camTopMargin;
  const zH = H / Math.max(1, H - needTop); // низ окна (y 480, варенье 462 у самого низа) … над головой ≥ camTopMargin
  const zt = clamp(Math.min(zS, zH), TUNE.zoomMin, TUNE.zoomBase);
  S.zoom = snap ? zt : S.zoom + (zt - S.zoom) * TUNE.zoomLerp;
  const visTop = H - H / S.zoom, bt = needTop < visTop ? needTop + H / S.zoom : H;
  S.camBot = snap ? bt : S.camBot + (bt - S.camBot) * TUNE.camYLerp;
  S.camX = snap ? camTarget() : S.camX + (camTarget() - S.camX) * TUNE.camLerp;
}
function step() {
  if (SIM) simControl(); else if (BOT.on) botTick();
  S.steps++;
  const o = S.om;
  if (S.scene === "play") {
    S.t -= DT;
    if (S.t <= 0) { S.t = 0; S.scene = "finale"; S.fin = TUNE.finaleSec; S.held = false; peakDone(); if (SIM) { S.scene = "end"; return; } }
  } else if (S.scene === "finale") {
    S.fin -= DT;
    autopilot();
    if (S.fin <= 0) { endRound(); if (SIM) return; }
  } else if (S.scene === "end") autopilot();
  const scoring = S.scene !== "end";
  const pmx = o.x, pmy = o.y + SIZE.mouthDy;

  if (!o.grounded) integrate(o, S.rope ? (o.x - o.px < 0 ? TUNE.backDrag : 1) : TUNE.airDrag);
  if (S.rope) {
    const r = S.rope;
    if (r.nodes) { // вид верёвки: узлы живут сами, последний — на Оме Номе
      r.shoot = Math.min(1, r.shoot + DT / TUNE.shootSec);
      for (let i = 1; i < r.nodes.length - 1; i++) integrate(r.nodes[i], 0.995);
    }
    const dx = o.x - r.ax, dy = o.y - r.ay, d = Math.hypot(dx, dy);
    if (d > r.L) { o.x = r.ax + dx / d * r.L; o.y = r.ay + dy / d * r.L; }
    if (r.nodes) { const l = r.nodes[r.nodes.length - 1]; l.x = o.x; l.y = o.y; l.px = o.x; l.py = o.y; relax(r.nodes, r.rest); }
  }
  // пределы скорости по осям
  { const cx = TUNE.capVx * DT, cy = TUNE.capVy * DT, vx = o.x - o.px, vy = o.y - o.py;
    if (vx > cx) o.px = o.x - cx; else if (vx < -cx) o.px = o.x + cx;
    if (vy > cy) o.py = o.y - cy; else if (vy < -cy) o.py = o.y + cy; }

  if (!o.grounded && o.y + SIZE.omFeet >= FLOOR) bounce(scoring);

  if (scoring && o.x > S.maxX) S.maxX = o.x;
  const vxs = o.x - o.px; if (Math.abs(vxs) > 0.3) o.face = Math.sign(vxs);

  // конфеты: съесть (по отрезку пути рта за тик) или слабо притянуть
  if (scoring) {
    const mx = o.x, my = o.y + SIZE.mouthDy, sx = mx - pmx, sy = my - pmy, s2 = sx * sx + sy * sy;

        S.lastKick = { from: sp, to: Math.hypot(o.x - o.px, o.y - o.py) / DT };
        pop(c.x, c.y - 30, S.combo > 1 ? "×" + S.combo : "+1", "#FFD23F");

    const vx = (o.x - o.px) / DT, vy = (o.y - o.py) / DT;

  if (S.wideT > 0) S.wideT -= DT;
  if (S.tgtBlink > 0) S.tgtBlink -= DT;

}
function bounce(scoring) {

  S.combo = 0; S.bounces++; S.sadT = 0.6; S.wideT = 0;
  if (!SIM) { // в какой промежуток упали (для статистики)
    const bl = S.WD.bld; let k = 0; while (k < bl.length && bl[k].x1 < o.x - 0.5) k++;
    S.gapBounce.add(k < bl.length && bl[k].x0 > o.x ? k : -1 - k);
  }
  pop(o.x, FLOOR - 130, "−" + String(TUNE.fallPenalty).replace(".", ",") + " с", "#F29B6B");

}
function tickFx() { // обрывки и всплывашки живут и после конца раунда — чтобы дотаять
  for (const f of S.frags) {
    f.life -= DT;
    for (let i = 1; i < f.nodes.length; i++) integrate(f.nodes[i], 0.99);
    relax(f.nodes, f.rest);
  }
  S.frags = S.frags.filter(f => f.life > 0);
  for (const p of S.pops) { p.life -= DT; p.y -= 50 * DT; }
  S.pops = S.pops.filter(p => p.life > 0);
  for (const r of S.rings) r.life -= DT;
  S.rings = S.rings.filter(r => r.life > 0);
  if (S.shot) { S.shot.t += DT; if (S.shot.t > TUNE.shootSec + TUNE.retractSec) S.shot = null; }
}
// финал и после него: Ом Ном сам цепляется (если цель есть) и висит, чтобы не застыть в воздухе
function autopilot() {
  if (S.rope) return;
  if (S.held) { doRelease(); return; }
  if (S.steps < S.noPressUntil) return;
  if (!S.om.grounded && S.tgt) doHold();
}
function starsFor(m) { return m >= star3() ? 3 : m >= star2() ? 2 : 1; }
const distM = () => Math.max(0, (S.maxX - START.x) / 40);
function endRound() {
  S.scene = "end"; S.held = false;
  if (SIM) return;
  peakDone();
  S.stars = starsFor(distM());
  if (NOFX) return;
  let best = 0;
  try { best = +localStorage.getItem(BEST_KEY) || 0; } catch (e) {}
  const m = Math.floor(distM());
  if (m > best && !BOT.on) { best = m; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }
  S.best = best;
  document.getElementById("endScore").textContent = m + " м";
  document.getElementById("endBest").textContent = "Рекорд: " + best + " м" + (BOT.on ? " (бот не пишет)" : "");
  document.getElementById("endStat").textContent = "конфет " + S.candies + " · «вжух» " + S.sweet + " · варенье " + S.bounces;
  document.getElementById("endGoals").textContent = "★★ от " + star2() + " м · ★★★ от " + star3() + " м";
  [...document.querySelectorAll("#endStars span")].forEach((s, i) => s.classList.toggle("on", i < S.stars));
  endEl.style.display = "flex";
  updateHud();
}
let hudTxt = "";
function updateHud() {
  const s = Math.ceil(S.t), mm = Math.floor(s / 60), ss = String(s % 60).padStart(2, "0");
  const m = distM(), st = starsFor(m), stars = "★".repeat(st) + "<i>" + "★".repeat(3 - st) + "</i>";
  const txt = "<b>" + Math.floor(m) + " м</b><span class=st>" + stars + "</span><small>🍬 " + S.candies + " · " + mm + ":" + ss + "</small>";
  if (txt !== hudTxt) { hudTxt = txt; hudEl.innerHTML = txt; }
}

// ---- Бот -----------------------------------------------------------------------------
// Умение s: 0 — жмёт и отпускает наугад; 1 — каждые 3 тика прокручивает варианты «когда нажать / отпустить»

  ctx.fillStyle = C.card; ctx.strokeStyle = C.ink; ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.roundRect(x, y, w, FLOOR - y + 12, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.card2; ctx.fillRect(x + 4, y + 22, w - 8, 6); ctx.fillStyle = C.cut;

function poseFrame() { // кадр Ома Нома по состоянию — чисто, без побочных эффектов

  if (S.wideT > 0) return "wide2";

  if (o.grounded) return "neutral";
  let near = 1e9;
  for (const c of S.cand) { const dx = c.x - o.x; if (dx > -60 && dx < 200) near = Math.min(near, Math.hypot(dx, c.y - o.y - SIZE.mouthDy)); }
  return near < 70 ? "wide" : "ajar";
}
let omFrame = "neutral"; const omGaze = {};
function drawOmNom(o) {
  let tgt = null, tgtD = 1e9;
  for (const c of S.cand) { const dx = c.x - o.x; if (dx > -20 && dx < 500) { const d = Math.hypot(dx, c.y - o.y); if (d < tgtD) { tgtD = d; tgt = c; } } }

  let tx, ty;
  if (tgt) { tx = tgt.x; ty = tgt.y; }
  else { const vx = (o.x - o.px) / DT, vy = (o.y - o.py) / DT; if (Math.hypot(vx, vy) > 20) { tx = o.x + vx * 0.3; ty = o.y + vy * 0.3; } }
  let tilt = 0;
  if (S.rope) tilt = Math.max(-0.5, Math.min(0.5, Math.atan2(o.x - S.rope.ax, S.rope.ay - o.y) * -0.6));
  OMS.draw(ctx, { frame: omFrame, mx: o.x, my: o.y + SIZE.mouthDy, fy: o.y + SIZE.omFeet, flip: o.face > 0, rot: tilt, piv: SIZE.omFeet,
    shadow: o.grounded, tx, ty }, omGaze);

// подсветка цели до нажатия (мир): пунктир к присоске на ребре крыши; цели нет — короткий серый луч 55°
function drawAim() {
  const o = S.om, t = S.tgt;
  ctx.lineCap = "round"; ctx.lineWidth = 4.5;
  if (t) {
    ctx.setLineDash([14, 14]); ctx.strokeStyle = "rgba(255,201,60,.5)";
    ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(t.x, t.y); ctx.stroke(); ctx.setLineDash([]);
    const bl = S.tgtBlink > 0;
    if (bl) { ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(t.x, t.y, 26, 0, 7); ctx.fill(); }
    drawCup(t.x, t.y, 1, bl ? 15 : 12);
  } else {
    const a = rad(TUNE.rayAngle), L = TUNE.missRay;
    ctx.setLineDash([12, 12]); ctx.strokeStyle = "rgba(74,37,18,.42)";
    ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x + Math.cos(a) * L, o.y - Math.sin(a) * L); ctx.stroke(); ctx.setLineDash([]);
  }
}
// цель за краем кадра: присоска у края со стрелкой (окно)
function drawAimEdge() {
  const t = S.tgt; if (!t) return;
  const p = toScreen(t.x, t.y), m = 14;
  if (p.x >= m && p.x <= W - m && p.y >= m && p.y <= H - m) return;
  const o = toScreen(S.om.x, S.om.y);
  const cx = clamp(p.x, m, W - m), cy = clamp(p.y, m, H - m), a = Math.atan2(p.y - o.y, p.x - o.x);
  drawCup(cx, cy, 1, 8);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
  ctx.fillStyle = C.gold; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(8, -6); ctx.lineTo(8, 6); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function hintText(label, x, y) {
  ctx.textAlign = "center"; ctx.font = "28px sans-serif"; ctx.fillText("👆", x, y);
  ctx.font = "900 13px Nunito, ui-rounded, system-ui, sans-serif"; ctx.lineJoin = "round"; ctx.lineWidth = 4; ctx.strokeStyle = C.ink; ctx.strokeText(label, x, y + 17);
  ctx.fillStyle = "#FBEBD0"; ctx.fillText(label, x, y + 17);
}
function drawHand() { // рука-подсказка первого раунда (окно)
  if (S.roundNo > 0 || S.sweet >= 2 || S.scene === "end" || S.scene === "finale" || BOT.on || !S.tutor) return;
  const o = S.om, p = toScreen(o.x, o.y); let label = null, k = 0;
  if (!S.rope) { if (o.grounded || S.tgt) { label = "жми"; k = 0.5 + 0.5 * Math.sin(S.hintT * 8); } }
  else { const vx = (o.x - o.px) / DT, vy = (o.y - o.py) / DT, a = Math.atan2(-vy, vx) * 180 / Math.PI; if (vx > 0 && a > 18 && a < 68) { label = "подними палец"; k = 1; } }
  if (!label) return;

function draw() {
  fit();

  ctx.setTransform(k, 0, 0, k, 0, 0);
  drawBackdrop();
  // мир: масштаб zoom, камера по x (camX) и по низу окна (camBot)
  ctx.setTransform(k * z, 0, 0, k * z, -S.camX * z * k, (H - S.camBot * z) * k);

  const aimOn = S.scene !== "end" && S.scene !== "finale" && !S.rope;
  const litId = aimOn && S.tgt ? S.tgt.house : -1;
  for (let i = firstIdx(bl, xa - 40); i < bl.length; i++) { const b = bl[i]; if (b.x0 > xb) break; if (b.x1 < xa) continue; drawHouse(b, b.id === litId); }
  if (aimOn) drawAim();
  if (S.rope && S.rope.shoot >= 1) drawCup(S.rope.ax, S.rope.ay);
  drawCrate();

  for (const f of S.frags) drawRope(f.nodes, Math.max(0, f.life / TUNE.fragFade), SIZE.rope * 0.8);
  if (S.rope) {
    const r = S.rope;
    if (r.shoot < 1 || !r.nodes) drawRope([{ x: o.x, y: o.y }, { x: o.x + (r.ax - o.x) * r.shoot, y: o.y + (r.ay - o.y) * r.shoot }], 1, SIZE.rope);
    else drawRope(r.nodes, 1, SIZE.rope);
    if (r.shoot < 1) drawCup(o.x + (r.ax - o.x) * r.shoot, o.y + (r.ay - o.y) * r.shoot);

  drawJam();

    else { ctx.strokeStyle = C.gold; ctx.lineWidth = 9 - q * 5; ctx.beginPath(); ctx.arc(r.x, r.y, 34 + q * 90, 0, 7); ctx.stroke(); ctx.strokeStyle = C.ink; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.arc(r.x, r.y, 40 + q * 90, 0, 7); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }

  if (aimOn) drawAimEdge();
  drawHand();
  ctx.textAlign = "center"; ctx.font = "900 17px Nunito, ui-rounded, system-ui, sans-serif"; ctx.lineJoin = "round";
  for (const p of S.pops) {
    const q = toScreen(p.x, p.y);
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.strokeText(p.txt, q.x, q.y);
    ctx.fillStyle = p.color; ctx.fillText(p.txt, q.x, q.y);

// ---- Цикл: фиксированный шаг 1/60 ---------------------------------------------------------------
let manual = false, acc = 0, lastT = 0;
const frameTimes = [];
function frame(now) {
  requestAnimationFrame(frame);
  if (lastT) {
    frameTimes.push(now - lastT); if (frameTimes.length > 120) frameTimes.shift();
    if (!manual) {
      acc += Math.min(0.05, (now - lastT) / 1000);
      let n = 0;
      while (acc >= DT && n < 3) { step(); acc -= DT; n++; }
      if (n === 3) acc = 0;

  lastT = now;
  draw(); updateHud();
}

// ---- Ввод ---------------------------------------------------------------------------------------------
const downs = new Set();
cv.addEventListener("pointerdown", e => {
  e.preventDefault(); if (BOT.on) return;
  downs.add(e.pointerId); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  hold();
});
function up(e) { if (!downs.delete(e.pointerId)) return; if (!downs.size) release(); }
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
window.addEventListener("blur", () => { downs.clear(); if (S.held && !BOT.on) release(); });
window.addEventListener("keydown", e => { if (e.code === "Space" && !e.repeat && !BOT.on) { e.preventDefault(); hold(); } });
window.addEventListener("keyup", e => { if (e.code === "Space" && !BOT.on) release(); });
cv.addEventListener("contextmenu", e => e.preventDefault());
document.getElementById("restart").addEventListener("click", () => newRound());
document.getElementById("again").addEventListener("click", () => newRound());
const botBtn = document.getElementById("botBtn");
botBtn.addEventListener("click", () => {
  const cur = !BOT.on ? 0 : BOT.mode === "naive" ? 4 : BOT.mode === "lazy" ? 5 : BOT.skill === 0 ? 1 : BOT.skill === 0.5 ? 2 : 3;
  const nx = BOT_MODES[(cur + 1) % BOT_MODES.length]; setBot(nx.label === "выкл" ? null : nx); newRound();
});
new ResizeObserver(() => draw()).observe(stage);
window.addEventListener("orientationchange", () => draw());

// ---- Тестовый API -----------------------------------------------------------------------------------------
window.__game = {
  ready: false,
  getState() {
    const o = S.om, vx = (o.x - o.px) / DT, vy = (o.y - o.py) / DT, t = S.tgt;
    const near = []; for (const b of S.WD.bld) if (b.x1 > S.camX - 100 && b.x0 < S.camX + W / S.zoom + 100) near.push({ x0: b.x0, x1: b.x1, top: b.top, h: b.h });
    return {
      scene: S.scene, seed: S.seed, t: S.t, held: S.held, steps: S.steps,
      om: { x: o.x, y: o.y, vx, vy, frame: poseFrame(), grounded: o.grounded },
      dist: distM(), maxX: S.maxX, speed: Math.hypot(vx, vy),
      rope: S.rope ? { ax: S.rope.ax, ay: S.rope.ay, L: S.rope.L, house: S.rope.house } : null,
      target: t ? { x: t.x, y: t.y, dev: t.dev, L: t.L, house: t.house } : null, tgtBlink: S.tgtBlink, tgtSwitch: S.tgtSwitch,
      candies: S.candies, combo: S.combo, bounces: S.bounces, misses: S.misses, sweet: S.sweet,
      stars: S.scene === "end" ? S.stars : starsFor(distM()), star2: star2(), star3: star3(),
      camX: S.camX, camY: S.camBot - H, zoom: S.zoom,
      ropeShare: S.playTicks ? S.ropeTicks / S.playTicks : 0, vMean: S.playTicks ? S.vSum / S.playTicks : 0, peaks: S.peaks.slice(-20),
      view: (() => { const r = cv.getBoundingClientRect(); return { left: r.left, top: r.top, width: r.width, height: r.height, scale: r.width / W }; })(),
      bot: { on: BOT.on, mode: BOT.mode, skill: BOT.skill, plans: BOT.plans },
      houses: near, candiesNear: S.cand.length, candyList: S.cand.slice(0, 16).map(c => ({ x: c.x, y: c.y })), gapBounces: S.gapBounce.size, best: S.best,
      gen: { houses: S.WD.bld.length, tries: S.WD.tries, rerolls: S.WD.rerolls, halves: S.WD.halves, fails: S.WD.fails },
      kick: S.lastKick || null, pops: S.pops.map(p => p.txt), sadT: S.sadT, wideT: S.wideT, shot: !!S.shot, ropeShoot: S.rope ? S.rope.shoot : null,

  },
  act(a, p) {

    else if (a === "release") { if (!BOT.on) release(); }
    else if (a === "restart") newRound(p && p.seed != null ? p.seed : undefined);
    else if (a === "clock") { manual = !!(p && p.manual); }
    else if (a === "step") { for (let i = 0; i < (p || 1); i++) step(); }

// проверка генератора: g, w, h в пределах v2.3; скан x шагом 5 u на высотах scanH над вареньем — цель везде
function genCheck(n, xMax) {
  const sS = S, sNO = NOFX, bad = [];
  const res = { seeds: n, xMax, houses: 0, gapMin: 1e9, gapMax: 0, wMin: 1e9, wMax: 0, hMin: 1e9, hMax: 0, scanPoints: 0, scanMiss: 0, tries: 0, rerolls: 0, halves: 0, fails: 0, bad };

      res.tries += WD.tries; res.rerolls += WD.rerolls; res.halves += WD.halves; res.fails += WD.fails;

}
STARS = [890, 1140]; // по calib{n:30} на seed 1…30 и 101…130 (60 раундов): ★★ = 0,9 × медиана бота 0,5, ★★★ = 0,95 × медиана бота 0,75, до 10 м
newRound(QS.has("seed") ? +QS.get("seed") : undefined);
if (QS.has("bot")) { const b = QS.get("bot"); setBot(b === "naive" ? { naive: true } : b === "lazy" ? { lazy: true } : { skill: +b }); newRound(S.seed); }
draw();
OMS.loaded.then(() => { window.__game.ready = true; });
