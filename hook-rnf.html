  </div></div>

<script>
"use strict";
// ---- Ом Ном кадрами приложения (D-40, не рисунок кодом) ---------------------------
// Кадры лежат в assets/omnom/ — одна папка на все прототипы; новую версию Ома Нома копируем поверх теми же именами.
// Числа — из assets/omnom/omnom_frames.json: 6,4024 px на u, лапы = pivot, рот (кадр wide); зрачки — два слоя (левый и правый глаз), каждый ходит в эллипсе своего глаза (pupils.<кадр>.eyes).
// В файлах Ом Ном смотрит ВЛЕВО от зрителя; flip = смотрит вправо. Кадр: p.mx, p.my — точка рта в игре (u), p.fy — лапы (по умолчанию рот + 20).
const OMS = (() => {
  const PX = 6.4024, PIV = [0.5366, 0.0253], MOUTH = [-2.08, -19.98];
  // Зрачки — по слою на глаз. Для каждого: rest — центр зрачка в покое, c и r — эллипс хода центра зрачка (u от лап, оси кадра до зеркала).
  // Сдвиг взгляда d одинаков для обоих глаз, но центр каждого зрачка потом зажимается в эллипс СВОЕГО глаза: зрачок не выходит из белка и не переходит шов.
  const PUP = {
    neutral: { l: { rest: [-13.93, -44.86], c: [-16.67, -45.33], r: [3.91, 3.98] },
             r: { rest: [-0.81, -42.67], c: [2.23, -42.67], r: [6.22, 6.39] } },
    ajar:   { l: { rest: [-13.7, -47.75], c: [-15.42, -48.29], r: [2.61, 2.51] },
             r: { rest: [-1.6, -45.33], c: [1.92, -42.83], r: [6.06, 6.01] } },
    wide:   { l: { rest: [-13.39, -51.18], c: [-14.79, -51.42], r: [1.98, 1.54] },
             r: { rest: [-1.13, -48.76], c: [0.98, -45.95], r: [5.73, 5.06] } },
    wide2:  { l: { rest: [-13.93, -52.28], c: [-14.95, -52.67], r: [1.64, 1.31] },
             r: { rest: [-1.52, -49.54], c: [0.83, -46.58], r: [5.85, 5.25] } },
  };
  const LOOK = 7; // u: длина полного взгляда, больше любого радиуса хода — на краю эллипса зрачок упирается в границу
  const NAMES = ["neutral", "ajar", "wide", "wide2", "chew", "chew2", "sad", "joy", "blink", "half", "shadow"];
  for (const f in PUP) NAMES.push(f + "_pupils_l", f + "_pupils_r");
  const img = {};
  const waits = [];
  for (const n of NAMES) {
    const i = new Image(); img[n] = i;
    waits.push(new Promise((res) => { i.onload = i.onerror = res; }));
    i.src = "assets/omnom/" + n + ".png";
  }
  const ok = (i) => i && i.complete && i.naturalWidth > 0;
  // центр зрачка: покой + сдвиг (dx, dy), затем в эллипс хода своего глаза: q = (p - c) / r; |q| > 1 -> p = c + q/|q| * r
  function eyePos(e, dx, dy) {
    let px = e.rest[0] + dx, py = e.rest[1] + dy;
    const qx = (px - e.c[0]) / e.r[0], qy = (py - e.c[1]) / e.r[1], ql = Math.hypot(qx, qy);
    if (ql > 1) { px = e.c[0] + qx / ql * e.r[0]; py = e.c[1] + qy / ql * e.r[1]; }
    return [px, py];
  }
  // p: { frame, mx, my, fy?, flip?, tx?, ty?, rot?, piv?, shadow?, alpha? }; st — объект вызывающего: плавный взгляд
  const last = { frame: null, l: null, r: null, d: null };
  function draw(ctx, p, st) {
    let f = p.frame || "neutral";
    if (f === "neutral" && (performance.now() + (p.blinkOff || 0)) % 3600 < 120) f = "blink";
    const base = img[f]; if (!ok(base)) return;
    const flip = p.flip ? -1 : 1, fx = p.mx - flip * MOUTH[0], fy = p.fy != null ? p.fy : p.my - MOUTH[1];
    const pw = base.naturalWidth, ph = base.naturalHeight, k = 1 / PX;
    ctx.save();
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    if (p.alpha != null) ctx.globalAlpha = p.alpha;
    if (p.shadow && ok(img.shadow)) ctx.drawImage(img.shadow, fx - 32, fy - 6, 64, 12);
    ctx.translate(fx, p.piv ? fy - p.piv : fy); if (p.rot) ctx.rotate(p.rot); if (p.piv) ctx.translate(0, p.piv);
    ctx.scale(flip * k, k);
    ctx.drawImage(base, -PIV[0] * pw, -(1 - PIV[1]) * ph);
    const pu = PUP[f], pl = img[f + "_pupils_l"], pr = img[f + "_pupils_r"];
    if (pu && ok(pl) && ok(pr)) {
      let gx = 0, gy = 0;
      if (p.tx != null) { // цель в системе кадра до зеркала; общий сдвиг взгляда, потом зажим по каждому глазу
        const pv = p.piv || 0;
        let dx = p.tx - fx, dy = p.ty - (fy - pv);
        if (p.rot) { const c = Math.cos(-p.rot), sn = Math.sin(-p.rot), qx = dx * c - dy * sn, qy = dx * sn + dy * c; dx = qx; dy = qy; }
        dy -= pv; dx *= flip;
        const ex = (pu.l.rest[0] + pu.r.rest[0]) / 2, ey = (pu.l.rest[1] + pu.r.rest[1]) / 2; // между глазами
        const vx = dx - ex, vy = dy - ey, L = Math.hypot(vx, vy) || 1, a = Math.min(1, L / 45);
        gx = vx / L * a * LOOK; gy = vy / L * a * LOOK;
      }
      if (st) { st.x = st.x == null ? gx : st.x + (gx - st.x) * 0.35; st.y = st.y == null ? gy : st.y + (gy - st.y) * 0.35; gx = st.x; gy = st.y; }
      const pL = eyePos(pu.l, gx, gy), pR = eyePos(pu.r, gx, gy);
      ctx.drawImage(pl, -PIV[0] * pw + (pL[0] - pu.l.rest[0]) * PX, -(1 - PIV[1]) * ph + (pL[1] - pu.l.rest[1]) * PX);
      ctx.drawImage(pr, -PIV[0] * pw + (pR[0] - pu.r.rest[0]) * PX, -(1 - PIV[1]) * ph + (pR[1] - pu.r.rest[1]) * PX);
      last.frame = f; last.l = pL; last.r = pR; last.d = [gx, gy];
    }
    ctx.restore();
  }
  return { draw, img, PUP, eyePos, last, loaded: Promise.all(waits), ready: () => NAMES.every((n) => ok(img[n])) };
})();
// ---- Главные числа: крутить здесь -------------------------------------------
// Поле 320×480 u. Ягодная улица: домики — задний план (места для зацепа), пол — пружинящее варенье.
const SIZE = {
  omH: 72,        // Ом Ном от лап до усика, u
  omR: 30,        // полуширина тела
  omFeet: 30,     // от центра тела до лап
  omTop: 36,      // от центра тела до макушки (верх кадра)
  mouthDy: 10,    // рот ниже центра тела
  candyR: 17,     // конфета Ø 34 u
  rope: 4,        // толщина верёвки
};
const TUNE = {
  gravity: 784, iterations: 25, linkLen: 12, nodeWeight: 0.02, // верёвка — Верле как в hook (только вид)
  rayAngle: 55,        // ° вверх-вправо (?angle=)
  rayMax: 360,         // u, длина верёвки/луча
  ropeMin: 40,         // u, ближе не цепляем — берём следующее пересечение
  sweetBoost: 1.12,    // «вжух»: множитель скорости
  sweetMin: 15, sweetMax: 60, // ° к горизонту вправо-вверх
  candyKick: 25,       // u/с вдоль движения за конфету
  bounceUp: 560, bounceVx: 140, fallPenalty: 2, // варенье
  maxSpeed: 700, airDrag: 0.999,
  jumpVx: 220, jumpVy: -120, // первое нажатие с коробки
  eatDist: 34, magnet: 140, magnetZone: 17, // как hook
  roundSec: 60, finaleSec: 1.2, fragFade: 1.2, shootSec: 0.07, retractSec: 0.15,
  // улица
  gapMin: 25, gapMax0: 50, gapGrow: 0.003, gapCap: 115,
  wMin: 90, wMax0: 200, wShrink: 0.002, wFloor: 130,
  topMin: 90, topCap: 290, safeY: 300,
  // камера
  camAnchor: 0.25, camLerp: 0.12, zoomMin: 0.82, zoomV0: 300, zoomV1: 650, zoomLerp: 0.05,
  // ошибки умения бота s (как в hook): доля «рассеянных» фаз (1−s)^randPow; ошибка момента ±(offBase + offSlope·(1−s)) тиков; запаздывание delaySlope·(1−s) тиков
  botRandPow: 4, botOffBase: 3, botOffSlope: 9, botDelaySlope: 8,
  // отличие от hook: поздний «хлоп» по варенью здесь стоит дорого (зацеп не достаёт ниже крыш), поэтому ошибка момента на нажатие ×0,2, на отпускание ×1
  botErrPress: 0.2, botErrRelease: 1,
  botAimNoise: 1,      // множитель ошибки прицела пальцем (σ 20/10/5 u)
};
// пороги звёзд по режимам (метры) — выставлены по замеру ботов, см. отчёт и calib()
const STARS = { angle: [0, 0], finger: [0, 0] };
// ----------------------------------------------------------------------------
const W = 320, H = 480, DT = 1 / 60, FLOOR = 462;
const START = { x: 80, bodyY: 300, boxX0: 40, boxX1: 120, boxTop: 330 };
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const stage = document.getElementById("stage");
const hudEl = document.getElementById("hud");
const endEl = document.getElementById("end");
const rulesEl = document.getElementById("rules");
const QS = new URLSearchParams(location.search);
if (QS.has("sec")) TUNE.roundSec = Math.max(5, +QS.get("sec") || 60);
if (QS.has("angle")) TUNE.rayAngle = Math.max(20, Math.min(80, +QS.get("angle") || 55));
let AIM = (QS.get("aim") === "finger" || QS.get("aim") === "tap") ? "finger" : "angle";
const rad = (d) => d * Math.PI / 180;
const lerp = (a, b, t) => a + (b - a) * t;
const star2 = () => STARS[AIM][0], star3 = () => STARS[AIM][1];

// Детерминированный генератор (mulberry32)
class Prng {
  constructor(seed) { this.s = seed >>> 0; }
  next() { let t = (this.s = (this.s + 0x6D2B79F5) >>> 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  clone() { const p = new Prng(0); p.s = this.s; return p; }
  gauss() { const u = Math.max(1e-9, this.next()), v = this.next(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * v); }
}

let S;            // всё состояние раунда
let SIM = false;  // идёт прокрутка планировщика бота (без эффектов, статистики и DOM)
let NOFX = false; // тихий прогон (калибровка): без эффектов и DOM, но со статистикой
const fx = () => !SIM && !NOFX;

// ---- Мир: домики улицы ---------------------------------------------------------
// Домик: x0, x1, top (крыша), col (цвет-ягода), v (вариант окон). Низ — варенье (FLOOR).
// Мир общий для настоящего раунда и прокруток бота: растёт только вперёд и целиком зависит от seed.
const gapMaxAt = (d) => Math.min(TUNE.gapCap, TUNE.gapMax0 + TUNE.gapGrow * d);
const wMaxAt = (d) => Math.max(TUNE.wFloor, TUNE.wMax0 - TUNE.wShrink * d);
const topMaxAt = (g) => Math.max(TUNE.topMin, Math.min(TUNE.topCap, TUNE.safeY - 46 - 1.43 * g));
function newWorld(seed) {
  const WD = { seed, rng: new Prng((Math.imul(seed >>> 0, 2654435761) ^ 0x9E3779B9) >>> 0), bld: [], cand: [], genX: 320, auto: true, n: 0 };
  WD.bld.push({ id: 0, x0: 160, x1: 320, top: 100, col: 0, v: 0, g: 0 });
  return WD;
}
function genMore(WD, xTo) {
  if (!WD.auto) return;
  while (WD.genX < xTo) {
    const last = WD.bld[WD.bld.length - 1], r = WD.rng;
    const g = lerp(TUNE.gapMin, gapMaxAt(last.x1 + TUNE.gapMin), r.next()); // d = левый край домика ≥ last.x1 + gapMin: gapMax(d) только растёт
    const x0 = last.x1 + g;
    const w = lerp(TUNE.wMin, wMaxAt(x0), r.next());
    const top = Math.round(lerp(TUNE.topMin, topMaxAt(g), r.next()));
    const b = { id: last.id + 1, x0, x1: x0 + w, top, col: (last.col + 1 + Math.floor(r.next() * 2)) % 3, v: Math.floor(r.next() * 3), g }; // соседние домики разного цвета
    WD.bld.push(b);
    // конфеты: 2 на дуге «хорошего маха» перед домиком, 1 над широким промежутком
    for (const th of [20, 45]) {
      const t = rad(th);
      addCand(WD, b.x0 - 180 * Math.sin(t), b.top + 40 + 180 * Math.cos(t));
    }
    if (g >= 60) addCand(WD, last.x1 + g / 2, b.top + 60);
    WD.genX = b.x1;
  }
}
function addCand(WD, x, y) {
  y = Math.min(y, FLOOR - 60 - 20); // лапы над вареньем ≥ 60 u (лапы = рот + 20)
  const L = WD.cand;
  for (let i = L.length - 1; i >= 0 && i >= L.length - 14; i--) if (Math.hypot(L[i].x - x, L[i].y - y) < 44) return;
  L.push({ x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 });
}
// улица вместо генератора (dev, для проверок)
function setStreet(houses) {
  const WD = S.WD; WD.auto = false;
  WD.bld = houses.map((h, i) => ({ id: i, x0: h.x0, x1: h.x0 + h.w, top: h.top, col: i % 3, v: i % 3, g: 0 }));
  WD.cand = []; S.cand = []; S.ci = 0;
}

// ---- Луч и зацеп -----------------------------------------------------------------
// Первое пересечение луча с контуром домика на расстоянии ropeMin…maxT: вход в левую стену/крышу;
// если Ом Ном перед домиком — выход через крышу или правую стену; ближе ropeMin — следующее пересечение.
const RAY = { hit: false, t: 0, x: 0, y: 0, b: null };
function castRay(ox, oy, dx, dy, maxT) {
  RAY.hit = false; RAY.b = null;
  if (dy > 1e-9) return RAY; // вниз не цепляем
  const bl = S.WD.bld, xe = ox + dx * maxT, xa = Math.min(ox, xe), xb = Math.max(ox, xe);
  let lo = 0, hi = bl.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (bl[m].x1 < xa) lo = m + 1; else hi = m; }
  let best = 1e9, bb = null;
  const ymax = FLOOR + 40;
  for (let i = lo; i < bl.length; i++) {
    const b = bl[i]; if (b.x0 > xb) break;
    let tin = -1e9, tout = 1e9;
    if (dx > 1e-9 || dx < -1e-9) {
      let a = (b.x0 - ox) / dx, c = (b.x1 - ox) / dx; if (a > c) { const q = a; a = c; c = q; }
      if (a > tin) tin = a; if (c < tout) tout = c;
    } else if (ox < b.x0 || ox > b.x1) continue;
    if (dy < -1e-9) {
      let a = (b.top - oy) / dy, c = (ymax - oy) / dy; if (a > c) { const q = a; a = c; c = q; }
      if (a > tin) tin = a; if (c < tout) tout = c;
    } else if (oy < b.top || oy > ymax) continue;
    if (tout < tin || tout < TUNE.ropeMin) continue;
    const t = tin >= TUNE.ropeMin ? tin : tout;
    if (t > maxT || t >= best) continue;
    if (oy + dy * t > FLOOR - 4) continue; // под вареньем не цепляем
    best = t; bb = b;
  }
  if (bb) { RAY.hit = true; RAY.t = best; RAY.x = ox + dx * best; RAY.y = oy + dy * best; RAY.b = bb; }
  return RAY;
}
function aimDir() { const a = rad(TUNE.rayAngle); return { dx: Math.cos(a), dy: -Math.sin(a) }; }
// направление к точке касания; ниже Ома Нома — «промах» (dy > 0)
function dirTo(px, py) {
  const o = S.om; let dx = px - o.x, dy = py - o.y; const L = Math.hypot(dx, dy);
  if (L < 3) return { dx: 0, dy: -1, below: false };
  return { dx: dx / L, dy: dy / L, below: dy > 0.001 };
}

// ---- Новый раунд -------------------------------------------------------------------
function newRound(seed) {
  if (seed == null) seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
  seed = seed >>> 0;
  const y0 = START.bodyY;
  S = {
    seed, WD: newWorld(seed), scene: "ready", t: TUNE.roundSec, fin: 0, held: false,

// ---- Верёвка (вид): Верле, последний узел прибит к Ому Ному ---------------------

function solve(a, b, rest) { // односторонне: тянет, не толкает

// ---- Действия игрока --------------------------------------------------------------
const userLocked = () => S.scene === "finale" || S.scene === "end";

// ---- Бот -----------------------------------------------------------------------------
// Умение s: 0 — жмёт и отпускает наугад; 1 — каждые 3 тика прокручивает варианты «когда нажать / отпустить»
// (k = 0…48 тиков шагом 2 или «не сейчас») на 120 тиков вперёд той же физикой и берёт лучший; дальше в прокрутке — правило наивного.
// Ошибки: доля «рассеянных» фаз (1−s)², ошибка момента ±(3 + 9·(1−s)) тиков и запаздывание 8·(1−s) тиков (как в hook).
// Режим «пальцем»: цель — (x0+10; top+15) ближайшего домика впереди, ошибка гаусс σ 20/10/5 u для умения 0/0,5/1.
const BOT = { on: false, mode: "plan", skill: 1, rng: new Prng(1), phase: -1, random: false, off: 0, randAt: 0, target: -1, lastPlan: -99, plans: 0, pend: null };
const PLAN_K = []; for (let k = 0; k <= 48; k += 2) PLAN_K.push(k); PLAN_K.push(999);
const PLAN_H = 120, PLAN_EVERY = 3;
function botReset() {
  BOT.rng = new Prng((S.seed * 2654435761 + Math.round(BOT.skill * 1000) * 97 + (BOT.mode === "naive" ? 5 : BOT.mode === "lazy" ? 9 : 13)) >>> 0);
  BOT.phase = -1; BOT.target = -1; BOT.pend = null; BOT.lastPlan = -99;
}
const sigmaFor = (s) => s <= 0.5 ? 20 - 20 * s : 10 - 10 * (s - 0.5);
// цель пальца: ближайший домик впереди, до точки ≤ rayMax и выше Ома Нома на ≥ 40 u
function fingerTarget(noisy) {

  for (let i = 0; i < bl.length; i++) {
    const b = bl[i]; if (b.x1 < o.x) continue; if (b.x0 > o.x + TUNE.rayMax) break;
    const tx = b.x0 + 10, ty = b.top + 15; if (tx <= o.x) continue;

  }
  if (!best) return null;
  if (noisy) { const sg = sigmaFor(BOT.skill) * TUNE.botAimNoise; best.x += BOT.rng.gauss() * sg; best.y += BOT.rng.gauss() * sg; }
  return best;
}
// зацеп будет, если нажать сейчас (для правила наивного)
function wouldHit() {
  const o = S.om;

  const d = aimDir(); return castRay(o.x, o.y, d.dx, d.dy, TUNE.rayMax).hit;
}
function pressNow(noisy) { // нажать как бот

}
// правило наивного: нажать, когда падает и зацеп будет; отпустить, когда скорость вправо-вверх > 20° (и не раньше чем через 6 тиков)
function naiveWant() {

  if (S.shot) { // промах: верёвка летит на rayMax и втягивается
    const sh = S.shot, p = sh.t < TUNE.shootSec ? sh.t / TUNE.shootSec : 1 - (sh.t - TUNE.shootSec) / TUNE.retractSec;
    const L = TUNE.rayMax * Math.max(0, p);
    drawRope([{ x: o.x, y: o.y }, { x: o.x + sh.dx * L, y: o.y + sh.dy * L }], 1, SIZE.rope);
  }
  drawOmNom(o);
  drawJam();
  for (const r of S.rings) { // кольцо «вжух» / шлёп варенья
    const k = 1 - r.life / r.max;
    ctx.globalAlpha = Math.max(0, r.life / r.max);
    if (r.tap) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(r.x, r.y, 8 + k * 16, 0, 7); ctx.stroke(); ctx.strokeStyle = C.ink; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(r.x, r.y, 11 + k * 16, 0, 7); ctx.stroke(); }
    else if (r.jam) { ctx.fillStyle = C.jam; for (let i = 0; i < 7; i++) { const a = -0.3 - i * 0.37, d = 8 + k * 38; ctx.beginPath(); ctx.arc(r.x + Math.cos(a - 1.3) * d * 1.3, r.y + Math.sin(a - 1.3) * d * 1.6 - k * 10, 4 - k * 2, 0, 7); ctx.fill(); } }
    else { ctx.strokeStyle = C.gold; ctx.lineWidth = 5 - k * 3; ctx.beginPath(); ctx.arc(r.x, r.y, 20 + k * 52, 0, 7); ctx.stroke(); ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(r.x, r.y, 24 + k * 52, 0, 7); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  drawHand();
  ctx.textAlign = "center"; ctx.font = "900 17px Nunito, ui-rounded, system-ui, sans-serif"; ctx.lineJoin = "round";
  for (const p of S.pops) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.strokeText(p.txt, p.x, p.y);
    ctx.fillStyle = p.color; ctx.fillText(p.txt, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  // линии скорости (экран)
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  const sp = Math.hypot(o.x - o.px, o.y - o.py) / DT;
  if (sp > 450) {
    const a = Math.min(0.55, (sp - 450) / 450), f = Math.floor(S.steps / 2);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.globalAlpha = a;
    for (let i = 0; i < 9; i++) { const y = 30 + hash(i * 31 + f) * 380, x = 20 + hash(i * 17 + f * 3) * 300, l = 24 + hash(i * 7 + f) * 40; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + l, y); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// ---- Цикл: фиксированный шаг 1/60 ---------------------------------------------------------------
let manual = false, acc = 0, lastT = 0;
const frameTimes = [];
function frame(now) {
  requestAnimationFrame(frame);
  if (lastT) {
    frameTimes.push(now - lastT); if (frameTimes.length > 120) frameTimes.shift();
    if (!manual) {
      acc += Math.min(0.05, (now - lastT) / 1000);
      let n = 0;
      while (acc >= DT && n < 3) { step(); acc -= DT; n++; }
      if (n === 3) acc = 0;
    }
  }
  lastT = now;
  draw(); updateHud();
}

// ---- Ввод ---------------------------------------------------------------------------------------------
const downs = new Set();
function pointWorld(e) { const r = cv.getBoundingClientRect(); return toWorld((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H); }
cv.addEventListener("pointerdown", e => {
  e.preventDefault(); if (BOT.on) return;
  downs.add(e.pointerId); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  hold(AIM === "finger" ? pointWorld(e) : undefined);
});
function up(e) { if (!downs.delete(e.pointerId)) return; if (!downs.size) release(); }
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
window.addEventListener("blur", () => { downs.clear(); if (S.held && !BOT.on) release(); });
window.addEventListener("keydown", e => { if (e.code === "Space" && !e.repeat && !BOT.on) { e.preventDefault(); hold(); } });
window.addEventListener("keyup", e => { if (e.code === "Space" && !BOT.on) release(); });
cv.addEventListener("contextmenu", e => e.preventDefault());
document.getElementById("restart").addEventListener("click", () => newRound());
document.getElementById("again").addEventListener("click", () => newRound());
const botBtn = document.getElementById("botBtn");
botBtn.addEventListener("click", () => {
  const cur = !BOT.on ? 0 : BOT.mode === "naive" ? 4 : BOT.mode === "lazy" ? 5 : BOT.skill === 0 ? 1 : BOT.skill === 0.5 ? 2 : 3;
  const nx = BOT_MODES[(cur + 1) % BOT_MODES.length]; setBot(nx.label === "выкл" ? null : nx); newRound();
});
const aimBtns = { angle: document.getElementById("aimAngle"), finger: document.getElementById("aimFinger") };
function setAim(m, restart) {
  AIM = m === "finger" || m === "tap" ? "finger" : "angle";
  aimBtns.angle.classList.toggle("on", AIM === "angle"); aimBtns.finger.classList.toggle("on", AIM === "finger");
  aimBtns.angle.textContent = "Угол " + TUNE.rayAngle + "°";
  setRules(); try { const u = new URL(location.href); u.searchParams.set("aim", AIM); history.replaceState(null, "", u); } catch (e) {}
  if (restart) newRound();
}
aimBtns.angle.addEventListener("click", () => { if (AIM !== "angle") setAim("angle", true); });
aimBtns.finger.addEventListener("click", () => { if (AIM !== "finger") setAim("finger", true); });
new ResizeObserver(() => draw()).observe(stage);
window.addEventListener("orientationchange", () => draw());

// ---- Тестовый API -----------------------------------------------------------------------------------------
function toPt(p) { if (!p) return undefined; if (p.x != null) return { x: p.x, y: p.y }; if (p.sx != null) return toWorld(p.sx, p.sy); return undefined; }
window.__game = {
  ready: false,
  getState() {
    const o = S.om, vx = (o.x - o.px) / DT, vy = (o.y - o.py) / DT;
    const near = []; for (const b of S.WD.bld) if (b.x1 > S.camX - 100 && b.x0 < S.camX + 600) near.push({ x0: b.x0, x1: b.x1, top: b.top });
    return {
      scene: S.scene, seed: S.seed, t: S.t, held: S.held, steps: S.steps, aimMode: AIM,
      om: { x: o.x, y: o.y, vx, vy, frame: poseFrame(), grounded: o.grounded },
      dist: distM(), maxX: S.maxX, speed: Math.hypot(vx, vy),
      rope: S.rope ? { ax: S.rope.ax, ay: S.rope.ay, L: S.rope.L } : null,
      aim: AIM === "angle" && !S.rope ? (() => { const d = aimDir(), r = castRay(o.x, o.y, d.dx, d.dy, TUNE.rayMax); return { hit: r.hit, x: r.hit ? r.x : o.x + d.dx * TUNE.rayMax, y: r.hit ? r.y : o.y + d.dy * TUNE.rayMax }; })() : { ...S.lastAim },
      candies: S.candies, combo: S.combo, bounces: S.bounces, misses: S.misses, sweet: S.sweet,
      stars: S.scene === "end" ? S.stars : starsFor(distM()), star2: star2(), star3: star3(), camX: S.camX, zoom: S.zoom,
      view: (() => { const r = cv.getBoundingClientRect(); return { left: r.left, top: r.top, width: r.width, height: r.height, scale: r.width / W }; })(),
      bot: { on: BOT.on, mode: BOT.mode, skill: BOT.skill, plans: BOT.plans },
      houses: near, candiesNear: S.cand.length, candyList: S.cand.slice(0, 16).map(c => ({ x: c.x, y: c.y })), gapBounces: S.gapBounce.size, best: S.best,
      kick: S.lastKick || null, pops: S.pops.map(p => p.txt), sadT: S.sadT, wideT: S.wideT, shot: !!S.shot, ropeShoot: S.rope ? S.rope.shoot : null,
    };
  },
  act(a, p) {
    if (a === "hold") { if (!BOT.on) hold(toPt(p)); }
    else if (a === "release") { if (!BOT.on) release(); }
    else if (a === "restart") newRound(p && p.seed != null ? p.seed : undefined);
    else if (a === "clock") { manual = !!(p && p.manual); }
    else if (a === "step") { for (let i = 0; i < (p || 1); i++) step(); }
    else if (a === "tune") Object.assign(TUNE, p || {});
    else if (a === "stars") { if (p) { if (p.angle) STARS.angle = p.angle; if (p.finger) STARS.finger = p.finger; } }
    else if (a === "aim") setAim(p && (p.mode || p), true);
    else if (a === "autoplay") setBot(p == null || p === false ? null : p);
    else if (a === "runToEnd") { let n = 0; while (S.scene !== "end" && n < 20000) { step(); n++; } }
    else if (a === "calib") return calib((p && p.n) || 30, p);
    else if (a === "place") { // dev: поставить Ома Нома (без верёвки)
      const o = S.om; o.x = p.x; o.y = p.y; o.px = o.x - (p.vx || 0) * DT; o.py = o.y - (p.vy || 0) * DT; o.grounded = false;
      S.rope = null; S.held = false; S.frags = []; if (S.scene === "ready" && p.start !== false) S.scene = "play";
      S.camX = camTarget(); ensureWorld();
    }
    else if (a === "street") { setStreet((p && p.houses) || []); ensureWorld(); }
    else if (a === "gencheck") return genCheck((p && p.n) || 50, (p && p.x) || 30000);
  },
  metrics() {
    const a = frameTimes.slice().sort((x, y) => x - y);
    const mean = a.reduce((s, x) => s + x, 0) / (a.length || 1);
    return { fps: a.length ? Math.round(1000 / mean) : 0, frameMsP95: a.length ? a[Math.floor(a.length * 0.95)] : 0, drawCalls: -1 };
  },
};
// проверка генератора: g, w, top в пределах §4; скан x шагом 5 u на y = safeY — луч цепляет везде
function genCheck(n, xMax) {
  const sS = S, sNO = NOFX, bad = [], res = { seeds: n, houses: 0, gapMin: 1e9, gapMax: 0, wMin: 1e9, wMax: 0, topMin: 1e9, topMax: 0, scanPoints: 0, scanMiss: 0, bad };
  const d = aimDir(); NOFX = true;
  try {
    for (let sd = 1; sd <= n; sd++) {
      newRound(sd); const WD = S.WD; genMore(WD, xMax + 600);
      const bl = WD.bld;
      for (let i = 1; i < bl.length; i++) {
        const b = bl[i], g = b.g, w = b.x1 - b.x0;
        res.houses++; res.gapMin = Math.min(res.gapMin, g); res.gapMax = Math.max(res.gapMax, g);
        res.wMin = Math.min(res.wMin, w); res.wMax = Math.max(res.wMax, w); res.topMin = Math.min(res.topMin, b.top); res.topMax = Math.max(res.topMax, b.top);
        if (g < TUNE.gapMin - 1e-6 || g > gapMaxAt(b.x0) + 1e-6 || w < TUNE.wMin - 1e-6 || w > wMaxAt(b.x0) + 1e-6 || b.top < TUNE.topMin || b.top > topMaxAt(g) + 0.5)
          if (bad.length < 5) bad.push({ sd, i, g, w, top: b.top });
      }
      for (let x = START.x; x < xMax; x += 5) { // с высоты 300; запас на край 25 u — у самой границы страны улицы не проверяем
        res.scanPoints++;
        S.om.x = x; S.om.y = TUNE.safeY;
        if (!castRay(x, TUNE.safeY, d.dx, d.dy, TUNE.rayMax).hit) { res.scanMiss++; if (bad.length < 5) bad.push({ sd, scanMissX: x }); }
      }
    }
  } finally { S = sS; NOFX = sNO; }
  return res;
}
STARS.angle = [360, 540]; STARS.finger = [320, 420]; // по calib{n:30} на seed 1…30 и 101…130 (60 раундов, см. отчёт): ★★ = 0,9 × медиана бота 0,5, ★★★ = 0,95 × медиана бота 0,75, до 10 м
setAim(AIM, false);
newRound(QS.has("seed") ? +QS.get("seed") : undefined);
if (QS.has("bot")) { const b = QS.get("bot"); setBot(b === "naive" ? { naive: true } : b === "lazy" ? { lazy: true } : { skill: +b }); newRound(S.seed); }
draw();
OMS.loaded.then(() => { window.__game.ready = true; });
requestAnimationFrame(frame);
</script>
