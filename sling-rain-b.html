<script>
"use strict";
// ---- Ом Ном кадрами приложения (D-40, не рисунок кодом) ---------------------------
// Кадры лежат в assets/omnom/ — одна папка на все прототипы; новую версию Ома Нома копируем поверх теми же именами.
// Числа — из assets/omnom/omnom_frames.json: 6,4024 px на u, лапы = pivot, рот (кадр wide); зрачки — два слоя (левый и правый глаз), каждый ходит в эллипсе своего глаза (pupils.<кадр>.eyes).
// В файлах Ом Ном смотрит ВЛЕВО от зрителя; flip = смотрит вправо. Кадр: p.mx, p.my — точка рта в игре (u), p.fy — лапы (по умолчанию рот + 20).
const OMS = (() => {
  const PX = 6.4024, PIV = [0.5366, 0.0253], MOUTH = [-2.08, -19.98];
  // Зрачки — по слою на глаз. Для каждого: rest — центр зрачка в покое, c и r — эллипс хода центра зрачка (u от лап, оси кадра до зеркала).
  // Сдвиг взгляда d одинаков для обоих глаз, но центр каждого зрачка потом зажимается в эллипс СВОЕГО глаза: зрачок не выходит из белка и не переходит шов.
  const PUP = {
    neutral: { l: { rest: [-13.93, -44.86], c: [-16.67, -45.33], r: [3.91, 3.98] },
             r: { rest: [-0.81, -42.67], c: [2.23, -42.67], r: [6.22, 6.39] } },
    ajar:   { l: { rest: [-13.7, -47.75], c: [-15.42, -48.29], r: [2.61, 2.51] },
             r: { rest: [-1.6, -45.33], c: [1.92, -42.83], r: [6.06, 6.01] } },
    wide:   { l: { rest: [-13.39, -51.18], c: [-14.79, -51.42], r: [1.98, 1.54] },
             r: { rest: [-1.13, -48.76], c: [0.98, -45.95], r: [5.73, 5.06] } },
    wide2:  { l: { rest: [-13.93, -52.28], c: [-14.95, -52.67], r: [1.64, 1.31] },
             r: { rest: [-1.52, -49.54], c: [0.83, -46.58], r: [5.85, 5.25] } },
  };
  const LOOK = 7; // u: длина полного взгляда, больше любого радиуса хода — на краю эллипса зрачок упирается в границу
  const NAMES = ["neutral", "ajar", "wide", "wide2", "chew", "chew2", "sad", "joy", "blink", "half", "shadow"];
  for (const f in PUP) NAMES.push(f + "_pupils_l", f + "_pupils_r");
  const img = {};
  const waits = [];
  for (const n of NAMES) {
    const i = new Image(); img[n] = i;
    waits.push(new Promise((res) => { i.onload = i.onerror = res; }));
    i.src = "assets/omnom/" + n + ".png";
  }
  const ok = (i) => i && i.complete && i.naturalWidth > 0;
  // центр зрачка: покой + сдвиг (dx, dy), затем в эллипс хода своего глаза: q = (p - c) / r; |q| > 1 -> p = c + q/|q| * r
  function eyePos(e, dx, dy) {
    let px = e.rest[0] + dx, py = e.rest[1] + dy;
    const qx = (px - e.c[0]) / e.r[0], qy = (py - e.c[1]) / e.r[1], ql = Math.hypot(qx, qy);
    if (ql > 1) { px = e.c[0] + qx / ql * e.r[0]; py = e.c[1] + qy / ql * e.r[1]; }
    return [px, py];
  }
  // p: { frame, mx, my, fy?, flip?, tx?, ty?, rot?, piv?, shadow?, alpha? }; st — объект вызывающего: плавный взгляд
  const last = { frame: null, l: null, r: null, d: null };
  function draw(ctx, p, st) {
    let f = p.frame || "neutral";
    if (f === "neutral" && (performance.now() + (p.blinkOff || 0)) % 3600 < 120) f = "blink";
    const base = img[f]; if (!ok(base)) return;
    const flip = p.flip ? -1 : 1, fx = p.mx - flip * MOUTH[0], fy = p.fy != null ? p.fy : p.my - MOUTH[1];
    const pw = base.naturalWidth, ph = base.naturalHeight, k = 1 / PX;
    ctx.save();
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    if (p.alpha != null) ctx.globalAlpha = p.alpha;
    if (p.shadow && ok(img.shadow)) ctx.drawImage(img.shadow, fx - 32, fy - 6, 64, 12);
    ctx.translate(fx, p.piv ? fy - p.piv : fy); if (p.rot) ctx.rotate(p.rot); if (p.piv) ctx.translate(0, p.piv);
    ctx.scale(flip * k, k);
    ctx.drawImage(base, -PIV[0] * pw, -(1 - PIV[1]) * ph);
    const pu = PUP[f], pl = img[f + "_pupils_l"], pr = img[f + "_pupils_r"];
    if (pu && ok(pl) && ok(pr)) {
      let gx = 0, gy = 0;
      if (p.tx != null) { // цель в системе кадра до зеркала; общий сдвиг взгляда, потом зажим по каждому глазу
        const pv = p.piv || 0;
        let dx = p.tx - fx, dy = p.ty - (fy - pv);
        if (p.rot) { const c = Math.cos(-p.rot), sn = Math.sin(-p.rot), qx = dx * c - dy * sn, qy = dx * sn + dy * c; dx = qx; dy = qy; }
        dy -= pv; dx *= flip;
        const ex = (pu.l.rest[0] + pu.r.rest[0]) / 2, ey = (pu.l.rest[1] + pu.r.rest[1]) / 2; // между глазами
        const vx = dx - ex, vy = dy - ey, L = Math.hypot(vx, vy) || 1, a = Math.min(1, L / 45);
        gx = vx / L * a * LOOK; gy = vy / L * a * LOOK;
      }
      if (st) { st.x = st.x == null ? gx : st.x + (gx - st.x) * 0.35; st.y = st.y == null ? gy : st.y + (gy - st.y) * 0.35; gx = st.x; gy = st.y; }
      const pL = eyePos(pu.l, gx, gy), pR = eyePos(pu.r, gx, gy);
      ctx.drawImage(pl, -PIV[0] * pw + (pL[0] - pu.l.rest[0]) * PX, -(1 - PIV[1]) * ph + (pL[1] - pu.l.rest[1]) * PX);
      ctx.drawImage(pr, -PIV[0] * pw + (pR[0] - pu.r.rest[0]) * PX, -(1 - PIV[1]) * ph + (pR[1] - pu.r.rest[1]) * PX);
      last.frame = f; last.l = pL; last.r = pR; last.d = [gx, gy];
    }
    ctx.restore();
  }
  return { draw, img, PUP, eyePos, last, loaded: Promise.all(waits), ready: () => NAMES.every((n) => ok(img[n])) };
})();
// ---- «Мармеладный дождь», вариация B «Пушка и пульт» (D-93, design/lab-sling-rain-v2.md: «Общее» + «Вариация B») ----
// Пушка наверху стреляет вниз, сила постоянная, решает угол. Целишься пальцем по пульту внизу (y ≥ 410 u): ввод относительный,
// угол = угол до касания + dx × aimGain. Палец внизу, пунктир и первый удар — выше. В полёте тап слева/справа — пузырь с ветром.
// Поле 320×480 u: пушка (160; 36), желейки y 90–340, x 28–292; тележка с Ом Номом — рот y 384, ход x 60–260; пульт y 412–476.
const TUNE = {
  gravity: 1100,     // u/с² (было 784)
  shotSpeed: 600,    // u/с, сила пушки постоянная (ручка)
  aimGain: 0.6,      // °/u — сколько градусов на единицу сдвига пальца (ручка)
  aimMax: 80,        // ° от вертикали
  aimPreview: 1,     // 0 — пунктир до первой желейки; 1 — плюс тень первого отскока (ручка)
  candyR: 12, candyHitR: 9,
  pegHalf: 7, pegThick: 12, pegGap: 20, pegMin: 28, pegMax: 40, jitter: 8,
  e: 0.72,           // упругость желеек (ручка; было 0,85)
  eTired: 0.45, tiredT: 3.0, // «усталость»: после 3 с полёта упругость 0,45, конфета бледнеет
  kt: 0.98, wallE: 0.6, maxSpeed: 950,
  gold: 10,          // золотых в раунде 1 (по описанию 8; 8 → 10 подбором по bench: случайный 34 % → 27 %); раунд n — gold + min(n−1, 2)
  shots: 7,          // конфет в раунде; поймал тележкой — +1
  multStep: 4, ptsPeg: 10, ptsGold: 50, bonusShot: 100,
  bubbleT: 0.7, bubbleRise: 230, bubbleK: 10, // пузырь 0,7 с, всплытие и ветер выходят на скорость с k = 10/с
  bubbleWind: 90,    // u/с вбок, в сторону тапа (ручка)
  cartSpeed: 0.6, cartAmp: 100, catchW: 18, omScale: 0.7,
  popGap: 0.075, popMax: 1.0, // вся очередь лопания ≤ 1 с
  stuckV: 40, stuckT: 0.5, shotMax: 6,
  tapT: 0.15, tapMove: 4, // касание короче 0,15 с со сдвигом < 4 u — не выстрел
  aimLookT: 1.6, ghostT: 0.35, aimDotTicks: 3,
  botN: 10, botNoise: 1.5, // прицельный бот: лучший из 10 углов, шум ±1,5°
};
const KNOBS = [ // ручки панели: ключ, подпись, мин, макс, шаг
  ["aimGain", "Пульт, °/u", 0.3, 1.2, 0.05],
  ["shotSpeed", "Сила пушки", 400, 800, 20],
  ["aimPreview", "Тень отскока (0/1)", 0, 1, 1],
  ["bubbleWind", "Ветер пузыря", 0, 180, 10],
  ["e", "Упругость", 0.5, 0.9, 0.01],
];
const W = 320, H = 480, DT = 1 / 60, SUB = 2;
const CAN = { x: 160, y: 36, len: 26 }, FIELD = { x0: 28, x1: 292, y0: 90, y1: 340 };
const MOUTH_Y = 384, FEET_Y = MOUTH_Y + 20 * TUNE.omScale, LOST_Y = 420;
const REM = { x0: 14, x1: 306, y0: 412, y1: 474, y: 443 };
const C = {
  paper: "#F5A9D0", paperHi: "#F9C3DF", paperLo: "#EE97C3", ink: "#4A2512", cream: "#FBEBD0", creamSh: "#E9CFA3",
  card: "#C98A4B", cardMid: "#B8773D", cardSh: "#8F5427", candy: "#E8412F", wrap: "#FFC93C", gold: "#FFD23F", goldLit: "#FFF6B8",
  mint: "#5FD3C7", mintLit: "#D9FFF9", mintDk: "#1E7F75", goldDk: "#B07A00", act: "#E8458A", actLow: "#A82060",
};
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rad = (d) => d * Math.PI / 180;

const q = new URLSearchParams(location.search);
let S, bot = null, quiet = false;

// ---- Геометрия ----
function segEnds(p) { const c = Math.cos(p.a) * TUNE.pegHalf, s = Math.sin(p.a) * TUNE.pegHalf; p.ax = p.x - c; p.ay = p.y - s; p.bx = p.x + c; p.by = p.y + s; return p; }
function ptSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
  const qx = ax + dx * t, qy = ay + dy * t; return { d: Math.hypot(px - qx, py - qy), qx, qy };
}
function orient(ax, ay, bx, by, cx, cy) { return Math.sign((bx - ax) * (cy - ay) - (by - ay) * (cx - ax)); }
function segSeg(p, o) {
  if (orient(p.ax, p.ay, p.bx, p.by, o.ax, o.ay) * orient(p.ax, p.ay, p.bx, p.by, o.bx, o.by) < 0 &&
      orient(o.ax, o.ay, o.bx, o.by, p.ax, p.ay) * orient(o.ax, o.ay, o.bx, o.by, p.bx, p.by) < 0) return 0;
  return Math.min(ptSeg(p.ax, p.ay, o.ax, o.ay, o.bx, o.by).d, ptSeg(p.bx, p.by, o.ax, o.ay, o.bx, o.by).d,
    ptSeg(o.ax, o.ay, p.ax, p.ay, p.bx, p.by).d, ptSeg(o.bx, o.by, p.ax, p.ay, p.bx, p.by).d);
}
// конфета в жерле пушки при угле deg (0 — вниз, + — вправо)
function muzzle(deg) { const a = rad(deg); return { x: CAN.x + Math.sin(a) * CAN.len, y: CAN.y + Math.cos(a) * CAN.len, dx: Math.sin(a), dy: Math.cos(a) }; }
function launchBody(deg) { const m = muzzle(deg); return { x: m.x, y: m.y, vx: m.dx * TUNE.shotSpeed, vy: m.dy * TUNE.shotSpeed, bubble: false, wind: 0 }; }

// ---- Физика конфеты: стены 0,6, желейки-капсулы (нормаль × −e, касательная × 0,98); пузырь всплывает сквозь желейки и сносится ветром ----
function stepBody(c, pegs, dt, onHit, e) {
  if (c.bubble) {
    const k = Math.min(1, TUNE.bubbleK * dt);
    c.vy += (-TUNE.bubbleRise - c.vy) * k; c.vx += (c.wind - c.vx) * k;
  } else c.vy += TUNE.gravity * dt;
  const sp = Math.hypot(c.vx, c.vy); if (sp > TUNE.maxSpeed) { c.vx *= TUNE.maxSpeed / sp; c.vy *= TUNE.maxSpeed / sp; }
  c.x += c.vx * dt; c.y += c.vy * dt;
  const r = TUNE.candyHitR;
  if (c.x < r) { c.x = r; c.vx = Math.abs(c.vx) * TUNE.wallE; }
  if (c.x > W - r) { c.x = W - r; c.vx = -Math.abs(c.vx) * TUNE.wallE; }
  if (c.y < r) { c.y = r; c.vy = Math.abs(c.vy) * TUNE.wallE; }
  if (c.bubble) { if (c.y < FIELD.y0 - 30) { c.y = FIELD.y0 - 30; c.vy = Math.max(0, c.vy); } return; } // пузырь не залетает в пушку
  const R = r + TUNE.pegThick / 2, reach = R + TUNE.pegHalf;
  for (const p of pegs) {
    if (!p.alive || Math.abs(c.x - p.x) > reach || Math.abs(c.y - p.y) > reach) continue;
    const s = ptSeg(c.x, c.y, p.ax, p.ay, p.bx, p.by); if (s.d >= R) continue;
    let nx = 0, ny = -1; if (s.d > 1e-6) { nx = (c.x - s.qx) / s.d; ny = (c.y - s.qy) / s.d; }
    c.x = s.qx + nx * R; c.y = s.qy + ny * R;
    const vn = c.vx * nx + c.vy * ny;
    if (vn < 0) {
      const tx = -ny, ty = nx, vt = c.vx * tx + c.vy * ty, nvn = -vn * e, nvt = vt * TUNE.kt;
      c.vx = nx * nvn + tx * nvt; c.vy = ny * nvn + ty * nvt;
      if (onHit) onHit(p, -vn, s.qx + nx * TUNE.pegThick / 2, s.qy + ny * TUNE.pegThick / 2);
    }
  }
}
// первая желейка, которой коснётся выстрел под углом deg (без тележки и пузыря)
function firstTouch(pegs, deg) {
  const c = launchBody(deg); let hit = null;
  for (let i = 0; i < 60 * 1.6 && !hit && c.y < LOST_Y; i++) for (let s = 0; s < SUB && !hit; s++) stepBody(c, pegs, DT / SUB, (p) => { hit = p; }, TUNE.e);
  return hit;
}

// ---- Поле по seed: шаблон (левая половина) + разброс ±8 u, зеркало, зазор, добивка до 28, срез до 40 ----
function tplGrid(r, y0, y1) {
  const out = [], rowH = 40 + r() * 6, colW = 56 + r() * 10, tilt = r() * 0.45, holes = 0.1 + r() * 0.15;
  for (let k = 0, y = y0 + 8; y <= y1 - 4; k++, y += rowH) {
    const off = (k % 2) * colW / 2;
    for (let x = 160 - off; x >= 30; x -= colW) if (r() >= holes) out.push({ x, y, a: (k % 2 ? 1 : -1) * tilt });
  }
  return out;
}
function tplRings(r, y0, y1) {
  const out = [], h = y1 - y0;
  const bR = 52 + r() * 10, by = y0 + h * 0.36, n = 10;
  for (let i = 0; i < n; i++) { const t = Math.PI / 2 + i / n * 2 * Math.PI, x = 160 + Math.cos(t) * bR; if (x <= 160.5) out.push({ x, y: by + Math.sin(t) * bR, a: t + Math.PI / 2 }); }
  const sx = 76 + r() * 14, sy = y0 + h * 0.8, sR = 30 + r() * 8, m = 7, t0 = r() * 6;

  const short = performance.now() - ptr.t < TUNE.tapT * 1000 && ptr.moved < TUNE.tapMove; ptr = null;
  if (e.type === "pointercancel" || short) cancelAim(); else fire();
}
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
document.addEventListener("visibilitychange", () => { if (document.hidden && ptr) { ptr = null; cancelAim(); } });
window.addEventListener("blur", () => { if (ptr) { ptr = null; cancelAim(); } });
function onButton(id, fn) { const b = document.getElementById(id); b.addEventListener("pointerdown", (e) => e.stopPropagation()); b.addEventListener("click", (e) => { e.stopPropagation(); initAudio(); fn(); }); }
onButton("restart", () => newRound(S.seed));
onButton("again", () => nextRound());
onButton("again2", () => newRound(S.seed));
onButton("newseed", () => newRound());
onButton("tuneBtn", () => document.getElementById("tune").classList.toggle("on"));
(function buildTune() {
  const box = document.getElementById("tune");
  for (const [k, label, mn, mx, st] of KNOBS) {
    if (q.has(k)) TUNE[k] = +q.get(k);
    const l = document.createElement("label"); l.textContent = label;
    const i = document.createElement("input"); i.type = "range"; i.min = mn; i.max = mx; i.step = st; i.value = TUNE[k];
    const v = document.createElement("span"); v.textContent = TUNE[k];
    i.addEventListener("input", () => { TUNE[k] = +i.value; v.textContent = i.value; });
    box.append(l, i, v);
  }
})();

// ---- Цикл: фиксированный тик 1/60 ----
let manual = false, acc = 0, last = performance.now();
const frames = [];
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  frames.push(now); if (frames.length > 120) frames.shift();
  if (!manual) { acc += dt; let n = 0; while (acc >= DT && n < 3) { tick(); acc -= DT; n++; } if (n === 3) acc = 0; }
  render();
  requestAnimationFrame(loop);
}

// ---- Тестовый API ----
function shortState() {
  return { phase: S.phase, scene: S.scene, round: S.round, shotsLeft: S.shotsLeft, goldLeft: S.goldLeft, goldTotal: S.goldTotal, chain: S.chain,
    flightT: +(S.phase === "fly" ? S.phaseT : S.flightT).toFixed(3), bubbleUsed: S.bubbleUsed, angle: +S.angle.toFixed(2), win: S.scene === "end" ? !!S.win : null };
}
window.__game = {
  ready: false,
  state: shortState,
  getState() {
    const r = cv.getBoundingClientRect(), c = S.candy, ap = S.aimView;
    return Object.assign(shortState(), {
      seed: S.seed, template: S.template, tick: Math.round(S.t * 60), lastAct: S.lastAct, omFrame, firstGold: S.firstGold,
      score: S.score, mult: mult(), maxChain: S.maxChain, shot: S.shot, catches: S.catches, bonus: S.bonus,
      pegsTotal: S.pegs.length, pegsLeft: S.pegs.filter((p) => p.alive).length, lit: S.pegs.filter((p) => p.alive && p.lit).length,
      pegs: S.pegs.map((p) => ({ x: +p.x.toFixed(1), y: +p.y.toFixed(1), a: +p.a.toFixed(3), gold: p.gold, lit: p.lit, alive: p.alive, cell: cellOf(p) })),
      bubble: { used: S.bubbleUsed, active: !!c.bubble, t: +c.bubbleT.toFixed(2), side: S.bubbleSide || null, wind: c.wind },
      candy: { x: c.x, y: c.y, vx: c.vx, vy: c.vy, vis: c.vis, tired: S.phase === "fly" && S.phaseT > TUNE.tiredT },
      cart: { x: cartX(), mouthY: MOUTH_Y, catchW: TUNE.catchW }, lastShot: S.lastShot, shots: S.shots.length,
      cannon: { x: CAN.x, y: CAN.y, angle: S.angle, muzzle: muzzle(S.angle) }, remote: { x0: REM.x0, x1: REM.x1, y0: REM.y0, y1: REM.y1, knobX: knobX(), knobY: REM.y },
      aimView: ap && (S.phase === "aim" || S.phase === "drag") ? { maxY: Math.max(CAN.y, ...ap.pts.map((p) => p.y), ...ap.ghost.map((p) => p.y), ap.hit ? ap.hit.y + 7.5 : 0), hit: ap.hit, dots: ap.pts.length, ghost: ap.ghost.length } : null,
      flyers: S.flyers.length, popups: S.popups.length, log: S.log.slice(-40), bot: !!bot,
      view: { left: r.left, top: r.top, scale, W, H }, tune: TUNE,
    });
  },
  act(a, p) {
    if (a === "seed") newRound(typeof p === "object" ? p.seed : p, typeof p === "object" ? p.round : undefined);
    else if (a === "restart") newRound(S.seed);
    else if (a === "newSeed") newRound();
    else if (a === "next") nextRound();
    else if (a === "aim") { if (S.phase !== "aim" && S.phase !== "drag") return false; return setAngle(typeof p === "object" ? p.deg : p); }
    else if (a === "fire") return fire();
    else if (a === "tap") return tap(p === "left" ? "left" : "right");
    else if (a === "clock") manual = !!(p && p.manual);
    else if (a === "step") { for (let i = 0; i < (p || 1); i++) tick(); }
    else if (a === "autoplay") { bot = p === false || (p && p.on === false) ? null : { skill: p && p.skill != null ? +p.skill : 1, loop: !(p && p.loop === false) }; S.botT = 0; S.botPlan = null; }
    else if (a === "plan") return botPlan(p && p.skill != null ? +p.skill : 1);
    else if (a === "sim") return simShot(+p);
    else if (a === "bench") return bench(p);
    else if (a === "setTune") { Object.assign(TUNE, p); }
    else if (a === "render") render();
  },
  metrics() {
    const d = []; for (let i = 1; i < frames.length; i++) d.push(frames[i] - frames[i - 1]);
    const avg = d.length ? d.reduce((s, x) => s + x, 0) / d.length : 16.7; d.sort((x, y) => x - y);
    return { fps: Math.round(1000 / avg), frameMsP95: d.length ? d[Math.floor(d.length * 0.95)] : 0, drawCalls: -1 };
  },
};
// ?seed=7&round=2&bot=1 — бот играет сам (bot=0 — случайный)
newRound(q.has("seed") ? +q.get("seed") : undefined, q.has("round") ? +q.get("round") : 1);
if (q.has("bot")) bot = { skill: +q.get("bot") || 0, loop: true };
fit(); render();
OMS.loaded.then(() => { window.__game.ready = true; });
requestAnimationFrame(loop);
</script>
