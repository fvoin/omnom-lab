  neutral: { l: { rest: [-13.93, -44.86], c: [-16.67, -45.33], r: [3.91, 3.98] }, r: { rest: [-0.81, -42.67], c: [2.23, -42.67], r: [6.22, 6.39] } },

function eyePos(e, dx, dy) { // центр зрачка: покой + d, затем в эллипс хода своего глаза
  let px = e.rest[0] + dx, py = e.rest[1] + dy;
  const qx = (px - e.c[0]) / e.r[0], qy = (py - e.c[1]) / e.r[1], ql = Math.hypot(qx, qy);
  if (ql > 1) { px = e.c[0] + qx / ql * e.r[0]; py = e.c[1] + qy / ql * e.r[1]; }
  return [px, py];
}

function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);

function buildCatalog() {
  const r = rng(SEED);
  const games = REAL.map(g => ({ ...g, real: true }));
  const slots = [];
  for (let i = 0; i < 94; i++) slots.push(THEMES[i % THEMES.length].id);
  const pools = {}; for (const t of THEMES) pools[t.id] = shuffle(POOLS[t.id], r);
  shuffle(slots, r).forEach((th, i) => {
    const name = pools[th].shift();
    games.push({ id: "g" + String(i + 1).padStart(2, "0"), name, theme: th, kind: "stub", shape: Math.floor(r() * 2) });
  });
  // новинки: 8 случайных (включая одну настоящую)
  const newIds = new Set(shuffle(games.filter(g => g.kind === "stub"), r).slice(0, 7).map(g => g.id));
  newIds.add("slide");
  for (const g of games) g.isNew = newIds.has(g.id);
  return games;

// ---------- состояние ----------
const today = new Date().toISOString().slice(0, 10);

function makeDaily() {
  const d = load("daily", null);
  if (d && d.date === today && d.ids.every(id => BY_ID[id])) return d.ids;
  const r = rng(SEED + Number(today.replace(/-/g, "")));
  const labs = shuffle(["hook", "sling", "slide"], r);
  const untried = shuffle(GAMES.filter(g => !seen.has(g.id) && !recent.includes(g.id) && g.kind === "stub"), r)[0];
  const third = shuffle(GAMES.filter(g => g.id !== labs[0] && g.id !== (untried && untried.id)), r)[0];
  const ids = [labs[0], untried ? untried.id : labs[1], third.id];
  save("daily", { date: today, ids });
  return ids;
}
const DAILY = makeDaily();
const DAILY_LABEL = ["Сыграй", "Ещё не пробовал", "Загляни"];

// порядок карусели: недавние, новые, набор дня, остальные (по темам и алфавиту)
const order = [];
const segs = [];
(function buildOrder() {
  const used = new Set();
  const push = (seg, ids) => { const start = order.length; for (const id of ids) if (!used.has(id)) { used.add(id); order.push(id); }
    segs.push({ id: seg.id, name: seg.name, start, end: order.length }); };
  push({ id: "recent", name: "Недавние" }, recent);
  push({ id: "new", name: "Новое" }, GAMES.filter(g => g.isNew && !seen.has(g.id)).map(g => g.id));
  push({ id: "daily", name: "Набор дня" }, DAILY);
  const rest = GAMES.slice().sort((a, b) => THEMES.findIndex(t => t.id === a.theme) - THEMES.findIndex(t => t.id === b.theme) || a.name.localeCompare(b.name, "ru"));
  push({ id: "rest", name: "Все" }, rest.map(g => g.id));
})();
function segAt(i) { return segs.find(s => i >= s.start && i < s.end) || segs[segs.length - 1]; }

  lastW = w; lastH = h;

  offX = Math.round((w - W * scale) / 2); offY = Math.round((h - H * scale) / 2);

}

// ---------- Ом Ном живой ----------
const omBody = $("omBody"), omPupilsL = $("omPupilsL"), omPupilsR = $("omPupilsR");

  const k = 1 - Math.pow(0.001, dt / 1000);
  st.look.x += (st.look.tx - st.look.x) * k; st.look.y += (st.look.ty - st.look.y) * k;
  // общий взгляд d (u), потом зажим в эллипс хода каждого глаза: зрачок не выходит из своего белка и не переходит шов
  const pl = eyePos(PUPIL.neutral.l, st.look.x * LOOK, st.look.y * LOOK), pr = eyePos(PUPIL.neutral.r, st.look.x * LOOK, st.look.y * LOOK);
  omPupilsL.style.transform = `translate(${((pl[0] - PUPIL.neutral.l.rest[0]) * OM_PX).toFixed(2)}px,${((pl[1] - PUPIL.neutral.l.rest[1]) * OM_PX).toFixed(2)}px)`;
  omPupilsR.style.transform = `translate(${((pr[0] - PUPIL.neutral.r.rest[0]) * OM_PX).toFixed(2)}px,${((pr[1] - PUPIL.neutral.r.rest[1]) * OM_PX).toFixed(2)}px)`;

// ---------- открыть игру ----------
function openGame(id) {
  const g = BY_ID[id];
  if (st.task && !st.task.done) {
    if (id === st.task.target) { for (const c of document.querySelectorAll(`.cell[data-id="${id}"]`)) c.classList.add("flash"); st.task.done = true; st.task.sec = (performance.now() - st.task.t0) / 1000; st.joyUntil = performance.now() + 900; renderTask(); }
    else showToast(`Это «${g.name}», а ищем «${BY_ID[st.task.target].name}»`);
    return;
  }
  recent = [id].concat(recent.filter(x => x !== id)).slice(0, 8); save("recent", recent);
  seen.add(id); save("seen", [...seen]);
  openedToday[id] = today; save("opened", openedToday);
  refreshDots(); refreshDaily();
  st.joyUntil = performance.now() + 700;
  if (g.kind === "lab") { st.pending = g.href; setTimeout(() => { location.href = g.href; }, 380); return; }
  st.popup = g.kind;
  $("popT").textContent = `«${g.name}»`;
  $("popP").textContent = g.kind === "app" ? "Эта игра есть в приложении. В прототипе главного экрана её нет." : "Заглушка: игры пока нет. Представь, что она открылась.";

}

// ---------- режим самопроверки ?task=1 ----------
const TASK = new URLSearchParams(location.search).get("task") === "1";

// ---------- ввод: тап, свайп, колесо ----------
let ptr = null; // {id, x0, y0, x, y, t0, kind, target, moved, samples}
function tapTargetOf(el) { return el && el.closest ? el.closest("[data-tap]") : null; }
stage.addEventListener("pointerdown", e => {
  if (ptr) return;
  const p = toStage(e);
  const target = tapTargetOf(e.target);
  let kind = "none";
  if (st.popup) kind = "tap";
  else if (st.gridOpen) kind = p.y > 140 ? "gridScroll" : "tap";
  else if (p.y >= 176 && p.y < 580 && !(target && (target.id === "arL" || target.id === "arR"))) kind = "carousel";
  else kind = "tap";
  ptr = { id: e.pointerId, x0: p.x, y0: p.y, x: p.x, y: p.y, t0: performance.now(), kind, target, moved: false,
    pos0: st.pos, grid0: st.gridY, samples: [{ t: performance.now(), x: p.x, y: p.y }] };
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  if (target) { st.pressed = target; target.classList.add("pressed"); }
  if (kind === "gridScroll") st.gridVel = 0;
});
stage.addEventListener("pointermove", e => {
  const p = toStage(e);
  if (!ptr || e.pointerId !== ptr.id) {
    if (e.pointerType === "mouse" && !st.gridOpen && !st.popup) lookAt((p.x - 195) / 160, (p.y - 275) / 200, 1200);
    return;
  }
  ptr.x = p.x; ptr.y = p.y;
  ptr.samples.push({ t: performance.now(), x: p.x, y: p.y }); if (ptr.samples.length > 8) ptr.samples.shift();
  if (!ptr.moved && Math.hypot(p.x - ptr.x0, p.y - ptr.y0) >= TAP_SLOP) {
    ptr.moved = true;
    if (st.pressed) { st.pressed.classList.remove("pressed"); st.pressed = null; }
  }
  if (!ptr.moved) return;
  if (ptr.kind === "carousel") {
    st.dragging = true;
    let pos = ptr.pos0 - (p.x - ptr.x0) / BOX_STEP;
    if (pos < 0) pos = pos * 0.35; if (pos > order.length - 1) pos = order.length - 1 + (pos - order.length + 1) * 0.35;
    st.pos = pos; st.target = pos;
    lookAt(-Math.sign(p.x - ptr.x0) * 0.9, 0.3, 600);
  } else if (ptr.kind === "gridScroll") {
    let y = ptr.grid0 - (p.y - ptr.y0);
    if (y < 0) y *= 0.35; if (y > st.gridMax) y = st.gridMax + (y - st.gridMax) * 0.35;
    st.gridY = y;
  }
});
function velocity(p) {
  const s = p.samples, now = performance.now();

}
function endPointer(e, cancelled) {

  if (!p.moved) {
    // тап: срабатывает на отпускании, если палец не сдвинулся на 12 px и остался на том же элементе
    const pt = toStage(e);
    const under = tapTargetOf(document.elementFromPoint(e.clientX, e.clientY));

function settle(velIdxPerSec) {

  const now = performance.now();

  else if (e.key === "Enter") act("tapBox"); else if (e.key === "Escape") { closePopup(); closeGrid(); }
});

function doTap(el) {

  else if (k === "prev") goTo(curIndex() - 1);
  else if (k === "next") goTo(curIndex() + 1);

  else if (k === "close") closeGrid();
  else if (k === "theme") gridToTheme(el.dataset.theme);
  else if (k === "cell") openGame(el.dataset.id);
  else if (k === "ok") closePopup();
  else if (k === "again") newTask();
}

// ---------- цикл ----------
const frames = []; let lastT = performance.now();
function loop(now) {
  const dt = Math.min(64, now - lastT); lastT = now;
  frames.push(dt); if (frames.length > 120) frames.shift();
  if (!st.dragging) {
    const k = 1 - Math.pow(0.0005, dt / 1000);
    st.pos += (st.target - st.pos) * Math.min(1, k * 1.6);
    if (Math.abs(st.target - st.pos) < 0.001) st.pos = st.target;
  }
  if (st.gridOpen && !(ptr && ptr.kind === "gridScroll" && ptr.moved)) {
    if (Math.abs(st.gridVel) > 5) { st.gridY += st.gridVel * dt / 1000; st.gridVel *= Math.pow(0.04, dt / 1000); } else st.gridVel = 0;
    if (st.gridY < 0) { st.gridY += (0 - st.gridY) * 0.25; st.gridVel = 0; if (st.gridY > -0.5) st.gridY = 0; }
    if (st.gridY > st.gridMax) { st.gridY += (st.gridMax - st.gridY) * 0.25; st.gridVel = 0; if (st.gridY < st.gridMax + 0.5) st.gridY = st.gridMax; }
  }
  gContent.style.transform = `translate3d(0,${(-st.gridY).toFixed(1)}px,0)`;
  renderCarousel();
  updateOmNom(now, dt);
  if (st.toast && now > st.toast) { st.toast = 0; $("toast").style.display = "none"; }
  if (st.task && !st.task.done) { const tm = $("title").querySelector(".tm"); if (tm) tm.textContent = ((now - st.task.t0) / 1000).toFixed(1) + " с"; }
  requestAnimationFrame(loop);
}

// ---------- тестовый API ----------
function act(action, payload) {
  switch (action) {
    case "next": goTo(curIndex() + 1); break;
    case "prev": goTo(curIndex() - 1); break;
    case "goto": goTo(typeof payload === "string" ? order.indexOf(payload) : Number(payload), true); break;
    case "swipe": { const n = Number(payload) || 1; goTo(curIndex() + n); break; }
    case "tapBox": openGame(order[curIndex()]); break;
    case "chip": goTo(order.indexOf(DAILY[Number(payload) || 0])); break;
    case "segment": { const s = segs.find(q => q.id === payload); if (s && s.end > s.start) goTo(s.start); break; }
    case "openGrid": openGrid(); break;
    case "closeGrid": closeGrid(); break;
    case "gridScroll": gridTo(Number(payload) || 0); break;
    case "gridTheme": gridToTheme(payload); break;
    case "openGame": openGame(payload); break;
    case "closePopup": closePopup(); break;
    case "newTask": newTask(); break;
    case "settle": st.pos = st.target; break;
    case "reset": try { for (const k of ["recent", "seen", "opened", "daily"]) localStorage.removeItem(KEY + k); } catch (e) {} break;
  }
}
window.__game = {
  ready: false,
  getState() {
    const i = curIndex();
    return { screen: st.popup ? "popup" : st.gridOpen ? "grid" : "carousel", index: i, pos: +st.pos.toFixed(3), current: order[i],
      currentName: BY_ID[order[i]].name, segment: segAt(i).id, segments: segs.map(s => ({ id: s.id, start: s.start, count: s.end - s.start })),
      order: order.slice(0, 12), total: order.length, recent: recent.slice(), daily: DAILY.slice(),
      newUnseen: GAMES.filter(g => g.isNew && !seen.has(g.id)).map(g => g.id),
      grid: { open: st.gridOpen, y: Math.round(st.gridY), max: st.gridMax }, popup: st.popup, pending: st.pending,
      task: st.task ? { target: st.task.target, name: BY_ID[st.task.target].name, done: st.task.done, sec: +st.task.sec.toFixed(2), taps: st.taps } : null,
      themes: THEMES.map(t => ({ id: t.id, count: GAMES.filter(g => g.theme === t.id).length })),
      view: { scale, offX, offY } };
  },
  act,
  metrics() { const s = frames.slice().sort((a, b) => a - b); const avg = s.reduce((a, b) => a + b, 0) / (s.length || 1);
    return { fps: Math.round(1000 / (avg || 16.7)), frameMsP95: +(s[Math.floor(s.length * 0.95)] || 0).toFixed(1), drawCalls: -1 }; },
  catalog: () => GAMES.map(g => ({ id: g.id, name: g.name, theme: g.theme, kind: g.kind, isNew: !!g.isNew })),
};
if (TASK) newTask();
requestAnimationFrame(loop);
Promise.all([...document.images].map(im => im.decode ? im.decode().catch(() => {}) : Promise.resolve()))
  .then(() => requestAnimationFrame(() => requestAnimationFrame(() => { window.__game.ready = true; })));
</script>
</body>
