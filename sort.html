<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="icon" href="data:,">
<title>Candy Sort</title>
<style>:root{--bg:#1f3a4d;--panel:#2e5470;--ink:#fff;--soft:#a9cbe0;--act:#ff8a3c}*{box-sizing:border-box}html,body{background:var(--bg);height:100%;color:var(--ink);margin:0;font:700 14px/1.3 ui-rounded,SF Pro Rounded,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}body{-webkit-user-select:none;user-select:none;overscroll-behavior:none;flex-direction:column;height:100dvh;display:flex}header{flex:none;align-items:center;gap:6px;height:46px;padding:0 8px;display:flex}a.back{color:var(--soft);padding:0 6px;font-size:24px;text-decoration:none}.box{background:var(--panel);text-align:center;white-space:nowrap;border-radius:10px;flex:1;min-width:0;padding:3px 8px}.box small{color:var(--soft);letter-spacing:.06em;text-transform:uppercase;font-size:10px;display:block}.box b{font-size:17px}button{font:inherit;background:var(--panel);color:#fff;cursor:pointer;border:0;border-radius:999px;padding:8px 11px;font-weight:800}button:disabled{opacity:.4}button.big{background:var(--act);padding:12px 30px;font-size:18px;box-shadow:0 4px #b05a1a}#stage{touch-action:none;flex:1;min-height:0;position:relative}canvas{touch-action:none;width:100%;height:100%;display:block;position:absolute;inset:0}.ov{text-align:center;background:#0a1924d1;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:20px;display:none;position:absolute;inset:0}.ov h2{margin:0;font-size:30px}.ov p{color:var(--soft);max-width:300px;margin:0}#gear{opacity:.8;z-index:5;width:36px;height:36px;padding:0;font-size:18px;position:fixed;bottom:8px;left:8px}#panel{background:var(--panel);z-index:5;border-radius:14px;width:230px;padding:10px 12px;display:none;position:fixed;bottom:52px;left:8px}#panel label{color:var(--soft);margin:6px 0 0;font-size:12px;display:block}#panel input{width:100%}</style>
</head>
<body>
<header>
  <a class="back" href="index.html" title="Lab">&larr;</a>
  <div class="box"><small>Level</small><b id="lvl">1</b></div>
  <div class="box"><small>Moves</small><b id="mv">0</b></div>
  <button id="undo">Undo</button>
  <button id="restart">Restart</button>
</header>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="ov" id="start" style="display:flex">
    <h2>Candy Sort</h2>
    <p>Tap a stick to lift its top rings, tap another to drop them. Fill a stick with one colour!</p>
    <p id="bestLvl"></p>
    <button class="big" id="play">Play</button>
  </div>
  <div class="ov" id="won">
    <h2 id="wonT">Level clear!</h2>
    <p id="wonP"></p>
    <button class="big" id="next">Next</button>
  </div>
</div>
<button id="gear">&#9881;</button>
<div id="panel">
  <label>Level (auto difficulty): <b id="vLevel"></b><input id="sLevel" type="range" min="1" max="20" step="1"></label>
  <label>Colors: <b id="vColors"></b><input id="sColors" type="range" min="2" max="8" step="1"></label>
  <label>Empty sticks: <b id="vEmpty"></b><input id="sEmpty" type="range" min="1" max="2" step="1"></label>
  <label>Height (rings per stick): <b id="vCap"></b><input id="sCap" type="range" min="3" max="6" step="1"></label>
  <label><input type="checkbox" id="cAuto" style="width:auto"> auto difficulty by level</label>
</div>
<script>
"use strict";
const COLORS = ["#FF4D6A", "#FF9A2E", "#FFD23F", "#58D05A", "#2FCFD6", "#4A82FF", "#A363FF", "#FF70D2"];
const DARK   = ["#B02A44", "#B86A10", "#B8920A", "#2F9A32", "#14959B", "#2656C4", "#6E3CC4", "#C23FA0"];
const $ = (id) => document.getElementById(id);
const now = () => performance.now();
const cfg = { level: 1, colors: 4, empty: 2, cap: 4, auto: true };
let bestLevel = 1;
try { bestLevel = Number(localStorage.getItem("lab.best.sort")) || 1; } catch (e) {}

// ---------- level params + generator ----------
function autoParams(level) {
  return { colors: Math.min(8, 3 + Math.floor((level - 1) / 2)), empty: level <= 3 ? 2 : (level % 3 === 0 ? 1 : 2), cap: 4 };
}
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const isFullUniform = (s, cap) => s.length === cap && s.every((x) => x === s[0]);
const isSolved = (st) => st.every((s) => s.length === 0);

// real game move: amount of rings moving from a to b, or 0
function moveAmount(st, a, b, cap) {
  const A = st[a], B = st[b];
  if (a === b || !A.length) return 0;
  const col = A[A.length - 1]; let run = 0;
  for (let i = A.length - 1; i >= 0 && A[i] === col; i--) run++;
  if (B.length) { if (B[B.length - 1] !== col) return 0; return Math.min(run, cap - B.length); }
  if (run === A.length) return 0;       // whole stick is one colour: pointless to move it to an empty one
  return Math.min(run, cap);
}
function legalMoves(st, cap) {
  const m = [];
  for (let a = 0; a < st.length; a++) for (let b = 0; b < st.length; b++) if (a !== b && moveAmount(st, a, b, cap) > 0) m.push([a, b]);
  return m;
}
// returns new state (arrays copied), clears stick if it became a full lollipop
function applyMove(st, a, b, cap) {
  const n = moveAmount(st, a, b, cap), s = st.slice();
  const A = s[a].slice(), B = s[b].slice();
  for (let i = 0; i < n; i++) B.push(A.pop());
  s[a] = A; s[b] = isFullUniform(B, cap) ? [] : B;
  return s;
}
function solvable(st0, cap, limit, path) {
  const seen = new Set(); let nodes = 0;
  const key = (s) => s.map((a) => a.join("")).sort().join("|");
  function dfs(s, depth) {
    if (isSolved(s)) return true;
    if (++nodes > limit || depth > 250) return false;
    const k = key(s); if (seen.has(k)) return false; seen.add(k);
    const ms = legalMoves(s, cap).map(([a, b]) => {
      const B = s[b], A = s[a];
      let sc = B.length ? 10 : 0;
      if (B.length && B.length + moveAmount(s, a, b, cap) === cap && B.every((x) => x === B[0])) sc += 100;
      if (A.length > moveAmount(s, a, b, cap) && A[A.length - 1 - moveAmount(s, a, b, cap)] === A[A.length - 1]) sc -= 5;
      return [sc + Math.random(), a, b];
    }).sort((x, y) => y[0] - x[0]);
    for (const [, a, b] of ms) if (dfs(applyMove(s, a, b, cap), depth + 1)) { if (path) path.unshift([a, b]); return true; }
    return false;
  }
  return dfs(st0, 0);
}
function randomDeal(colors, empty, cap) {
  for (;;) {
    const rings = []; for (let c = 0; c < colors; c++) for (let i = 0; i < cap; i++) rings.push(c);
    shuffle(rings);
    const st = []; for (let i = 0; i < colors; i++) st.push(rings.slice(i * cap, (i + 1) * cap));
    for (let i = 0; i < empty; i++) st.push([]);
    if (!st.some((s) => isFullUniform(s, cap))) return st;
  }
}
// reverse scramble from the solved state: guaranteed solvable with single-ring moves (fallback only)
function reverseDeal(colors, empty, cap) {
  const st = []; for (let c = 0; c < colors; c++) st.push(Array(cap).fill(c));
  for (let i = 0; i < empty; i++) st.push([]);
  for (let step = 0; step < colors * cap * 6 || st.some((s) => isFullUniform(s, cap)); step++) {
    if (step > 2000) break;
    const srcs = []; for (let b = 0; b < st.length; b++) { const B = st[b]; if (B.length && (B.length === 1 || B[B.length - 2] === B[B.length - 1])) srcs.push(b); }
    const b = srcs[Math.floor(Math.random() * srcs.length)];
    const dsts = []; for (let a = 0; a < st.length; a++) if (a !== b && st[a].length < cap) dsts.push(a);
    if (!dsts.length) continue;
    st[dsts[Math.floor(Math.random() * dsts.length)]].push(st[b].pop());
  }
  return st;
}
let lastGen = { attempts: 0, fallback: false };
function genLevel(colors, empty, cap) {
  for (let i = 1; i <= 40; i++) {
    const st = randomDeal(colors, empty, cap);
    if (solvable(st, cap, 25000)) { lastGen = { attempts: i, fallback: false }; return st; }
  }
  lastGen = { attempts: 40, fallback: true };
  return reverseDeal(colors, empty, cap);
}

// ---------- game state ----------
let sticks = [], initial = [], cap = 4, history = [], moves = 0, eaten = 0, sel = -1, won = false, started = false, stuck = false;
let flying = [], chewUntil = 0, wonAt = 0, nextId = 1, params = autoParams(1);
function curParams() { return cfg.auto ? autoParams(cfg.level) : { colors: cfg.colors, empty: cfg.empty, cap: cfg.cap }; }
function toRings(st) { return st.map((s) => s.map((c) => ({ id: nextId++, c, x: NaN, y: NaN }))); }
function newLevel() {
  params = curParams(); cap = params.cap;
  const st = genLevel(params.colors, params.empty, cap);
  initial = st.map((s) => s.slice());
  load(initial);
}
function load(st) {
  sticks = toRings(st); history = []; moves = 0; eaten = 0; sel = -1; won = false; stuck = false; flying = []; chewUntil = 0;
  $("won").style.display = "none"; updHud();
}
function colorsOf() { return sticks.map((s) => s.map((r) => r.c)); }
function updHud() {
  $("lvl").textContent = cfg.auto ? cfg.level : "C"; $("mv").textContent = moves; $("undo").disabled = !history.length;
}
function runOf(i) { const s = sticks[i]; let n = 0; for (let k = s.length - 1; k >= 0 && s[k].c === s[s.length - 1].c; k--) n++; return n; }

function tryMove(a, b) {
  const st = colorsOf(), n = moveAmount(st, a, b, cap);
  if (!n) return false;
  history.push({ snap: sticks.map((s) => s.slice()), moves, eaten });
  const part = sticks[a].splice(sticks[a].length - n, n);
  sticks[b].push(...part.reverse());
  // note: reverse() keeps the order of the lifted run (all same colour anyway)
  moves++;
  const B = sticks[b];
  if (B.length === cap && B.every((r) => r.c === B[0].c)) { // lollipop ready: Om Nom eats it
    const t0 = now() + 350;
    B.forEach((r, j) => flying.push({ r, t0: t0 + j * 90, x0: NaN, y0: NaN }));
    sticks[b] = [];
    eaten++;
    chewUntil = t0 + 90 * cap + 500 + 500;
  }
  if (sticks.every((s) => !s.length)) { won = true; wonAt = now() + 1300; if (cfg.auto && cfg.level >= bestLevel) { bestLevel = cfg.level + 1; try { localStorage.setItem("lab.best.sort", String(bestLevel)); } catch (e) {} } }
  stuck = !won && !legalMoves(colorsOf(), cap).length;
  updHud();
  return true;
}
function tap(i) {
  if (!started || won || i < 0 || i >= sticks.length) return;
  if (sel === -1) { if (sticks[i].length) sel = i; return; }
  if (sel === i) { sel = -1; return; }
  if (tryMove(sel, i)) { sel = -1; return; }
  sel = sticks[i].length ? i : -1;
}
function undo() {
  if (!history.length) return;
  const h = history.pop(); sticks = h.snap; moves = h.moves; eaten = h.eaten; sel = -1; won = false; stuck = false; flying = [];
  $("won").style.display = "none"; updHud();
}
function restart() { if (!started) return; load(initial); }

// ---------- layout ----------
const cv = $("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
const BAND = 100;
let spd = 1;
function layout() {
  const r = cv.getBoundingClientRect(); if (r.width < 2 || r.height < 2) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
window.addEventListener("resize", layout);
new ResizeObserver(layout).observe($("stage"));
function geom() {
  const S = sticks.length, rows = S <= 5 ? 1 : 2, per = Math.ceil(S / rows);
  const top = BAND, areaH = Math.max(120, H - top - 56), rowH = areaH / rows, cellW = W / per;
  const ringH = Math.min(30, rowH / (cap + 1.8)), ringW = Math.min(cellW * 0.84, 74);
  return { S, rows, per, top, rowH, cellW, ringH, ringW };
}
function stickXY(g, i) { // x centre, y of the base (floor)
  const row = Math.floor(i / g.per), col = i % g.per, inRow = Math.min(g.per, g.S - row * g.per);
  const x0 = (W - inRow * g.cellW) / 2;
  const rowTop = g.top + row * g.rowH;
  const used = (cap + 1.8) * g.ringH;
  return { x: x0 + col * g.cellW + g.cellW / 2, base: rowTop + g.rowH / 2 + used / 2 - g.ringH * 0.3, rowTop };
}
const omPos = () => ({ x: W - 52, y: 56, R: 30 });

// ---------- drawing ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function drawRing(x, y, w, h, c, s) {
  if (s <= 0.02) return;
  w *= s; h *= s;
  ctx.fillStyle = DARK[c]; rr(x - w / 2, y - h / 2 + 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = COLORS[c]; rr(x - w / 2, y - h / 2, w, h * 0.92, h / 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.4)"; rr(x - w * 0.36, y - h * 0.36, w * 0.5, h * 0.2, h * 0.1); ctx.fill();
}
function drawOm(t) {
  const { x, y, R } = omPos();
  const chewing = t < chewUntil;
  const fl = flying.find((f) => t >= f.t0 && f.p !== undefined && f.p < 1) || (flying.length && flying.some((f) => t >= f.t0 - 300));
  let open = 0.12, look = [0, 1];
  if (fl) { open = 0.9; look = [-1, 0.8]; }
  else if (chewing) { open = 0.3 + 0.3 * Math.abs(Math.sin(t / 90)); look = [-0.5, 0.5]; }
  const sq = chewing && !fl ? 1 + 0.04 * Math.sin(t / 55) : 1;
  const ln = Math.hypot(look[0], look[1]); look = [look[0] / ln, look[1] / ln];
  ctx.save(); ctx.translate(x, y + R * (1 - sq)); ctx.scale(1 / sq, sq);
  ctx.fillStyle = "#2E9E3D"; ctx.strokeStyle = "#1B6B27"; ctx.lineWidth = 3;
  for (const s of [-1, 1]) { rr(s * R * 0.42 - R * 0.17, R * 0.8, R * 0.34, R * 0.5, R * 0.17); ctx.fill(); ctx.stroke(); } // 2 legs
  for (const s of [-1, 1]) { // 2 arms
    ctx.save(); ctx.translate(s * R * 0.92, R * 0.1); ctx.rotate(s * (chewing ? -0.9 + 0.2 * Math.sin(t / 90) : -0.5));
    rr(-R * 0.14, -R * 0.1, R * 0.28, R * 0.7, R * 0.14); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  ctx.fillStyle = "#4FD15F"; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill(); ctx.stroke();
  for (const s of [-1, 1]) {
    const ex = s * R * 0.36, ey = -R * 0.28, er = R * 0.3;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, er, 0, 7); ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(ex + look[0] * er * 0.38, ey + look[1] * er * 0.38, er * 0.42, 0, 7); ctx.fill();
  }
  const mw = R * (0.45 + 0.4 * open), mh = R * (0.06 + 0.5 * open);
  ctx.fillStyle = "#6B1620"; ctx.beginPath(); ctx.ellipse(0, R * 0.42, mw, mh, 0, 0, 7); ctx.fill();
  ctx.restore();
}
let lastT = now();
function frame() {
  const t = now(), dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  if (!W) { requestAnimationFrame(frame); return; }
  const g = geom(), k = 1 - Math.exp(-dt * 16 * spd);
  // status text
  ctx.fillStyle = "#A9CBE0"; ctx.font = "700 14px system-ui, sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText(stuck ? "Stuck! Undo or Restart" : sel >= 0 ? "Now tap where to drop" : "Tap a stick", 14, 38);
  ctx.fillStyle = "#fff"; ctx.font = "900 20px system-ui, sans-serif";
  ctx.fillText("Lollipops: " + eaten + " / " + params.colors, 14, 64);
  drawOm(t);
  // sticks
  for (let i = 0; i < g.S; i++) {
    const p = stickXY(g, i), h = (cap + 0.9) * g.ringH;
    if (i === sel) { ctx.fillStyle = "rgba(255,255,255,.14)"; rr(p.x - g.cellW / 2 + 3, p.rowTop + 2, g.cellW - 6, g.rowH - 4, 14); ctx.fill(); }
    ctx.fillStyle = "#8AA7BA"; rr(p.x - 4, p.base - h, 8, h, 4); ctx.fill();
    ctx.fillStyle = "#6B8799"; rr(p.x - g.ringW * 0.5 - 4, p.base - 3, g.ringW + 8, 9, 5); ctx.fill();
  }
  // rings: smooth towards slots
  for (let i = 0; i < g.S; i++) {
    const p = stickXY(g, i), s = sticks[i], run = i === sel && s.length ? runOf(i) : 0;
    for (let j = 0; j < s.length; j++) {
      const r = s[j], lifted = run && j >= s.length - run;
      const tx = p.x, ty = p.base - (j + 0.5) * g.ringH - (lifted ? g.ringH * 1.5 + 6 : 0);
      if (isNaN(r.x)) { r.x = tx; r.y = ty; }
      r.x += (tx - r.x) * k; r.y += (ty - r.y) * k;
    }
  }
  for (let i = 0; i < g.S; i++) for (const r of sticks[i]) drawRing(r.x, r.y, g.ringW, g.ringH, r.c, 1);
  // flying lollipop rings -> Om Nom
  const om = omPos(), mx = om.x, my = om.y + om.R * 0.42;
  flying = flying.filter((f) => f.p === undefined || f.p < 1);
  for (const f of flying) {
    if (t < f.t0) { // wait in the slot (hold current spot)
      drawRing(f.r.x, f.r.y, g.ringW, g.ringH, f.r.c, 1); continue;
    }
    if (isNaN(f.x0)) { f.x0 = f.r.x; f.y0 = f.r.y; }
    f.p = Math.min(1, (t - f.t0) / (450 / spd));
    const p = f.p, x = f.x0 + (mx - f.x0) * p, y = f.y0 + (my - f.y0) * p - Math.sin(p * Math.PI) * 50;
    drawRing(x, y, g.ringW, g.ringH, f.r.c, 1 - 0.75 * p * p);
  }
  if (won && t > wonAt && $("won").style.display !== "flex") {
    $("wonT").textContent = "Level " + (cfg.auto ? cfg.level : "") + " clear!";
    $("wonP").textContent = moves + " moves";
    $("won").style.display = "flex";
  }
  requestAnimationFrame(frame);
}

// ---------- input: tap = pointerdown + pointerup without drift ----------
let down = null;
cv.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
cv.addEventListener("pointerup", (e) => {
  if (!down || e.pointerId !== down.id) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 14) return;
  const rc = cv.getBoundingClientRect(), x = e.clientX - rc.left, y = e.clientY - rc.top;
  tap(hit(x, y));
});
cv.addEventListener("pointercancel", () => { down = null; });
function hit(x, y) {
  const g = geom();
  for (let i = 0; i < g.S; i++) {
    const p = stickXY(g, i);
    if (Math.abs(x - p.x) <= g.cellW / 2 && y >= p.rowTop && y <= p.rowTop + g.rowH) return i;
  }
  return -1;
}

// ---------- UI ----------
function begin(level) { if (level != null) cfg.level = level; started = true; $("start").style.display = "none"; newLevel(); }
$("bestLvl").textContent = bestLevel > 1 ? "Reached level " + bestLevel : "";
$("play").addEventListener("click", () => begin(1));
$("next").addEventListener("click", () => { if (cfg.auto) cfg.level++; syncPanel(); newLevel(); });
$("undo").addEventListener("click", undo);
$("restart").addEventListener("click", restart);
$("gear").addEventListener("click", () => { const p = $("panel"); p.style.display = p.style.display === "block" ? "none" : "block"; });
function syncPanel() {
  const p = curParams();
  $("sLevel").value = cfg.level; $("vLevel").textContent = cfg.level;
  $("sColors").value = p.colors; $("vColors").textContent = p.colors;
  $("sEmpty").value = p.empty; $("vEmpty").textContent = p.empty;
  $("sCap").value = p.cap; $("vCap").textContent = p.cap;
  $("cAuto").checked = cfg.auto;
}
function custom() { // sliders for colors/empty/height switch to custom mode and rebuild the level
  const p = curParams();
  cfg.colors = Number($("sColors").value); cfg.empty = Number($("sEmpty").value); cfg.cap = Number($("sCap").value);
  cfg.auto = false; syncPanel(); if (started) newLevel();
}
["sColors", "sEmpty", "sCap"].forEach((id) => $(id).addEventListener("change", custom));
$("sLevel").addEventListener("change", () => { cfg.level = Number($("sLevel").value); cfg.auto = true; syncPanel(); if (started) newLevel(); });
$("cAuto").addEventListener("change", () => { cfg.auto = $("cAuto").checked; syncPanel(); if (started) newLevel(); });
["sColors", "sEmpty", "sCap", "sLevel"].forEach((id) => $(id).addEventListener("input", () => { $("v" + id.slice(1)).textContent = $(id).value; }));
syncPanel();

// ---------- test API ----------
window.__game = {
  ready: true,
  getState: () => ({ scene: !started ? "start" : won ? "won" : "play", level: cfg.level, auto: cfg.auto, sticks: colorsOf(), cap, moves, eaten, selected: sel, stuck, won, gen: lastGen, canUndo: history.length > 0 }),
  act(a, p) {
    if (a === "start") begin(p && p.level);
    else if (a === "tap") tap(p);
    else if (a === "undo") undo();
    else if (a === "restart") restart();
    else if (a === "next") { if (cfg.auto) cfg.level++; syncPanel(); newLevel(); }
    else if (a === "set") { Object.assign(cfg, p); syncPanel(); if (started) newLevel(); }
    else if (a === "setSticks") { cap = p.cap || cap; params = { colors: p.sticks.filter((s) => s.length).length, empty: 0, cap }; load(p.sticks); initial = p.sticks.map((s) => s.slice()); }
  },
  solvePath: () => { const path = []; return solvable(colorsOf(), cap, 200000, path) ? path : null; }, // dev: solution from the current state
  metrics: () => ({ fps: 60, frameMsP95: 16, drawCalls: -1 }),
};
layout();
requestAnimationFrame(frame);
</script>
