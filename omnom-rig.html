<script>
"use strict";
// ==== TUNE: главные числа — крутить здесь =====================================================
// Поле 320×420 u; 1 u = 3,375 px при ширине 1080 → Ом Ном 72 u ≈ 243 px (как в играх).
// Риг: assets/omnom-rig/omnom_rig.json (пути, кости, формы, позы), клипы и пружины — assets/omnom-rig/omnom_clips.json.
const W = 320, H = 420;
const PX = 6.4024, K = 1 / PX;          // px холста рига (= холст кадров v2 525×506) на 1 u
const DT = 1 / 60;
const TUNE = {
  floorY: 352,
  om: [226, 352],                // лапы Ома Нома в сценке, u
  pult: [160, 344],              // лапы в пульте (в воздухе — выше на airUp)
  airUp: 70,
  sling: [46, 262],              // рогатка: кожанка, u
  slingPull: 24,                 // u, оттяжка при прицеле
  candyR: 11,
  gravity: 784,                  // u/с², как в играх
  hitT: 0.9,                     // с полёта конфеты в рот
  missT: 0.84, missOver: [24, -86], // промах: цель — над усиком, чуть позади
  eatDist: 14, magnet: 32,       // u: рот ловит конфету; ближе magnet — подтягивает
  openFar: 110, openNear: 30, openTau: 0.06, // open 0..1 по расстоянию конфета — рот (как в рогатке: 110 u)
  loop: 15,                      // с, сценка
  events: [[0.6, "aim", "hit"], [1.9, "antic"], [2.5, "launch"], [5.7, "reload"], [6.3, "aim", "miss"], [7.4, "antic"], [7.9, "launch"],
    [10.0, "reload"], [10.5, "reach"], [12.5, "wave"]],
  swing: { hookY: 70, L: 80, amp: 0.9, release: 0.65, reachD: 30, pump: 2.4, catchR: 20, ropeTau: 0.12, ropeDamp: 3, minCross: 2, flyTiltPerU: 0.09 },
  dprMax: 2,
};
const C = { wall: "#F7E0B5", wall2: "#F0D3A0", card: "#C98A4B", card2: "#B8773D", shade: "#8F5427", cut: "#5A2E10",
  cream: "#FBEBD0", cream2: "#E9CFA3", ink: "#4A2512", candy: "#E8412F", candy2: "#B92A1E", wrap: "#FFC93C", dot: "#FFFFFF" };
const D2R = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---- Ом Ном кадрами приложения (D-40, не рисунок кодом) — блок OMS из hook.html; добавлено p.now (часы симуляции для моргания) ---------------------------
// Кадры лежат в assets/omnom/ — одна папка на все прототипы; новую версию Ома Нома копируем поверх теми же именами.
// Числа — из assets/omnom/omnom_frames.json: 6,4024 px на u, лапы = pivot, рот (кадр wide); зрачки — два слоя (левый и правый глаз), каждый ходит в эллипсе своего глаза (pupils.<кадр>.eyes).
// В файлах Ом Ном смотрит ВЛЕВО от зрителя; flip = смотрит вправо. Кадр: p.mx, p.my — точка рта в игре (u), p.fy — лапы (по умолчанию рот + 20).
const OMS = (() => {
  const PX = 6.4024, PIV = [0.5366, 0.0253], MOUTH = [-2.08, -19.98];
  // Зрачки — по слою на глаз. Для каждого: rest — центр зрачка в покое, c и r — эллипс хода центра зрачка (u от лап, оси кадра до зеркала).
  // Сдвиг взгляда d одинаков для обоих глаз, но центр каждого зрачка потом зажимается в эллипс СВОЕГО глаза: зрачок не выходит из белка и не переходит шов.
  const PUP = {
    neutral: { l: { rest: [-13.93, -44.86], c: [-16.67, -45.33], r: [3.91, 3.98] },
             r: { rest: [-0.81, -42.67], c: [2.23, -42.67], r: [6.22, 6.39] } },
    ajar:   { l: { rest: [-13.7, -47.75], c: [-15.42, -48.29], r: [2.61, 2.51] },
             r: { rest: [-1.6, -45.33], c: [1.92, -42.83], r: [6.06, 6.01] } },
    wide:   { l: { rest: [-13.39, -51.18], c: [-14.79, -51.42], r: [1.98, 1.54] },
             r: { rest: [-1.13, -48.76], c: [0.98, -45.95], r: [5.73, 5.06] } },
    wide2:  { l: { rest: [-13.93, -52.28], c: [-14.95, -52.67], r: [1.64, 1.31] },
             r: { rest: [-1.52, -49.54], c: [0.83, -46.58], r: [5.85, 5.25] } },
  };
  const LOOK = 7; // u: длина полного взгляда, больше любого радиуса хода — на краю эллипса зрачок упирается в границу
  const NAMES = ["neutral", "ajar", "wide", "wide2", "chew", "chew2", "sad", "joy", "blink", "half", "shadow"];
  for (const f in PUP) NAMES.push(f + "_pupils_l", f + "_pupils_r");
  const img = {};
  const waits = [];
  for (const n of NAMES) {
    const i = new Image(); img[n] = i;
    waits.push(new Promise((res) => { i.onload = i.onerror = res; }));
    i.src = "assets/omnom/" + n + ".png";
  }
  const ok = (i) => i && i.complete && i.naturalWidth > 0;
  // центр зрачка: покой + сдвиг (dx, dy), затем в эллипс хода своего глаза: q = (p - c) / r; |q| > 1 -> p = c + q/|q| * r
  function eyePos(e, dx, dy) {
    let px = e.rest[0] + dx, py = e.rest[1] + dy;
    const qx = (px - e.c[0]) / e.r[0], qy = (py - e.c[1]) / e.r[1], ql = Math.hypot(qx, qy);
    if (ql > 1) { px = e.c[0] + qx / ql * e.r[0]; py = e.c[1] + qy / ql * e.r[1]; }
    return [px, py];
  }
  // p: { frame, mx, my, fy?, flip?, tx?, ty?, rot?, piv?, shadow?, alpha? }; st — объект вызывающего: плавный взгляд
  const last = { frame: null, l: null, r: null, d: null };
  function draw(ctx, p, st) {
    let f = p.frame || "neutral";
    if (f === "neutral" && ((p.now != null ? p.now : performance.now()) + (p.blinkOff || 0)) % 3600 < 120) f = "blink";
    const base = img[f]; if (!ok(base)) return;
    const flip = p.flip ? -1 : 1, fx = p.mx - flip * MOUTH[0], fy = p.fy != null ? p.fy : p.my - MOUTH[1];
    const pw = base.naturalWidth, ph = base.naturalHeight, k = 1 / PX;
    ctx.save();
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    if (p.alpha != null) ctx.globalAlpha = p.alpha;
    if (p.shadow && ok(img.shadow)) ctx.drawImage(img.shadow, fx - 32, fy - 6, 64, 12);
    ctx.translate(fx, p.piv ? fy - p.piv : fy); if (p.rot) ctx.rotate(p.rot); if (p.piv) ctx.translate(0, p.piv);
    ctx.scale(flip * k, k);
    ctx.drawImage(base, -PIV[0] * pw, -(1 - PIV[1]) * ph);
    const pu = PUP[f], pl = img[f + "_pupils_l"], pr = img[f + "_pupils_r"];
    if (pu && ok(pl) && ok(pr)) {
      let gx = 0, gy = 0;
      if (p.tx != null) { // цель в системе кадра до зеркала; общий сдвиг взгляда, потом зажим по каждому глазу
        const pv = p.piv || 0;
        let dx = p.tx - fx, dy = p.ty - (fy - pv);
        if (p.rot) { const c = Math.cos(-p.rot), sn = Math.sin(-p.rot), qx = dx * c - dy * sn, qy = dx * sn + dy * c; dx = qx; dy = qy; }
        dy -= pv; dx *= flip;
        const ex = (pu.l.rest[0] + pu.r.rest[0]) / 2, ey = (pu.l.rest[1] + pu.r.rest[1]) / 2; // между глазами
        const vx = dx - ex, vy = dy - ey, L = Math.hypot(vx, vy) || 1, a = Math.min(1, L / 45);
        gx = vx / L * a * LOOK; gy = vy / L * a * LOOK;
      }
      if (st) { st.x = st.x == null ? gx : st.x + (gx - st.x) * 0.35; st.y = st.y == null ? gy : st.y + (gy - st.y) * 0.35; gx = st.x; gy = st.y; }
      const pL = eyePos(pu.l, gx, gy), pR = eyePos(pu.r, gx, gy);
      ctx.drawImage(pl, -PIV[0] * pw + (pL[0] - pu.l.rest[0]) * PX, -(1 - PIV[1]) * ph + (pL[1] - pu.l.rest[1]) * PX);
      ctx.drawImage(pr, -PIV[0] * pw + (pR[0] - pu.r.rest[0]) * PX, -(1 - PIV[1]) * ph + (pR[1] - pu.r.rest[1]) * PX);
      last.frame = f; last.l = pL; last.r = pR; last.d = [gx, gy];
    }
    ctx.restore();
  }
  return { draw, img, PUP, eyePos, last, loaded: Promise.all(waits), ready: () => NAMES.every((n) => ok(img[n])) };
})();

// ==== Матрицы 2×3 (как у canvas: x' = a x + c y + e, y' = b x + d y + f) ============================
function mmul(A, B, o) { o = o || new Array(6);
  const a = A[0] * B[0] + A[2] * B[1], b = A[1] * B[0] + A[3] * B[1], c = A[0] * B[2] + A[2] * B[3], d = A[1] * B[2] + A[3] * B[3],
    e = A[0] * B[4] + A[2] * B[5] + A[4], f = A[1] * B[4] + A[3] * B[5] + A[5];
  o[0] = a; o[1] = b; o[2] = c; o[3] = d; o[4] = e; o[5] = f; return o; }
function minv(A) { const det = A[0] * A[3] - A[1] * A[2] || 1e-12, a = A[3] / det, b = -A[1] / det, c = -A[2] / det, d = A[0] / det;
  return [a, b, c, d, -(a * A[4] + c * A[5]), -(b * A[4] + d * A[5])]; }
function map(A, x, y) { return [A[0] * x + A[2] * y + A[4], A[1] * x + A[3] * y + A[5]]; }
function mT(x, y) { return [1, 0, 0, 1, x, y]; }
function mR(deg) { const r = deg * D2R, c = Math.cos(r), s = Math.sin(r); return [c, s, -s, c, 0, 0]; }
function mS(x, y) { return [x, 0, 0, y, 0, 0]; }
function chain(...ms) { let o = ms[0].slice(); for (let i = 1; i < ms.length; i++) o = mmul(o, ms[i]); return o; }
// кость: local = T(t)·T(pivot)·R(r)·S(s)·T(−pivot)  (omnom_rig.json "transform")
function boneLocal(pv, v, k, o) { const r = v[k + 2] * D2R, c = Math.cos(r), s = Math.sin(r), sx = v[k + 3], sy = v[k + 4];
  const a = c * sx, b = s * sx, cc = -s * sy, d = c * sy, px = pv[0], py = pv[1];
  o[0] = a; o[1] = b; o[2] = cc; o[3] = d; o[4] = v[k] + px - (a * px + cc * py); o[5] = v[k + 1] + py - (b * px + d * py); return o; }

// ==== Риг: разбор json, семьи форм, рисование Path2D ===============================================
function parseD(d) { const cmds = [], nums = []; const re = /[MCLZ]|-?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/gi; let m;
  while ((m = re.exec(d))) { const s = m[0]; if (/^[a-z]$/i.test(s)) cmds.push(s.toUpperCase()); else nums.push(+s); }
  return { cmds, nums: Float64Array.from(nums) }; }
function toPath(cmds, n) { const p = new Path2D(); let k = 0;
  for (let i = 0; i < cmds.length; i++) { const c = cmds[i];
    if (c === "M") { p.moveTo(n[k], n[k + 1]); k += 2; } else if (c === "L") { p.lineTo(n[k], n[k + 1]); k += 2; }
    else if (c === "C") { p.bezierCurveTo(n[k], n[k + 1], n[k + 2], n[k + 3], n[k + 4], n[k + 5]); k += 6; } else p.closePath(); }
  return p; }
// слот семьи: одинаковый список команд у всех форм → морфинг = взвешенная сумма чисел
function makeMorph(ds) { const P = ds.map(parseD), cm = P[0].cmds.join("");
  for (const q of P) if (q.cmds.join("") !== cm || q.nums.length !== P[0].nums.length) throw new Error("morph: разные команды");
  return { P, cmds: P[0].cmds, buf: new Float64Array(P[0].nums.length), key: "", path: null }; }
function morphPath(m, w) { let key = ""; for (let i = 0; i < w.length; i++) key += (Math.round(w[i] * 1e4)) + ",";
  if (key === m.key) return m.path;
  const b = m.buf; b.fill(0);
  for (let f = 0; f < w.length; f++) { const wf = w[f]; if (!wf) continue; const n = m.P[f].nums; for (let i = 0; i < b.length; i++) b[i] += wf * n[i]; }
  m.key = key; m.path = toPath(m.cmds, b); return m.path; }
function polyArea(n) { let a = 0; const L = n.length - (n.length % 2); for (let i = 0; i < L; i += 2) { const j = (i + 2) % L; a += n[i] * n[j + 1] - n[j] * n[i + 1]; } return Math.abs(a) / 2; }

const R = { J: null, parts: [], bi: {}, NB: 0, shapes: [], byId: {}, fam: {}, mouth: {}, poses: {}, mot: null, clips: {}, CP: null, list: [] };
let HEAD, BODY, MOUTH, PUPL, PUPR, SPR1, SPR2, SPR3, HANDL, ROOT, SHADOW;
let FEET, CENTER, MOUTH_O, REST, TRAVEL, GRIP_HANG, SH_IMG = null;

function rigBuild(J, CJ) {
  R.J = J; R.mot = CJ.motion;
  J.parts.forEach((p, i) => { R.parts.push({ id: p.id, pi: p.parent ? R.bi[p.parent] : -1, pivot: p.pivot }); R.bi[p.id] = i; });
  R.NB = R.parts.length;
  [ROOT, BODY, HEAD, MOUTH, PUPL, PUPR, SPR1, SPR2, SPR3, HANDL, SHADOW] =
    ["root", "body", "head", "mouth", "pupil_l", "pupil_r", "sprout1", "sprout2", "sprout3", "hand_l", "shadow"].map((n) => R.bi[n]);
  FEET = J.anchors.feet; CENTER = [281.71, 300]; MOUTH_O = J.families.mouth.origin;
  REST = J.anchors.pupils.rest; TRAVEL = J.anchors.pupils.travel;
  for (const fn of ["body", "eyes", "lids"]) { const F = J.families[fn]; R.fam[fn] = { members: F.members, slots: F.slots }; }
  J.shapes.forEach((s, i) => {
    const o = { id: s.id, pi: R.bi[s.part], part: s.part, z: s.z, zFront: s.zFront, fill: s.fill, opacity: s.opacity, blur: s.blur,
      clip: s.clip || null, hidden: !!s.hidden, fam: null, morph: null, path: null, ord: i, mouth: false, nums: null };
    let fam = null; for (const fn of ["body", "eyes", "lids"]) if (R.fam[fn].slots.includes(s.id)) fam = fn;
    if (fam) { o.fam = fam; const F = J.families[fam]; o.morph = makeMorph(F.members.map((m) => F.forms[m][s.id])); }
    else { o.path = new Path2D(s.d); o.nums = parseD(s.d).nums; }
    R.shapes.push(o); R.byId[s.id] = o;
  });
  for (const g in J.families.mouth.groups) { const G = J.families.mouth.groups[g];
    R.mouth[g] = { members: G.members, slots: G.slots.map((sl, i) => ({ id: sl.id, pi: MOUTH, part: "mouth", z: sl.z, fill: sl.fill,
      clip: sl.clip || null, ord: 1000 + i, mouth: true, fam: "mouth", morph: makeMorph(G.members.map((m) => G.forms[m][sl.id])),
      upper: /^mouth\.tooth(U\d|\d)\.fill$/.test(sl.id) })), byId: {} };
    for (const s of R.mouth[g].slots) R.mouth[g].byId[s.id] = s; }
  // позы: json рига + свои (clips.json "poses": base + замены костей)
  for (const n in J.poses) R.poses[n] = poseFromJson(J.poses[n]);
  for (const n in CJ.poses) { const c = CJ.poses[n]; const P = clonePose(R.poses[c.base]);
    for (const id in c.bones || {}) setBone(P, id, c.bones[id], false); R.poses[n] = P; }
  R.CP = CJ; for (const n in CJ.clips) R.clips[n] = compileClip(CJ.clips[n]);
  // точка хвата за верёвку: центр лапки в позе hangRig (px рига, от корня)
  const hb = bbox(R.byId["hand_l.fill"].nums); const dsH = dsFromPose(R.poses.hangRig, mT(0, 0) /* в px рига */, true);
  GRIP_HANG = map(dsH.world[HANDL], (hb[0] + hb[2]) / 2, (hb[1] + hb[3]) / 2);
  // тень: размытие один раз в картинку (подсказка "blur" в json; ctx.filter есть не везде — берём shadowBlur)
  const sh = R.byId["shadow.shape"], b = bbox(sh.nums), m = sh.blur * 3;

    const q = (arr, f) => { const s = arr.slice().sort((x, y) => x - y); return s.length ? s[Math.min(s.length - 1, Math.floor(s.length * f))] : 0; };
    const mean = frameTimes.reduce((s, x) => s + x, 0) / (frameTimes.length || 1);
    return { fps: frameTimes.length ? Math.round(1000 / mean) : 0, frameMsP95: +q(frameTimes, 0.95).toFixed(2), drawMsP95: +q(drawTimes, 0.95).toFixed(2), drawMsMax: +q(drawTimes, 1).toFixed(2), drawCalls: -1 };
  },
};

// ==== Загрузка ======================================================================================
syncSliders(); document.getElementById("rules").textContent = RULES.scene;
Promise.all([fetch("assets/omnom-rig/omnom_rig.json").then((r) => r.json()), fetch("assets/omnom-rig/omnom_clips.json").then((r) => r.json()), OMS.loaded, v2Loaded])
  .then(([J, CJ]) => { rigBuild(J, CJ); setScene("scene"); $("msg").style.display = "none"; window.__game.ready = true; requestAnimationFrame(frame); })
  .catch((err) => { $("msg").textContent = "Не загрузился риг: " + err.message + ". Открой лабораторию через сервер (не file://)."; console.warn(err); });
</script>
