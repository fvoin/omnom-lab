// ---- Геометрия ----

        flightBubble: r2(mean(all.filter((s) => s.bubble).map((s) => s.flight))), flightNoBubble: r2(mean(all.filter((s) => !s.bubble).map((s) => s.flight))),

// ---- Ввод: Pointer Events. Оттяжка начинается под полем (y ≥ 396) и тянется вниз; в полёте тап — пузырь плывёт к пальцу ----
let ptr = null;
function toU(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
stage.addEventListener("pointerdown", (e) => {
  if (ptr !== null || e.target.closest("#end")) return;
  initAudio();
  if (bot) { bot = null; if (S.phase === "drag") cancelPull(); }
  const u = toU(e);
  if (S.phase === "fly") { tap(u.x, u.y); e.preventDefault(); return; }
  if (u.y < PULL_ZONE) return; // выше — не жест: рука закрыла бы поле
  if (!startPull()) return;
  ptr = { id: e.pointerId, y: e.clientY };
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});
stage.addEventListener("pointermove", (e) => { if (ptr && e.pointerId === ptr.id) setPull((e.clientY - ptr.y) / scale * TUNE.pullGain); });
function up(e) { if (!ptr || e.pointerId !== ptr.id) return; ptr = null; if (e.type === "pointercancel") cancelPull(); else release(); }
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
document.addEventListener("visibilitychange", () => { if (document.hidden && ptr) { ptr = null; cancelPull(); } });
window.addEventListener("blur", () => { if (ptr) { ptr = null; cancelPull(); } });
function onButton(id, fn) { const b = document.getElementById(id); b.addEventListener("pointerdown", (e) => e.stopPropagation()); b.addEventListener("click", (e) => { e.stopPropagation(); initAudio(); fn(); }); }
onButton("restart", () => newGame(S.seed));
onButton("again", () => newGame());
onButton("newseed", () => newGame());
onButton("tuneBtn", () => document.getElementById("tune").classList.toggle("on"));
(function buildTune() {
  const box = document.getElementById("tune");
  for (const [k, label, mn, mx, st] of KNOBS) {
    const l = document.createElement("label"); l.textContent = label;
    const i = document.createElement("input"); i.type = "range"; i.min = mn; i.max = mx; i.step = st; i.value = TUNE[k];
    const v = document.createElement("span"); v.textContent = TUNE[k];
    i.addEventListener("input", () => { TUNE[k] = +i.value; v.textContent = i.value; });
    box.append(l, i, v);
  }
})();

// ---- Цикл: фиксированный тик 1/60 ----
let manual = false, acc = 0, last = performance.now();
const frames = [];
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  frames.push(now); if (frames.length > 120) frames.shift();
  if (!manual) { acc += dt; let n = 0; while (acc >= DT && n < 3) { tick(); acc -= DT; n++; } if (n === 3) acc = 0; }
  render();
  requestAnimationFrame(loop);
}

// ---- Тестовый API ----
function shortState() { return { phase: S.phase, scene: S.scene, field: S.field, shotsLeft: S.shotsLeft, goldLeft: S.goldLeft, goldTotal: S.goldTotal, score: S.score, fieldsCleared: S.fieldsCleared, chain: S.chain, flightT: +S.flightT.toFixed(3), bubbleUsed: S.bubbleUsed, tired: S.tired, pull: S.pull, stars: S.scene === "end" ? stars() : null }; }
window.__game = {
  ready: false,
  state: shortState,
  getState() {
    const r = cv.getBoundingClientRect(), c = S.candy;
    return Object.assign(shortState(), {
      seed: S.seed, template: S.template, moving: S.moving, tick: Math.round(S.t * 60), ft: +S.ft.toFixed(3), lastAct: S.lastAct, omFrame,
      maxChain: S.maxChain, shot: S.shot, fieldShot: S.fieldShot, catches: S.catches, firstGold: S.firstGold, firstPegs: S.firstPegs, record: S.record,
      pegsAlive: S.pegs.filter((p) => p.alive).length, mintTarget: S.mintTarget, lit: S.pegs.filter((p) => p.alive && p.lit).length,
      pegs: S.pegs.filter((p) => p.alive).map((p) => ({ x: +p.x.toFixed(1), y: +p.y.toFixed(1), a: +p.a.toFixed(3), gold: p.gold, lit: p.lit, moving: !!p.mv, drop: +p.drop.toFixed(2) })),
      bubble: { used: S.bubbleUsed, active: !!c.bubble, t: +c.bubbleT.toFixed(2), tx: c.bubble ? c.btx : null, ty: c.bubble ? c.bty : null },
      candy: { x: c.x, y: c.y, vx: c.vx, vy: c.vy, vis: c.vis }, lastPull: S.lastPull,
      aim: S.phase === "drag" && S.pull >= TUNE.pullMin ? (() => { const a = aimPath(S.pull); return { mark: a.mark, hit: a.hit, first: a.pts[0] || null }; })() : null,
      cart: { x: cartX(), mouthY: MOUTH_Y, catchW: TUNE.catchW }, lastShot: S.lastShot, banner: S.banner ? S.banner.text : null,
      flyers: S.flyers.length, popups: S.popups.length, log: S.log.slice(-40), bot: bot ? bot.skill : null,
      view: { left: r.left, top: r.top, scale, W, H, exit: EXIT, field: F, pullZone: PULL_ZONE }, tune: TUNE, art: ART.ok,
    });
  },
  act(a, p) {
    if (a === "seed" || a === "newGame") newGame(typeof p === "object" && p ? p.seed : p);
    else if (a === "restart") newGame(S.seed);
    else if (a === "pull") { if (S.phase === "aim") startPull(); setPull(typeof p === "object" ? p.y : p); }
    else if (a === "release") return release();
    else if (a === "shoot") { if (!startPull()) return false; setPull(typeof p === "object" ? p.y : p); return release(); }
    else if (a === "tap") return p && typeof p === "object" ? tap(p.x, p.y) : tap();
    else if (a === "clock") manual = !!(p && p.manual);
    else if (a === "step") { for (let i = 0; i < (p || 1); i++) tick(); }
    else if (a === "skipRain") { for (const pg of S.pegs) pg.drop = 0; if (S.phase === "rain") toAim(); }
    else if (a === "autoplay") { bot = p === false || (p && p.on === false) ? null : { skill: p && p.skill != null ? +p.skill : 1 }; if (S) { S.botT = 0; S.botPlan = null; } }
    else if (a === "plan") return botPlan();
    else if (a === "bench") return bench(p);
    else if (a === "setTune") { Object.assign(TUNE, p); }
    else if (a === "setShots") { S.shotsLeft = +p; updateHud(); }
    else if (a === "clearGold") { for (const pg of S.pegs) if (pg.gold && pg.alive) { pg.alive = false; S.goldLeft--; } updateHud(); } // dev: следующий выстрел очистит поле
    else if (a === "render") render();
  },
  metrics() {
    const d = []; for (let i = 1; i < frames.length; i++) d.push(frames[i] - frames[i - 1]);
    const avg = d.length ? d.reduce((s, x) => s + x, 0) / d.length : 16.7; d.sort((x, y) => x - y);
    return { fps: Math.round(1000 / avg), frameMsP95: d.length ? d[Math.floor(d.length * 0.95)] : 0, drawCalls: -1 };
  },
};
// ?seed=7&bot=1 — бот играет сам; любые ключи TUNE тоже из адреса (?e=0.7&refill=0.5)
newGame(q.has("seed") ? +q.get("seed") : undefined);
if (q.has("bot")) bot = { skill: +q.get("bot") || 0 };
fit(); render();
Promise.all([OMS.loaded, ART.loaded]).then(() => { window.__game.ready = true; });
requestAnimationFrame(loop);
</script>
