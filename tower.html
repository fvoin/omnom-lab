<script>
"use strict";
// ---- Ом Ном кадрами приложения (D-40, не рисунок кодом) ---------------------------
// Кадры лежат в assets/omnom/ — одна папка на все прототипы; новую версию Ома Нома копируем поверх теми же именами.
// Числа — из assets/omnom/omnom_frames.json: 6,4024 px на u, лапы = pivot, рот (кадр wide); зрачки — два слоя (левый и правый глаз), каждый ходит в эллипсе своего глаза (pupils.<кадр>.eyes).
// В файлах Ом Ном смотрит ВЛЕВО от зрителя; flip = смотрит вправо. Кадр: p.mx, p.my — точка рта в игре (u), p.fy — лапы (по умолчанию рот + 20).
const OMS = (() => {
  const PX = 6.4024, PIV = [0.5366, 0.0253], MOUTH = [-2.08, -19.98];
  // Зрачки — по слою на глаз. Для каждого: rest — центр зрачка в покое, c и r — эллипс хода центра зрачка (u от лап, оси кадра до зеркала).
  // Сдвиг взгляда d одинаков для обоих глаз, но центр каждого зрачка потом зажимается в эллипс СВОЕГО глаза: зрачок не выходит из белка и не переходит шов.
  const PUP = {
    neutral: { l: { rest: [-13.93, -44.86], c: [-16.67, -45.33], r: [3.91, 3.98] },
             r: { rest: [-0.81, -42.67], c: [2.23, -42.67], r: [6.22, 6.39] } },
    ajar:   { l: { rest: [-13.7, -47.75], c: [-15.42, -48.29], r: [2.61, 2.51] },
             r: { rest: [-1.6, -45.33], c: [1.92, -42.83], r: [6.06, 6.01] } },
    wide:   { l: { rest: [-13.39, -51.18], c: [-14.79, -51.42], r: [1.98, 1.54] },
             r: { rest: [-1.13, -48.76], c: [0.98, -45.95], r: [5.73, 5.06] } },
    wide2:  { l: { rest: [-13.93, -52.28], c: [-14.95, -52.67], r: [1.64, 1.31] },
             r: { rest: [-1.52, -49.54], c: [0.83, -46.58], r: [5.85, 5.25] } },
  };
  const LOOK = 7; // u: длина полного взгляда, больше любого радиуса хода — на краю эллипса зрачок упирается в границу
  const NAMES = ["neutral", "ajar", "wide", "wide2", "chew", "chew2", "sad", "joy", "blink", "half", "shadow"];
  for (const f in PUP) NAMES.push(f + "_pupils_l", f + "_pupils_r");
  const img = {};
  const waits = [];
  for (const n of NAMES) {
    const i = new Image(); img[n] = i;
    waits.push(new Promise((res) => { i.onload = i.onerror = res; }));
    i.src = "assets/omnom/" + n + ".png";
  }
  const ok = (i) => i && i.complete && i.naturalWidth > 0;
  // центр зрачка: покой + сдвиг (dx, dy), затем в эллипс хода своего глаза: q = (p - c) / r; |q| > 1 -> p = c + q/|q| * r
  function eyePos(e, dx, dy) {
    let px = e.rest[0] + dx, py = e.rest[1] + dy;
    const qx = (px - e.c[0]) / e.r[0], qy = (py - e.c[1]) / e.r[1], ql = Math.hypot(qx, qy);
    if (ql > 1) { px = e.c[0] + qx / ql * e.r[0]; py = e.c[1] + qy / ql * e.r[1]; }
    return [px, py];
  }
  // p: { frame, mx, my, fy?, flip?, tx?, ty?, rot?, piv?, shadow?, alpha? }; st — объект вызывающего: плавный взгляд
  const last = { frame: null, l: null, r: null, d: null };
  function draw(ctx, p, st) {
    let f = p.frame || "neutral";
    if (f === "neutral" && (performance.now() + (p.blinkOff || 0)) % 3600 < 120) f = "blink";
    const base = img[f]; if (!ok(base)) return;
    const flip = p.flip ? -1 : 1, fx = p.mx - flip * MOUTH[0], fy = p.fy != null ? p.fy : p.my - MOUTH[1];
    const pw = base.naturalWidth, ph = base.naturalHeight, k = 1 / PX;
    ctx.save();
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    if (p.alpha != null) ctx.globalAlpha = p.alpha;
    if (p.shadow && ok(img.shadow)) ctx.drawImage(img.shadow, fx - 32, fy - 6, 64, 12);
    ctx.translate(fx, p.piv ? fy - p.piv : fy); if (p.rot) ctx.rotate(p.rot); if (p.piv) ctx.translate(0, p.piv);
    ctx.scale(flip * k, k);
    ctx.drawImage(base, -PIV[0] * pw, -(1 - PIV[1]) * ph);
    const pu = PUP[f], pl = img[f + "_pupils_l"], pr = img[f + "_pupils_r"];
    if (pu && ok(pl) && ok(pr)) {
      let gx = 0, gy = 0;
      if (p.tx != null) { // цель в системе кадра до зеркала; общий сдвиг взгляда, потом зажим по каждому глазу
        const pv = p.piv || 0;
        let dx = p.tx - fx, dy = p.ty - (fy - pv);
        if (p.rot) { const c = Math.cos(-p.rot), sn = Math.sin(-p.rot), qx = dx * c - dy * sn, qy = dx * sn + dy * c; dx = qx; dy = qy; }
        dy -= pv; dx *= flip;
        const ex = (pu.l.rest[0] + pu.r.rest[0]) / 2, ey = (pu.l.rest[1] + pu.r.rest[1]) / 2; // между глазами
        const vx = dx - ex, vy = dy - ey, L = Math.hypot(vx, vy) || 1, a = Math.min(1, L / 45);
        gx = vx / L * a * LOOK; gy = vy / L * a * LOOK;
      }
      if (st) { st.x = st.x == null ? gx : st.x + (gx - st.x) * 0.35; st.y = st.y == null ? gy : st.y + (gy - st.y) * 0.35; gx = st.x; gy = st.y; }
      const pL = eyePos(pu.l, gx, gy), pR = eyePos(pu.r, gx, gy);
      ctx.drawImage(pl, -PIV[0] * pw + (pL[0] - pu.l.rest[0]) * PX, -(1 - PIV[1]) * ph + (pL[1] - pu.l.rest[1]) * PX);
      ctx.drawImage(pr, -PIV[0] * pw + (pR[0] - pu.r.rest[0]) * PX, -(1 - PIV[1]) * ph + (pR[1] - pu.r.rest[1]) * PX);
      last.frame = f; last.l = pL; last.r = pR; last.d = [gx, gy];
    }
    ctx.restore();
  }
  return { draw, img, PUP, eyePos, last, loaded: Promise.all(waits), ready: () => NAMES.every((n) => ok(img[n])) };
})();
// ---- Главные числа. Кадр 1080×1920 опорных px (design/lab-tower-physics.md, tower.md §3–6) ----
const TUNE = {
  // режим physics (lab-tower-physics.md §3)
  layerW: 220,        // ширина каждого слоя; главная ручка сложности (базовый на блюде — 756). Спека: 300; по калибровке бота (счёт = поставленные слои) подобрано 220
  lives: 3,           // вишенки
  swayT: 2.4,         // с, период раскачки башни, не кратен маятнику
  swayPerLayer: 2,    // px раскачки на слой
  swayLean: 1.0,      // вклад кривизны (|lean| = смещение среднего центра от 540)
  swayMax: 200,       // px, потолок
  perfectPx: 14,      // допуск «идеально» (оба режима)
  perfectCalm: 0.7,   // успокоение башни на серии ≥ 3
  star2: 20, star3: 35, // physics: взрослый × 0,7 и хороший × 0,85, округлено до 5 (calib)
  // режим current (tower.md §6)
  curStar2: 15, curStar3: 30,
  maxLayers: 50,
  // общее
  fallT: 0.42,        // с, падение с 520 px
  rampT: 0.3,         // с, плавный переход раскачки / высоты к новым значениям
  bonusFrom: 3,       // серия «идеально» ≥ 3: следующее даёт +24 к ширине (current)
  bonusPx: 24,
  collapseCamT: 0.5,  // с, камера после обрушения
  // бот: модели игроков (σ мс, β — предугадывание сдвига вершины, γ — выпрямление башни) для skill 0 / 0,5 / 1
  botSigma: [90, 45, 25], botBeta: [0.4, 0.7, 0.95], botGamma: [0, 0.3, 0.6],
  botFrom: 0.3,       // с после готовности — раньше бот не целится
};
const FW = 1080, FH = 1920, DT = 1 / 60;
const PLATE_Y = 1760, LH = 96, BASE_W = 756, X0 = 540;
const HOVER_GAP = 520, ROPE_H = 950, CAM_TOP = 1150, OMK = 3.056; // Ом Ном 72 u × 3,056 = 220 px
const C = { ink: "#4A2512", cream: "#FBEBD0", creamSh: "#E9CFA3", card: "#C98A4B", cardMid: "#B8773D", cardSh: "#8F5427", cut: "#5A2E10",
  mint: "#8FE3C0", mintHi: "#BFF2DC", mintLo: "#6FCFA8", gold: "#FFD23F", act: "#E8458A", cherry: "#D8213C" };
const SL = [ // цвета крема по кругу: розовый, шоколад, ваниль, лимонный
  { b: "#F58FB5", c: "#FFD3E4", s: "#D96A93" }, { b: "#8A4E2C", c: "#CF946A", s: "#5E3019" },
  { b: "#FFE9A8", c: "#FFF8E1", s: "#E5C970" }, { b: "#F7DC5A", c: "#FFF2A0", s: "#D9BA2E" } ];
const BASE_COL = { b: "#EFD9AE", c: "#FBEBD0", s: "#C98A4B" };

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = (u) => u * u * (3 - 2 * u);
const ramp = (t, t0, dur) => clamp((t - t0) / dur, 0, 1);
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r) { const u = Math.max(1e-9, r()), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const periodOf = (k) => Math.max(1.3, 2.6 - 0.1 * Math.floor((k - 1) / 2));
const ampCurve = (k) => k <= 5 ? 260 : k <= 15 ? 320 : 380;
function interp3(arr, s) { return s <= 0.5 ? lerp(arr[0], arr[1], s / 0.5) : lerp(arr[1], arr[2], (s - 0.5) / 0.5); }

// ---- Состояние ----
let MODE = "current";
try { const m = localStorage.getItem("lab.tower.mode"); if (m === "physics" || m === "current") MODE = m; } catch (e) {}
const BEST = { current: 0, physics: 0 };
try { BEST.current = +localStorage.getItem("lab.best.tower-current") || 0; BEST.physics = +localStorage.getItem("lab.best.tower-physics") || 0; } catch (e) {}
let S;                       // текущий раунд
let bot = null;              // { skill, naive } — живёт между раундами, пока не выключат или игрок не тронет экран
let manual = false, acc = 0, loopNow = performance.now(), firstRound = true;

function newRound(seed, mode, silent) {
  if (mode === "current" || mode === "physics") { MODE = mode; if (!silent) { try { localStorage.setItem("lab.tower.mode", MODE); } catch (e) {} } }
  if (seed == null) seed = (Math.random() * 0x7fffffff) | 0;
  const rng = mulberry(seed);
  S = {
    seed, mode: MODE, silent: !!silent, scene: "play", phase: "after", tick: 0, t: 0,
    rng, brng: mulberry(seed ^ 0x9e3779b9), vrng: mulberry(seed ^ 0x5bd1e995),
    psi: rng() * Math.PI * 2,
    layers: [{ x: X0, w: BASE_W, ci: -1 }], n: 0, placed: 0,
    score: 0, lives: TUNE.lives, streak: 0, falls: 0, collapses: 0, perfects: 0,
    lastResult: null, lastOffset: null, lastEvent: null, lastAct: null,
    sw: { Lf: 0, Lt: 0, Hf: 1, Ht: 1, t0: 0 }, lean: 0,
    cam: { f: 0, to: 0, t0: 0, dur: TUNE.rampT },
    cur: null, fall: null, cutAt: null, hop: null, jump: null, react: null,
    lowT0: 0, readyTick: 24, readyT: 0.4,
    crumbs: [], debris: [], rings: [], texts: [], stubs: [],
    squash: null, overT: 0, endTick: 0, stats: null, flip: false, hintOff: !firstRound,
  };
  prepareLayer(24); S.jump = { t0: 3, t1: 24 };
  S.cam.f = S.cam.to = camTarget(0);
  botPlanned = false;
  if (!silent) { updateUi(); hideEnd(); }
}
let botPlanned = false;

// ---- Кривая маятника и раскачка ----
function prepareLayer(readyTick) {
  const top = S.layers[S.n], k = S.n + 1, c = top.x;
  const w = S.mode === "current" ? top.w : TUNE.layerW;
  const fit = Math.min(c, FW - c) - 0.35 * w;
  const A = S.mode === "current" ? Math.max(150, Math.min(ampCurve(k), fit)) : Math.max(60, Math.min(ampCurve(k), fit));
  S.cur = { c, w, A, T: periodOf(k), phi0: (k % 2 ? 1 : -1) * Math.PI / 2, k, ci: S.placed % 4 };
  S.readyTick = readyTick; S.readyT = readyTick * DT;
}
function xl(t) { const c = S.cur; return c.c + c.A * Math.sin(2 * Math.PI * (t - S.readyT) / c.T + c.phi0); }
const Lat = (t) => lerp(S.sw.Lf, S.sw.Lt, smooth(ramp(t, S.sw.t0, TUNE.rampT)));
const Hat = (t) => Math.max(1, lerp(S.sw.Hf, S.sw.Ht, smooth(ramp(t, S.sw.t0, TUNE.rampT))));
function swayAt(t) { return S.mode === "physics" ? Lat(t) * Math.sin(2 * Math.PI * t / TUNE.swayT + S.psi) : 0; }
function tiltAt(t) { return S.mode === "physics" ? Math.atan(swayAt(t) / (Hat(t) * LH)) : 0; }
// пересчёт силы раскачки после посадки / обрушения / соскальзывания; t0 — момент события
function retarget(t0) {
  const n = S.n; let lean = 0;
  if (n > 0) { let sum = 0; for (let i = 1; i <= n; i++) sum += S.layers[i].x; lean = sum / n - X0; }
  let L = Math.min(TUNE.swayMax, TUNE.swayPerLayer * n + TUNE.swayLean * Math.abs(lean));
  if (S.streak >= 3) L *= TUNE.perfectCalm;
  S.sw = { Lf: Lat(t0), Lt: L, Hf: Hat(t0), Ht: Math.max(1, n), t0 };
  S.lean = lean;
}
function topWorldY(n) { return PLATE_Y - LH * (n + 1); }
function camTarget(n) { return Math.max(0, CAM_TOP - topWorldY(n)); }
function camAt(t) { const c = S.cam; const u = ramp(t, c.t0, c.dur); return lerp(c.f, c.to, 1 - (1 - u) * (1 - u)); }
function moveCam(t0, dur) { S.cam = { f: camAt(t0), to: camTarget(S.n), t0, dur }; }

// поза слоя i башни в момент t (центр, наклон)
function poseOf(i, t) {
  const L = S.layers[i];
  if (i === 0) return { x: L.x, y: PLATE_Y - LH / 2, rot: 0, w: L.w, ci: L.ci };
  const sw = swayAt(t), H = Hat(t), th = S.mode === "physics" ? Math.atan(sw / (H * LH)) : 0;
  let x = L.x + sw * i / H;
  if (L.corr) x += L.corr * (1 - smooth(ramp(t, L.corrT0, TUNE.rampT)));
  const y = PLATE_Y - (i + 0.5) * LH * Math.cos(th) + (L.x - X0) * Math.sin(th);
  return { x, y, rot: th, w: L.w, ci: L.ci };
}
function topPt(i, t) { const p = poseOf(i, t); return { x: p.x + 48 * Math.sin(p.rot), y: p.y - 48 * Math.cos(p.rot), rot: p.rot }; }
function hoverY() { return topWorldY(S.n) - HOVER_GAP - LH / 2; }
function hangPose(t) {
  const c = S.cur, hv = hoverY();
  if (t < S.readyT) {
    const u = clamp((t - S.lowT0 * DT) / (21 * DT), 0, 1), e = 1 - (1 - u) * (1 - u);
    return { x: xl(S.readyT), y: hv - 60 - 400 * (1 - e) };
  }
  const ph = 2 * Math.PI * (t - S.readyT) / c.T + c.phi0;
  return { x: c.c + c.A * Math.sin(ph), y: hv - 60 * Math.sin(ph) * Math.sin(ph) };
}
function yTargetFall(t) { // центр падающего слоя в момент посадки: на вершине башни, с учётом её наклона в момент t
  const th = tiltAt(t), xn = S.fall.xnew;
  return PLATE_Y - (S.n + 1.5) * LH * Math.cos(th) + (xn - X0) * Math.sin(th);
}
function fallPose(t) {
  const F = S.fall, tau = clamp((t - F.tcut) / TUNE.fallT, 0, 1);
  return { x: F.x0, y: F.y0 + (yTargetFall(t) - F.y0) * tau * tau, tau };
}

// ---- Действия игрока ----
// tcut — момент среза в секундах игры (дробный: не привязан к тику)
function doCut(tcut) {
  if (S.scene !== "play" || S.phase !== "ready") return false;
  const top = S.layers[S.n];
  tcut = Math.max(S.readyT, tcut);
  const x0 = xl(tcut), hp = hangPose(tcut);
  const phys = S.mode === "physics";

// ---- Посадка ----

// ---- Шаг игры ----

}

// ---- Рисование ----
const cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
let scale = 1, dpr = 1, lastW = 0, lastH = 0;
function fit() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  const nd = Math.min(2, window.devicePixelRatio || 1);
  if (w === lastW && h === lastH && nd === dpr) return;
  lastW = w; lastH = h; dpr = nd;
  scale = Math.min((w - 28) / FW, (h - 28) / FH);
  cv.style.width = FW * scale + "px"; cv.style.height = FH * scale + "px";
  cv.style.left = (w - FW * scale) / 2 + "px"; cv.style.top = (h - FH * scale) / 2 + "px";

// ---- Ом Ном (кадры приложения) ----
const omGaze = {};

  }

  drawPlate();
  const phys = S.mode === "physics";
  const hanging = S.phase === "ready" || (S.phase === "after" && S.tick >= S.lowT0);
  // верёвки (за башней)
  if (hanging) {
    const h = hangPose(rt), nx = S.cur.c, ny = topWorldY(S.n) - ROPE_H, hw = S.cur.w / 2 - 22;
    ctx.strokeStyle = C.cut; ctx.lineWidth = 9; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(h.x - hw, h.y - 48); ctx.moveTo(nx, ny); ctx.lineTo(h.x + hw, h.y - 48); ctx.stroke();
    circle(nx, ny, 22, C.gold, C.ink, 6);
  }
  for (const s of S.stubs) {
    const u = (S.tick - s.t0) / 30; ctx.globalAlpha = 1 - u; ctx.strokeStyle = C.cut; ctx.lineWidth = 9; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - 50, s.y + 40 + 200 * u * u); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + 50, s.y + 40 + 200 * u * u); ctx.stroke();
    ctx.globalAlpha = 1; circle(s.x, s.y, 22, C.gold, C.ink, 6);
  }

  const view0 = -cam - 140, view1 = -cam + FH + 140;
  for (let i = 0; i <= S.n; i++) {
    const p = poseOf(i, rt);
    if (p.y < view0 || p.y > view1) continue;
    let sq = 0;
    if (i === S.n && S.squash) { const u = (tickf - S.squash.t0) / 9; if (u >= 0 && u < 1) sq = 1 - 0.09 * Math.sin(Math.PI * u); }
    let wob = 0;
    if (S.wobble && i === S.wobble.i) { const u = (tickf - S.wobble.t0) / 24; if (u >= 0 && u < 1) wob = 0.09 * Math.sin(u * 3 * Math.PI) * (1 - u); }
    drawSlab(p.x, p.y, p.w, LH + 6, p.rot + wob, colOf(p.ci), sq);
  }
  // пунктирная проекция под качающимся слоем — на текущую вершину (не предсказание)
  if (hanging && S.phase === "ready") {
    const h = hangPose(rt), th = tiltAt(rt);
    ctx.save(); ctx.translate(h.x, PLATE_Y - (S.n + 1.5) * LH * Math.cos(th) + (h.x - X0) * Math.sin(th)); ctx.rotate(th);
    ctx.setLineDash([16, 12]); ctx.lineWidth = 5; ctx.strokeStyle = "rgba(74,37,18,.55)"; ctx.lineCap = "butt";
    rrect(-S.cur.w / 2, -LH / 2 + 4, S.cur.w, LH - 8, 16); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  }
  // кусочки, падающие / съезжающие
  for (const d of S.debris) {
    const e = (tickf - d.t0) * DT, th = d.dir * (d.spin * e + d.spin2 * e * e), c = Math.cos(th), s = Math.sin(th);
    for (const pc of d.pieces) {
      const rx = pc.x - d.px, ry = pc.y - d.py;
      const x = d.px + rx * c - ry * s + d.vx * e, y = d.py + rx * s + ry * c + d.vy * e + 0.5 * d.g * e * e;
      drawSlab(x, y, pc.w, pc.h, pc.rot + th, colOf(pc.ci));
    }
  }
  // висящий / падающий слой и Ом Ном
  if (S.phase === "fall") { const f = fallPose(rt); drawSlab(f.x, f.y, S.fall.w, LH, 0, colOf(S.fall.ci)); }
  else if (hanging) { const h = hangPose(rt); drawSlab(h.x, h.y, S.cur.w, LH, 0, colOf(S.cur.ci)); }
  drawOm(rt, tickf);
  // эффекты
  for (const c of S.crumbs) { const u = (tickf - c.t0) / c.life; ctx.globalAlpha = clamp(1.4 - u * 1.4, 0, 1); circle(c.x, c.y, c.r, c.col, C.ink, 2); }
  ctx.globalAlpha = 1;
  for (const r of S.rings) {
    const u = (tickf - r.t0) / 15; ctx.globalAlpha = 1 - u; ctx.lineWidth = r.bright ? 12 : 8; ctx.strokeStyle = r.bright ? "#FFFFFF" : C.gold;
    const g = 10 + 50 * u; rrect(r.x - r.w / 2 - g, r.y - LH / 2 - g, r.w + 2 * g, LH + 2 * g, 28 + g * 0.4); ctx.stroke();
    if (r.bright) for (let k = 0; k < 6; k++) { const a = k * 1.047 + u * 2; circle(r.x + Math.cos(a) * (r.w / 2 + 40 + 80 * u), r.y + Math.sin(a) * (80 + 60 * u), 9 * (1 - u), C.gold, null); }
    ctx.globalAlpha = 1;
  }
  for (const x of S.texts) { const u = (tickf - x.t0) / 50; ctx.globalAlpha = clamp(2 - u * 2, 0, 1); label(x.text, x.x, x.y - 90 * u, x.size, x.color); ctx.globalAlpha = 1; }
  ctx.restore();
  // подсказка первого слоя
  if (!S.hintOff && S.scene === "play" && S.phase === "ready" && S.n === 0) {
    const pulse = 1 + 0.06 * Math.sin(rt * 7);
    ctx.save(); ctx.translate(FW / 2, 1560); ctx.scale(pulse, pulse); label("ТАП — ПЕРЕРЕЖЬ ВЕРЁВКУ", 0, 0, 56, C.cream); ctx.restore();
  }
  // HUD: вишенки слева, число слоёв справа сверху, рекорд мелко
  if (phys) for (let i = 0; i < TUNE.lives; i++) drawCherry(70 + i * 96, 100, 34, i < S.lives);
  if (S.streak >= 2) label("серия ×" + S.streak, phys ? 150 : 100, phys ? 190 : 100, 44, C.gold);
  label(String(S.score), FW - 48, 106, 120, C.cream, "right");
  label("рекорд " + BEST[S.mode], FW - 48, 198, 42, C.cream, "right");
}

// ---- Ввод: тап в любой точке поля (кроме экрана итога) ----
stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest("#end")) return;
  e.preventDefault();
  humanTap(e.timeStamp);
});
window.addEventListener("keydown", (e) => { if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); if (S.scene === "end") { if (againReady()) newRound(); } else humanTap(); } });
function againReady() { return S.scene === "end" && S.stats && S.tick - S.stats.doneT >= 18; }
function onButton(id, fn) {
  const b = $(id);
  b.addEventListener("pointerdown", (e) => e.stopPropagation());
  b.addEventListener("pointerup", (e) => { e.stopPropagation(); if (!b.disabled) fn(); });
}
onButton("restart", () => newRound());
onButton("again", () => { if (againReady()) newRound(); });
$("endOm").addEventListener("pointerup", () => { if (againReady()) newRound(); });
onButton("mCur", () => { if (MODE !== "current") newRound(S.seed, "current"); });
onButton("mPhy", () => { if (MODE !== "physics") newRound(S.seed, "physics"); });

// ---- Цикл: фиксированный тик 1/60, рендер по кадрам ----
const frames = [];
function loop(now) {
  const dt = Math.min(0.05, (now - loopNow) / 1000); loopNow = now;
  frames.push(now); if (frames.length > 120) frames.shift();
  if (!manual) { acc += dt; let n = 0; while (acc >= DT && n < 3) { tick(); acc -= DT; n++; } if (n === 3) acc = 0; }
  if (S.scene === "end") { const b = $("again"); if (b.disabled && againReady()) b.disabled = false; }
  render();
  requestAnimationFrame(loop);
}

// ---- Тестовый API ----
// tapAt: ждёт готовности, находит ближайший момент, когда смещение d (spec §2 п. 5; в current — x_cut − x_top) равно offsetPx, и режет в него
function tapAt(off) {
  bot = null; let guard = 0;
  while (S.phase !== "ready" && S.scene === "play" && guard++ < 3000) tick();
  if (S.phase !== "ready") { S.lastAct = "notReady"; return false; }
  const top = S.layers[S.n], phys = S.mode === "physics";
  const g = (t) => xl(t) - (phys ? top.x + swayAt(t + TUNE.fallT) : top.x) - off;
  const t0 = Math.max(S.readyT, S.t + 1e-6), t1 = t0 + 2 * S.cur.T + 0.5;
  let a = t0, ga = g(a), tc = null;
  for (let t = t0 + 0.0005; t <= t1; t += 0.0005) {
    const gt = g(t);
    if ((ga <= 0 && gt > 0) || (ga >= 0 && gt < 0) || gt === 0) {
      let lo = a, hi = t, glo = ga;
      for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2, gm = g(mid); if ((glo <= 0 && gm <= 0) || (glo >= 0 && gm >= 0)) { lo = mid; glo = gm; } else hi = mid; }
      tc = (lo + hi) / 2; break;
    }
    a = t; ga = gt;
  }
  if (tc == null) { S.lastAct = "unreachable"; return false; }
  S.cutAt = tc; guard = 0;
  while (S.phase === "ready" && guard++ < 3000) tick();
  guard = 0; while (S.phase === "fall" && guard++ < 200) tick();
  S.lastAct = "tapAt";
  return { result: S.lastResult, offset: S.lastOffset };
}
const med = (a) => { const s = a.slice().sort((x, y) => x - y); return s[s.length >> 1]; };
const pct = (a, p) => { const s = a.slice().sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; };
function calib(n, mode) {
  const saved = { S, bot, acc, MODE, first: firstRound, planned: botPlanned };
  const out = { mode: mode || MODE, n, seeds: "k·7919", models: {} };
  const models = [["kid", 0, false], ["adult", 0.5, false], ["good", 1, false], ["naive", 0.5, true]];
  for (const [name, sk, naive] of models) {
    const L = [], T = [], F = [], K = [], P = [];
    for (let k = 1; k <= n; k++) {
      newRound(k * 7919, out.mode, true);
      bot = { skill: sk, naive };
      let g = 0; while (S.phase !== "over" && S.scene === "play" && g++ < 60000) tick();
      L.push(S.score); T.push(S.overT); F.push(S.falls); K.push(S.collapses); P.push(S.perfects);
    }
    out.models[name] = { layersMed: med(L), layersP10: pct(L, 0.1), layersP90: pct(L, 0.9), layersMean: +(L.reduce((a, b) => a + b, 0) / n).toFixed(1),
      timeMed: Math.round(med(T)), timeP10: Math.round(pct(T, 0.1)), timeP90: Math.round(pct(T, 0.9)), fallsMed: med(F), collapsesMed: med(K), perfectsMed: med(P) };
  }
  S = saved.S; bot = saved.bot; acc = saved.acc; MODE = saved.MODE; firstRound = saved.first; botPlanned = saved.planned;
  return out;
}
function omPos() { const f = omPlace(S.t, S.tick); return { x: f.x, y: f.y, rot: f.rot }; }
window.__game = {
  ready: false,
  getState() {
    const t = S.t, top = S.layers[S.n], cur = S.cur, r = cv.getBoundingClientRect();
    return {
      scene: S.scene, mode: S.mode, phase: S.phase, seed: S.seed, best: BEST[S.mode], tick: S.tick, lastAct: S.lastAct,
      tower: {
        state: S.phase === "over" || S.phase === "done" ? "over" : "play", n: S.n, layers: S.layers.map((l) => ({ x: +l.x.toFixed(3), w: +l.w.toFixed(3) })),
        topX: top.x, topW: top.w, streak: S.streak, lastResult: S.lastResult, lastOffset: S.lastOffset, lastEvent: S.lastEvent,
        score: S.score, lives: S.lives, falls: S.falls, collapses: S.collapses, perfects: S.perfects,
        period: cur.T, amp: cur.A, swingX: xl(t), swingReady: S.phase === "ready", readyTick: S.readyTick,
        sway: { L: Lat(t), target: S.sw.Lt, s: swayAt(t), H: Hat(t), lean: S.lean, tilt: tiltAt(t) },
        ropeCount: 2, cam: camAt(t), visibleLayers: Math.min(S.n + 1, Math.floor((FH - (CAM_TOP)) / LH) + 6),
        debris: S.debris.length, crumbs: S.crumbs.length,
      },
      result: { rating: S.stats ? S.stats.rating : 0, star2: S.mode === "current" ? TUNE.curStar2 : TUNE.star2, star3: S.mode === "current" ? TUNE.curStar3 : TUNE.star3, stats: S.stats },
      om: { frame: omFrameNow(), ...omPos() },
      bot: bot ? { skill: bot.skill, naive: !!bot.naive, plan: S.botAim || null } : null,
      view: { left: r.left, top: r.top, scale }, tune: TUNE,
    };
  },
  act(a, p) {
    if (a === "tap") { if (p && p.dtMs != null && S.phase === "ready") return doCut(clamp(S.t + p.dtMs / 1000, S.readyT, S.t + 2 * DT)); return humanTap(); }
    else if (a === "tapAt") return tapAt(p && p.offsetPx != null ? +p.offsetPx : 0);
    else if (a === "restart") { newRound(p && p.seed != null ? p.seed : undefined, p && p.mode); S.lastAct = "restart"; }
    else if (a === "mode") { newRound(S.seed, p && p.mode); S.lastAct = "mode"; }
    else if (a === "autoplay") { bot = p && p.skill != null ? { skill: clamp(+p.skill, 0, 1), naive: !!p.naive } : null; S.cutAt = null; botPlanned = false; }
    else if (a === "clock") manual = !!(p && p.manual);
    else if (a === "step") { for (let i = 0; i < (p == null ? 1 : p); i++) tick(); }
    else if (a === "calib") return calib(p && p.n || 50, p && p.mode);

  },
  metrics() {
    const d = []; for (let i = 1; i < frames.length; i++) d.push(frames[i] - frames[i - 1]);
    const avg = d.length ? d.reduce((s, x) => s + x, 0) / d.length : 16.7; d.sort((a, b) => a - b);
    return { fps: Math.round(1000 / avg), frameMsP95: d.length ? d[Math.floor(d.length * 0.95)] : 0, drawCalls: -1 };
  },
};
// ?seed=7&bot=0.5&mode=physics — посмотреть бота глазами; naive=1 — бот без чтения раскачки
const q = new URLSearchParams(location.search);
newRound(q.has("seed") ? +q.get("seed") : undefined, q.get("mode"));
if (q.has("bot")) bot = { skill: clamp(+q.get("bot"), 0, 1), naive: q.get("naive") === "1" };
fit(); render();
OMS.loaded.then(() => { window.__game.ready = true; });
requestAnimationFrame(loop);
</script>
