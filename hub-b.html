const qs = new URLSearchParams(location.search);
const TASK = qs.get("task") === "1";
const SEED = Number(qs.get("seed") || 30);
const LS = "hubB.";

/* ---------- storage (try/catch) ---------- */
function load(k, def) { try { const v = localStorage.getItem(LS + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } }
function save(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} }

/* ---------- seeded rng ---------- */
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  st.scroll = 0; st.mode = "idle"; st.vel = 0; st.lift.y = parkY(FLOORS[0]); st.lift.v = 0;
  $("#title").className = "task"; $("#title").textContent = `Найди: «${tg.name}»`;
  $("#timer").style.display = ""; $("#cnt").style.display = "none";
}
function finishTask(el) {
  const tk = st.task; tk.done = true; tk.timeSec = (now() - tk.t0) / 1000; tk.taps = st.taps;
  if (el) el.classList.add("found");
  const ok = tk.timeSec <= 10;
  $("#res .rt").innerHTML = `Нашёл «${esc(GAMES[tk.target].name)}» за ${tk.timeSec.toFixed(1).replace(".", ",")} с<small>${ok ? "в норме: ≤ 10 с" : "дольше 10 с"} · тапов: ${tk.taps}</small>`;
  $("#res").classList.add("on"); $("#timer").textContent = tk.timeSec.toFixed(1).replace(".", ",") + " с";
  st.om.joyUntil = now() + 900; st.om.waveUntil = now() + 900;
  return { found: true, timeSec: tk.timeSec };
}

/* ---------- Om Nom: alive (blinks, looks) ---------- */
const PUP = { // по глазу: rest — центр зрачка в покое, c и r — эллипс хода центра (u от лап, оси кадра). Взгляд d общий, потом зажим в эллипс своего глаза
  neutral: { l: { rest: [-13.93, -44.86], c: [-16.67, -45.33], r: [3.91, 3.98] }, r: { rest: [-0.81, -42.67], c: [2.23, -42.67], r: [6.22, 6.39] } },
  wide:    { l: { rest: [-13.39, -51.18], c: [-14.79, -51.42], r: [1.98, 1.54] }, r: { rest: [-1.13, -48.76], c: [0.98, -45.95], r: [5.73, 5.06] } },
};
function eyePos(e, dx, dy) { // центр зрачка: покой + d, затем в эллипс хода своего глаза
  let px = e.rest[0] + dx, py = e.rest[1] + dy;
  const qx = (px - e.c[0]) / e.r[0], qy = (py - e.c[1]) / e.r[1], ql = Math.hypot(qx, qy);
  if (ql > 1) { px = e.c[0] + qx / ql * e.r[0]; py = e.c[1] + qy / ql * e.r[1]; }
  return [px, py];
}
const LOOK = 7; // u: полный взгляд, больше любого радиуса хода
function eyeScreen() { // eye point in screen-logical coords
  return { x: PANEL_W + 310 - 43 + 0.5366 * 80 + (PUP.neutral.l.rest[0] + PUP.neutral.r.rest[0]) / 2 * OM_K, y: st.lift.y - 18 + (PUP.neutral.l.rest[1] + PUP.neutral.r.rest[1]) / 2 * OM_K - st.scroll };
}
function lookAtScreen(x, y, ms) { st.om.lookX = x; st.om.lookY = y; st.om.lookUntil = now() + ms; }
let clock0 = performance.now();
const now = () => performance.now() - clock0;

/* ---------- main loop ---------- */
const meter = []; let lastT = performance.now();
let shown = { frame: "", pupils: "", tf: "", liftTf: "", rope: -1, swing: 99, btn: -1 };
const omImgs = {};
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t; meter.push(dt * 1000); if (meter.length > 120) meter.shift();
  const T = now();
  // scroll modes
  if (st.mode === "fling") { st.scroll += st.vel * dt; st.vel *= Math.exp(-dt * 3.2); const c = clampS(st.scroll); if (c !== st.scroll) { st.scroll = c; st.vel = 0; } if (Math.abs(st.vel) < 15) st.mode = "idle"; }
  else if (st.mode === "anim") { const a = st.anim; a.t += dt; const u = Math.min(1, a.t / a.dur); const e = u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; st.scroll = a.from + (a.to - a.from) * e; if (u >= 1) { st.mode = "idle"; st.anim = null; } }
  else if (st.mode === "wheel") { st.scroll += (st.wheelTo - st.scroll) * (1 - Math.exp(-dt * 14)); if (Math.abs(st.wheelTo - st.scroll) < 0.5) { st.scroll = st.wheelTo; st.mode = "idle"; } }
  // which floor is in the centre → lift target
  st.centerFloor = st.scroll <= 0.5 ? 0 : floorAt(st.scroll + CENTER_Y);
  const L = st.lift; const tgtY = parkY(FLOORS[st.centerFloor]); L.target = st.centerFloor;
  const dy = tgtY - L.y; const want = Math.max(-2600, Math.min(2600, dy * 7));
  const acc = Math.max(-9000, Math.min(9000, (want - L.v) * 12)); L.v += acc * dt; L.y += L.v * dt;
  if (Math.abs(dy) < 0.8 && Math.abs(L.v) < 25) { L.y = tgtY; L.v = 0; }
  const wasMoving = L.moving; L.moving = Math.abs(L.v) > 40;
  if (wasMoving && !L.moving) { st.om.joyUntil = T + 450; if (st.centerFloor === 0) st.om.waveUntil = T + 1100; }
  // swing (pendulum driven by acceleration)
  L.swingV += (-L.swing * 40 - L.swingV * 3.5 - acc * 0.0012) * dt; L.swing += L.swingV * dt; L.swing = Math.max(-8, Math.min(8, L.swing));
  // Om Nom frame
  const om = st.om;
  if (T > om.nextBlink) { om.blinkUntil = T + 130; om.nextBlink = T + 2200 + Math.random() * 3300; if (Math.random() < .2) om.nextBlink = T + 260; }
  if (T > om.lookUntil && T > om.nextGlance) { // idle glances: at doors, up, down, at you
    const e = eyeScreen(); const opts = [[e.x - 200, e.y], [e.x - 150, e.y - 120], [e.x - 160, e.y + 140], [e.x, e.y + 400], [e.x - 1, e.y]];
    const o = opts[Math.floor(Math.random() * opts.length)]; om.glX = o[0]; om.glY = o[1]; om.nextGlance = T + 1400 + Math.random() * 2200;
  }
  let f = "neutral";
  if (T < om.waveUntil) f = (Math.floor(T / 200) % 2) ? "wave1" : "wave2";
  else if (T < om.joyUntil) f = "joy";
  else if (L.moving) f = "wide";
  else if (T < om.blinkUntil) f = "blink";
  om.frame = f;
  let tx = 0, ty = 0;
  if (f === "neutral" || f === "wide") {
    const e = eyeScreen();
    let lx, ly;
    if (f === "wide") { lx = e.x - 30; ly = e.y + Math.sign(L.v) * 200; }
    else if (T < om.lookUntil) { lx = om.lookX; ly = om.lookY; } else { lx = om.glX ?? e.x - 1; ly = om.glY ?? e.y; }
    const vx = lx - e.x, vy = ly - e.y, len = Math.hypot(vx, vy) || 1, near = Math.min(1, len / 60);
    const nx = vx / len * near, ny = vy / len * near;
    tx = nx * LOOK * OM_K; ty = ny * LOOK * OM_K; // общий сдвиг взгляда, px
  }
  om.px += (tx - om.px) * Math.min(1, dt * 14); om.py += (ty - om.py) * Math.min(1, dt * 14);
  // render
  const tf = `translateY(${-st.scroll.toFixed(1)}px)`; if (tf !== shown.tf) { bld.style.transform = tf; shown.tf = tf; }
  const ltf = `translate(0px,${L.y.toFixed(1)}px)`; if (ltf !== shown.liftTf) { $("#lift").style.transform = ltf; shown.liftTf = ltf; }
  const bob = 1 + Math.sin(T / 520) * 0.012;
  $("#liftIn").style.transform = `rotate(${L.swing.toFixed(2)}deg)`;
  $("#om").style.transform = `scale(${bob.toFixed(4)},${(2 - bob).toFixed(4)})`;
  const ropeH = Math.round(L.y - 118 - 52); if (ropeH !== shown.rope) { $("#rope").style.height = Math.max(0, ropeH) + "px"; shown.rope = ropeH; }
  if (f !== shown.frame) {
    for (const im of $("#om").children) im.classList.toggle("on", im.dataset.f === f || im.dataset.f === f + "_pupils_l" || im.dataset.f === f + "_pupils_r");
    shown.frame = f;
  }
  if (f === "neutral" || f === "wide") { // общий взгляд d (u), у каждого глаза свой зажим в эллипс хода: зрачок не выходит из своего белка и не переходит шов
    const pu = PUP[f], dxu = om.px / OM_K, dyu = om.py / OM_K;
    for (const eye of ["l", "r"]) {
      const ps = eyePos(pu[eye], dxu, dyu), im = $(`#om img[data-f="${f}_pupils_${eye}"]`); om["p" + eye] = ps;
      if (im) im.style.transform = `translate(${((ps[0] - pu[eye].rest[0]) * OM_K).toFixed(2)}px,${((ps[1] - pu[eye].rest[1]) * OM_K).toFixed(2)}px)`;
    }
  }
  const bi = btnOfFloor(st.centerFloor);
  if (bi !== shown.btn) { panel.querySelectorAll(".pb").forEach((el, i) => el.classList.toggle("on", i === bi)); shown.btn = bi; }
  // garland twinkle (cheap opacity)
  if (st.scroll < ROOM_H) { const bs = document.querySelectorAll(".bulb"); bs.forEach((b, i) => { b.style.opacity = (0.75 + 0.25 * Math.sin(T / 400 + i * 1.7)).toFixed(2); }); }
  if (st.task && !st.task.done) $("#timer").textContent = ((T - st.task.t0) / 1000).toFixed(1).replace(".", ",") + " с";
  requestAnimationFrame(frame);
}

/* ---------- test API ---------- */
function rectOf(sel) { const el = document.querySelector(sel); if (!el) return null; const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height }; }
window.__game = {
  ready: false,
  getState() {
    const vis = []; const top = st.scroll, bot = st.scroll + H;
    FLOORS.forEach((f, i) => { if (f.top + f.h > top + BAR && f.top < bot) vis.push(i); });
    return {
      scene: st.modal ? "modal" : "hub", scroll: Math.round(st.scroll), maxScroll: MAX_SCROLL, mode: st.mode,
      centerFloor: st.centerFloor, visibleFloors: vis, activeButton: BUTTONS[btnOfFloor(st.centerFloor)].key,
      lift: { y: Math.round(st.lift.y), floor: st.lift.target, moving: st.lift.moving, parkedAt: st.lift.moving ? null : FLOORS.findIndex(f => Math.abs(parkY(f) - st.lift.y) < 1) },
      omnom: { frame: st.om.frame, pupils: [+st.om.px.toFixed(2), +st.om.py.toFixed(2)], pupilL: st.om.pl && st.om.pl.map((v) => +v.toFixed(2)), pupilR: st.om.pr && st.om.pr.map((v) => +v.toFixed(2)) },
      catalog: { total: GAMES.length, real: GAMES.filter(g => g.real).map(g => g.name), newIds: GAMES.filter(g => g.isNew).map(g => g.id),
        themes: THEMES.map((t, ti) => ({ key: t.key, name: t.name, color: t.color, count: GAMES.filter(g => g.themeIdx === ti).length })) },
      floors: FLOORS.map((f, i) => ({ i, kind: f.kind, theme: f.kind === "theme" ? THEMES[f.themeIdx].key : null, top: f.top, h: f.h, games: f.games.map(id => GAMES[id].name) })),
      buttons: BUTTONS.map(b => ({ key: b.key, floors: b.floors })),
      opened: [...st.opened], recent: st.recent.map(id => GAMES[id].name), daily: { ids: st.daily.ids, names: st.daily.ids.map(id => GAMES[id].name), done: st.daily.done },
      newDots: [...document.querySelectorAll(".door .dot")].length,
      modal: st.modal, task: st.task ? { target: GAMES[st.task.target].name, targetId: st.task.target, done: st.task.done, timeSec: st.task.timeSec, taps: st.task.taps,
        targetFloor: FLOORS.findIndex(f => f.games.includes(st.task.target)), targetButton: btnOfFloor(FLOORS.findIndex(f => f.games.includes(st.task.target))) } : null,
      gameIndex: GAMES.map(g => ({ id: g.id, name: g.name, theme: THEMES[g.themeIdx].key, kind: g.kind, isNew: g.isNew })),
      tapSlopPx: TAP_SLOP, scale,
    };
  },
  act(action, p) {
    switch (action) {
      case "button": goButton(typeof p === "number" ? p : BUTTONS.findIndex(b => b.key === p)); return;
      case "scrollTo": st.mode = "idle"; st.scroll = clampS(+p); return;
      case "scrollBy": st.mode = "idle"; st.scroll = clampS(st.scroll + +p); return;
      case "open": return openGame(typeof p === "number" ? p : (GAMES.find(g => g.name === p) || {}).id, document.querySelector(`.door[data-gid="${typeof p === "number" ? p : (GAMES.find(g => g.name === p) || {}).id}"]`));
      case "closeModal": closeModal(); return;
      case "newTask": newTask(); return;
      case "tapOm": handleTap("om"); return;
      case "rect": return rectOf(p);        // screen rect of a selector (for real-mouse tests)
      case "doorRect": { const els = [...document.querySelectorAll(`#bld .floor:not(.room) .door[data-gid="${p}"]`)]; if (!els.length) return null; const r = els[0].getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
      case "resetStorage": try { for (const k of Object.keys(localStorage)) if (k.startsWith(LS)) localStorage.removeItem(k); } catch (e) {} return;
      default: return { error: "unknown action " + action };
    }
  },
  metrics() { const a = meter.slice().sort((x, y) => x - y); const avg = a.reduce((s, v) => s + v, 0) / (a.length || 1);
    return { fps: Math.round(1000 / (avg || 16.7)), frameMsP95: +(a[Math.floor(a.length * 0.95)] || 0).toFixed(1), drawCalls: -1 }; },
};

buildBuilding(); buildPanel(); fit();
if (TASK) newTask();
requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); window.__game.ready = true; });
</script>
