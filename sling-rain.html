<script>
"use strict";
// ---- Ом Ном кадрами приложения (D-40, не рисунок кодом) ---------------------------
// Кадры лежат в assets/omnom/ — одна папка на все прототипы; новую версию Ома Нома копируем поверх теми же именами.
// Числа — из assets/omnom/omnom_frames.json: 6,4024 px на u, лапы = pivot, рот (кадр wide); зрачки — два слоя (левый и правый глаз), каждый ходит в эллипсе своего глаза (pupils.<кадр>.eyes).
// В файлах Ом Ном смотрит ВЛЕВО от зрителя; flip = смотрит вправо. Кадр: p.mx, p.my — точка рта в игре (u), p.fy — лапы (по умолчанию рот + 20).
const OMS = (() => {
  const PX = 6.4024, PIV = [0.5366, 0.0253], MOUTH = [-2.08, -19.98];
  // Зрачки — по слою на глаз. Для каждого: rest — центр зрачка в покое, c и r — эллипс хода центра зрачка (u от лап, оси кадра до зеркала).
  // Сдвиг взгляда d одинаков для обоих глаз, но центр каждого зрачка потом зажимается в эллипс СВОЕГО глаза: зрачок не выходит из белка и не переходит шов.
  const PUP = {
    neutral: { l: { rest: [-13.93, -44.86], c: [-16.67, -45.33], r: [3.91, 3.98] },
             r: { rest: [-0.81, -42.67], c: [2.23, -42.67], r: [6.22, 6.39] } },
    ajar:   { l: { rest: [-13.7, -47.75], c: [-15.42, -48.29], r: [2.61, 2.51] },
             r: { rest: [-1.6, -45.33], c: [1.92, -42.83], r: [6.06, 6.01] } },
    wide:   { l: { rest: [-13.39, -51.18], c: [-14.79, -51.42], r: [1.98, 1.54] },
             r: { rest: [-1.13, -48.76], c: [0.98, -45.95], r: [5.73, 5.06] } },
    wide2:  { l: { rest: [-13.93, -52.28], c: [-14.95, -52.67], r: [1.64, 1.31] },
             r: { rest: [-1.52, -49.54], c: [0.83, -46.58], r: [5.85, 5.25] } },
  };
  const LOOK = 7; // u: длина полного взгляда, больше любого радиуса хода — на краю эллипса зрачок упирается в границу
  const NAMES = ["neutral", "ajar", "wide", "wide2", "chew", "chew2", "sad", "joy", "blink", "half", "shadow"];
  for (const f in PUP) NAMES.push(f + "_pupils_l", f + "_pupils_r");
  const img = {};
  const waits = [];
  for (const n of NAMES) {
    const i = new Image(); img[n] = i;
    waits.push(new Promise((res) => { i.onload = i.onerror = res; }));
    i.src = "assets/omnom/" + n + ".png";
  }
  const ok = (i) => i && i.complete && i.naturalWidth > 0;
  // центр зрачка: покой + сдвиг (dx, dy), затем в эллипс хода своего глаза: q = (p - c) / r; |q| > 1 -> p = c + q/|q| * r
  function eyePos(e, dx, dy) {
    let px = e.rest[0] + dx, py = e.rest[1] + dy;
    const qx = (px - e.c[0]) / e.r[0], qy = (py - e.c[1]) / e.r[1], ql = Math.hypot(qx, qy);
    if (ql > 1) { px = e.c[0] + qx / ql * e.r[0]; py = e.c[1] + qy / ql * e.r[1]; }
    return [px, py];
  }
  // p: { frame, mx, my, fy?, flip?, tx?, ty?, rot?, piv?, shadow?, alpha? }; st — объект вызывающего: плавный взгляд
  const last = { frame: null, l: null, r: null, d: null };
  function draw(ctx, p, st) {
    let f = p.frame || "neutral";
    if (f === "neutral" && (performance.now() + (p.blinkOff || 0)) % 3600 < 120) f = "blink";
    const base = img[f]; if (!ok(base)) return;
    const flip = p.flip ? -1 : 1, fx = p.mx - flip * MOUTH[0], fy = p.fy != null ? p.fy : p.my - MOUTH[1];
    const pw = base.naturalWidth, ph = base.naturalHeight, k = 1 / PX;
    ctx.save();
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    if (p.alpha != null) ctx.globalAlpha = p.alpha;
    if (p.shadow && ok(img.shadow)) ctx.drawImage(img.shadow, fx - 32, fy - 6, 64, 12);
    ctx.translate(fx, p.piv ? fy - p.piv : fy); if (p.rot) ctx.rotate(p.rot); if (p.piv) ctx.translate(0, p.piv);
    ctx.scale(flip * k, k);
    ctx.drawImage(base, -PIV[0] * pw, -(1 - PIV[1]) * ph);
    const pu = PUP[f], pl = img[f + "_pupils_l"], pr = img[f + "_pupils_r"];
    if (pu && ok(pl) && ok(pr)) {
      let gx = 0, gy = 0;
      if (p.tx != null) { // цель в системе кадра до зеркала; общий сдвиг взгляда, потом зажим по каждому глазу
        const pv = p.piv || 0;
        let dx = p.tx - fx, dy = p.ty - (fy - pv);
        if (p.rot) { const c = Math.cos(-p.rot), sn = Math.sin(-p.rot), qx = dx * c - dy * sn, qy = dx * sn + dy * c; dx = qx; dy = qy; }
        dy -= pv; dx *= flip;
        const ex = (pu.l.rest[0] + pu.r.rest[0]) / 2, ey = (pu.l.rest[1] + pu.r.rest[1]) / 2; // между глазами
        const vx = dx - ex, vy = dy - ey, L = Math.hypot(vx, vy) || 1, a = Math.min(1, L / 45);
        gx = vx / L * a * LOOK; gy = vy / L * a * LOOK;
      }
      if (st) { st.x = st.x == null ? gx : st.x + (gx - st.x) * 0.35; st.y = st.y == null ? gy : st.y + (gy - st.y) * 0.35; gx = st.x; gy = st.y; }
      const pL = eyePos(pu.l, gx, gy), pR = eyePos(pu.r, gx, gy);
      ctx.drawImage(pl, -PIV[0] * pw + (pL[0] - pu.l.rest[0]) * PX, -(1 - PIV[1]) * ph + (pL[1] - pu.l.rest[1]) * PX);
      ctx.drawImage(pr, -PIV[0] * pw + (pR[0] - pu.r.rest[0]) * PX, -(1 - PIV[1]) * ph + (pR[1] - pu.r.rest[1]) * PX);
      last.frame = f; last.l = pL; last.r = pR; last.d = [gx, gy];
    }
    ctx.restore();
  }
  return { draw, img, PUP, eyePos, last, loaded: Promise.all(waits), ready: () => NAMES.every((n) => ok(img[n])) };
})();
// ---- «Мармеладный дождь» (D-92, концепция 1 из design/sling-concepts.md): один выстрел — конфета скачет вниз по желейкам ----
// Поле 320×480 u. Желейки — капсулы толщиной 12 u (lab-sling-bounce.md §1), отскок e 0,85, касательная 0,98.
// Лит (зажжённые) желейки остаются твёрдыми до конца выстрела, потом лопаются по очереди; золотые летят Ому Ному в рот.
const TUNE = {
  gravity: 784,      // u/с²
  power: 8,          // скорость вылета = оттяжка × power (ручка); 90 u → 720 u/с
  maxPull: 90, minPull: 14,
  candyR: 12,        // u, рисунок (Ø 24 — меньше, чем 34 в концепции: иначе в поле не влезает 30+ желеек с зазором)
  candyHitR: 9,      // u, столкновения (мягкий край)
  pegHalf: 7,        // u, половина оси капсулы (длина желейки 14 + 12 = 26 u)
  pegThick: 12,      // u
  pegGap: 20,        // u, зазор между желейками (конфета Ø 18 проходит)
  pegMin: 30, pegMax: 50, jitter: 8,
  e: 0.85,           // упругость желеек (ручка)
  kt: 0.98, wallE: 0.6, maxSpeed: 950,
  gold: 7,           // золотых на поле (ручка, со следующего раунда); ≈ 1/4 желеек, как в концепции 12 из 50–70
  shots: 10,         // конфет в раунде; поймал тележкой — +1
  multStep: 4,       // каждые 4 сбитые в одном выстреле — множитель +1
  ptsPeg: 10, ptsGold: 50, bonusShot: 100,
  bubbleT: 1.2,      // с, пузырь (ручка)
  bubbleRise: 230,   // u/с, скорость всплытия
  cartSpeed: 1.1,    // рад/с, тележка туда-сюда (ручка); 1,1 — период 5,7 с
  cartAmp: 112,      // u, ход тележки от центра
  catchW: 28,        // u, полуширина «рта» тележки
  omScale: 0.7,      // Ом Ном на тележке — 0,7 от размера в «Рогатке»
  popGap: 0.075,     // с между лопающимися желейками
  stuckV: 40, stuckT: 0.8, // конфета застряла (|v| < 40 u/с 0,8 с) — желейки под ней лопаются сразу
  shotMax: 20,       // с, предел выстрела
  aimDots: 14, aimDotTicks: 3,
  ropeIters: 25, ropeNodes: 15, ropeSlack: 1.04, ropeDamp: 0.985, ropeWidth: 4,
};
const KNOBS = [ // ручки панели: ключ, подпись, мин, макс, шаг
  ["e", "Упругость желеек", 0.5, 1, 0.05],
  ["power", "Сила рогатки", 4, 10, 0.5],
  ["bubbleT", "Пузырь, с", 0.6, 2.4, 0.1],
  ["cartSpeed", "Тележка, скорость", 0, 2.5, 0.1],
  ["gold", "Золотых (новый раунд)", 3, 14, 1],
];
const W = 320, H = 480, DT = 1 / 60, SUB = 2;
const MODES = { // рогатка сверху (концепция) или снизу (как нынешняя «Рогатка»)
  top: { rest: { x: 160, y: 96 }, a: { x: 106, y: 88 }, b: { x: 214, y: 88 }, peg: [134, 394] },
  bottom: { rest: { x: 160, y: 384 }, a: { x: 106, y: 376 }, b: { x: 214, y: 376 }, peg: [40, 330] },
};
const FEET_Y = 458, MOUTH_Y = FEET_Y - 20 * TUNE.omScale;
const C = {
  paper: "#F5A9D0", paperHi: "#F9C3DF", paperLo: "#EE97C3", ink: "#4A2512", cream: "#FBEBD0", creamSh: "#E9CFA3",
  card: "#C98A4B", cardSh: "#8F5427", candy: "#E8412F", wrap: "#FFC93C", gold: "#FFD23F", goldLit: "#FFF6B8",
  mint: "#5FD3C7", mintLit: "#D9FFF9", mintDk: "#1E7F75", goldDk: "#B07A00",
};
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const q = new URLSearchParams(location.search);
let MODE = q.get("mode") === "bottom" ? "bottom" : "top", G = MODES[MODE];
let S, bot = null;

// ---- Геометрия ----
function segEnds(p) { const c = Math.cos(p.a) * TUNE.pegHalf, s = Math.sin(p.a) * TUNE.pegHalf; p.ax = p.x - c; p.ay = p.y - s; p.bx = p.x + c; p.by = p.y + s; return p; }
function ptSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
  const qx = ax + dx * t, qy = ay + dy * t; return { d: Math.hypot(px - qx, py - qy), qx, qy };
}
function orient(ax, ay, bx, by, cx, cy) { return Math.sign((bx - ax) * (cy - ay) - (by - ay) * (cx - ax)); }
function segSeg(p, o) {
  if (orient(p.ax, p.ay, p.bx, p.by, o.ax, o.ay) * orient(p.ax, p.ay, p.bx, p.by, o.bx, o.by) < 0 &&
      orient(o.ax, o.ay, o.bx, o.by, p.ax, p.ay) * orient(o.ax, o.ay, o.bx, o.by, p.bx, p.by) < 0) return 0;
  return Math.min(ptSeg(p.ax, p.ay, o.ax, o.ay, o.bx, o.by).d, ptSeg(p.bx, p.by, o.ax, o.ay, o.bx, o.by).d,
    ptSeg(o.ax, o.ay, p.ax, p.ay, p.bx, p.by).d, ptSeg(o.bx, o.by, p.ax, p.ay, p.bx, p.by).d);
}

// ---- Поле по seed: шаблон (левая половина) + разброс ±8 u, зеркало, зазор, добивка до 30, срез до 50 ----
function tplGrid(r, y0, y1) {
  const out = [], rowH = 40 + r() * 6, colW = 56 + r() * 10, tilt = r() * 0.45, holes = 0.1 + r() * 0.15;
  for (let k = 0, y = y0 + 8; y <= y1 - 4; k++, y += rowH) {
    const off = (k % 2) * colW / 2;
    for (let x = 160 - off; x >= 30; x -= colW) if (r() >= holes) out.push({ x, y, a: (k % 2 ? 1 : -1) * tilt });
  }
  return out;
}
function tplRings(r, y0, y1) {
  const out = [], h = y1 - y0;
  const bR = 58 + r() * 12, by = y0 + h * 0.34, n = 10;
  for (let i = 0; i < n; i++) { const t = Math.PI / 2 + i / n * 2 * Math.PI, x = 160 + Math.cos(t) * bR; if (x <= 160.5) out.push({ x, y: by + Math.sin(t) * bR, a: t + Math.PI / 2 }); }
  const sx = 76 + r() * 14, sy = y0 + h * 0.8, sR = 34 + r() * 8, m = 7, t0 = r() * 6;
  for (let i = 0; i < m; i++) { const t = t0 + i / m * 2 * Math.PI; out.push({ x: sx + Math.cos(t) * sR, y: sy + Math.sin(t) * sR, a: t + Math.PI / 2 }); }
  for (let x = 160 - 29; x >= 30; x -= 58) out.push({ x, y: y0 + 6, a: 0 });
  out.push({ x: 160, y: sy, a: Math.PI / 2 }, { x: 44, y: by, a: 1.2 }, { x: 160, y: y1 - 4, a: 0 });
  return out;
}
function tplArcs(r, y0, y1) {
  const out = [], n = 6, step = (y1 - y0 - 12) / (n - 1);
  for (let k = 0; k < n; k++) {
    const yk = y0 + 6 + k * step, cv = (k % 2 ? 1 : -1) * (0.0022 + r() * 0.0018), off = (k % 2) * 28;
    for (let x = 160 - off; x >= 30; x -= 56) { const dx = x - 160, y = yk + cv * (dx * dx - 4200); if (y >= y0 - 4 && y <= y1 + 4) out.push({ x, y, a: Math.atan(2 * cv * dx) }); }
  }
  return out;
}
const TEMPLATES = [["решётка", tplGrid], ["кольца", tplRings], ["дуги", tplArcs]];
function genField(seed) {
  const r = mulberry(seed ^ 0x9e3779b9), y0 = G.peg[0], y1 = G.peg[1];
  const ti = Math.floor(r() * TEMPLATES.length), raw = TEMPLATES[ti][1](r, y0, y1);
  const minD = TUNE.pegThick + TUNE.pegGap, pegs = []; let pid = 0;
  function add(x, y, a, jit) {
    if (jit) { x += (r() * 2 - 1) * TUNE.jitter; y += (r() * 2 - 1) * TUNE.jitter; a += (r() * 2 - 1) * 0.15; }
    if (Math.abs(x - 160) < 10) { x = 160; a = Math.abs(Math.sin(a)) > 0.7 ? Math.PI / 2 : 0; }
    if (x > 160) return false;
    const L = [segEnds({ x, y, a })];
    if (x < 160) L.push(segEnds({ x: W - x, y, a: -a }));
    for (const p of L) {
      if (Math.min(p.ax, p.bx) < 28 || Math.max(p.ax, p.bx) > W - 28) return false; // зазор до стены ≥ 22
      if (Math.min(p.ay, p.by) < y0 - 6 || Math.max(p.ay, p.by) > y1 + 6) return false;
      if (Math.hypot(p.x - G.rest.x, p.y - G.rest.y) < 56) return false;
    }
    if (L.length === 2 && segSeg(L[0], L[1]) < minD) return false;
    for (const p of L) for (const o of pegs) if (segSeg(p, o) < minD) return false;
    pid++; for (const p of L) { p.pid = pid; pegs.push(p); }
    return true;
  }
  for (const p of raw) add(p.x, p.y, p.a, true) || add(p.x, p.y, p.a, false);
  // добивка: узлы шестиугольной решётки в случайном порядке, потом случайные точки
  const fill = [], st = minD + 16;
  for (let k = 0, y = y0; y <= y1; k++, y += st * 0.8) for (let x = 160 - (k % 2) * st / 2; x >= 26; x -= st) fill.push([x, y]);
  for (let i = fill.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [fill[i], fill[j]] = [fill[j], fill[i]]; }
  for (const [x, y] of fill) { if (pegs.length >= TUNE.pegMin + 10) break; add(x, y, (r() * 2 - 1) * 0.9, true); }
  for (let i = 0; pegs.length < TUNE.pegMin && i < 1500; i++) add(30 + r() * 130, y0 + r() * (y1 - y0), (r() * 2 - 1) * 0.9, false);
  while (pegs.length > TUNE.pegMax) { const id = pegs[Math.floor(r() * pegs.length)].pid; for (let i = pegs.length - 1; i >= 0; i--) if (pegs[i].pid === id) pegs.splice(i, 1); }
  // золотые: не меньше 3 видны прямым выстрелом из рогатки, остальные — глубже
  const R = TUNE.candyHitR + TUNE.pegThick / 2;
  const visible = (p) => { const dx = p.x - G.rest.x, dy = p.y - G.rest.y, L = Math.hypot(dx, dy);
    for (let s = 0; s < L - R - 2; s += 4) { const x = G.rest.x + dx * s / L, y = G.rest.y + dy * s / L;
      for (const o of pegs) if (o !== p && ptSeg(x, y, o.ax, o.ay, o.bx, o.by).d < R) return false; }
    return true; };
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const nG = Math.min(TUNE.gold, pegs.length - 2);
  const vis = shuffle(pegs.filter(visible)), gold = vis.slice(0, Math.min(3, nG));
  const depth = (p) => MODE === "top" ? p.y : -p.y;
  const rest = pegs.filter((p) => !gold.includes(p)).sort((a, b) => depth(b) - depth(a));
  const deep = shuffle(rest.slice(0, Math.max(nG, Math.ceil(rest.length * 0.7))));
  while (gold.length < nG) gold.push(deep.shift());
  for (const p of pegs) { p.gold = gold.includes(p); p.lit = false; p.alive = true; p.sqT = 9; p.flash = 0; p.cd = 0; }
  return { pegs, template: TEMPLATES[ti][0], visibleGold: gold.filter(visible).length };
}

// ---- Состояние раунда ----
function newRound(seed) {
  seed = seed == null ? (Date.now() & 0x7fffffff) : (seed >>> 0);
  const f = genField(seed);
  S = {
    seed, scene: "play", phase: "aim", t: 0, phaseT: 0, cartPh: 0, template: f.template, visibleGold: f.visibleGold,
    pegs: f.pegs, goldTotal: f.pegs.filter((p) => p.gold).length, goldLeft: 0,
    score: 0, shot: 0, shotsLeft: TUNE.shots, catches: 0, chain: 0, multShown: 1, multPulse: 9,
    candy: null, pull: null, litOrder: [], popIdx: 0, popT: 0, popGap: TUNE.popGap,
    bubbleUsed: false, stuckT: 0, shotPts: 0, shotGold: 0, maxChain: 0, lastShot: null, bonus: 0,
    fx: [], popups: [], flyers: [], chewT: 0, sadT: 0, ret: null, botT: 0, botPlan: null, log: [], lastAct: null,
  };
  S.goldLeft = S.goldTotal;
  initRope(); freshCandy();
  document.getElementById("end").style.display = "none";
  document.getElementById("seed").textContent = "seed " + seed;
  updateHud();
}
function logEv(type, o) { S.log.push(Object.assign({ t: +S.t.toFixed(2), type }, o || {})); if (S.log.length > 300) S.log.shift(); }
function mult() { return 1 + Math.floor(Math.max(0, S.chain - 1) / TUNE.multStep); }
function cartX() { return 160 + TUNE.cartAmp * Math.sin(S.cartPh); }

// ---- Резинка: Верле (как в sling.html) ----
let rope;
function initRope() {
  const n = TUNE.ropeNodes, A = G.a, B = G.b, L = Math.hypot(B.x - A.x, B.y - A.y) / (n - 1) * TUNE.ropeSlack;
  rope = { L0: L, La: L, Lb: L, mid: (n - 1) / 2, pinMid: true, p: [] };
  for (let i = 0; i < n; i++) { const x = A.x + (B.x - A.x) * i / (n - 1); rope.p.push({ x, y: A.y, px: x, py: A.y }); }
}
function stepRope() {
  const p = rope.p, n = p.length, A = G.a, B = G.b;
  for (let i = 1; i < n - 1; i++) { const o = p[i], vx = (o.x - o.px) * TUNE.ropeDamp, vy = (o.y - o.py) * TUNE.ropeDamp; o.px = o.x; o.py = o.y; o.x += vx; o.y += vy + TUNE.gravity * DT * DT; }
  for (let k = 0; k < TUNE.ropeIters; k++) {
    p[0].x = A.x; p[0].y = A.y; p[n - 1].x = B.x; p[n - 1].y = B.y;
    if (rope.pinMid) { p[rope.mid].x = S.candy.x; p[rope.mid].y = S.candy.y; }
    for (let i = 0; i < n - 1; i++) {
      const a = p[i], b = p[i + 1], L = i < rope.mid ? rope.La : rope.Lb;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-6, diff = (d - L) / d * 0.5;
      const fa = (i === 0 || (rope.pinMid && i === rope.mid)) ? 0 : 1, fb = (i + 1 === n - 1 || (rope.pinMid && i + 1 === rope.mid)) ? 0 : 1, s = fa + fb;
      if (!s) continue;
      a.x += dx * diff * 2 * fa / s; a.y += dy * diff * 2 * fa / s; b.x -= dx * diff * 2 * fb / s; b.y -= dy * diff * 2 * fb / s;
    }
  }
}
function stretchRopeTo(c) {
  rope.La = Math.max(rope.L0, Math.hypot(c.x - G.a.x, c.y - G.a.y) / rope.mid);
  rope.Lb = Math.max(rope.L0, Math.hypot(c.x - G.b.x, c.y - G.b.y) / rope.mid);
}
function freshCandy() {
  S.candy = { x: G.rest.x, y: G.rest.y, vx: 0, vy: 0, vis: 1, bubble: false, bubbleT: 0, rot: 0 };
  rope.pinMid = true; rope.La = rope.Lb = rope.L0;
}

// ---- Физика конфеты: стены 0,6, потолок, желейки-капсулы (нормаль × −e, касательная × 0,98) ----
function stepBody(c, pegs, dt, onHit, bubble) {
  if (bubble) { c.vy += (-TUNE.bubbleRise - c.vy) * Math.min(1, 5 * dt); c.vx *= Math.pow(0.35, dt); }
  else c.vy += TUNE.gravity * dt;
  const sp = Math.hypot(c.vx, c.vy); if (sp > TUNE.maxSpeed) { c.vx *= TUNE.maxSpeed / sp; c.vy *= TUNE.maxSpeed / sp; }
  c.x += c.vx * dt; c.y += c.vy * dt;
  const r = TUNE.candyHitR;
  if (c.x < r) { c.x = r; c.vx = Math.abs(c.vx) * TUNE.wallE; }
  if (c.x > W - r) { c.x = W - r; c.vx = -Math.abs(c.vx) * TUNE.wallE; }
  if (c.y < r) { c.y = r; c.vy = Math.abs(c.vy) * TUNE.wallE; }
  if (bubble && MODE === "top" && c.y < G.peg[0] - 30) { c.y = G.peg[0] - 30; c.vy = Math.max(0, c.vy); } // пузырь не залетает в рогатку
  if (bubble) return; // пузырь всплывает сквозь желейки: второй проход начинается, когда он лопнет
  const R = r + TUNE.pegThick / 2, e = TUNE.e, reach = R + TUNE.pegHalf;
  for (const p of pegs) {
    if (!p.alive || Math.abs(c.x - p.x) > reach || Math.abs(c.y - p.y) > reach) continue;
    const s = ptSeg(c.x, c.y, p.ax, p.ay, p.bx, p.by); if (s.d >= R) continue;
    let nx = 0, ny = -1; if (s.d > 1e-6) { nx = (c.x - s.qx) / s.d; ny = (c.y - s.qy) / s.d; }
    c.x = s.qx + nx * R; c.y = s.qy + ny * R;
    const vn = c.vx * nx + c.vy * ny;
    if (vn < 0) {
      const tx = -ny, ty = nx, vt = c.vx * tx + c.vy * ty, nvn = -vn * e, nvt = vt * TUNE.kt;
      c.vx = nx * nvn + tx * nvt; c.vy = ny * nvn + ty * nvt;
      if (onHit) onHit(p, -vn, s.qx + nx * TUNE.pegThick / 2, s.qy + ny * TUNE.pegThick / 2);
    }
  }
}

// ---- Звук: синтез (щелчок, «бойнг» с повышением тона по цепочке, лопание, «ам», пузырь) ----
let AC = null;
function initAudio() { try { if (!AC) { const K = window.AudioContext || window.webkitAudioContext; if (K) AC = new K(); } if (AC && AC.state === "suspended") AC.resume(); } catch (e) { AC = null; } }
function tone(type, f0, f1, f2, t0, dur, vol) {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t0);
  if (f2) { o.frequency.exponentialRampToValueAtTime(f1, t0 + dur * 0.25); o.frequency.exponentialRampToValueAtTime(f2, t0 + dur); }
  else if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.03);
}
function sfx(kind, i, v) {
  if (!AC || AC.state !== "running") return;
  try {
    const t = AC.currentTime, st = Math.pow(2, Math.min(i || 0, 26) / 12); v = v == null ? 1 : v;
    if (kind === "click") tone("square", 1500, 500, 0, t, 0.04, 0.06);
    else if (kind === "boing") { const f = 247 * st; tone("triangle", f * 0.7, f * 1.25, f, t, 0.2, 0.24 * v); }
    else if (kind === "gold") { const f = 494 * st; tone("sine", f * 2, f * 2, 0, t + 0.02, 0.18, 0.1); }
    else if (kind === "pop") { const f = 520 * Math.pow(2, Math.min(i || 0, 30) / 24); tone("sine", f * 1.8, f * 0.6, 0, t, 0.08, 0.15); }
    else if (kind === "am") { tone("triangle", 260, 170, 0, t, 0.1, 0.2); tone("triangle", 230, 150, 0, t + 0.12, 0.13, 0.2); }
    else if (kind === "bubble") tone("sine", 280, 900, 0, t, 0.28, 0.14);
    else if (kind === "bpop") tone("sine", 1300, 320, 0, t, 0.07, 0.14);
    else if (kind === "catch") [784, 988, 1175, 1568].forEach((f, k) => tone("sine", f, f, 0, t + k * 0.07, 0.16, 0.11));
    else if (kind === "win") [523, 659, 784, 1047].forEach((f, k) => tone("triangle", f, f, 0, t + k * 0.09, 0.25, 0.14));
  } catch (e) {}
}

// ---- Ввод: оттяжка, выстрел, тап-пузырь ----
function startPull() { if (S.scene !== "play" || S.phase !== "aim") return false; S.phase = "drag"; S.pull = { dx: 0, dy: 0 }; S.ret = null; return true; }
function setPull(dx, dy) {
  if (S.phase !== "drag") return;
  const d = Math.hypot(dx, dy); if (d > TUNE.maxPull) { dx *= TUNE.maxPull / d; dy *= TUNE.maxPull / d; }
  S.pull = { dx, dy }; S.candy.x = G.rest.x + dx; S.candy.y = G.rest.y + dy; stretchRopeTo(S.candy);
}
function cancelPull() {
  if (S.phase !== "drag") return;
  const c = S.candy; S.pull = null; S.phase = "aim"; S.lastAct = "cancelled"; S.ret = { x: c.x, y: c.y, t: 0 };
}
function release() {
  if (S.phase !== "drag") return false;
  const p = S.pull;
  if (Math.hypot(p.dx, p.dy) < TUNE.minPull) { cancelPull(); return false; }
  S.pull = null;
  const c = S.candy; c.vx = -p.dx * TUNE.power; c.vy = -p.dy * TUNE.power;
  rope.pinMid = false; rope.La = rope.Lb = rope.L0;
  S.phase = "fly"; S.phaseT = 0; S.shot++; S.shotsLeft--; S.lastAct = "shot";
  S.chain = 0; S.multShown = 1; S.bubbleUsed = false; S.stuckT = 0; S.shotPts = 0; S.shotGold = 0; S.litOrder = [];
  sfx("click"); logEv("shot", { dx: +p.dx.toFixed(1), dy: +p.dy.toFixed(1) }); updateHud();
  return true;
}
function tap() {
  if (S.phase !== "fly" || S.bubbleUsed || !S.candy.vis) return false;
  S.bubbleUsed = true; S.candy.bubble = true; S.candy.bubbleT = 0; S.lastAct = "bubble";
  sfx("bubble"); logEv("bubble", { x: +S.candy.x.toFixed(0), y: +S.candy.y.toFixed(0) });
  return true;
}

// ---- Тик ----
function popup(x, y, text, color, size) { S.popups.push({ x, y, text, color, size: size || 16, t: 0 }); }
function onHit(p, vn, hx, hy) {
  if (!p) return;
  if (vn > 25) { p.sqT = 0; S.fx.push({ k: "ring", x: hx, y: hy, t: 0 }); }
  if (!p.lit) {
    p.lit = true; p.flash = 0.2; S.chain++; S.litOrder.push(p); S.maxChain = Math.max(S.maxChain, S.chain);
    const m = mult(), pts = (p.gold ? TUNE.ptsGold : TUNE.ptsPeg) * m;
    S.score += pts; S.shotPts += pts; if (p.gold) S.shotGold++;
    popup(p.x, p.y - 12, "+" + pts, p.gold ? C.goldDk : C.mintDk, p.gold ? 19 : 15);
    if (m > S.multShown) { S.multShown = m; S.multPulse = 0; popup(S.candy.x, S.candy.y - 26, "×" + m + "!", "#A82060", 26); }
    sfx("boing", S.chain - 1); if (p.gold) sfx("gold", S.chain - 1);
    logEv("hit", { gold: p.gold, chain: S.chain, mult: m, pts });
    updateHud();
  } else if (vn > 60 && p.cd <= 0) sfx("boing", S.chain - 1, 0.45);
  p.cd = 0.08;
}
function popPeg(p, k) {
  if (!p.alive) return;
  p.alive = false;
  S.fx.push({ k: "burst", x: p.x, y: p.y, t: 0, gold: p.gold });
  sfx("pop", k);
  if (p.gold) { S.goldLeft--; S.flyers.push({ x0: p.x, y0: p.y, t: 0 }); updateHud(); }
}
function endShot(caught) {
  const c = S.candy;
  S.lastShot = { hits: S.chain, gold: S.shotGold, caught, bubble: S.bubbleUsed, pts: S.shotPts, maxMult: mult() };
  if (caught) {
    S.shotsLeft++; S.catches++; S.chewT = 0.6; c.vis = 0;
    popup(cartX(), MOUTH_Y - 34, "+1", "#A82060", 24); sfx("am"); sfx("catch");
  } else if (Math.abs(c.x - cartX()) < 70) S.sadT = 0.8;
  c.vis = 0;
  logEv(caught ? "catch" : "lost", { hits: S.chain, gold: S.shotGold });
  S.phase = "pop"; S.phaseT = 0; S.popIdx = 0; S.popT = 0;
  S.popGap = Math.min(TUNE.popGap, 1.5 / Math.max(1, S.litOrder.length));
  updateHud();
}
function nextShot() {
  if (S.goldLeft <= 0) return endRound(true);
  if (S.shotsLeft <= 0) return endRound(false);
  S.phase = "aim"; S.phaseT = 0; S.botT = 0; S.botPlan = null; S.chain = 0; S.multShown = 1;
  freshCandy();
}
function endRound(win) {
  S.scene = "end"; S.phase = "end"; S.win = win;
  S.bonus = win ? S.shotsLeft * TUNE.bonusShot : 0; S.score += S.bonus;
  logEv("end", { win, score: S.score, gold: S.goldTotal - S.goldLeft });
  if (win) sfx("win");
  document.getElementById("endTitle").textContent = win ? "Все золотые!" : "Конфеты кончились";
  document.getElementById("endScore").textContent = S.score;
  document.getElementById("endDetail").textContent = "Золотые " + (S.goldTotal - S.goldLeft) + "/" + S.goldTotal +
    " · поймал " + S.catches + (S.bonus ? " · бонус +" + S.bonus : "");
  document.getElementById("end").style.display = "flex";
  updateHud();
}
function tick() {
  S.t += DT; S.phaseT += DT; S.cartPh += TUNE.cartSpeed * DT;
  for (const p of S.pegs) { p.sqT += DT; if (p.flash > 0) p.flash -= DT; if (p.cd > 0) p.cd -= DT; }
  for (const f of S.fx) f.t += DT; S.fx = S.fx.filter((f) => f.t < 0.4);
  for (const p of S.popups) p.t += DT; S.popups = S.popups.filter((p) => p.t < 0.8);
  S.multPulse += DT; if (S.chewT > 0) S.chewT -= DT; if (S.sadT > 0) S.sadT -= DT;
  for (const f of S.flyers) { f.t += DT; if (f.t >= 0.5) { S.chewT = 0.45; sfx("am"); } }
  S.flyers = S.flyers.filter((f) => f.t < 0.5);
  const c = S.candy;
  if (S.ret) { S.ret.t += DT; const k = Math.min(1, S.ret.t / 0.1); c.x = S.ret.x + (G.rest.x - S.ret.x) * k; c.y = S.ret.y + (G.rest.y - S.ret.y) * k; stretchRopeTo(c); if (k >= 1) S.ret = null; }
  stepRope();
  if (S.phase === "fly") {
    for (let s = 0; s < SUB; s++) stepBody(c, S.pegs, DT / SUB, onHit, c.bubble);
    c.rot += c.vx * DT / 17;
    if (c.bubble) { c.bubbleT += DT; if (c.bubbleT >= TUNE.bubbleT) { c.bubble = false; c.vy = -40; sfx("bpop"); S.fx.push({ k: "bpop", x: c.x, y: c.y, t: 0 }); logEv("bubblePop", { y: +c.y.toFixed(0) }); } }
    // застряла на желейке — желейки под ней лопаются сразу
    if (Math.hypot(c.vx, c.vy) < TUNE.stuckV && !c.bubble) S.stuckT += DT; else S.stuckT = 0;
    if (S.stuckT > TUNE.stuckT) {
      S.stuckT = 0; const R = TUNE.candyHitR + TUNE.pegThick / 2 + 4;
      for (const p of S.pegs) if (p.alive && ptSeg(c.x, c.y, p.ax, p.ay, p.bx, p.by).d < R) { if (!p.lit) onHit(p, 0, p.x, p.y); popPeg(p, S.chain); }
      logEv("unstuck", {});
    }
    const mx = cartX();
    if (!c.bubble && c.vy > 0 && Math.abs(c.x - mx) < TUNE.catchW && c.y > MOUTH_Y - 16 && c.y < MOUTH_Y + 22) endShot(true);
    else if (c.y > H + 24 || S.phaseT > TUNE.shotMax) endShot(false);
  } else if (S.phase === "pop") {
    S.popT += DT;
    while (S.popIdx < S.litOrder.length && S.popT >= S.popIdx * S.popGap) { popPeg(S.litOrder[S.popIdx], S.popIdx); S.popIdx++; }
    if (S.popIdx >= S.litOrder.length && !S.flyers.length && S.popT >= S.popIdx * S.popGap + 0.25) nextShot();
  }
  if (bot && S.scene === "play") botTick();
}
function updateHud() {
  document.getElementById("score").textContent = "Счёт: " + S.score;
  document.getElementById("shots").textContent = "Конфеты: " + S.shotsLeft;
  document.getElementById("gold").textContent = "Золотые: " + (S.goldTotal - S.goldLeft) + "/" + S.goldTotal;
}

// ---- Бот (skill 0 — случайный выстрел, 1 — лучший из 40): перебирает прицелы на копии поля (без тележки и пузыря), берёт лучший; пузырь — когда конфета внизу ----
function simShot(pull) {
  const lit = new Set(); let n = 0, gold = 0;
  const c = { x: G.rest.x + pull.dx, y: G.rest.y + pull.dy, vx: -pull.dx * TUNE.power, vy: -pull.dy * TUNE.power };
  const hit = (p) => { if (!lit.has(p)) { lit.add(p); n++; if (p.gold) gold++; } };
  for (let i = 0; i < 60 * 6 && c.y < H + 20; i++) for (let s = 0; s < SUB; s++) stepBody(c, S.pegs, DT / SUB, hit, false);
  return { n, gold };
}
function botPlan() {
  const r = mulberry(S.seed * 31 + S.shot * 7919 + 1), n = Math.max(1, Math.round(1 + (bot ? bot.skill : 1) * 39)); let best = null;
  for (let i = 0; i < n; i++) {
    const ang = MODE === "top" ? -Math.PI * (0.12 + 0.76 * r()) : Math.PI * (0.12 + 0.76 * r());
    const m = 30 + r() * (TUNE.maxPull - 30), pull = { dx: Math.cos(ang) * m, dy: Math.sin(ang) * m };
    const s = simShot(pull), v = s.gold * 6 + s.n + r() * 0.5;
    if (!best || v > best.v) best = { v, pull, sim: s };
  }
  return best;
}
function botTick() {
  if (S.phase === "aim") {
    S.botT += DT;
    if (S.botT > 0.4 && !S.botPlan) S.botPlan = botPlan();
    if (S.botPlan && S.botT > 0.5) { startPull(); setPull(S.botPlan.pull.dx * 0.5, S.botPlan.pull.dy * 0.5); }
  } else if (S.phase === "drag" && S.botPlan) {
    S.botT += DT; const k = Math.min(1, (S.botT - 0.5) / 0.3); setPull(S.botPlan.pull.dx * (0.5 + 0.5 * k), S.botPlan.pull.dy * (0.5 + 0.5 * k));
    if (k >= 1) release();
  } else if (S.phase === "fly" && !S.bubbleUsed && S.candy.vy > 0 && S.candy.y > MOUTH_Y - 70 && Math.abs(S.candy.x - cartX()) > TUNE.catchW + 10) tap();
}

// ---- Рисование ----
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), stage = document.getElementById("stage");
let scale = 1, dpr = 1, lastW = 0, lastH = 0, bg = null;
function fit() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  const nd = Math.min(2, window.devicePixelRatio || 1);
  if (w === lastW && h === lastH && nd === dpr) return;
  lastW = w; lastH = h; dpr = nd;
  scale = Math.min((w - 22) / W, (h - 22) / H);
  cv.style.width = W * scale + "px"; cv.style.height = H * scale + "px";
  cv.style.left = (w - W * scale) / 2 + "px"; cv.style.top = (h - H * scale) / 2 + "px";

// ---- Ввод: Pointer Events (палец и мышь); тянуть можно из любого места поля, в полёте — тап ----
let ptr = null;

onButton("again", () => newRound(S.seed));

(function buildTune() {

    const l = document.createElement("label"); l.textContent = label;
