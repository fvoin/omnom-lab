"use strict";

// Кадры лежат в assets/omnom/ — одна папка на все прототипы; новую версию Ома Нома копируем поверх теми же именами.
// Числа — из assets/omnom/omnom_frames.json: 6,4024 px на u, лапы = pivot, рот (кадр wide); зрачки — два слоя (левый и правый глаз), каждый ходит в эллипсе своего глаза (pupils.<кадр>.eyes).

  const PX = 6.4024, PIV = [0.5366, 0.0253], MOUTH = [-2.08, -19.98];
  // Зрачки — по слою на глаз. Для каждого: rest — центр зрачка в покое, c и r — эллипс хода центра зрачка (u от лап, оси кадра до зеркала).

    neutral: { l: { rest: [-13.93, -44.86], c: [-16.67, -45.33], r: [3.91, 3.98] },

    wide2:  { l: { rest: [-13.93, -52.28], c: [-14.95, -52.67], r: [1.64, 1.31] },

  };

  const NAMES = ["neutral", "ajar", "wide", "wide2", "chew", "chew2", "sad", "joy", "blink", "half", "shadow"];

const TUNE = {

  wallBounce: 0.9, ceilBounce: 0.4, cutSlow: 0.9,
  catchR: 28,          // u, «рот» Ома Нома
  magnetY: 340, magnetK: 10, // ниже magnetY (у черты) падающие конфеты тянутся к рту (доля 10/с по x) — выше гроздь падает целиком

  aimDots: 9, aimDotTicks: 4,
  popPts: 10, dropPts: 10, clearPts: 100,
  botThink: 0.5, botPullT: 0.3,
  ropeIters: 20, ropeNodes: 13, ropeSlack: 1.04, ropeDamp: 0.985,

// генератор: центры гроздей в [x0, x1], верхний ряд top, высота h рядов (по сетке)
const GEN = { sp: 28, x0: 10, x1: 310, top: [6, 7], h: [4, 5], slant: [40, 80] }; // slant — сдвиг гвоздя верёвки от грозди к середине, u
const KNOBS = [["colors", "Цветов", 3, 4, 1], ["ropes", "Верёвок", 3, 5, 1], ["shots", "Конфет в раунде", 15, 60, 5], ["power", "Сила рогатки", 9, 14, 0.2], ["lowerAfter", "Опускание после промахов", 3, 10, 1]];

const CEIL = 8, Y0 = 30, LINE_Y = 348, MAXROW = 18;

const NAIL_A = { x: 116, y: 382 }, NAIL_B = { x: 204, y: 382 }, REST = { x: 160, y: 388 };
const FLOOR = 478, MOUTH_Y = FLOOR - 22, OM_HOME = 266, NEXT = { x: 56, y: 436 };
const COL = [{ f: "#E8412F", hi: "#FF9A80" }, { f: "#2F86E0", hi: "#9CCBFF" }, { f: "#F5B800", hi: "#FFE78A" }, { f: "#9B5DE5", hi: "#D6B8FA" }];
const C = { paper: "#F5A9D0", paperHi: "#F9C3DF", paperLo: "#EE97C3", ink: "#4A2512", cream: "#FBEBD0", card: "#C98A4B", cardSh: "#8F5427", rope: "#7A3B1C", ok: "#A82060", gold: "#FFD23F" };

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

let AC = null, amNext = 0;

const SFX = {
  shot() { tone(1400, 500, 0.05, "triangle", 0.18); },
  stick() { tone(420, 260, 0.05, "sine", 0.18); },
  pop(i) { tone(900 + i * 70, 220, 0.08, "square", 0.08, i * 0.045); tone(2400, 900, 0.03, "sine", 0.1, i * 0.045); },
  boing() { tone(160, 620, 0.12, "sine", 0.3); tone(620, 150, 0.4, "triangle", 0.22, 0.1); tone(330, 300, 0.4, "sine", 0.1, 0.12); },

// ---- Гроздь: гекс-сетка (r, c), чётные ряды 10 ячеек, нечётные 9, шаг 32 ----
const key = (r, c) => r + "," + c;

function dropUnsupported(cl) {

function slotFor(cl, hk, x, y) {

// ---- Генератор грозди по seed: R гроздей-«виноградин», у каждой своя верёвка ----

        const cols = []; for (let c = 0; c < (r & 1 ? G.nE - 1 : G.nE); c++) cols.push(c);

    seed, rng, botRng: mulberry(seed ^ 0x5bd1e995), scene: "play", phase: "aim", phaseT: 0, t: 0, why: "",
    shot: 0, score: 0, dry: 0, cl: genCluster(rng, -260), cur: 0, next: 0, candy: null, pull: null,
    falling: [], stubs: [], bursts: [], popups: [], chain: 0, chainPts: 0, chainPop: null, shotCut: false,
    om: { x: OM_HOME, vx: 0, chew: 0, sad: 0, idle: 0 },

function pickColor() {

function loadCandy() { S.candy = { x: REST.x, y: REST.y, vx: 0, vy: 0, color: S.cur, vis: true, pop: 0.2 }; rope.pinMid = true; rope.La = rope.Lb = rope.L0; S.phase = "aim"; S.phaseT = 0; }

// ---- События броска ----

    setPull(S.botPlan.dx * k, S.botPlan.dy * k);
    if (k >= 1) { release(); S.botPlan = null; S.botT = 0; }
  }
}

// ---- Рисование ----
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), stage = document.getElementById("stage");
let scale = 1, dpr = 1, lastW = 0, lastH = 0, bg = null;
function fit() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  const nd = Math.min(2, window.devicePixelRatio || 1);
  if (w === lastW && h === lastH && nd === dpr) return;
  lastW = w; lastH = h; dpr = nd;
  scale = Math.min((w - 24) / W, (h - 24) / H);
  cv.style.width = W * scale + "px"; cv.style.height = H * scale + "px";
  cv.style.left = (w - W * scale) / 2 + "px"; cv.style.top = (h - H * scale) / 2 + "px";
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr); bg = null;
}
new ResizeObserver(fit).observe(stage);
window.addEventListener("resize", fit); window.addEventListener("orientationchange", fit);
function circle(x, y, r, fill, line, lw) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (line) { ctx.strokeStyle = line; ctx.lineWidth = lw || 2; ctx.stroke(); } }
function drawBg() {
  if (!bg) {
    bg = document.createElement("canvas"); bg.width = cv.width; bg.height = cv.height;
    const g = bg.getContext("2d"); g.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, C.paperHi); gr.addColorStop(0.55, C.paper); gr.addColorStop(1, C.paperLo);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.fillStyle = "rgba(255,255,255,.13)"; for (let x = 12; x < W; x += 40) g.fillRect(x, 0, 16, H);
    g.fillStyle = "rgba(255,255,255,.18)"; g.beginPath(); g.ellipse(160, 520, 240, 110, 0, 0, 7); g.fill();
    // потолок-планка
    g.fillStyle = C.card; g.fillRect(0, 0, W, CEIL); g.fillStyle = C.cardSh; g.fillRect(0, CEIL - 2, W, 2);
    // стойки рогатки
    for (const n of [NAIL_A, NAIL_B]) {
      const lean = n === NAIL_A ? 1 : -1;
      g.fillStyle = C.card; g.strokeStyle = C.cardSh; g.lineWidth = 2;
      g.beginPath(); g.moveTo(n.x - 6, n.y); g.lineTo(n.x + 6, n.y); g.lineTo(n.x + 9 + lean * 22, H + 2); g.lineTo(n.x - 9 + lean * 22, H + 2); g.closePath(); g.fill(); g.stroke();
    }
    // подставка «следующей»
    g.fillStyle = "rgba(74,37,18,.15)"; g.beginPath(); g.ellipse(NEXT.x, NEXT.y + 13, 16, 4, 0, 0, 7); g.fill();
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bg, 0, 0); ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
// конфета: цвет + знак формы (кольцо, ромб, звезда, треугольник) — различимы и без цвета
function drawBall(x, y, ci, s, rot) {
  const r = TUNE.ballR * (s || 1), col = COL[ci] || COL[0];
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot);
  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, 1, 0, 0, r); g.addColorStop(0, col.hi); g.addColorStop(1, col.f);
  circle(0, 0, r, g, C.ink, 2.2);
  ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 2.6 * (s || 1);
  const k = r / 15; ctx.beginPath();
  if (ci === 0) { ctx.arc(0, 1, 5.5 * k, 0, 7); ctx.stroke(); }
  else if (ci === 1) { ctx.moveTo(0, -6.5 * k); ctx.lineTo(5.5 * k, 1); ctx.lineTo(0, 8 * k); ctx.lineTo(-5.5 * k, 1); ctx.closePath(); ctx.fill(); }
  else if (ci === 2) { for (let i = 0; i < 10; i++) { const rr = (i % 2 ? 3 : 7) * k, a = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(Math.cos(a) * rr, 1 + Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  else { ctx.moveTo(0, -6 * k); ctx.lineTo(6.5 * k, 6 * k); ctx.lineTo(-6.5 * k, 6 * k); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.beginPath(); ctx.ellipse(-r * 0.42, -r * 0.5, r * 0.28, r * 0.17, -0.5, 0, 7); ctx.fill();
  ctx.restore();
}
function ropeLine(x1, y1, x2, y2) { ctx.strokeStyle = C.rope; ctx.lineWidth = 2.6; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo((x1 + x2) / 2 + 2, (y1 + y2) / 2, x2, y2); ctx.stroke(); }
let omFrame = "neutral"; const omGaze = {};
function render() {
  fit(); drawBg();
  const cl = S.cl, om = S.om, warn = cl.cells.size && bottomY(cl, true) > LINE_Y - G.rowH * 1.1;
  // черта
  ctx.setLineDash([8, 7]); ctx.lineWidth = 2.5; ctx.strokeStyle = warn ? `rgba(200,30,60,${0.5 + 0.4 * Math.sin(S.t * 10)})` : "rgba(74,37,18,.3)";
  ctx.beginPath(); ctx.moveTo(4, LINE_Y); ctx.lineTo(W - 4, LINE_Y); ctx.stroke(); ctx.setLineDash([]);
  // верёвки, гвоздики
  for (const rp of cl.ropes) {
    circle(rp.ax, CEIL - 1, 3, C.cream, C.ink, 1.4);
    if (rp.cut || !cl.cells.has(rp.key)) continue;
    const b = ropeEnd(cl, rp); ropeLine(rp.ax, CEIL, b.x, b.y);
  }
  for (const s of S.stubs) ropeLine(s.ax, CEIL, s.ax + Math.sin(s.a) * s.L, CEIL + Math.cos(s.a) * s.L);
  for (const e of cl.cells.values()) { const p = cellPos(cl, e.r, e.c); drawBall(p.x, p.y, e.color); }
  // «чпок»: кольцо и крошки
  for (const b of S.bursts) {
    if (b.t < 0) { drawBall(b.x, b.y, b.color, 1 + 0.15 * Math.sin(-b.t * 60)); continue; }
    const k = b.t / 0.35, a = 1 - k;
    ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 3 * a + 1; ctx.beginPath(); ctx.arc(b.x, b.y, 10 + 22 * k, 0, 7); ctx.stroke();
    for (let i = 0; i < 6; i++) { const an = i * 1.047 + b.x; circle(b.x + Math.cos(an) * 26 * k, b.y + Math.sin(an) * 26 * k + 20 * k * k, 4 * a + 1, COL[b.color].f); }
  }
  // Ом Ном
  const near = S.falling.length ? S.falling.reduce((m, f) => (f.y > m.y && f.y < MOUTH_Y ? f : m), { y: -1e9 }) : null;
  if (om.chew > 0) omFrame = Math.floor(om.chew * 18) % 2 ? "chew2" : "chew";
  else if (om.sad > 0) omFrame = "sad";
  else if (near && near.y > -1e9) omFrame = MOUTH_Y - near.y < 160 ? "wide" : "ajar";
  else omFrame = "neutral";
  const look = near && near.y > -1e9 ? near : S.candy.vis ? S.candy : null;
  OMS.draw(ctx, { frame: omFrame, mx: om.x, my: MOUTH_Y, fy: FLOOR, flip: Math.abs(om.vx) > 5 ? om.vx > 0 : om.x < REST.x, tx: look ? look.x : undefined, ty: look ? look.y : undefined, shadow: true }, omGaze);
  // падающие
  for (const f of S.falling) {
    if (f.stub) { ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); ropeLine(0, 1 - TUNE.ballR, 1, 1 - TUNE.ballR - Math.min(40, f.stub)); ctx.restore(); }
    drawBall(f.x, f.y, f.color, 1, f.rot);
  }
  // рогатка
  const sr = Math.max(rope.La, rope.Lb) / rope.L0;
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = sr > 1.8 ? "#E8412F" : sr > 1.15 ? "#B8452A" : "#7A3B1C"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(rope.p[0].x, rope.p[0].y); for (let i = 1; i < rope.p.length; i++) ctx.lineTo(rope.p[i].x, rope.p[i].y); ctx.stroke();
  for (const n of [NAIL_A, NAIL_B]) { circle(n.x + 1.5, n.y + 2, 7, "rgba(74,37,18,.3)"); circle(n.x, n.y, 7, C.cream, C.ink, 2); }
  if (S.phase === "drag" && S.pull && Math.hypot(S.pull.dx, S.pull.dy) >= TUNE.minPull && S.pull.dy >= 4) {
    let x = S.candy.x, y = S.candy.y, vx = -S.pull.dx * TUNE.power, vy = -S.pull.dy * TUNE.power;
    for (let i = 0; i < TUNE.aimDots; i++) {
      for (let j = 0; j < TUNE.aimDotTicks; j++) { vy += TUNE.gravity * DT; x += vx * DT; y += vy * DT; if (x < 15 || x > W - 15) { vx = -vx * TUNE.wallBounce; x = Math.max(15, Math.min(W - 15, x)); } }
      const f = i / (TUNE.aimDots - 1), a = 0.95 - 0.55 * f; circle(x, y, 5 - 2.2 * f, `rgba(251,235,208,${a})`, `rgba(74,37,18,${a * 0.9})`, 1.6);
    }
  }
  const c = S.candy;
  if (c.vis) drawBall(c.x, c.y, c.color, c.pop > 0 ? 1 - c.pop * 2 : 1, S.phase === "fly" ? S.phaseT * c.vx / 60 : 0);
  if (S.scene === "play" && S.shot + (c.vis ? 1 : 0) < TUNE.shots) drawBall(NEXT.x, NEXT.y, S.next, 0.72);
  // до опускания: точки под «следующей»
  for (let i = 0; i < TUNE.lowerAfter; i++) circle(NEXT.x - (TUNE.lowerAfter - 1) * 4 + i * 8, NEXT.y + 24, 2.6, i < TUNE.lowerAfter - S.dry ? C.cream : "rgba(74,37,18,.35)", C.ink, 1);
  // надписи
  ctx.textAlign = "center"; ctx.lineWidth = 5; ctx.strokeStyle = C.cream; ctx.lineJoin = "round";
  for (const p of S.popups) {
    const life = p.big ? 1.4 : 0.8; ctx.font = p.big ? "900 30px Nunito, system-ui" : "900 17px Nunito, system-ui";
    ctx.globalAlpha = Math.min(1, (life - p.t) * 3); const y = p.y - p.t * (p.big ? 20 : 40);
    ctx.strokeText(p.text, p.x, y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, y);
  }
  ctx.globalAlpha = 1;
}

// ---- Ввод: тянуть из любого места поля; тап без сдвига — поменять текущую и следующую ----
let ptr = null;
stage.addEventListener("pointerdown", e => {
  if (ptr !== null || e.target.closest("#end")) return;
  audioOn();
  if (bot) { bot = null; if (S.phase === "drag") cancelPull(); }
  if (!startPull()) return;
  ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});
stage.addEventListener("pointermove", e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  ptr.moved = Math.max(ptr.moved, Math.hypot(e.clientX - ptr.x, e.clientY - ptr.y));
  setPull((e.clientX - ptr.x) / scale, (e.clientY - ptr.y) / scale);
});
function up(e) {
  if (!ptr || e.pointerId !== ptr.id) return;
  const tap = ptr.moved < TUNE.tapPx && performance.now() - ptr.t < TUNE.tapMs; ptr = null;
  if (e.type === "pointercancel") cancelPull(); else if (tap) { cancelPull(); swap(); } else release();
}
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
document.addEventListener("visibilitychange", () => { if (document.hidden && ptr) { ptr = null; cancelPull(); } });
window.addEventListener("blur", () => { if (ptr) { ptr = null; cancelPull(); } });
function onButton(id, fn) { const b = document.getElementById(id); b.addEventListener("pointerdown", e => e.stopPropagation()); b.addEventListener("pointerup", e => { e.stopPropagation(); audioOn(); fn(); }); }
onButton("restart", () => { ptr = null; newRound(S.seed); });
onButton("again", () => { ptr = null; newRound(S.seed); });
onButton("newseed", () => { ptr = null; newRound(); });
onButton("again2", () => { ptr = null; newRound(); });
// ручки: смена — новый раунд на том же seed
const knobs = document.getElementById("knobs");
for (const [k, label, mn, mx, st] of KNOBS) {
  const l = document.createElement("label"); l.innerHTML = `<span>${label}</span><input type="range" min="${mn}" max="${mx}" step="${st}" value="${TUNE[k]}"><b>${TUNE[k]}</b>`;
  const inp = l.querySelector("input"), out = l.querySelector("b");
  inp.addEventListener("input", () => { TUNE[k] = +inp.value; out.textContent = inp.value; newRound(S.seed); });
  knobs.appendChild(l);
}

// ---- Цикл ----
let manual = false, acc = 0, lastT = performance.now();
const frames = [];
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  frames.push(now); if (frames.length > 120) frames.shift();
  if (!manual) { acc += dt; let n = 0; while (acc >= DT && n < 3) { tick(); acc -= DT; n++; } if (n === 3) acc = 0; }
  render(); requestAnimationFrame(loop);
}

// ---- Тестовый API ----
window.__game = {
  ready: false,
  getState() {
    const cl = S.cl, r = cv.getBoundingClientRect();
    return {
      scene: S.scene, phase: S.phase, why: S.why, seed: S.seed, score: S.score, shot: S.shot, shotsLeft: TUNE.shots - S.shot,
      current: S.cur, next: S.next, dry: S.dry, lowerIn: TUNE.lowerAfter - S.dry, omFrame,
      cluster: {
        count: cl.cells.size, yOff: cl.yOff, yT: cl.yT, bottom: cl.cells.size ? bottomY(cl) : null, line: LINE_Y, genTries: cl.tries, ropesReachable: cl.reach,
        cells: [...cl.cells.values()].map(e => ({ r: e.r, c: e.c, color: e.color, ...cellPos(cl, e.r, e.c) })),
        ropes: cl.ropes.map((rp, i) => ({ i, ax: rp.ax, cut: rp.cut, end: !rp.cut && cl.cells.has(rp.key) ? ropeEnd(cl, rp) : null })),
      },
      falling: S.falling.length, chain: S.chain, om: { x: S.om.x, mouthY: MOUTH_Y },
      candy: { x: S.candy.x, y: S.candy.y, vx: S.candy.vx, vy: S.candy.vy, vis: S.candy.vis, color: S.candy.color },
      pull: S.pull, last: S.last, stats: { ...S.st }, bot: bot ? { skill: bot.skill } : null,
      view: { left: r.left, top: r.top, scale, restX: REST.x, restY: REST.y }, tune: { ...TUNE },
    };
  },
  act(a, p) {
    if (a === "seed" || a === "restart") newRound(p && p.seed != null ? p.seed : a === "restart" ? S.seed : undefined);
    else if (a === "newSeed") newRound();
    else if (a === "shoot") { if (!startPull()) return false; setPull(p.dx, p.dy); return release(); }
    else if (a === "tap" || a === "swap") return swap();
    else if (a === "pull") { if (S.phase === "aim") startPull(); setPull(p.dx, p.dy); }
    else if (a === "release") return release();
    else if (a === "drag") { const pts = p.points; if (!startPull()) return false; const [x0, y0] = pts[0]; for (const q of pts) setPull(q[0] - x0, q[1] - y0); return release(); }
    else if (a === "autoplay") { bot = p && p.skill != null ? { skill: Math.max(0, Math.min(1, +p.skill)) } : null; S.botT = 0; S.botPlan = null; if (S.phase === "drag") cancelPull(); }
    else if (a === "clock") manual = !!(p && p.manual);
    else if (a === "step") { for (let i = 0; i < (p || 1); i++) tick(); }
    else if (a === "predict") return simShot(S.cl, p.dx, p.dy, p.color != null ? p.color : S.cur);
    else if (a === "plan") return planShot(p && p.skill != null ? p.skill : 1);
    else if (a === "ropeShot") { // оракул: бросок, рвущий верёвку, с самым большим обвалом
      let best = null; for (const s of scan(S.cl, S.cur, 4)) if (s.res.cuts.length && (!best || s.res.drops > best.res.drops)) best = s;
      return best ? { dx: best.dx, dy: best.dy, ...best.res } : null;
    }
    else if (a === "setTune") { Object.assign(TUNE, p); newRound(S.seed); }
    else if (a === "render") render();
  },
  metrics() {

    const avg = d.length ? d.reduce((s, x) => s + x, 0) / d.length : 16.7; d.sort((a, b) => a - b);
    return { fps: Math.round(1000 / avg), frameMsP95: d.length ? d[Math.floor(d.length * 0.95)] : 0, drawCalls: -1 };
  },
};
const q = new URLSearchParams(location.search);
newRound(q.has("seed") ? +q.get("seed") : undefined);
if (q.has("bot")) bot = { skill: Math.max(0, Math.min(1, +q.get("bot"))) };
fit(); render();
OMS.loaded.then(() => { window.__game.ready = true; });
requestAnimationFrame(loop);
</script>
