<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="icon" href="data:,">
<title>Pin Nom</title>
<style>:root{--ink:#2a2140;--cream:#fff6e0;--bg:#3d2f63;--act:#ff5fa8}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{background:var(--bg);height:100%;color:var(--ink);overscroll-behavior:none;-webkit-user-select:none;user-select:none;margin:0;font:800 14px/1.25 ui-rounded,SF Pro Rounded,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}#stage{position:absolute;inset:0}canvas{touch-action:none;width:100%;height:100%;display:block;position:absolute;top:0;left:0}button{font:inherit;border:2px solid var(--ink);background:var(--cream);color:var(--ink);cursor:pointer;border-radius:999px;padding:10px 18px;font-size:16px;font-weight:800;box-shadow:0 3px #00000059}button:active{transform:translateY(2px);box-shadow:0 1px #00000059}button.big{background:var(--act);color:#fff;text-shadow:0 1px 0 var(--ink);padding:12px 26px;font-size:20px}.ov{z-index:5;background:#2a21408c;justify-content:center;align-items:center;display:none;position:absolute;inset:0}.ov.on{display:flex}.card{background:var(--cream);border:3px solid var(--ink);text-align:center;border-radius:24px;width:min(90%,340px);max-height:94%;padding:16px 18px 18px;overflow:auto;box-shadow:0 6px #00000059}.card h1{color:#a8205f;margin:0 0 4px;font-size:28px}.card p{margin:6px 0 10px;font-size:14px;font-weight:700}.card small{opacity:.7;margin-top:10px;font-weight:700;display:block}.card a{color:#a8205f;text-decoration:none}.card .col{flex-direction:column;align-items:stretch;gap:10px;display:flex}.grid{grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 12px;display:grid}.lv{background:#efe6ff;border-radius:12px;height:62px;padding:0;position:relative;overflow:hidden;box-shadow:0 2px #0000004d}.lv .glass{border:2px solid var(--ink);background:#fff9;border-top-width:0;border-radius:0 0 8px 8px;position:absolute;inset:16px 22% 6px;overflow:hidden}.lv .fill{background:repeating-linear-gradient(135deg,#ff7fbf 0 6px,#ff4f9d 6px 10px);position:absolute;bottom:0;left:0;right:0}.lv .num{font-size:13px;position:absolute;top:1px;left:0;right:0}.lv.lock{opacity:.45}.lv.cur{outline:3px solid var(--act)}.stars{letter-spacing:4px;margin:4px 0 8px;font-size:44px;line-height:1}.stars span{color:#d9cfe6}.stars span.on{color:#ffc928;-webkit-text-stroke:2px var(--ink)}.rew{color:#a8205f;margin:4px 0 12px;font-size:22px;font-weight:900}.rew s{color:var(--ink);opacity:.7;margin-top:2px;font-size:12px;font-weight:700;text-decoration:none;display:block}</style>
  <script type="module" crossorigin src="./assets/pin-BhcYgmGC.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="modulepreload" crossorigin href="./assets/layer-CHPe9y9m.js">
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="ov on" id="menu"><div class="card">
    <h1>Pin Nom</h1>
    <p>Pull the pins in the right order. Fill the jar up to the line!</p>
    <div class="grid" id="grid"></div>
    <div class="col"><button class="big" id="play">Play</button></div>
    <small>Tap or swipe a pin to pull it.</small>
    <small><a href="index.html">&larr; Lab</a></small>
  </div></div>
  <div class="ov" id="pause"><div class="card">
    <h1>Paused</h1>
    <div class="col"><button class="big" id="resume">Resume</button><button id="pRestart">Restart</button><button id="pQuit">Quit (no reward)</button></div>
  </div></div>
  <div class="ov" id="result"><div class="card">
    <h1 id="rTitle">Jar filled!</h1>
    <div class="stars" id="rStars"></div>
    <p id="rInfo"></p>
    <div class="rew" id="rRew"></div>
    <div class="col"><button class="big" id="rMain">Next level</button><button id="rMenu">Levels</button></div>
  </div></div>
</div>
</body>
</html>
