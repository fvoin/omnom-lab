<script>
"use strict";
// ---- Ом Ном кадрами приложения (D-40): тот же блок, что в sling.html -----------------------
const OMS = (() => {
  const PX = 6.4024, PIV = [0.5366, 0.0253], MOUTH = [-2.08, -19.98];
  const PUP = {
    neutral: { l: { rest: [-13.93, -44.86], c: [-16.67, -45.33], r: [3.91, 3.98] },
             r: { rest: [-0.81, -42.67], c: [2.23, -42.67], r: [6.22, 6.39] } },
    ajar:   { l: { rest: [-13.7, -47.75], c: [-15.42, -48.29], r: [2.61, 2.51] },
             r: { rest: [-1.6, -45.33], c: [1.92, -42.83], r: [6.06, 6.01] } },
    wide:   { l: { rest: [-13.39, -51.18], c: [-14.79, -51.42], r: [1.98, 1.54] },
             r: { rest: [-1.13, -48.76], c: [0.98, -45.95], r: [5.73, 5.06] } },
    wide2:  { l: { rest: [-13.93, -52.28], c: [-14.95, -52.67], r: [1.64, 1.31] },
             r: { rest: [-1.52, -49.54], c: [0.83, -46.58], r: [5.85, 5.25] } },
  };
  const LOOK = 7;
  const NAMES = ["neutral", "ajar", "wide", "wide2", "chew", "chew2", "sad", "joy", "blink", "half", "shadow"];
  for (const f in PUP) NAMES.push(f + "_pupils_l", f + "_pupils_r");
  const img = {}, waits = [];
  for (const n of NAMES) {
    const i = new Image(); img[n] = i;
    waits.push(new Promise((res) => { i.onload = i.onerror = res; }));
    i.src = "assets/omnom/" + n + ".png";
  }
  const ok = (i) => i && i.complete && i.naturalWidth > 0;
  function eyePos(e, dx, dy) {
    let px = e.rest[0] + dx, py = e.rest[1] + dy;
    const qx = (px - e.c[0]) / e.r[0], qy = (py - e.c[1]) / e.r[1], ql = Math.hypot(qx, qy);
    if (ql > 1) { px = e.c[0] + qx / ql * e.r[0]; py = e.c[1] + qy / ql * e.r[1]; }
    return [px, py];
  }
  function draw(ctx, p, st) {
    let f = p.frame || "neutral";
    if (f === "neutral" && (performance.now() + (p.blinkOff || 0)) % 3600 < 120) f = "blink";
    const base = img[f]; if (!ok(base)) return;
    const flip = p.flip ? -1 : 1, fx = p.mx - flip * MOUTH[0], fy = p.fy != null ? p.fy : p.my - MOUTH[1];
    const pw = base.naturalWidth, ph = base.naturalHeight, k = 1 / PX;
    ctx.save();
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    if (p.shadow && ok(img.shadow)) ctx.drawImage(img.shadow, fx - 32, fy - 6, 64, 12);
    ctx.translate(fx, fy); if (p.rot) ctx.rotate(p.rot);
    ctx.scale(flip * k, k);
    ctx.drawImage(base, -PIV[0] * pw, -(1 - PIV[1]) * ph);
    const pu = PUP[f], pl = img[f + "_pupils_l"], pr = img[f + "_pupils_r"];
    if (pu && ok(pl) && ok(pr)) {
      let gx = 0, gy = 0;
      if (p.tx != null) {
        let dx = p.tx - fx, dy = p.ty - fy;
        if (p.rot) { const c = Math.cos(-p.rot), sn = Math.sin(-p.rot), qx = dx * c - dy * sn, qy = dx * sn + dy * c; dx = qx; dy = qy; }
        dx *= flip;
        const ex = (pu.l.rest[0] + pu.r.rest[0]) / 2, ey = (pu.l.rest[1] + pu.r.rest[1]) / 2;
        const vx = dx - ex, vy = dy - ey, L = Math.hypot(vx, vy) || 1, a = Math.min(1, L / 45);
        gx = vx / L * a * LOOK; gy = vy / L * a * LOOK;
      }
      if (st) { st.x = st.x == null ? gx : st.x + (gx - st.x) * 0.35; st.y = st.y == null ? gy : st.y + (gy - st.y) * 0.35; gx = st.x; gy = st.y; }
      const pL = eyePos(pu.l, gx, gy), pR = eyePos(pu.r, gx, gy);
      ctx.drawImage(pl, -PIV[0] * pw + (pL[0] - pu.l.rest[0]) * PX, -(1 - PIV[1]) * ph + (pL[1] - pu.l.rest[1]) * PX);
      ctx.drawImage(pr, -PIV[0] * pw + (pR[0] - pu.r.rest[0]) * PX, -(1 - PIV[1]) * ph + (pR[1] - pu.r.rest[1]) * PX);
    }
    ctx.restore();
  }
  return { draw, img, loaded: Promise.all(waits), ready: () => NAMES.every((n) => ok(img[n])) };
})();

// ---- Числа. Поле 320×480 u, как в sling.html. Первые пять — ручки панели ----
const TUNE = {
  roundTime: 90,        // c, длина раунда (sling-concepts §3: 90 с); таймер стартует с первого броска
  growPerPass: 3,       // u Ø за пас: 34 → 52 за 6 пасов
  weightPerLayer: 0.08, // −8 % дальности за слой (тяжесть = g / 0,92^слои)
  friendCatchR: 40,     // u, ловля друга (широкая — ребёнку)
  fireStreak: 3,        // чистых пасов подряд (без стен) — огонь, пас даёт ×2
  // ---- остальное ----
  gravity: 784, power: 7.6, maxPull: 130, minPull: 14,
  candyD: 34, layersMax: 6, omCatchR: 34, catchGrow: 0.5, // зоны ловли растут на 0,5 от прироста радиуса кома
  wallBounce: 0.5, flightTimeout: 3.5, restTicks: 18, restV: 15,
  friends: 4, spotX: [36, 284], spotY: [180, 355], spotGap: 76, omDead: 0, // друзья не ближе 76 u друг к другу; omDead > 0 — запрет ставить друга под Омом Номом (|x − x Ома| < omDead) omGap: 115, hopMin: 70,
  omX: [100, 220], omY: 105, omReachAhead: 1, // друг на новом месте достаёт до Ома Нома комом на omReachAhead слоёв тяжелее нынешнего
  aimDots: 9, aimDotTicks: 4, aimDotsLoss: 1, // пунктир короче на 1 точку за слой (не меньше 3)
  aimAngles: 144, // углов вылета в быстрой проверке окна (шаг 2,5°)
  jobCells: 600, // клеток сетки решателя за тик на поиск нового места друга (≤ ~3 мс)
  catchT: 0.15, eatT: 0.6, lostT: 1.0, hopT: 0.45,
  botThink: 0.45, botPullT: 0.3,
  ropeNodes: 13, ropeIters: 20, ropeDamp: 0.985, ropeWidth: 4,
};
const KNOBS = [
  ["growPerPass", "Рост Ø за пас, u", 0, 6, 0.5],
  ["weightPerLayer", "Тяжесть за слой", 0, 0.15, 0.01],
  ["friendCatchR", "Ловля друга, u", 24, 60, 2],
  ["fireStreak", "Огонь после пасов", 2, 6, 1],
  ["aimDotsLoss", "Пунктир −точек за слой", 0, 1.5, 0.25],
];
const W = 320, H = 480, DT = 1 / 60;
const C = {
  paper: "#F5A9D0", paperHi: "#F9C3DF", paperLo: "#EE97C3", ink: "#4A2512", cream: "#FBEBD0", creamSh: "#E9CFA3",
  card: "#C98A4B", cardSh: "#8F5427", bulb: "#FFE9A8", glow: "rgba(255,200,87,.35)",
  candy: "#E8412F", wrap: "#FFC93C", gold: "#FFD23F", ok: "#A82060", fire: "#FF8A2A", sugar: "#FFF4DE",
};
const FRIENDS = [ // цветные кружки с глазами
  { c: "#E8412F", sh: "#B32A1C", spots: true },  // божья коровка
  { c: "#9AA9BA", sh: "#6E7D8E", ears: true },   // мышонок
  { c: "#3FA7E0", sh: "#1F7AAE" },
  { c: "#F2B33D", sh: "#C1861A" },
  { c: "#9B6BD6", sh: "#6E45A6" },
];
const SPRINKLE = ["#E8458A", "#3FA7E0", "#98CC24", "#FFD23F", "#9B6BD6"];

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rOf = (layers) => (TUNE.candyD + TUNE.growPerPass * layers) / 2;
const gOf = (layers) => TUNE.gravity / Math.pow(1 - TUNE.weightPerLayer, layers);
const omBox = (o) => ({ x: o.x - 32, y: o.y + 24, w: 64, h: 14 }); // полка под Омом Номом (как подставка в sling.html)
const standF = (p) => ({ x: p.x - 22, y: p.y + 43, w: 44, h: 10 });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ---- Состояние ----
let S, bot = null;
function newRound(seed) {
  seed = seed == null ? (Date.now() & 0x7fffffff) : (seed >>> 0);
  S = {
    seed, rng: mulberry(seed), botRng: mulberry(seed ^ 0x5bd1e995),
    scene: "play", phase: "aim", t: 0, phaseT: 0, started: false, timeLeft: TUNE.roundTime,
    score: 0, value: 1, passes: 0, layers: 0, streak: 0, fire: false, holder: 0,
    om: null, friends: [], ball: null, pull: null, snap: null, ret: null,
    popups: [], fx: [], omFace: "idle", lostAt: null, eatFrom: null, genFallbacks: 0,
    stats: { eaten: 0, lost: 0, eatenPts: 0, lostPts: 0, maxKom: 0, throws: 0, passes: 0, kom: [], releases: [], heldAtEnd: 0, jobAborted: 0 }, job: null,
    lastEvent: null, botT: 0, botN: 0, botTgt: null, flightN: 0, restN: 0,
  };
  genField();
  newBall(0);
  document.getElementById("end").style.display = "none";
  updateHud(true);
}

// ---- Мир для полёта: общий для игры, решателя и бота ----
// from — бросающий (его зона не ловит); live — прыгающий друг ещё не ловит
function world(from, layers, live, list) {
  const r = rOf(layers), grow = TUNE.catchGrow * (r - TUNE.candyD / 2), all = list || S.friends;
  return { from, om: S.om, all, fr: all.map((f, j) => (j === from || (live && f.hop)) ? null : f),
    g: gOf(layers), hr: r * 0.82, cr: TUNE.friendCatchR + grow, ocr: TUNE.omCatchR + grow };
}
function circleRect(c, r, R) {
  const nx = Math.max(R.x, Math.min(c.x, R.x + R.w)), ny = Math.max(R.y, Math.min(c.y, R.y + R.h));
  let dx = c.x - nx, dy = c.y - ny; const d = Math.hypot(dx, dy);
  if (d >= r) return false;
  if (d < 1e-6) { dx = 0; dy = c.y < R.y + R.h / 2 ? -1 : 1; } else { dx /= d; dy /= d; }
  const push = r - (d < 1e-6 ? 0 : d);
  c.x += dx * push; c.y += dy * push;
  const vn = c.vx * dx + c.vy * dy;
  if (vn < 0) { c.vx -= (1 + TUNE.wallBounce) * vn * dx; c.vy -= (1 + TUNE.wallBounce) * vn * dy; c.vx *= 0.85; }
  return true;
}
// шаг кома: null | {who:"om"} | {who:"f", i} | {who:"out"}
function stepBall(b, w) {
  b.vy += w.g * DT; b.x += b.vx * DT; b.y += b.vy * DT;
  const r = w.hr, wb = TUNE.wallBounce;
  // стена отбивает только ком, летящий в неё: оттянутый за край поля ком просто влетает обратно
  if (b.x < r && b.vx < 0) { b.x = r; b.vx = Math.abs(b.vx) * wb; b.touched = true; b.bumps++; }
  if (b.x > W - r && b.vx > 0) { b.x = W - r; b.vx = -Math.abs(b.vx) * wb; b.touched = true; b.bumps++; }
  if (b.y < r && b.vy < 0) { b.y = r; b.vy = Math.abs(b.vy) * wb; b.touched = true; b.bumps++; }
  if (Math.hypot(b.x - w.om.x, b.y - w.om.y) < w.ocr) return { who: "om" };
  for (let i = 0; i < w.fr.length; i++) { const f = w.fr[i]; if (f && b.vy > 0 && Math.hypot(b.x - f.x, b.y - f.y) < w.cr) return { who: "f", i }; } // друг ловит только падающий ком (как кольцо в Dunk Shot)
  const sh = omBox(w.om); // полка Ома Нома — односторонняя: снизу ком пролетает к рту, сверху на неё падает
  if (b.vy > 0 && b.y < sh.y && circleRect(b, r, sh)) { b.touched = true; b.bumps++; }
  for (let i = 0; i < w.all.length; i++) if (i !== w.from && circleRect(b, r, standF(w.all[i]))) { b.touched = true; b.bumps++; } // своя подставка не мешает: ком проходит между лапами
  if (b.y > H + 30 && b.vy > 0) return { who: "out" };
  return null;
}
function simulate(w, P, pull, keepPath) {
  const b = { x: P.x, y: P.y, vx: -pull.dx * TUNE.power, vy: -pull.dy * TUNE.power, touched: false, bumps: 0 };
  const path = [];
  for (let i = 0; i < TUNE.flightTimeout * 60; i++) {
    const e = stepBall(b, w);
    if (keepPath) path.push({ x: b.x, y: b.y });
    if (e) return { who: e.who, i: e.i, touched: b.touched, ticks: i + 1, path };
  }
  return { who: "out", touched: b.touched, ticks: TUNE.flightTimeout * 60, path };
}
const hitsT = (r, tg) => tg === "om" ? r.who === "om" : (r.who === "f" && r.i === tg);
// быстрая проверка окна: чистое попадание и четыре соседа ±3 u тоже чистые (окно ≥ 6 u оттяжки)
// генератор: кандидаты — баллистика без препятствий через точку прицела (центр цели и точки чуть выше/сбоку — вход сверху)
// для aimAngles углов вылета (вылет из лап держателя); каждый проверяется настоящим полётом с четырьмя соседями ±3 u; отдаёт управление после каждого угла
const AIMS = { om: [[0, 0], [-24, -8], [24, -8], [-14, -22], [14, -22], [0, -26]], f: [[0, 0], [0, -22], [-18, -12], [18, -12]] };
function* reachG(w, P, tg) {
  const T0 = tg === "om" ? w.om : w.all[tg], k = 1 / TUNE.power, h = 3;
  const hit = (dx, dy) => { const r = simulate(w, P, { dx, dy }); return hitsT(r, tg) && !r.touched; };
  for (const [ox, oy] of AIMS[tg === "om" ? "om" : "f"]) for (let a = 0; a < TUNE.aimAngles; a++) {
    const Dx = T0.x + ox - P.x, Dy = T0.y + oy - P.y;
    const th = (a + 0.5) * 2 * Math.PI / TUNE.aimAngles, c = Math.cos(th), sn = Math.sin(th);
    const s = Dx / c; if (!(s > 0)) continue;
    const t2 = 2 * (Dy - s * sn) / w.g; if (t2 <= 0) continue;
    const t = Math.sqrt(t2); if (t < 0.05) continue;
    const L = s / t * k; if (L > TUNE.maxPull || L < TUNE.minPull + 4) { yield; continue; }
    const dx = -c * L, dy = -sn * L;
    if (hit(dx, dy) && hit(dx + h, dy) && hit(dx - h, dy) && hit(dx, dy + h) && hit(dx, dy - h)) return { dx, dy };
    yield;
  }
  return null;
}
function reachQuick(w, P, tg) { const it = reachG(w, P, tg); let r; while (!(r = it.next()).done); return r.value; }
// решатель (как solve в sling.html): центр самого широкого окна «чисто»; нет — любое попадание
function solveTo(w, P, tg) {
  const M = TUNE.maxPull, s = 5, clean = new Map(), any = new Map();
  for (let dy = -M; dy <= M; dy += s) for (let dx = -M; dx <= M; dx += s) {
    const L = Math.hypot(dx, dy); if (L > M || L < TUNE.minPull) continue;
    const r = simulate(w, P, { dx, dy });
    if (hitsT(r, tg)) { any.set(dx + "," + dy, { dx, dy }); if (!r.touched) clean.set(dx + "," + dy, { dx, dy }); }
  }
  const pick = (m) => {
    let bs = null, bn = -1;
    for (const q of m.values()) {
      let n = 0; for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) if (m.has((q.dx + i * s) + "," + (q.dy + j * s))) n++;
      if (n > bn) { bn = n; bs = q; }
    }
    return bs ? { dx: bs.dx, dy: bs.dy, n: bn } : null;
  };
  const c = pick(clean); if (c) return { ...c, clean: true };
  const a = pick(any); return a ? { ...a, clean: false } : null;
}

// ---- Поле по seed: Ом Ном наверху на полке, 4 друга; с места каждого друга есть окно «чисто» до Ома Нома ----
function spotOk(c, skip) {
  if (dist(c, S.om) < TUNE.omGap || Math.abs(c.x - S.om.x) < TUNE.omDead) return false;
  for (let j = 0; j < S.friends.length; j++) if (j !== skip && dist(c, S.friends[j]) < TUNE.spotGap) return false;
  return true;
}
function randSpot(rng) { return { x: TUNE.spotX[0] + rng() * (TUNE.spotX[1] - TUNE.spotX[0]), y: TUNE.spotY[0] + rng() * (TUNE.spotY[1] - TUNE.spotY[0]) }; }
function genField() {
  const rng = S.rng;
  S.om = { x: TUNE.omX[0] + rng() * (TUNE.omX[1] - TUNE.omX[0]), y: TUNE.omY };
  for (let i = 0; i < TUNE.friends; i++) {
    let placed = null;
    for (let t = 0; t < 1500 && !placed; t++) {
      const c = randSpot(rng); if (!spotOk(c, -1)) continue;
      const f = { x: c.x, y: c.y, k: i, hop: null, look: {} };
      S.friends.push(f);
      const okOm = reachQuick(world(i, TUNE.omReachAhead), f, "om");
      const okPass = i !== 1 || reachQuick(world(0, 0), S.friends[0], 1);
      if (okOm && okPass) placed = f; else S.friends.pop();

}
// бросивший друг перепрыгивает туда, куда нынешний держатель достаёт окном «чисто», а оттуда — до Ома Нома
// считается кусками в тиках (S.job); бросок раньше конца поиска — друг остаётся на месте

    const list = S.friends.map((q, j) => j === a ? { x: c.x, y: c.y } : q);
    if ((yield* reachG(world(b, S.layers, false, list), list[b], a)) && (yield* reachG(world(a, Math.min(TUNE.layersMax, S.layers + TUNE.omReachAhead), false, list), list[a], "om"))) {

function runJob(cells) { if (!S.job) return; for (let k = 0; k < cells; k++) if (S.job.next().done) { S.job = null; return; } }

// ---- Резинка в лапах держателя: Верле, как в sling.html ----
let rope = null;

// ---- Ком ----

}
function startPull() {

  S.phase = "drag"; S.pull = { dx: 0, dy: 0 }; S.ret = null; return true;
}
function setPull(dx, dy) {

}

}

  // вылет из лап держателя: оттяжка задаёт только скорость (ком не стартует из-за края поля или изо рта Ома Нома)

}
function popup(x, y, text, color, size) { S.popups.push({ x: Math.max(24, Math.min(W - 24, x)), y, text, color, size: size || 20, t: 0 }); }

  S.phase = "catch"; S.phaseT = 0; S.lastEvent = "pass";

  if (wasFire && !S.fire) S.fx.push({ k: "smoke", x: f.x, y: f.y, t: 0 });

function eat() {

  S.fx.push({ k: "burst", x: S.om.x, y: S.om.y, t: 0 });

  popup(S.lostAt.x, S.lostAt.y - 20, "−" + S.value, "#6B5A50", 20 + Math.min(14, S.value));
  for (let k = 0; k < 10; k++) S.fx.push({ k: "crumb", x: S.lostAt.x, y: S.lostAt.y, vx: (k - 4.5) * 22, vy: -120 - (k % 3) * 50, t: 0, c: k % 2 ? C.sugar : C.candy });

function nearestTo(x) {

}

// ---- Бот: тот же ввод (startPull → setPull → release). greed — пасов до «забрать» ----
function gauss(r) { const u = Math.max(1e-9, r()), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

function botTick() {

  } else if (S.phase === "drag" && S.botTgt) {

    setPull(S.botTgt.dx * e, S.botTgt.dy * e);
    if (S.botN >= n) { S.botTgt = null; S.botT = 0; release(); }
  } else S.botT = 0;

// ---- Шаг игры ----
function tick() {

  for (const f of S.fx) { f.t += DT; if (f.vx != null) { f.vy += 600 * DT; f.x += f.vx * DT; f.y += f.vy * DT; } }
  S.fx = S.fx.filter(f => f.t < (f.k === "crumb" ? 0.9 : f.k === "flame" ? 0.35 : f.k === "smoke" ? 0.6 : 0.3));
  if (S.scene !== "play") { stepRope(); return; }

    const n0 = b.bumps, e = stepBall(b, world(S.holder, S.layers, true));

    if (S.fire && S.flightN % 2 === 0) S.fx.push({ k: "flame", x: b.x, y: b.y, vx: -b.vx * 0.15, vy: -b.vy * 0.15 - 40, t: 0 });
    if (Math.hypot(b.vx, b.vy) < TUNE.restV) S.restN++; else S.restN = 0;

}

  S.scene = "end"; S.phase = "end"; S.stats.heldAtEnd = held; S.lastEvent = "end"; ptr = null;
  document.getElementById("endScore").textContent = S.score;
  const ate = S.stats.kom.filter(k => k.result === "eat");
  document.getElementById("endEat").textContent = `Съел комов: ${S.stats.eaten}` + (ate.length ? ` · самый большой ${Math.max(...ate.map(k => k.value))}` : "");
  document.getElementById("endLost").textContent = `Уронил: ${S.stats.lost}` + (S.stats.lostPts ? ` (−${S.stats.lostPts})` : "");

const hudCache = {};
function setText(id, txt, cls) {

  const el = document.getElementById(id); el.textContent = txt; if (cls != null) el.className = cls;
}
function updateHud() {

  const showKom = S.phase === "eat" || S.phase === "lost" ? 0 : S.value;
  setText("kom", showKom + (S.fire ? " ×2" : ""), S.fire ? "fire" : "");
  const tt = Math.ceil(S.timeLeft - 1e-9);

// ---- Звук: простой синтез ----
let AC = null;
function audioOn() {
  if (AC === null) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = false; } }
  if (AC && AC.state === "suspended") AC.resume().catch(() => {});
}
function tone(type, f0, f1, dur, vol, delay, wob, lp) {
  const t0 = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type;

  else { o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur); }
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let node = o;
  if (lp) { const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(lp[0], t0); f.frequency.exponentialRampToValueAtTime(lp[1], t0 + dur); o.connect(f); node = f; }
  node.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfx(name, v) {
  if (!AC || manual) return;
  try {
    if (name === "click") tone("square", 1900, 1100, 0.04, 0.06);
    else if (name === "pass") tone("triangle", 420 + Math.min(8, v) * 70, 520 + Math.min(8, v) * 90, 0.09, 0.12, 0.03);
    else if (name === "boing") tone("sine", 380 + 120 * (v || 0.5), 150, 0.24, 0.2, 0, 0.12);
    else if (name === "bump") tone("sine", 230, 90, 0.08, 0.12);
    else if (name === "am") { tone("sawtooth", 240, 170, 0.16, 0.14, 0, 0, [1400, 420]); tone("sine", 180, 150, 0.14, 0.18, 0.13); }
    else if (name === "sad") tone("sine", 420, 150, 0.45, 0.15, 0, 0.05);
  } catch (e) {}
}

// ---- Рисование ----
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), stage = document.getElementById("stage");
let scale = 1, dpr = 1, lastW = 0, lastH = 0, bg = null;
function fit() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  const nd = Math.min(2, window.devicePixelRatio || 1);
  if (w === lastW && h === lastH && nd === dpr) return;
  lastW = w; lastH = h; dpr = nd;
  scale = Math.min((w - 24) / W, (h - 24) / H);
  cv.style.width = W * scale + "px"; cv.style.height = H * scale + "px";
  cv.style.left = (w - W * scale) / 2 + "px"; cv.style.top = (h - H * scale) / 2 + "px";
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  bg = null;
}
new ResizeObserver(fit).observe(stage);
window.addEventListener("resize", fit); window.addEventListener("orientationchange", fit);
function circle(x, y, r, fill, line, lw) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (line) { ctx.strokeStyle = line; ctx.lineWidth = lw || 2; ctx.stroke(); }
}
function ellipse(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function drawBg() {
  if (!bg) {
    bg = document.createElement("canvas"); bg.width = cv.width; bg.height = cv.height;
    const g = bg.getContext("2d"); g.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, C.paperHi); gr.addColorStop(0.55, C.paper); gr.addColorStop(1, C.paperLo);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.fillStyle = "rgba(255,255,255,.13)"; for (let x = 12; x < W; x += 40) g.fillRect(x, 0, 16, H);
    g.fillStyle = "rgba(74,37,18,.06)"; for (let y = 30; y < H; y += 46) for (let x = (y / 46 % 2) * 20 + 32; x < W; x += 40) { g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); }
    g.strokeStyle = C.ink; g.lineWidth = 1.6; g.beginPath(); g.moveTo(-4, 4);
    for (let x = 0; x <= 324; x += 4) g.lineTo(x, 4 + Math.sin((x / 80) * Math.PI) ** 2 * 10); g.stroke();
    for (let x = 20; x < W; x += 40) {
      const y = 4 + Math.sin((x / 80) * Math.PI) ** 2 * 10;
      g.fillStyle = C.glow; g.beginPath(); g.arc(x, y + 7, 10, 0, 7); g.fill();
      g.fillStyle = C.bulb; g.strokeStyle = C.ink; g.lineWidth = 1.2; g.beginPath(); g.ellipse(x, y + 7, 3.6, 5, 0, 0, 7); g.fill(); g.stroke();
    }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bg, 0, 0); ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
function drawOmBox(o) {
  const b = omBox(o);
  ellipse(o.x + 3, b.y + b.h + 4, b.w * 0.5, 4, "rgba(74,37,18,.25)");
  rrect(b.x, b.y, b.w, b.h, 5); ctx.fillStyle = C.card; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = C.cardSh; ctx.fillRect(b.x + 3, b.y + b.h - 5, b.w - 6, 3);

// ---- Цикл: фиксированный тик 1/60 ----
